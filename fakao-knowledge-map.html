<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>法考主观题要学的一切 · 七科考点全景</title>
<meta name="description" content="法考主观题知识图谱：7 科 887 个考点、973 条前置依赖、118 个专题的三维依赖图。" />
</head>
<body>
<style>
:root{
  --bg:#070A0F; --panel:#0D1219; --panel-2:#131A24;
  --ink:#E8EDF2; --ink-2:#9FB0C0; --ink-3:#65778A;
  --rule:#1B2530; --rule-2:#26333F;
  --accent:#4FD8E8;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",-apple-system,sans-serif;
  font-size:14px; line-height:1.7; -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
.song{ font-family:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif; }
.mono{ font-family:ui-monospace,"SF Mono",Menlo,monospace; font-variant-numeric:tabular-nums; }

#stage{ position:fixed; inset:0; touch-action:none; cursor:grab; display:block; }
#stage.drag{ cursor:grabbing; }

/* ── 标题 ─────────────────────────────── */
#intro{
  position:fixed; left:44px; top:9vh; max-width:min(30rem,42vw);
  pointer-events:none; z-index:5;
  transition:opacity .45s ease, transform .45s ease;
}
#intro.away{ opacity:0; transform:translateX(-14px); }
.eyebrow{
  display:flex; align-items:center; gap:9px;
  font-size:10.5px; letter-spacing:.2em; color:var(--ink-3); margin:0 0 20px; white-space:nowrap;
}
.eyebrow i{ width:5px; height:5px; border-radius:50%; background:var(--accent); font-style:normal; }
h1{
  font-size:clamp(2.1rem,4vw,3.3rem); line-height:1.16; font-weight:700;
  letter-spacing:.02em; margin:0 0 20px; text-wrap:balance;
}
#intro p{ color:var(--ink-2); margin:0; max-width:24em; font-size:14px; }
#intro p b{ color:var(--ink); font-weight:600; }
#intro .cta{ margin-top:14px; color:var(--ink-3); font-size:12.5px; }

/* ── 图例 ─────────────────────────────── */
#legend{
  position:fixed; left:44px; bottom:38px; z-index:6;
  background:color-mix(in srgb,var(--panel) 82%,transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--rule); border-radius:4px; padding:11px 4px 8px;
  min-width:208px; max-height:52vh; overflow-y:auto;
}
#legend h2{
  font-size:9.5px; letter-spacing:.2em; color:var(--ink-3);
  margin:0 0 9px; padding:0 14px; font-weight:500;
}
.lg{
  display:grid; grid-template-columns:9px 1fr auto; align-items:center; gap:0 10px;
  width:100%; padding:3px 14px; background:none; border:0; cursor:pointer;
  font:inherit; font-size:12.5px; color:var(--ink-2); text-align:left;
  transition:color .15s, background .15s;
}
.lg:hover{ color:var(--ink); background:#ffffff08; }
.lg:focus-visible{ outline:1px solid var(--accent); outline-offset:-2px; }
.lg .dot{ width:9px; height:9px; border-radius:50%; background:var(--c); transition:opacity .15s; }
.lg .n{ font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums;
  font-family:ui-monospace,"SF Mono",Menlo,monospace; }
.lg[aria-pressed="false"]{ color:var(--ink-3); }
.lg[aria-pressed="false"] .dot{ opacity:.2; }
.lg-h{ font-size:9.5px; letter-spacing:.18em; color:var(--ink-3); padding:9px 14px 3px; }
.lg-h:first-child{ padding-top:2px; }

/* ── 层级筛选 ─────────────────────────── */
#lvl{
  position:fixed; left:50%; transform:translateX(-50%); bottom:38px; z-index:6;
  display:flex; align-items:center; gap:16px;
  background:color-mix(in srgb,var(--panel) 82%,transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--rule); border-radius:100px; padding:9px 20px;
}
#lvl label{ font-size:10px; letter-spacing:.18em; color:var(--ink-3); white-space:nowrap; }
#lvlOut{ font-size:13px; color:var(--accent); min-width:5.6em; white-space:nowrap; }
#lvlR{ -webkit-appearance:none; appearance:none; width:190px; height:18px; background:none; cursor:pointer; margin:0; }
#lvlR::-webkit-slider-runnable-track{ height:2px; background:var(--rule-2); border-radius:2px; }
#lvlR::-moz-range-track{ height:2px; background:var(--rule-2); border-radius:2px; }
#lvlR::-webkit-slider-thumb{ -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
  background:var(--accent); border:2px solid var(--bg); margin-top:-5.5px; }
#lvlR::-moz-range-thumb{ width:13px; height:13px; border-radius:50%; background:var(--accent); border:2px solid var(--bg); }
#lvlR:focus-visible{ outline:1px solid var(--accent); outline-offset:4px; border-radius:4px; }
#lvlAll{
  font:inherit; font-size:11.5px; padding:2px 11px; border-radius:100px; cursor:pointer;
  background:none; color:var(--ink-3); border:1px solid var(--rule-2); white-space:nowrap;
}
#lvlAll:hover{ color:var(--accent); border-color:var(--accent); }
#lvlAll[aria-pressed="true"]{ color:var(--accent); border-color:var(--accent); }

/* ── 搜索 ─────────────────────────────── */
#search{
  position:fixed; right:44px; top:30px; z-index:7; width:248px;
}
#q{
  width:100%; font:inherit; font-size:13px; color:var(--ink);
  background:color-mix(in srgb,var(--panel) 82%,transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--rule); border-radius:100px; padding:8px 16px; outline:none;
}
#q::placeholder{ color:var(--ink-3); }
#q:focus{ border-color:var(--accent); }
#hits{
  margin-top:6px; background:color-mix(in srgb,var(--panel) 94%,transparent);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border:1px solid var(--rule); border-radius:4px; max-height:48vh; overflow-y:auto;
  display:none; padding:5px 0;
}
#hits.on{ display:block; }
.hit{
  display:grid; grid-template-columns:7px 1fr; align-items:baseline; gap:0 9px;
  width:100%; padding:5px 13px; background:none; border:0; cursor:pointer;
  font:inherit; font-size:12.5px; color:var(--ink-2); text-align:left; line-height:1.5;
}
.hit:hover{ color:var(--accent); background:#ffffff08; }
.hit .dot{ width:7px; height:7px; border-radius:50%; transform:translateY(-1px); }
.hit small{ color:var(--ink-3); font-size:10.5px; margin-left:6px; }

/* ── 提示 ─────────────────────────────── */
#hint{
  position:fixed; right:44px; bottom:38px; z-index:6; text-align:right;
  font-size:11px; color:var(--ink-3); letter-spacing:.04em; line-height:2;
}
#hint .k{ color:var(--ink-2); }

/* ── P3 掌握度条（左下，hint 上方）────── */
#mastery{
  position:fixed; left:18px; bottom:64px; z-index:6;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap; max-width:min(92vw,560px);
  background:color-mix(in srgb,var(--panel) 82%,transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid #ffffff10; border-radius:10px; padding:8px 12px;
  font-size:12px; color:var(--ink-2);
}
#mastery .m-tip{ color:var(--ink-3); }
#mastery .m-n{ font-variant-numeric:tabular-nums; white-space:nowrap; }
#mastery .m-b{
  font:inherit; font-size:11.5px; color:var(--ink-2); cursor:pointer;
  background:none; border:1px solid #ffffff18; border-radius:100px; padding:3px 10px;
}
#mastery .m-b:hover{ color:var(--ink); border-color:#ffffff40; }
#mastery .m-b[aria-pressed="true"]{ color:#F0748F; border-color:#F0748F88; }
#mastery #mTog[aria-pressed="true"]{ color:var(--ink-2); border-color:#ffffff18; }

/* ── 详情面板 ─────────────────────────── */
#panel{
  position:fixed; right:0; top:0; bottom:0; width:min(430px,92vw); z-index:20;
  background:color-mix(in srgb,var(--panel) 94%,transparent);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-left:1px solid var(--rule); overflow-y:auto; overscroll-behavior:contain;
  transform:translateX(100%); transition:transform .3s cubic-bezier(.4,0,.2,1);
  padding:32px 34px 48px;
}
#panel.open{ transform:none; }
#close{
  position:absolute; right:22px; top:22px; width:28px; height:28px; border-radius:50%;
  background:none; border:1px solid var(--rule-2); color:var(--ink-3);
  font-size:15px; line-height:1; cursor:pointer; padding:0;
}
#close:hover{ color:var(--ink); border-color:var(--ink-3); }
.p-sub{ display:flex; align-items:center; gap:8px; font-size:11px; letter-spacing:.1em; margin:0 0 14px; }
.p-sub .dot{ width:8px; height:8px; border-radius:50%; }
.p-name{ font-size:1.66rem; font-weight:700; line-height:1.32; margin:0 0 14px; letter-spacing:.02em; }
.p-desc{
  font-size:13.5px; color:var(--ink-2); line-height:1.85; margin:0 0 22px;
  padding-left:14px; border-left:2px solid var(--rule-2);
}
.p-meta{ display:flex; flex-wrap:wrap; gap:7px; margin:0 0 26px; }
.chip{
  font-size:11px; padding:3px 10px; border-radius:100px;
  border:1px solid var(--rule-2); color:var(--ink-2); white-space:nowrap;
}
.chip.lv{ color:var(--accent); border-color:color-mix(in srgb,var(--accent) 40%,transparent); }
.chip.w5{ color:#F0748F; border-color:#F0748F66; }
.p-h{
  font-size:10px; letter-spacing:.2em; color:var(--ink-3);
  margin:30px 0 12px; padding-bottom:9px; border-bottom:1px solid var(--rule);
  display:flex; justify-content:space-between; align-items:baseline;
}
.p-h .c{ font-size:11px; color:var(--ink-2); letter-spacing:0;
  font-family:ui-monospace,"SF Mono",Menlo,monospace; }
.depth{ margin:0 0 4px; }
.depth-l{ font-size:10.5px; color:var(--ink-3); margin:14px 0 6px; letter-spacing:.06em; }
.depth:first-child .depth-l{ margin-top:2px; }
.item{
  display:grid; grid-template-columns:7px 1fr auto; align-items:baseline; gap:0 10px;
  width:100%; padding:5px 0; background:none; border:0; cursor:pointer;
  font:inherit; font-size:13px; color:var(--ink-2); text-align:left; line-height:1.55;
}
.item:hover{ color:var(--accent); }
.item:focus-visible{ outline:1px solid var(--accent); outline-offset:1px; }
.item .dot{ width:7px; height:7px; border-radius:50%; transform:translateY(-1px); }
.item .a{ font-size:10.5px; color:var(--ink-3);
  font-family:ui-monospace,"SF Mono",Menlo,monospace; }
.item.soft .dot{ opacity:.35; }
.why{ font-size:11.5px; color:var(--ink-3); line-height:1.7; margin:-2px 0 8px 17px; }
.empty{ font-size:12.5px; color:var(--ink-3); margin:0; }
.p-foot{
  margin-top:38px; padding-top:18px; border-top:1px solid var(--rule);
  font-size:11px; color:var(--ink-3); line-height:1.85;
}
.src{ font-size:11.5px; color:var(--ink-2); }
#gfb{ margin-top:26px; border-top:1px solid var(--rule); padding-top:16px; }
#gfb h3{ font-size:10px; letter-spacing:.18em; color:var(--ink-3); margin:0 0 9px; font-weight:500; }
#gfbText{
  width:100%; min-height:64px; font:inherit; font-size:13px; line-height:1.8; color:var(--ink);
  background:var(--panel-2); border:1px solid var(--rule-2); border-radius:6px;
  padding:10px 12px; resize:vertical; outline:none;
}
#gfbText:focus{ border-color:var(--accent); }
#gfbSave{
  font:inherit; font-size:11.5px; padding:3px 12px; border-radius:100px; cursor:pointer;
  background:none; color:var(--ink-3); border:1px solid var(--rule-2); margin-top:8px;
}
#gfbSave:hover{ color:var(--accent); border-color:var(--accent); }
#gfbTag{ font-size:11px; color:#5FD0A0; margin-left:9px; }
/* 溯源默认收起——Simon 要求不默认占一段文字，想查时再点开 */
#srcBtn{
  font:inherit; font-size:11.5px; padding:3px 12px; border-radius:100px; cursor:pointer;
  background:none; color:var(--ink-3); border:1px solid var(--rule-2); margin-top:2px;
}
#srcBtn:hover{ color:var(--accent); border-color:var(--accent); }
#srcBox{ display:none; margin-top:12px; }
#srcBox.on{ display:block; }
.srow{
  display:grid; grid-template-columns:auto 1fr auto; gap:0 9px; align-items:baseline;
  font-size:11.5px; color:var(--ink-2); line-height:1.75; padding:3px 0;
  border-bottom:1px solid var(--rule);
}
.srow:last-child{ border-bottom:0; }
.srow .t{ font-size:10px; letter-spacing:.08em; color:var(--ink-3); white-space:nowrap; }
.srow .loc{ font-size:11px; color:var(--accent);
  font-family:ui-monospace,"SF Mono",Menlo,monospace; white-space:nowrap; }
.srow .loc.weak{ color:var(--ink-3); }
.srow .how{ grid-column:2/-1; font-size:10.5px; color:var(--ink-3); }

#loading{
  position:fixed; inset:0; display:grid; place-items:center; z-index:40;
  background:var(--bg); color:var(--ink-3); font-size:12px; letter-spacing:.2em;
  transition:opacity .5s ease;
}
#loading.gone{ opacity:0; pointer-events:none; }

@media (max-width:820px){
  #intro{ left:22px; right:22px; top:8vh; max-width:none; }
  h1{ font-size:2rem; }
  #legend{ left:22px; bottom:96px; min-width:0; padding:9px 2px 6px; max-height:38vh; }
  #legend h2{ padding:0 11px; }
  .lg{ padding:3px 11px; font-size:11.5px; }
  #lvl{ bottom:26px; padding:7px 15px; gap:11px; width:calc(100vw - 44px); justify-content:center; }
  #lvl label{ display:none; }
  #lvlR{ width:100%; min-width:0; }
  #search{ right:22px; left:22px; width:auto; top:16px; }
  #hint{ display:none; }
  #panel{ padding:26px 22px 40px; }
}
/* 窄屏或矮屏时图例会压住介绍段落（图例现在有 7 行），只保留标题 */
@media (max-width:820px), (max-height:760px){
  #intro p:not(.cta){ display:none; }
  #intro .cta{ margin-top:10px; }
}
@media (max-height:640px){
  #intro .cta{ display:none; }
  #legend{ max-height:32vh; }
}
@media (prefers-reduced-motion:reduce){
  #panel,#intro{ transition:none; }
}
</style>

<canvas id="stage"></canvas>

<div id="loading" class="mono">正在展开考点依赖网</div>

<div id="intro">
  <p class="eyebrow"><i></i>2026 主观题 · 七科全覆盖 · 教材依赖图</p>
  <h1 class="song">法考主观题<br />要学的一切</h1>
  <p><b>887</b> 个考点，<b>973</b> 条前置依赖，覆盖 <b>118</b> 个专题。不是扁平的考点清单，而是一张有方向的网——每条连线都写明了：学这个之前，得先会哪个。</p>
  <p class="cta">越往上的点，要垫的东西越多。点一个点试试。</p>
</div>

<div id="search">
  <input id="q" type="search" placeholder="搜考点／专题，如 协议管辖 / 表见代理" autocomplete="off" spellcheck="false" />
  <div id="hits"></div>
</div>

<div id="legend">
  <h2>科目 · 点击开关</h2>
  <div id="legendRows"></div>
</div>

<div id="lvl">
  <label>依赖层级</label>
  <span id="lvlOut" class="mono">全部</span>
  <input type="range" id="lvlR" min="0" max="23" step="1" value="0" aria-label="按依赖层级筛选" />
  <button id="lvlAll" aria-pressed="true">全部</button>
</div>

<div id="mastery"></div>

<div id="hint">
  <div><span class="k">拖动</span> 旋转 · <span class="k">滚轮</span> 缩放 · <span class="k">点击</span> 展开</div>
  <div>依据 2026 主观题攻略七科自建 · 备考自用</div>
</div>

<aside id="panel" aria-live="polite">
  <button id="close" aria-label="关闭">✕</button>
  <div id="panelBody"></div>

const M_KEY = "fakao-map-mastery";
let mastery = null, masteryOn = true, weakOnly = false;
try { mastery = JSON.parse(localStorage.getItem(M_KEY) || "null"); } catch(e){}
const M_COL = { g:"#5FD0A0", y:"#F5B942", r:"#F0748F", none:"#2E3A47" };
function mBand(tid){
  if (!mastery) return null;
  const s = mastery[tid];
  if (!s) return "none";
  if ((s.lapses|0) >= 3) return "r";
  if ((s.lv|0) >= 4) return "g";
  return (s.lv|0) >= 2 ? "y" : "r";
}
function applyMastery(obj){
  const bt = obj && (obj.byTopic || obj);          // 兼容整份 progress.json 或裸 byTopic
  if (!bt || typeof bt !== "object" || Array.isArray(bt)) return false;
  const keys = Object.keys(bt).filter(k => /^[a-z]{2}\d{3}$/.test(k));
  if (!keys.length) return false;
  mastery = {}; for (const k of keys) mastery[k] = bt[k];
  localStorage.setItem(M_KEY, JSON.stringify(mastery));
  masteryOn = true; paintMasteryBar(); draw();
  return true;
}

  let g=0,y=0,r=0,none=0;
  for (let i=0;i<G.nodes.length;i++){
    const b = mBand(TID[i]);
    if (b==="g") g++; else if (b==="y") y++; else if (b==="r") r++; else none++;
  }
  el.innerHTML =
    `<span class="m-n" style="color:${M_COL.g}">●${g}</span>`+
    `<span class="m-n" style="color:${M_COL.y}">●${y}</span>`+
    `<span class="m-n" style="color:${M_COL.r}">●${r}</span>`+
    `<span class="m-n" style="color:#5A6B7E">○${none} 未刷</span>`+
    `<button class="m-b" id="mWeak" aria-pressed="${weakOnly}">只看薄弱</button>`+
    `<button class="m-b" id="mTog" aria-pressed="${masteryOn}">${masteryOn?"掌握度着色":"原色"}</button>`+
    `<button class="m-b" id="mClr" title="清除本机掌握度数据">✕</button>`;
  document.getElementById("mWeak").onclick = () => { weakOnly = !weakOnly; if (weakOnly) masteryOn = true; paintMasteryBar(); draw(); };
  document.getElementById("mTog").onclick  = () => { masteryOn = !masteryOn; if (!masteryOn) weakOnly = false; paintMasteryBar(); draw(); };
  document.getElementById("mClr").onclick  = () => { mastery = null; weakOnly = false; localStorage.removeItem(M_KEY); paintMasteryBar(); draw(); };
}
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => {
  e.preventDefault();
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f) return;
  f.text().then(t => {
    let ok = false;
    try { ok = applyMastery(JSON.parse(t)); } catch(err){}
    if (!ok){ const el = document.getElementById("mastery");
      el.innerHTML = `<span class="m-tip" style="color:${M_COL.r}">这份文件里没有 byTopic 掌握度数据——要闯关收工页「导出进度」那份 progress.json</span>`;
      setTimeout(paintMasteryBar, 4200); }
  });
});
/* SRC 是数组，每项 [类型, 引用, 定位, 置信度, 定位方式] */
const SRC_T = { book:"教材", lecture:"网课实录", note:"笔记", law:"法条", manual:"用户指定补充" };
const SRC_C = { exact:"", range:"待核", none:"未定位" };
const TID = G.nodes.map(n => n[10]);   // 考点 id（全局连接键）

const pre = Array.from({length:N}, () => []);   // 前置
const post = Array.from({length:N}, () => []);  // 后续
const eIndex = new Map();
G.edges.forEach(([a,b,hard], i) => {
  pre[a].push([b,hard,i]); post[b].push([a,hard,i]);
  eIndex.set(a+"_"+b, i);
});

const catOn = G.cats.map(() => true);
let lvlFilter = null;

function visible(i){
  const n = G.nodes[i];
  if (!catOn[n[CA]]) return false;
  if (lvlFilter !== null && n[LV] !== lvlFilter) return false;
  if (weakOnly && mBand(TID[i]) !== "r") return false;   // 只看薄弱：只留红档
  return true;
}

/* ─────────── 渲染 ─────────── */
const cv = document.getElementById("stage");
const ctx = cv.getContext("2d", { alpha:false });
let W=0, H=0, DPR=1;
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width = W+"px"; cv.style.height = H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize", resize); resize();

let rotY = 0.4, rotX = -0.13, zoom = 1, spin = 0.0016;
const px = new Float32Array(N), py = new Float32Array(N), pz = new Float32Array(N), pr = new Float32Array(N);
const order = new Int32Array(N);
let selected = -1, hovered = -1, chain = null;

function project(){
  const cy=Math.cos(rotY), sy=Math.sin(rotY), cx=Math.cos(rotX), sx=Math.sin(rotX);
  const cxc = camX, cyc = H*0.52;
  const base = Math.min(W > 820 ? W*0.56 : W*0.92, H*0.86) / 680;
  const s = base * zoom * 1.05;
  const FOV = 1250;
  for (let i=0;i<N;i++){
    const n = G.nodes[i];
    const x=n[NX], y=n[NY], z=n[NZ];
    let X = x*cy + z*sy, Z = z*cy - x*sy;
    let Y = y*cx - Z*sx;  Z = Z*cx + y*sx;
    const d = FOV / (FOV + Z*s + 260);
    px[i] = cxc + X*s*d;
    py[i] = cyc + Y*s*d;
    pz[i] = Z;
    pr[i] = (1.5 + (n[WT]-1)*1.35) * d * Math.min(zoom,2.4) * (base*0.92+0.34);
  }
}

function draw(){
  ctx.fillStyle = "#070A0F";
  ctx.fillRect(0,0,W,H);

  const hi = chain;
  ctx.lineWidth = 0.55;
  ctx.strokeStyle = hi ? "rgba(150,175,200,0.045)" : "rgba(150,175,200,0.10)";
  ctx.beginPath();
  for (let e=0;e<G.edges.length;e++){
    const a=G.edges[e][0], b=G.edges[e][1];
    if (!visible(a) || !visible(b)) continue;
    if (hi && hi.edge.has(e)) continue;
    ctx.moveTo(px[a],py[a]); ctx.lineTo(px[b],py[b]);
  }
  ctx.stroke();

  if (hi){
    ctx.lineWidth = 1.15;
    ctx.strokeStyle = "rgba(79,216,232,0.5)";
    ctx.beginPath();
    for (const e of hi.edge){
      const a=G.edges[e][0], b=G.edges[e][1];
      ctx.moveTo(px[a],py[a]); ctx.lineTo(px[b],py[b]);
    }
    ctx.stroke();
  }

  let m=0;
  for (let i=0;i<N;i++) if (visible(i)) order[m++]=i;
  const view = order.subarray(0,m);
  Array.prototype.sort.call(view, (a,b)=> pz[b]-pz[a]);

  for (let k=0;k<m;k++){
    const i = view[k];
    const dim = hi && !hi.node.has(i);
    const dep = Math.max(0, Math.min(1, (pz[i]+330)/660));
    let alpha = 0.30 + dep*0.70;
    if (dim) alpha *= 0.13;
    ctx.globalAlpha = alpha;
    const mb = masteryOn ? mBand(TID[i]) : null;
    ctx.fillStyle = mb ? M_COL[mb] : COL[G.nodes[i][CA]];
    ctx.beginPath();
    ctx.arc(px[i], py[i], Math.max(0.6, pr[i]), 0, 6.2832);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const [i,c] of [[selected,"#4FD8E8"],[hovered,"#FFFFFF"]]){
    if (i < 0 || !visible(i)) continue;
    ctx.strokeStyle = c; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(px[i],py[i], Math.max(pr[i],3)+6, 0, 6.2832); ctx.stroke();
  }
  if (hovered >= 0 && hovered !== selected && visible(hovered)){
    const n = G.nodes[hovered];
    ctx.font = '13px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
    const t = n[NM], w = ctx.measureText(t).width;
    let lx = px[hovered]+14; const ly = py[hovered]+4;
    if (lx + w > W-16) lx = px[hovered]-14-w;
    ctx.fillStyle = "rgba(7,10,15,0.82)";
    ctx.fillRect(lx-7, ly-15, w+14, 22);
    ctx.fillStyle = "#E8EDF2";
    ctx.fillText(t, lx, ly);
  }
}

function camTarget(){
  if (W <= 820) return W/2;
  return panelOpen ? Math.max(W*0.30, (W - Math.min(430, W*0.92))/2) : W*0.60;
}
let camX = 0;

let needsDraw = true;
function frame(){
  if (!dragging && !panelOpen) { rotY += spin; needsDraw = true; }
  const t = camTarget();
  if (Math.abs(camX - t) > 0.4){ camX += (t - camX) * 0.12; needsDraw = true; }
  else camX = t;
  if (needsDraw){ project(); draw(); needsDraw = false; }
  requestAnimationFrame(frame);
}

/* ─────────── 交互 ─────────── */
let dragging=false, moved=false, lx=0, ly=0, panelOpen=false;

function pick(mx,my){
  let best=-1, bd=18*18;
  for (let i=0;i<N;i++){
    if (!visible(i)) continue;
    const dx=px[i]-mx, dy=py[i]-my, d=dx*dx+dy*dy;
    const r = Math.max(pr[i],4)+5;
    if (d < r*r && d < bd){ bd=d; best=i; }
  }
  return best;
}

cv.addEventListener("pointerdown", e => {
  dragging=true; moved=false; lx=e.clientX; ly=e.clientY;
  cv.classList.add("drag"); cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", e => {
  if (dragging){
    const dx=e.clientX-lx, dy=e.clientY-ly;
    if (Math.abs(dx)+Math.abs(dy) > 3) moved=true;
    rotY += dx*0.0052; rotX += dy*0.0042;
    rotX = Math.max(-1.35, Math.min(1.35, rotX));
    lx=e.clientX; ly=e.clientY; needsDraw=true;
  } else {
    const h = pick(e.clientX, e.clientY);
    if (h !== hovered){ hovered=h; needsDraw=true; cv.style.cursor = h>=0 ? "pointer" : "grab"; }
  }
});
cv.addEventListener("pointerup", e => {
  dragging=false; cv.classList.remove("drag");
  if (!moved){ const i = pick(e.clientX, e.clientY); i>=0 ? open(i) : close(); }
});
cv.addEventListener("pointercancel", () => { dragging=false; cv.classList.remove("drag"); });
cv.addEventListener("wheel", e => {
  e.preventDefault();
  zoom = Math.max(0.35, Math.min(6, zoom * (e.deltaY > 0 ? 0.92 : 1.087)));
  needsDraw = true;
}, { passive:false });

let pinch = 0;
cv.addEventListener("touchmove", e => {
  if (e.touches.length !== 2) return;
  const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  if (pinch) { zoom = Math.max(0.35, Math.min(6, zoom * d/pinch)); needsDraw = true; }
  pinch = d;
}, { passive:true });
cv.addEventListener("touchend", () => { pinch = 0; });

/* ─────────── 前置闭包 ─────────── */
function closure(start){
  const node = new Set([start]), edge = new Set(), levels = [];
  let front = [start], d = 0;
  while (front.length && d < 40){
    const next = [];
    for (const a of front){
      for (const [b,,ei] of pre[a]){
        edge.add(ei);
        if (!node.has(b)){ node.add(b); next.push(b); }
      }
    }
    if (next.length) levels.push(next.slice());
    front = next; d++;
  }
  return { node, edge, levels };
}

/* ─────────── 面板 ─────────── */
const panel = document.getElementById("panel");
const body = document.getElementById("panelBody");
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const stars = w => "★".repeat(w) + "☆".repeat(5-w);

function srcRows(list){
  if (!list || !list.length) return `<p class="empty">还没登记来源。</p>`;
  return list.map(([t,ref,loc,conf,how]) => `<div class="srow">
      <span class="t">${esc(SRC_T[t] || t)}</span>
      <span>${esc(ref)}</span>
      <span class="loc${conf==="exact"?"":" weak"}">${esc(loc || SRC_C[conf] || "")}</span>
      ${how ? `<span class="how">${esc(how)}${conf==="range"?"，只定位到专题区间，需回教材确认具体页":""}</span>` : ""}
    </div>`).join("");
}

function row(i, hard){
  const n = G.nodes[i];
  return `<button class="item${hard===0?" soft":""}" data-i="${i}">
    <span class="dot" style="background:${COL[n[CA]]}"></span>
    <span>${esc(n[NM])}</span>
    <span class="a">L${n[LV]}</span>
  </button>`;
}

function open(i){
  selected = i; chain = closure(i); panelOpen = true; needsDraw = true;
  document.getElementById("intro").classList.add("away");
  hideHits();
  const n = G.nodes[i];
  const total = chain.node.size - 1;
  const down = post[i].map(([a]) => a);

  const direct = pre[i].map(([b,hard,ei]) =>
    row(b,hard) + `<p class="why">${esc(G.edges[ei][3])}</p>`).join("");

  const rest = chain.levels.slice(1).map((lv, d) => `
    <div class="depth">
      <div class="depth-l mono">↑ 再往前 ${d+2} 层 · ${lv.length} 项</div>
      ${lv.sort((a,b)=>G.nodes[b][LV]-G.nodes[a][LV]).map(x => row(x,1)).join("")}
    </div>`).join("");

  body.innerHTML = `
    <div class="p-sub"><span class="dot" style="background:${COL[n[CA]]}"></span>
      <span>${esc(G.cats[n[CA]])} · ${esc(G.domains[n[DO]])}</span></div>
    <h2 class="p-name song">${esc(n[NM])}</h2>
    ${n[DE] ? `<p class="p-desc">${esc(n[DE])}</p>` : ""}
    <div class="p-meta">
      <span class="chip lv">第 ${n[LV]} 层</span>
      <span class="chip${n[WT]>=5?" w5":""}">${stars(n[WT])}</span>
      <span class="chip">直接前置 ${pre[i].length}</span>
      <span class="chip">后续 ${down.length}</span>
      ${mastery ? (mastery[TID[i]]
        ? `<span class="chip" style="color:${M_COL[mBand(TID[i])]};border-color:${M_COL[mBand(TID[i])]}55">已练到 L${mastery[TID[i]].lv|0}${(mastery[TID[i]].lapses|0)?` · 栽过 ${mastery[TID[i]].lapses|0} 次`:""}</span>`
        : `<span class="chip" style="color:#5A6B7E">还没刷过</span>`) : ""}
    </div>

    <div class="p-h"><span>此前必须先会</span><span class="c">${total} 项</span></div>
    ${pre[i].length ? `<div class="depth"><div class="depth-l mono">↑ 直接前置 · ${pre[i].length} 项</div>${direct}</div>${rest}`
      : `<p class="empty">没有前置——这是图上的起点之一，可以直接开始。</p>`}

    <div class="p-h"><span>会了它才能学</span><span class="c">${down.length} 项</span></div>
    ${down.length
      ? down.sort((a,b)=>G.nodes[a][LV]-G.nodes[b][LV]).map(x => row(x,1)).join("")
      : `<p class="empty">图上没有以它为前置的考点。</p>`}

    <button id="srcBtn" aria-expanded="false">溯源 · ${n[SRC].length} 条来源</button>
    <div id="srcBox">${srcRows(n[SRC])}</div>
    <div id="gfb"><h3>逛到这里的想法 · 随手记<span id="gfbTag"></span></h3>
      <textarea id="gfbText" placeholder="例：这个点要巩固 / 这条前置关系不对 / 释义该补充××"></textarea>
      <button id="gfbSave">存下这条</button></div>

    <div class="p-foot">
      考点清单来自七科 2026 主观题攻略（民法·孟献贵／刑法·柏浪涛／民诉·戴鹏／刑诉·左宁／
      行政法·李佳／商法·郄鹏恩／理论法·马峰），页码由脚本回正文定位。行政法、商法、理论法的
      考点为正文标题自动收割后人工校订，其专题内的连线标注为「教材编排顺序」的仍待细化为真实前置。
      释义以教材表述为准，如与教材不一致以教材为准。
    </div>`;
  panel.classList.add("open");
  panel.scrollTop = 0;
}

function close(){
  selected = -1; chain = null; panelOpen = false; needsDraw = true;
  panel.classList.remove("open");
  document.getElementById("intro").classList.remove("away");
}

document.getElementById("close").addEventListener("click", close);
/* 全景图反馈：存 localStorage，有同步 token（与 Session 同域共享）就顺手推到同一端点，
   Claude「收反馈」时从服务器一起拉。失败静默，不打断逛图。 */
function saveGraphFb(i){
  const ta = document.getElementById("gfbText"), txt = ta.value.trim();
  if (!txt) return;
  const n = G.nodes[i];
  const fb = { ts: Date.now(), device: "graph", itemId: "graph", topicIds: [TID[i]],
               lv: 0, text: `【${n[NM]}】${txt}` };
  const box = JSON.parse(localStorage.getItem("fakao-graph-feedback") || "[]");
  box.push(fb); localStorage.setItem("fakao-graph-feedback", JSON.stringify(box));
  ta.value = "";
  const tag = document.getElementById("gfbTag");
  tag.textContent = "已存"; setTimeout(() => tag.textContent = "", 2000);
  const token = localStorage.getItem("fakao-sync-token");
  if (token) fetch(`https://ai-proxy.congshi-jiang.workers.dev/v1/sync/s/${token}/merge`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ items: {}, feedback: box }),
  }).then(r => { if (r.ok) tag.textContent = "已同步"; setTimeout(() => tag.textContent = "", 2000); })
    .catch(() => {});
}

body.addEventListener("click", e => {
  const b = e.target.closest(".item");
  if (b) { open(+b.dataset.i); return; }
  if (e.target.closest("#gfbSave")){ saveGraphFb(selected); return; }
  if (e.target.closest("#srcBtn")){
    const box = document.getElementById("srcBox"), btn = document.getElementById("srcBtn");
    const on = box.classList.toggle("on");
    btn.setAttribute("aria-expanded", String(on));
  }
});
addEventListener("keydown", e => { if (e.key === "Escape"){ close(); hideHits(); } });

/* ─────────── 图例 ─────────── */
const counts = G.cats.map(() => 0);
for (const n of G.nodes) counts[n[CA]]++;
document.getElementById("legendRows").innerHTML = G.cats.map((c,i) =>
  `<button class="lg" data-c="${i}" aria-pressed="true" style="--c:${COL[i]}">
      <span class="dot"></span><span>${esc(c)}</span><span class="n">${counts[i]}</span>
    </button>`).join("");

paintMasteryBar();   /* P3：本机存过掌握度就直接上色，没存过显示拖入提示 */

document.getElementById("legendRows").addEventListener("click", e => {
  const b = e.target.closest(".lg"); if (!b) return;
  const c = +b.dataset.c;
  catOn[c] = !catOn[c];
  b.setAttribute("aria-pressed", String(catOn[c]));
  needsDraw = true;
});

/* ─────────── 层级筛选 ─────────── */
const lvlR = document.getElementById("lvlR"), lvlOut = document.getElementById("lvlOut"),
      lvlAll = document.getElementById("lvlAll");
lvlR.max = String(G.levelMax);
function syncLvl(){
  lvlOut.textContent = lvlFilter === null ? "全部" : "第 " + lvlFilter + " 层";
  lvlAll.setAttribute("aria-pressed", String(lvlFilter === null));
  needsDraw = true;
}
lvlR.addEventListener("input", () => { lvlFilter = +lvlR.value; syncLvl(); });
lvlAll.addEventListener("click", () => { lvlFilter = null; syncLvl(); });

/* ─────────── 搜索 ─────────── */
const q = document.getElementById("q"), hits = document.getElementById("hits");
function hideHits(){ hits.classList.remove("on"); }
q.addEventListener("input", () => {
  const s = q.value.trim();
  if (!s){ hideHits(); return; }
  const found = [];
  for (let i=0;i<N;i++){
    const n = G.nodes[i];
    if (n[NM].includes(s) || G.domains[n[DO]].includes(s) || (n[DE]||"").includes(s)) found.push(i);
    if (found.length >= 40) break;
  }
  hits.innerHTML = found.length
    ? found.map(i => `<button class="hit" data-i="${i}">
        <span class="dot" style="background:${COL[G.nodes[i][CA]]}"></span>
        <span>${esc(G.nodes[i][NM])}<small>${esc(G.domains[G.nodes[i][DO]])} · L${G.nodes[i][LV]}</small></span>
      </button>`).join("")
    : `<p class="empty" style="padding:8px 13px">没找到</p>`;
  hits.classList.add("on");
});
hits.addEventListener("click", e => {
  const b = e.target.closest(".hit"); if (!b) return;
  const i = +b.dataset.i;
  catOn[G.nodes[i][CA]] = true;
  document.querySelector(`.lg[data-c="${G.nodes[i][CA]}"]`)?.setAttribute("aria-pressed","true");
  lvlFilter = null; syncLvl();
  q.value = ""; open(i);
});
q.addEventListener("keydown", e => { if (e.key === "Escape"){ q.value=""; hideHits(); } });

/* ─────────── 启动 ─────────── */
camX = camTarget();
project(); draw(); frame();
setTimeout(() => document.getElementById("loading").classList.add("gone"), 260);
</script>
