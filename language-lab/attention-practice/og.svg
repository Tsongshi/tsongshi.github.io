    <rect x="178" width="126" height="46" rx="23" fill="none" stroke="#315247" stroke-width="2"/>
    <text x="241" y="29" fill="#315247" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700">PERFORM</text>
    <text x="323" y="29" fill="#b18a43" font-family="Arial, sans-serif" font-size="23">→</text>
    <rect x="356" width="126" height="46" rx="23" fill="none" stroke="#315247" stroke-width="2"/>
    <text x="419" y="29" fill="#315247" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700">INSPECT</text>
  </g>
  <g transform="translate(880 306)">
    <circle r="196" fill="none" stroke="#315247" stroke-width="3"/>
    <circle r="143" fill="none" stroke="#a8aaa1" stroke-width="2"/>
    <circle r="88" fill="#ded8cc" stroke="#a8aaa1" stroke-width="2"/>
    <text x="0" y="12" fill="#315247" text-anchor="middle" font-family="Georgia, serif" font-size="80">1K</text>
    <text x="0" y="55" fill="#53605a" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">DIRECTION, NOT GUARANTEE</text>
  </g>
  <text x="76" y="574" fill="#53605a" font-family="Arial, sans-serif" font-size="17">Evidence-aware · B2 clear English · one 25-minute practice session</text>
