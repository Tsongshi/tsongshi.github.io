<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The Attention Practice System</title>
  <desc id="desc">Do not collect empty hours. Focus, perform, inspect, repair, retrieve, and transfer.</desc>
  <rect width="1200" height="630" fill="#d4cec2"/>
  <path d="M0 0h16v630H0z" fill="#315247"/>
  <text x="74" y="86" fill="#315247" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">LANGUAGE LEARNING LAB · METHOD 04</text>
  <text x="72" y="206" fill="#26322d" font-family="Georgia, serif" font-size="78">Do not collect</text>
  <text x="72" y="292" fill="#315247" font-family="Georgia, serif" font-size="82">empty hours.</text>
  <text x="76" y="360" fill="#53605a" font-family="Arial, sans-serif" font-size="24">Turn attention into observable skill.</text>
  <g transform="translate(74 432)">
