<body>
<style>
:root{
  --bg:#070A0F; --panel:#0D1219; --panel-2:#131A24;
  --ink:#E8EDF2; --ink-2:#9FB0C0; --ink-3:#65778A;
  --rule:#1B2530; --rule-2:#26333F;
  --accent:#4FD8E8;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",-apple-system,sans-serif;
  font-size:14px; line-height:1.7; -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
.song{ font-family:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif; }
.mono{ font-family:ui-monospace,"SF Mono",Menlo,monospace; font-variant-numeric:tabular-nums; }

#stage{ position:fixed; inset:0; touch-action:none; cursor:grab; display:block; }
#stage.drag{ cursor:grabbing; }

/* ── title block ──────────────────────── */
#intro{
  position:fixed; left:44px; top:14vh; max-width:min(30rem,42vw);
  pointer-events:none; z-index:5;
  transition:opacity .45s ease, transform .45s ease;
}
#intro.away{ opacity:0; transform:translateX(-14px); }
.eyebrow{
  display:flex; align-items:center; gap:9px;
  font-size:10.5px; letter-spacing:.2em; color:var(--ink-3); margin:0 0 22px;
}
.eyebrow i{ width:5px; height:5px; border-radius:50%; background:var(--accent); font-style:normal; }
h1{
  font-size:clamp(2.4rem,4.6vw,3.9rem); line-height:1.16; font-weight:700;
  letter-spacing:.02em; margin:0 0 24px; text-wrap:balance;
}
#intro p{ color:var(--ink-2); margin:0; max-width:26em; font-size:14.5px; }
#intro p b{ color:var(--ink); font-weight:600; }
#intro .cta{ margin-top:18px; color:var(--ink-3); font-size:12.5px; }

/* ── legend ───────────────────────────── */
#legend{
  position:fixed; left:44px; bottom:38px; z-index:6;
  background:color-mix(in srgb,var(--panel) 82%,transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--rule); border-radius:4px; padding:14px 4px 10px;
  min-width:212px;
}
#legend h2{
  font-size:9.5px; letter-spacing:.2em; color:var(--ink-3);
  margin:0 0 10px; padding:0 14px; font-weight:500;
}
.lg{
  display:grid; grid-template-columns:9px 1fr auto; align-items:center; gap:0 10px;
  width:100%; padding:5px 14px; background:none; border:0; cursor:pointer;
  font:inherit; font-size:12.5px; color:var(--ink-2); text-align:left;
  transition:color .15s, background .15s;
}
.lg:hover{ color:var(--ink); background:#ffffff08; }
.lg:focus-visible{ outline:1px solid var(--accent); outline-offset:-2px; }
.lg .dot{ width:9px; height:9px; border-radius:50%; background:var(--c); transition:opacity .15s; }
.lg .n{ font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums;
  font-family:ui-monospace,"SF Mono",Menlo,monospace; }
.lg[aria-pressed="false"]{ color:var(--ink-3); }
.lg[aria-pressed="false"] .dot{ opacity:.2; }

/* ── age filter ───────────────────────── */
#age{
  position:fixed; left:50%; transform:translateX(-50%); bottom:38px; z-index:6;
  display:flex; align-items:center; gap:16px;
  background:color-mix(in srgb,var(--panel) 82%,transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--rule); border-radius:100px; padding:9px 20px;
}
#age label{ font-size:10px; letter-spacing:.18em; color:var(--ink-3); white-space:nowrap; }
#ageOut{ font-size:13px; color:var(--accent); min-width:4.4em; white-space:nowrap; }
#ageR{ -webkit-appearance:none; appearance:none; width:190px; height:18px; background:none; cursor:pointer; margin:0; }
#ageR::-webkit-slider-runnable-track{ height:2px; background:var(--rule-2); border-radius:2px; }
#ageR::-moz-range-track{ height:2px; background:var(--rule-2); border-radius:2px; }
#ageR::-webkit-slider-thumb{ -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
  background:var(--accent); border:2px solid var(--bg); margin-top:-5.5px; }
#ageR::-moz-range-thumb{ width:13px; height:13px; border-radius:50%; background:var(--accent); border:2px solid var(--bg); }
#ageR:focus-visible{ outline:1px solid var(--accent); outline-offset:4px; border-radius:4px; }
#ageAll{
  font:inherit; font-size:11.5px; padding:2px 11px; border-radius:100px; cursor:pointer;
  background:none; color:var(--ink-3); border:1px solid var(--rule-2); white-space:nowrap;
}
#ageAll:hover{ color:var(--accent); border-color:var(--accent); }
#ageAll[aria-pressed="true"]{ color:var(--accent); border-color:var(--accent); }

/* ── hints + credit ───────────────────── */
#hint{
  position:fixed; right:44px; bottom:38px; z-index:6; text-align:right;
  font-size:11px; color:var(--ink-3); letter-spacing:.04em; line-height:2;
}
#hint a{ color:var(--ink-3); text-decoration:none; border-bottom:1px solid var(--rule-2); }
#hint a:hover{ color:var(--accent); border-color:var(--accent); }
#hint .k{ color:var(--ink-2); }

/* ── detail panel ─────────────────────── */
#panel{
  position:fixed; right:0; top:0; bottom:0; width:min(430px,92vw); z-index:20;
  background:color-mix(in srgb,var(--panel) 94%,transparent);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-left:1px solid var(--rule); overflow-y:auto; overscroll-behavior:contain;
  transform:translateX(100%); transition:transform .3s cubic-bezier(.4,0,.2,1);
  padding:32px 34px 48px;
}
#panel.open{ transform:none; }
#close{
  position:absolute; right:22px; top:22px; width:28px; height:28px; border-radius:50%;
  background:none; border:1px solid var(--rule-2); color:var(--ink-3);
  font-size:15px; line-height:1; cursor:pointer; padding:0;
}
#close:hover{ color:var(--ink); border-color:var(--ink-3); }
.p-sub{ display:flex; align-items:center; gap:8px; font-size:11px; letter-spacing:.1em; margin:0 0 14px; }
.p-sub .dot{ width:8px; height:8px; border-radius:50%; }
.p-name{ font-size:1.72rem; font-weight:700; line-height:1.3; margin:0 0 8px; letter-spacing:.02em; }
.p-en{ font-size:12px; color:var(--ink-3); margin:0 0 18px; letter-spacing:.01em; }
.p-desc{
  font-size:13.5px; color:var(--ink-2); line-height:1.85; margin:0 0 22px;
  padding-left:14px; border-left:2px solid var(--rule-2);
}
.p-meta{ display:flex; flex-wrap:wrap; gap:7px; margin:0 0 26px; }
.chip{
  font-size:11px; padding:3px 10px; border-radius:100px;
  border:1px solid var(--rule-2); color:var(--ink-2); white-space:nowrap;
}
.chip.age{ color:var(--accent); border-color:color-mix(in srgb,var(--accent) 40%,transparent); }
.p-h{
  font-size:10px; letter-spacing:.2em; color:var(--ink-3);
  margin:30px 0 12px; padding-bottom:9px; border-bottom:1px solid var(--rule);
  display:flex; justify-content:space-between; align-items:baseline;
}
.p-h .c{ font-size:11px; color:var(--ink-2); letter-spacing:0;
  font-family:ui-monospace,"SF Mono",Menlo,monospace; }
.depth{ margin:0 0 4px; }
.depth-l{ font-size:10.5px; color:var(--ink-3); margin:14px 0 6px; letter-spacing:.06em; }
.depth:first-child .depth-l{ margin-top:2px; }
.item{
  display:grid; grid-template-columns:7px 1fr auto; align-items:baseline; gap:0 10px;
  width:100%; padding:5px 0; background:none; border:0; cursor:pointer;
  font:inherit; font-size:13px; color:var(--ink-2); text-align:left; line-height:1.55;
}
.item:hover{ color:var(--accent); }
.item:focus-visible{ outline:1px solid var(--accent); outline-offset:1px; }
.item .dot{ width:7px; height:7px; border-radius:50%; transform:translateY(-1px); }
.item .a{ font-size:10.5px; color:var(--ink-3);
  font-family:ui-monospace,"SF Mono",Menlo,monospace; }
.item.soft .dot{ opacity:.35; }
.empty{ font-size:12.5px; color:var(--ink-3); margin:0; }
.p-foot{
  margin-top:38px; padding-top:18px; border-top:1px solid var(--rule);
  font-size:11px; color:var(--ink-3); line-height:1.85;
}
.p-foot a{ color:var(--ink-2); }

#loading{
  position:fixed; inset:0; display:grid; place-items:center; z-index:40;
  background:var(--bg); color:var(--ink-3); font-size:12px; letter-spacing:.2em;
  transition:opacity .5s ease;
}
#loading.gone{ opacity:0; pointer-events:none; }

@media (max-width:820px){
  #intro{ left:22px; right:22px; top:9vh; max-width:none; }
  h1{ font-size:2.1rem; }
  #legend{ left:22px; bottom:96px; min-width:0; padding:10px 2px 7px; }
  #legend h2{ padding:0 11px; }
  .lg{ padding:4px 11px; font-size:11.5px; }
  #age{ bottom:26px; padding:7px 15px; gap:11px; width:calc(100vw - 44px); justify-content:center; }
  #age label{ display:none; }
  #ageR{ width:100%; min-width:0; }
  #hint{ display:none; }
  #panel{ padding:26px 22px 40px; }
}
@media (prefers-reduced-motion:reduce){
  #panel,#intro{ transition:none; }
}
</style>

<script>
const G = {"subjects":["科学","数学","英语语文","历史","个人与社会性发展","生活技能","计算机","学会学习"],"domains":["人工智能","语文思维","语法与标点","书写与抄写","自然拼读与识词","阅读理解","口语与听力","拼写与词法","词汇","写作","古埃及","古希腊与古罗马","历史思维","中世纪","学会学习","创业","金钱与理财","加法与减法","代数","计数与基数","数据与统计","分数","几何","数学思维","测量","乘法与除法","数的表示与位值","概率","比与比例","情绪素养","共情与社会意识","友谊与合作","负责任的决策","自我认识","自我调节与韧性","世界动物","恐龙与古生物学","地球系统","生态系统与栖息地","能量","力与运动","昆虫与小虫子","物质与材料","海洋生物","生物与生命过程","极地","雨林","科学探究","太空探索","天体系统与地球历史","人体","火山与地震","波、光与声","天气与气候"],"nodes":[["日常生活中的人工智能","AI in Daily Life",6,0,5,7,27,24.1,-166.5,-177.1,"认出生活里的人工智能：手机的人脸解锁、视频推荐、拼写自动纠正、能感应到人的自动门；那些看起来“懂事”的技术"],["日常生活中的计算机","Computers in Everyday Life",6,0,5,7,29,-0.2,-173.9,-169.4,"找出生活里的计算机——不只是笔记本电脑，还有手机、平板、智能音箱、红绿灯、洗衣机；什么样的东西才算计算机"],["现实中的机器人","Real-World Robots",6,0,5,7,10,-15.1,-162.9,-167.9,"机器人到底是什么——不是科幻片里那种；工厂里的机器人、扫地机器人、做手术的机械臂；机器人执行的是人给它的指令"],["智能设备与非智能设备","Smart Versus Not-Smart Devices",6,0,5,7,26,12.8,-178.2,-154.5,"把东西分成“智能的”（能感知并作出反应）和“不智能的”（只是待在那儿）；烤面包机和智能音箱的区别；初步认识有些机器能感知世界并作出反应"],["分步指令","Step-by-Step Instructions",6,0,5,7,26,12.5,-150,-190.2,"把日常任务拆成一步步的指令（做三明治、刷牙）；指令错了或少了，事情就会出岔子；计算机会一丝不苟地照指令做"],["语音助手的工作原理","Voice Assistants and How They Work",6,0,5,7,27,31.1,-176.9,-162.4,"跟 Siri、小爱同学、Google 助手说话时发生了什么：它们听、试着理解、去查答案；有时也会弄错；它们是工具，不是活的"],["电子游戏中的人工智能","AI in Computer Games",6,0,7,9,10,8.7,-65.1,-181.6,"游戏里的角色怎么“决定”该做什么；简单的规则型 AI 和会学习的 AI 有什么不同；NPC、难度调节；下象棋或棋类游戏时充当对手的 AI"],["人工智能的错误与局限","AI Mistakes and Limitations",6,0,7,9,23,12.7,-24.6,-203.9,"机器会出错；它们只知道被喂过的东西；训练数据不好，结果就不好；AI 不是魔法，只是在数据上做数学；看看那些边缘情况和失败案例"],["计算机的数据与信息","Data and Information for Computers",6,0,7,9,27,24.6,-58.6,-212,"数据是什么：计算机用的信息——数字、文字、图片、声音；计算机知道的一切都来自人给它的数据"],["人与机器的差别","Humans Versus Machines",6,0,7,9,19,-15.9,-41.4,-203.9,"比较人和机器各自擅长什么：创造力、共情、常识，对上速度、记忆力、重复劳作；图灵测试（简化版）；人的独特之处在哪里"],["机器学习基础","Machine Learning Basics",6,0,7,9,25,-2.6,-25.5,-217.7,"从概念上理解机器学习：给计算机看大量例子，它找出规律，再对新东西作出预测；用 Teachable Machine 之类的工具亲手试一试"],["模式与分类","Patterns and Classification",6,0,7,9,27,6.4,-52.1,-211.8,"人很擅长发现规律；计算机也能学着发现规律，但需要大量例子；用分类和归类的活动打下机器学习的基础"],["推荐系统与信息茧房","Recommendation Systems and Filter Bubbles",6,0,7,9,11,35.3,-39.3,-203.9,"推荐系统是怎么运作的：视频网站、影视平台、购物网站会记录你点了什么，从中找规律；信息茧房；有用的建议和操纵之间的区别"],["人工智能决策的公平性","AI and Fairness in Decisions",6,0,9,11,21,-28.5,60.9,-205.9,"AI 该不该替人做重要决定：招聘、贷款、司法；AI 作出不公平的决定时谁来负责；初识算法公平"],["人工智能与环境","AI and the Environment",6,0,9,11,111,-30.7,63.9,-174.1,"训练 AI 需要消耗大量能源和水；数据中心带来的环境代价；但 AI 也能帮上忙——预测天气、监测森林砍伐、优化能耗；这中间的取舍"],["人工智能与未来的工作","AI and the Future of Work",6,0,9,11,21,3.9,43.8,-198.5,"AI 正在怎样改变工作：有些职业消失，新的职业出现，更多职业发生变化；AI（暂时）做不了的工作；在 AI 时代什么能力更要紧"],["人工智能的数据采集与隐私","AI Data Collection and Privacy",6,0,9,11,31,37.8,40.9,-206.6,"AI 系统会收集你的哪些数据；这些数据在谁手里、为什么这件事重要；cookie、追踪、一直在听的智能音箱；你的数据是有价值的"],["人工智能系统中的偏见","Bias in AI Systems",6,0,9,11,19,-6.5,50.8,-217.9,"训练数据有偏见，AI 就会有偏见；比如人脸识别对某些肤色更准，翻译时擅自认定性别；偏见从哪来，能不能修正"],["深度伪造与AI生成内容","Deepfakes and AI-Generated Content",6,0,9,11,15,21.6,53.5,-202.7,"深度伪造、AI 生成的图片和文字；怎么识别、为什么值得当回事；核查来源有多重要；网上看到的不一定是真的"],["设计公平的人工智能规则","Designing Fair AI Rules",6,0,9,11,21,-15.7,73.6,-203.6,"把设计思维用在 AI 伦理上：如果由你来设计一个 AI 系统，你会给它定什么规则？它该帮谁？什么事不许它做？"],["人工智能的未来","The Future of AI",6,0,9,11,115,-4.8,71.7,-185.8,"十年后 AI 可能做到什么；我们希望它做什么、又担心什么；孩子将来会是 AI 的设计者和决策者；带着期待和主动感去看待"],["为理解而读","Reading for Meaning",2,1,5,6,114,73.2,-191.8,-2,"明白阅读是为了读出意思，不只是把字念对——一段文字若只能拼读出来却不理解，就等于没读"],["监控自己的理解","Monitoring Comprehension",2,1,6,8,111,98.6,-113,2.3,"分清把词读出来和真正读懂了——发现自己只是过了一遍字却没抓住意思，并想办法补救"],["作者的用词选择","Author's word choices",2,1,7,9,55,125.2,-46.2,-2.2,"看出作者在用词、结构、语气和视角上的有意选择，如何在你这个读者身上产生特定的效果"],["推断义与字面义","Inference vs Explicit Meaning",2,1,7,9,33,83,-52.4,22.6,"分清文本明说了什么，和哪些是你推断、假设或自己加进去的——分得清这两者，才谈得上诚实的理解"],["知道自己哪里不懂","Knowing What You Don't Know",2,1,8,10,38,84.9,9.1,44.5,"留意自己的词汇缺口——发现那些一知半解的词，分清哪些有把握、哪些没把握，并找到办法把不确定的地方弄清楚"],["检查自己写的东西","Reviewing Own Writing",2,1,8,10,62,118.3,3,24,"判断自己写的东西有没有在读者身上达到预期的效果——不止检查有没有错，还要问它到底管不管用"],["反思自己的语言使用","Reflecting on Your Language Use",2,1,10,11,45,99.5,87.2,48.7,"反思自 把要写的内容说出来或记下来，写下想法和关键词，并在正式写之前逐句把意思想清楚"],["修改与润色","Revising and editing",2,9,6,7,94,151.7,-121.4,60.4,"校对自己的文章，检查拼写、语法和标点错误；在老师或同学帮助下评价和修改文章，重读一遍确保意思清楚、时态前后一致"],["有结构的观点写作","Structured Opinion Writing",2,9,6,11,19,146.9,-20.7,70.3,"写表达观点的文章：引出话题，明确说出自己的立场，用连接词把理由有条理地串起来，并写出总结的句子或段落"],["写诗","Writing Poetry",2,9,6,7,30,141.8,-139,9.7,"写诗，体会语言的规律、押韵和节奏，并背下诗歌，用合适的语调朗诵"],["记叙文写作","Narrative Writing",2,9,7,11,33,183.4,12.2,20.4,"写记叙文，把背景、人物和情节写充实，用对话和描写来展开经历、表现人物面对情境时的反应"],["把文章分成段落","Organising Writing into Paragraphs",2,9,7,10,68,194.4,-26.1,38.9,"把文章分成段落，围绕一个主题把相关内容归到一起；在非记叙类写作中使用标题、小标题这类简单的组织方式"],["打腹稿与变换句式","Rehearsing and Varying Sentences",2,9,7,8,29,177.8,-80.8,57.5,"写之前先在口头上组织和演练句子，逐步积累多样丰富的词汇和越来越多的句式，包括对话"],["修改与润色（7岁以上）","Revising and editing (age 7+)",2,9,7,11,82,158.2,13.3,63.4,"评价并修改自己的文章：判断写得是否有效果，为保持前后一致提出语法和用词上的改动，并按三四年级的要求校对拼写、语法和标点错误"],["修改与润色（8岁以上）","Revising and editing (age 8+)",2,9,8,9,71,144.7,-14.3,50.7,"能独立地、带着挑剔的眼光重读自己的文章——看出哪里意思不清楚、哪个词还可以更有力、哪里可能让读者看糊涂；不用老师提醒就自己动手修改，凭自己的判断决定哪里行、哪里不行"],["小型研究项目","Short Research Projects",2,9,8,11,71,94.2,33.7,6.8,"开展小型研究项目，围绕一个话题积累知识，从纸质和电子资料中收集信息，并做简要而有条理的笔记"],["生动的用词","Vivid Word Choices",2,9,8,10,27,177.3,20,40.6,"选用准确、生动的词语，让写作产生特定的效果"],["写作技法术语","Writing Craft Vocabulary",2,9,8,11,47,179.5,39.9,37.6,"认识并会使用写作技法与效果方面的术语——形式、结构、语域、语气、声音、连贯、衔接、论点、证据、视角、修辞、技法、正式、非正式、风格——并明白这些词说的是写作者为了对读者产生某种效果而有意作出的选择"],["根据读者选择体裁与语气","Choosing Form and Tone for Your Audience",2,9,9,10,70,162.1,61.5,24.8,"动笔前先弄清写给谁看、为什么而写，选择与目标读者和表达目的相匹配的体裁、语气和语域"],["有依据的写作","Evidence-Based Writing",2,9,9,11,68,76.3,65.5,-12.4,"从说明性文本中取证，为写作中的分析、思考和研究提供支持，把本年级的阅读要求用到非虚构类文本上"],["写作中引用文学证据","Literary Evidence in Writing",2,9,9,11,67,105.5,78,-9.1,"从文学文本中取证，为写作中的分析、思考和研究提供支持，把本年级的阅读要求用到文学作品上"],["为读者而写","Writing for an audience",2,9,9,11,49,184.6,74.3,20.6,"写出清楚连贯的文章，内容的展开和组织方式要贴合任务、目的和读者，全篇保持风格和结构的一致"],["说明文的排版与格式","Layout and Formatting in Informational Writing",2,9,10,11,42,175.3,94.8,32,"使用标题、小标题、分栏、项目符号和表格等排版手段来组织文字，在说明性和解释性写作中引导读者读下去"],["记叙文的构思","Planning Narratives",2,9,10,11,66,163.7,98.6,9.3,"构思记叙文时，想一想作家是怎样塑造人物、描写场景的，借鉴自己读过、听过或演过的作品里的手法"],["查资料与做笔记","Research & Note-Taking",2,9,10,11,60,91.2,107,5.2,"从纸质和电子资料中收集相关信息，在笔记和成稿中加以概括或用自己的话转述，并附上简单的参考书目或资料来源清单"],["写内容提要","Writing a Précis",2,9,10,11,41,77.7,103,-7.9,"把较长的段落写成内容提要：简明地概括主要观点和关键信息，保住核心意思，删掉无关紧要的细节"],["全文的衔接与过渡","Cohesion and Transitions Across Writing",2,9,11,14,70,172.9,178.4,40.5,"用多样的过渡语、衔接手段和段落之间的连接方法，让整篇文章连贯起来——包括表示时间的过渡、表示因果的连接词，以及提示论点、时间或场景转换的技巧"],["成熟的说明与阐释写作","Developed Informational and Explanatory Writing",2,9,11,14,82,154,177.2,28.3,"写说明和阐释类文章，深入探讨一个话题、把想法讲清楚——用标题和排版把信息按逻辑组织起来，用相关的事实、定义、细节和引文把话题展开，并使用准确的词汇"],["议论与说服性写作","Persuasive Writing",2,9,11,14,239,147.5,179.6,-9.7,"写议论文，用清晰的理由和相关的证据支持自己的主张——包括提出主张、正视对立观点、把理由按逻辑组织起来、保持正式的文风，并写出总结性的结论"],["构思、修改与编辑","Planning, Revising and Editing Writing",2,9,11,14,129,120.1,152.7,71.7,"通过构思、修改和编辑让文章更连贯、更有效果——想一想文章是否贴合目标读者和写作目的，调整用词、语法和结构，并校对拼写、标点和语法"],["查证与来源评估","Research & Source Evaluation",2,9,11,14,135,108.5,183.3,6.1,"把阅读和研究得来的材料加以概括和整理——从多个来源收集相关信息，判断可信度，把证据融进文章而不抄袭，并用事实细节支撑自己的观点"],["跨体裁写作","Writing Across Genres",2,9,11,14,88,150.6,198.4,4.7,"为记叙文以外的各种目的和读者而写——包括剧本、诗歌、私人信件和正式书信、发言提纲等形式——并为每一种选择合适的体裁、语域和写作惯例"],["写人物与对话","Writing Character & Dialogue",2,9,11,14,88,172.7,179.1,11.3,"用有效的手法写记叙文，展开真实或想象的经历——包括交代背景和叙述视角，通过对话、节奏和描写来塑造人物，运用多样的过渡，并写出带有思考的结尾"],["为效果服务的写作技巧","Writing Techniques for Effect",2,9,11,14,228,148,195.8,22.9,"把不断增长的词汇、语法和篇章结构知识用到写作中——借鉴阅读中见到的文学和修辞手法（如反问、三段式排比、首语重复、对比）来增强感染力"],["图坦卡蒙墓的发现","Discovering Tutankhamun's Tomb",3,10,5,7,19,149.7,-126.2,-99.1,"明白我们之所以了解古埃及，是因为考古学家挖出并研究了在沙里埋了几千年的东西——而其中最激动人心的一次发现，是霍华德·卡特在1922年找到了图坦卡蒙隐藏的陵墓，里面满是黄金珍宝"],["埃及神祇与来世信仰","Egyptian Gods and the Afterlife",3,10,5,7,44,141,-140.6,-134.8,"明白古埃及人信奉许多男神和女神，相信人死后会在美好的来世继续生活——所以他们才那么用心地处理遗体，并在墓里放满食物、首饰和珍贵物品，供死者使用"],["埃及、尼罗河与沙漠","Egypt, the Nile, and the Desert",3,10,5,7,64,108.7,-164.6,-119.8,"在非洲地图上找到埃及，明白这是一个位于炎热干旱沙漠中的国家，但世界第一长河尼罗河从这里流过，带来了水和肥沃的土壤，让人们能种出粮食，建立起最早的伟大文明之一"],["古埃及的日常生活","Everyday Life in Ancient Egypt",3,10,5,7,41,137.6,-157.8,-119.2,"描述古埃及普通人的日常生活是什么样：农民在尼罗河边种小麦和大麦，一家人住泥砖房，孩子们玩游戏、养宠物，人们吃面包、鱼、水果和蔬菜"],["象形文字与莎草纸","Hieroglyphs and Papyrus",3,10,5,7,21,130.2,-158.5,-89.5,"知道古埃及人用一种叫象形文字的特殊文字——用图画和符号代表读音和词语——并且写在一种像纸一样的材料上，这种材料叫莎草纸，是用尼罗河边生长的一种植物做成的"],["法老与图坦卡蒙","Pharaohs and Tutankhamun",3,10,5,7,55,118.9,-139,-101.2,"知道古埃及由被称为法老的强大国王和王后统治，他们住在宏伟的宫殿里、制定法律——最有名的法老之一是图坦卡蒙，他小小年纪就当上法老，几千年后他的黄金陵墓才被发现"],["金字塔与狮身人面像","Pyramids and the Great Sphinx",3,10,5,7,48,108.5,-153.9,-104.9,"知道古埃及人建造巨大的石头金字塔作为法老的陵墓，吉萨大金字塔是古代世界七大奇迹之一，至今依然屹立；还有狮身人面像——一座狮子身体、人的头的雕像——守卫着金字塔"],["词汇：古埃及","Vocabulary: ancient egypt",3,10,5,9,57,134.5,-104.3,-117.7,"认识并会使用古埃及的关键词汇——法老、金字塔、陵墓、木乃伊/木乃伊制作、象形文字、莎草纸、石棺、卡诺卜坛、泡碱、考古学家、文物、尼罗河、三角洲、灌溉、桔槔、书吏、维齐尔、方尖碑、狮身人面像、王名圈——并在描述埃及的社会、宗教和物质文化时准确使用这些术语"],["古埃及在时间轴上的位置","Ancient Egypt on the Timeline",3,10,7,9,82,72.7,-51,-67.6,"把古埃及放到一条跨越三千多年的时间轴上——从约公元前3100年（第一位法老统一埃及）到公元前30年（被罗马征服）——明白这个文明延续的时间比从罗马时代到今天还要长，并分为几个大的时期：古王国（金字塔时代）、中王国和新王国（帝国时代）"],["金字塔是怎么建成的","Building the Pyramids",3,10,7,9,83,102.9,-15.1,-92.9,"了解金字塔是怎么建成的：成千上万的工人用斜坡、滚木和雪橇搬运巨大的石块，工程由法老的官员组织；造型从平顶的马斯塔巴演变到阶梯金字塔（如左塞尔的），再到表面平整的大金字塔——还要知道后来的法老葬在帝王谷中开凿于岩石里的隐蔽墓穴中"],["埃及的男神与女神","Egyptian Gods and Goddesses",3,10,7,9,23,153.7,-39.5,-136.3,"说出并描述埃及主要的男神和女神：太阳神拉，每天驾船横穿天空；掌管来世的奥西里斯；掌管魔法与母性的女神伊西斯；豺头人身、主管木乃伊制作的阿努比斯；鹰头人身的天空之神荷鲁斯；朱鹭头的文字之神托特；以及猫形的护佑女神芭斯特"],["古埃及的社会等级","Egyptian Social Hierarchy",3,10,7,9,22,142.7,-56.6,-121.7,"把古埃及的社会结构描述成金字塔形的等级：最上面是法老，其次是祭司和贵族，再往下是书吏和士兵，然后是工匠和商人，底层是农民和劳工——明白一个人的地位通常是继承来的，并决定了他一生的生活方式"],["埃及墓室壁画与文物","Egyptian Tomb Paintings and Artefacts",3,10,7,9,27,146.2,-39.3,-101.5,"把古埃及的墓室壁画、文物和器物当作证据来了解当时的日常生活：内巴蒙墓的壁画画着狩猎和宴饮，首饰和家具显示出工艺水平，陶罐、工具这类日用品告诉我们普通人用些什么——明白正是靠这些材料，我们才能把一个几千年前就结束的文明一点点拼凑出来"],["木乃伊制作全过程","Mummification Step by Step",3,10,7,9,16,128.1,-59.6,-133.9,"描述木乃伊制作的完整步骤：先清洗遗体，取出内脏放进卡诺卜坛，用泡碱把遗体脱水40天，然后用亚麻布条一层层缠裹，中间夹进护身符，最后放入装饰精美的石棺"],["书吏与罗塞塔石碑","Scribes and the Rosetta Stone",3,10,7,9,23,125.7,-46.2,-93,"知道书吏是受过专门训练、能读写象形文字的人；罗塞塔石碑——一块用三种文字刻着同一段话的石板——是破解象形文字密码的钥匙；商博良（Jean-François Champollion）借助它在1822年释读出象形文字，结束了几百年的谜团"],["上埃及与下埃及","Upper and Lower Egypt",3,10,7,9,37,109.4,-72,-126.6,"明白古埃及分为上埃及（南部狭窄的河谷）和下埃及（北部宽阔的三角洲），两地由同一位法老统一起来；埃及人通过灌溉渠和桔槔调配尼罗河水，一年到头都能种庄稼"],["古埃及留下的遗产","Ancient Egypt's Lasting Legacy",3,10,9,11,142,140.6,75.4,-126.3,"评价古埃及留下的长远影响：埃及人发展出早期的医学、数学（用来建金字塔和在洪水退后丈量土地）、天文学（根据观测星象制定历法）和工程技术，影响了包括希腊和罗马在内的后来文明——并把古埃及与其他早期文明（美索不达米亚、印度河流域、商朝）作比较，找出文字、农业、城市和有组织的宗教这些共同特征"],["克娄巴特拉与埃及的终结","Cleopatra and the End of Egypt",3,10,9,11,129,121.9,61,-110.3,"知道古埃及最终走向了终结：最后一位法老是克娄巴特拉七世，她与罗马结盟，却在公元前31年败给屋大维（即后来的奥古斯都），此后埃及成为罗马帝国的一个行省——三千多年的法老统治就此结束，埃及历史翻开新的一页"],["埃及的艺术与建筑","Egyptian Art and Architecture",3,10,9,11,94,133.6,47.9,-96.4,"分析埃及的艺术与建筑：埃及绘画遵循严格的程式（人物画成侧面但眼睛是正面，身形大小表示地位高低）；陵墓和神庙的形制从马斯塔巴演变到阶梯金字塔、平整的金字塔，再到阿布辛贝这类开凿在岩石中的神庙；方尖碑、巨型雕像和卡纳克这样的神庙则彰显着法老的权力和对神的虔敬"],["埃及的年表与地图","Egyptian Timelines and Maps",3,10,9,10,77,-18.7,21.5,-7,"读懂并绘制历史年表——把古埃及的各个时期、法老和重大事件，按彼此之间以及与今天的先后关系排在时间轴上；读懂标示尼罗河三角洲、贸易路线和重要遗址位置的地图"],["埃及的贸易与经济","Egyptian Trade and Economy",3,10,9,11,45,120.8,48.9,-123.8,"明白古埃及有繁荣的经济，基础是农业剩余、贸易和专门分工：尼罗河的肥沃土壤出产的粮食足以养活工匠、祭司和官员；埃及沿尼罗河并跨越地中海开展贸易——用黄金、莎草纸和谷物换取黎巴嫩的雪松木、阿富汗的青金石和蓬特的香料"],["亡灵的审判","Judgement of the Dead",3,10,9,11,22,142.6,37,-131.2,"描述埃及人关于亡灵审判的信仰：人死后，心脏要在审判大厅里与玛阿特的羽毛称重，阿努比斯掌管天平，托特记录结果——心地纯净者可进入芦苇之野（乐园），心脏过重的则被怪兽阿米特吞食；还要知道《亡灵书》里写着帮助死者通过这场考验的咒语"],["法老作为在世之神","The Pharaoh as Living God",3,10,9,11,22,147.6,57.3,-123.8,"明白法老不只是统治者，还被认为是在世的神——神与人之间的中介；玛阿特（真理、正义与宇宙秩序）的观念指导着埃及的法律和政务，由维齐尔和各级官员代表法老治理国家"],["现代考古与文物伦理","Modern Archaeology and Egyptian Ethics",3,10,10,12,473,152.8,80.1,-78.9,"明白今天的埃及学家除了传统发掘外，还使用先进技术——给木乃伊做CT扫描、用卫星影像寻找埋在地下的建筑、做DNA分析；同时要用批判的眼光思考考古的伦理问题：木乃伊该不该在博物馆展出，古代文物归谁所有，殖民时代的收藏又怎样影响着我们今天研究和呈现古埃及的方式"],["埃及的数学与工程","Egyptian Maths and Engineering",3,10,11,13,79,40.3,144.6,-104.8,"描述埃及在数学和工程上的成就：《莱因德数学纸草书》记载了面积、体积和分数的计算；金字塔朝向的精确度（与正北的偏差在0.05度以内）需要高超的测量技术；埃及的医学纸草书详细记载了解剖知识和药物疗法——由此可见埃及是早期科学技术史上的重要贡献者"],["关于古埃及的史料","Historical Sources on Ancient Egypt",3,10,11,13,123,117.1,139.7,-66.6,"说明我们对古埃及的认识是由多种史料建立起来的——铭文、纸草文书、文物和实物遗存——并对每一类作批判性评估：其中存在哪些偏见、空白和失真？探讨商博良释读象形文字如何改变了这个领域，以及为什么同一件文物在不同学者手里会有不同的解读"],["埃及与周边文明","Egypt and Its Neighbours",3,10,12,13,38,104.2,197.3,-93.6,"考察埃及与周边文明的关系：延伸到努比亚、黎凡特和蓬特的贸易网络；希克索斯人的入侵和战车的传入；新王国时期的帝国及其与赫梯的冲突，最终导致卡迭石战役和世界上现存最早的和平条约——由此明白埃及并非孤立存在，而是相互连通的古代世界的一部分"],["金字塔究竟是谁建的","Who Really Built the Pyramids",3,10,12,14,316,116.7,190.7,-64.6,"分析金字塔究竟由谁建造、为何而建，用证据检验「外星人建造」和「奴隶劳动」这两种说法：吉萨工匠村的考古发现表明，这是一支有报酬、有技术、吃得饱的劳动队伍；讨论修建巨型工程在社会层面的作用——它既是国家组织的形式，也是宗教义务和谋生途径；并评估围绕新发现的施工坡道和后勤组织的当前争论"],["古埃及文明的衰亡","Fall of Ancient Egyptian Civilisation",3,10,13,14,45,99.1,248.5,-83.8,"沿着一次次被征服的历程追溯古埃及文明的终结——亚述、波斯、马其顿（亚历山大大帝），最后是罗马——并说明每一个征服者同时也被埃及文化所塑造；考察克娄巴特拉七世作为末代法老、也作为通晓多种语言的政治谋略家的形象；再想一想古埃及有哪些东西留存在了今天的文化、宗教和语言之中"],["地图上的古希腊与古罗马","Ancient Greece and Rome on the Map",3,11,5,7,49,99.9,-165.7,-141.4,"在地图上找到希腊和意大利，知道它们是地中海周边的国家，几千年前这里发展出了两个伟大的古代文明——古希腊和古罗马，比古埃及人晚得多，又比我们今天早得多"],["古代生活与今天的对比","Ancient life vs today",3,11,5,7,29,122.5,-165.1,-137.2,"比较古希腊或古罗马的孩子和今天的孩子生活有什么不同——包括上学（在蜡板上写字、在斯巴达学习格斗）、食物（橄榄、面包、葡萄）、游戏和衣着（束腰外衣和凉鞋），并知道这些文明存在于几千年前"],["希腊诸神与奥林匹斯山","Greek gods & Mount Olympus",3,11,5,7,31,110.9,-154.2,-151.6,"知道古希腊人信奉许多住在奥林匹斯山上的男神和女神——包括宙斯（众神之王，掌管雷电）、雅典娜（智慧）、波塞冬（海洋）、赫尔墨斯（传信）、阿佛洛狄忒（爱）——每位神都有特殊的力量，在世上各司其职"],["希腊神话与英雄","Greek Myths and Heroes",3,11,5,7,12,95.1,-129,-118,"复述至少一个有英雄和怪物的希腊神话——比如忒修斯与迷宫里的米诺陶洛斯、赫拉克勒斯（海格力斯）与狮子、或珀尔修斯与美杜莎——并知道这些是古希腊人用来解释世界、传递道理的故事"],["罗马的士兵与建造者","Roman soldiers & builders",3,11,5,7,33,81.2,-161.7,-121,"知道罗马士兵在庞大的帝国里行军，修筑笔直的道路和坚固的城墙，有些罗马道路、城墙和建筑今天仍能看到——可见罗马人是强大的建造者，他们的工程留存了几千年"],["罗慕路斯与雷穆斯","Romulus & Remus",3,11,5,7,33,78,-176.4,-102,"知道罗马的建城传说罗慕路斯与雷穆斯——一对被遗弃的双胞胎婴儿，由母狼哺育长大，后来建立了罗马城——并明白这是罗马人讲述自己城市起源的传说"],["最早的奥林匹克","The first Olympics",3,11,5,7,11,88.4,-177.7,-119.9,"知道奥林匹克运动会起源于古希腊一个叫奥林匹亚的地方，是为纪念宙斯而举办的体育竞赛，今天我们看的现代奥运会正是受这些古代赛会启发而来"],["雅典民主","Athenian Democracy",3,11,7,9,26,134.3,-5,-140.5,"明白雅典发明了民主——自由的男性公民聚在公民大会上辩论并投票决定城邦的重要事务——但妇女、奴隶和外邦人没有投票权"],["雅典与斯巴达","Athens Versus Sparta",3,11,7,9,29,131.5,-34.8,-157.5,"比较雅典和斯巴达这两个非常不同的希腊城邦：雅典重视学问、艺术、辩论和民主，斯巴达重视军事训练、纪律和服从——并明白城邦就是一座自己管理自己、像小国家一样的城市"],["布狄卡反抗罗马的起义","Boudicca's Revolt Against Rome",3,11,7,9,7,64.5,-55.3,-94.9,"讲述爱西尼部落女王布狄卡的故事：她领导了一场反抗罗马统治的猛烈起义，烧毁了科尔切斯特、伦敦和圣奥尔本斯，最后军队被击败；理解她作为反抗强大帝国的象征所具有的意义"],["罗马城镇的日常生活","Daily Life in a Roman Town",3,11,7,9,30,107.2,-25.5,-121.3,"描述罗马城镇里的日常生活——广场（集市和聚会的地方）、公共浴场、圆形竞技场和别墅——并说明罗马人是出色的工程师，修建了笔直的道路、输水的引水渠、地下供暖系统（hypocaust），以及标示帝国在不列颠北部边界的哈德良长城"],["角斗士与庞贝","Gladiators & Pompeii",3,11,7,9,15,49.6,-50.1,-36.8,"知道罗马人在罗马斗兽场这样的大型竞技场里观看角斗士搏斗，角斗士通常是受训搏斗的奴隶或囚犯；知道公元79年维苏威火山爆发掩埋了庞贝城，为罗马日常生活留下了极为难得的一个切面"],["神祇与帕特农神庙","Gods & the Parthenon",3,11,7,9,29,121.3,-53,-156.3,"说出主要希腊神祇及其职掌——宙斯（众神之王、雷电）、赫拉（天后、婚姻）、雅典娜（智慧、战争）、波塞冬（海洋）、阿波罗（太阳、音乐）、阿尔忒弥斯（狩猎、月亮）、阿瑞斯（战争）、阿佛洛狄忒（爱）、赫尔墨斯（信使）、赫菲斯托斯（火与工艺）、哈迪斯（冥界）——并知道雅典的帕特农神庙是为供奉雅典娜而建的宏伟神殿"],["希腊神的罗马名字","Greek Gods with Roman Names",3,11,7,9,22,99.3,-42.9,-147.5,"明白罗马人沿用了希腊诸神，却给他们起了新名字——宙斯变成朱庇特，赫拉变成朱诺，阿瑞斯变成玛尔斯，雅典娜变成密涅瓦，波塞冬变成尼普顿，阿佛洛狄忒变成维纳斯——这说明罗马受希腊文化影响之深"],["希腊戏剧","Greek theatre",3,11,7,9,16,108.9,-49.6,-132.6,"知道古希腊人发明了戏剧，在大型露天剧场上演悲剧和喜剧，演员戴着面具；戏剧作为纪念酒神狄俄尼索斯的宗教节庆的一部分演出，观众多达数千人"],["马拉松与温泉关","Marathon and Thermopylae",3,11,7,9,12,108.8,-33.2,-164.6,"描述马拉松战役和温泉关战役：希腊各城邦联合起来抵抗入侵的波斯帝国——信使斐迪庇第斯把马拉松的捷报送回（马拉松赛跑由此而来），三百斯巴达人在温泉关英勇死守——并理解这些战争是为保卫希腊的独立而打"],["罗马军队与征服不列颠","Roman Army and Conquest of Britain",3,11,7,9,33,87.9,-65.6,-114.3,"描述罗马军队如何编成由训练有素的士兵组成的军团，尤利乌斯·凯撒如何在公元前55年首次进袭不列颠、克劳狄乌斯皇帝又在公元43年将其征服，并说明罗马人为什么要扩张帝国——为了土地、资源、赋税和荣耀"],["亚历山大大帝的帝国","Alexander the Great's Empire",3,11,9,11,15,108.6,57.4,-168.3,"描述马其顿的亚历山大大帝如何征服了从希腊到埃及再到印度的庞大帝国，把希腊的语言、文化和思想传播到古代世界各地——开启了希腊文化与东方文化交融的希腊化时代"],["希腊罗马生活的实证","Evidence for Greek and Roman Life",3,11,9,11,104,108.7,67.8,-97.6,"明白历史学家和考古学家是靠证据拼凑出古希腊罗马生活的——陶器上的绘画、钱币、铭文、庞贝这样的遗址，以及荷马、普林尼等作者留下的文字——而同样的证据，不同的历史学家可能作出不同的解读"],["西罗马帝国的灭亡","Fall of the Western Roman Empire",3,11,9,11,15,84.9,73.9,-100.5,"描述西罗马帝国如何因多重因素逐渐衰落——外族入侵的军事压力、政局动荡、经济困难、帝国摊子铺得太大——最终于公元476年灭亡，而东罗马（拜占庭）帝国又延续了将近一千年"],["希腊与罗马建筑","Greek and Roman Architecture",3,11,9,11,25,133.4,49.7,-145.7,"辨认希腊柱式——多立克（朴素敦实）、爱奥尼（涡卷形柱头）、科林斯（繁复的叶饰柱头）——以及罗马的建筑创新——拱券、穹顶和混凝土——并在法院、博物馆、政府大楼、纪念碑等现代公共建筑上找出它们的影子"],["希腊罗马留给今天的遗产","Greek and Roman Legacy Today",3,11,9,11,153,144.3,70.9,-157,"评价希腊罗马文明留给现代生活的持久贡献——民主、法律、语言（拉丁语词根）、建筑（柱式、拱券、穹顶）、体育（奥运会）、哲学、文学和戏剧——并明白希腊的思想是经由罗马、再经由后来的欧洲文明，一环一环传到我们这里的"],["希腊哲学家与医学","Greek Philosophers and Medicine",3,11,9,11,14,130.9,52.4,-168.1,"知道被称为哲学家的希腊思想者提出了理解世界的方法，至今仍影响着我们——苏格拉底用一连串追问来检验观点（苏格拉底方法），柏拉图设想理想的社会，亚里士多德观察并分类自然万物——还知道希波克拉底被称为医学之父，因为他坚持疾病有自然的原因，而不是归咎于神"],["罗马法、拉丁语与基督教","Roman Law, Latin, and Christianity",3,11,9,11,30,108.5,66.4,-147.3,"明白罗马法成为欧洲乃至更远地方法律体系的基础；拉丁语是法语、西班牙语、意大利语、葡萄牙语和罗马尼亚语的源头，还给英语带来数百个词（如 exit、video、annual、education）；基督教在罗马帝国境内传播，最终在君士坦丁皇帝时期成为帝国的官方宗教"],["罗马共和国与罗马帝国","Roman Republic and Empire",3,11,9,11,27,113.4,84.1,-129.4,"说明罗马最初实行共和制——有选举产生的执政官、权力很大的元老院，还有贵族与平民之分——后来变成由奥古斯都（他带来了和平，即罗马和平）、尼禄这样的皇帝统治的帝国，并把共和制与雅典的直接民主作比较"],["希腊罗马中被遮蔽的声音","Hidden Voices of Greece and Rome",3,11,11,13,109,122.8,138.2,-123.7,"考察通常被希腊罗马历史略过的人群——占雅典人口约30%、支撑起罗马经济的奴隶，境遇在雅典（大多困于家中）与斯巴达（可以体能训练、拥有财产）之间差别巨大的女性，以及两大帝国境内被征服的各族——并思考历史记载中缺了谁的声音，为什么"],["雅典的接纳与排斥","Inclusion and Exclusion in Athens",3,11,11,13,15,111.6,157.3,-116.9,"分析谁被纳入、谁被排除在雅典民主之外——只有自由的成年男性公民（约占成年人的30%）可以参与，妇女、奴隶（可能占人口三分之一）和外邦侨民（metics）被排除在外——并通过与现代代议制民主比较，评价雅典是否真的配得上「民主发源地」这个称号"],["特洛伊：神话还是史实","Troy: Myth or History?",3,11,11,13,103,96,135.9,-101.8,"探究谢里曼在今土耳其希萨利克的发掘如何引出一个问题：荷马《伊利亚特》里描写的特洛伊战争是真实历史、部分真实，还是纯属神话——并理解考古材料和文献材料可能互相印证，也可能互相矛盾，古代世界里神话与史实的界线常常模糊"],["罗马共和国的终结","Fall of the Roman Republic",3,11,12,14,108,96.5,212.7,-105.8,"梳理罗马的政治暴力——格拉古兄弟遇害，马略与苏拉的内战，凯撒渡过卢比孔河并在三月十五日遇刺，屋大维与安东尼的最后一战——如何摧毁了共和国，导致奥古斯都一人独治；并讨论共和国的终结是必然，还是一连串选择的结果"],["同一件事的不同说法","Different Accounts of the Same Event",3,12,6,8,40,113.5,-82.5,-53.1,"认识到不同的人对同一件事可以有不同的说法——两种说法可能都出于真心，却仍然彼此不一致"],["来自过去的证据","Evidence from the Past",3,12,6,7,49,129.3,-112,-64.7,"明白我们对过去的了解全都来自证据——留存下来的物品、建筑、图画、文献和故事"],["词汇：历史思维","Vocabulary: historical thinking",3,12,6,10,47,132.2,-29.3,-59.4,"知道并使用历史思维的词汇——史料、证据、一手史料、二手史料、文物、纪年、时间顺序、公元前（BC/BCE）、公元（AD/CE）、世纪、十年、时代、时期、 gs",4,29,5,7,88,45.9,-156.3,145.2,"明白情绪都有起因——发生了某件事（触发点），让我们产生某种感受——并开始能说出是什么触发了自己的情绪"],["情绪词汇","Emotion Vocabulary",4,29,7,9,51,43.4,-54.7,190.3,"使用基本情绪之外更丰富的情绪词——包括沮丧、担心、焦虑、难为情、嫉妒、自豪、失望、感激、孤单——并能区分相近的情绪"],["被掩饰的情绪","Hidden and Masked Feelings",4,29,7,9,15,49.7,-49.5,153,"认识到人有时会掩饰或藏起真实的感受——明明难过却在笑，明明不好受却说\"我没事\"——并理解一个人为什么会这样做"],["情绪在身体上的感觉","How Emotions Feel in Your Body",4,29,7,9,19,43.4,-28.6,172.1,"理解情绪和身体的联系——认出身体发出的信号，比如肚子里发慌（紧张）、拳头攥紧（生气）、心跳加快（害怕或兴奋）、肩膀发紧（有压力）"],["情绪的强弱程度","Mild to Strong Emotions",4,29,7,9,16,21,-53,177.2,"明白情绪有强弱之分——从轻微到强烈——同一种情绪，强弱不同，感觉会很不一样（比如 有点烦 → 生气 → 暴怒，或 紧张 → 焦虑 → 惊慌）"],["文化与经历如何塑造情绪","Culture and Experience Shape Emotions",4,29,9,11,15,29.5,72.8,145.5,"明白情绪反应会受个人经历、文化和情境的影响——同样一件事，因为各人的背景和过往经历不同，会引发不同的情绪"],["情绪的长期模式","Emotional Patterns Over Time",4,29,9,11,124,39.1,92,170.8,"回顾自己一段时间以来的情绪模式——留意反复出现的触发点，了解自己通常的反应，看到自己对情绪的觉察是怎样长进的"],["情绪与决策","Emotions and Decision-Making",4,29,9,11,85,44.8,63.4,187.8,"明白情绪会影响思考和做决定——强烈的情绪会让判断变得不清楚，冷静时和难受时我们常常会做出不同的选择，而意识到这一点能让我们更有掌控力"],["复杂与矛盾的情绪","Mixed and Conflicting Emotions",4,29,9,11,14,27.6,51.9,177,"明白人可以同时有复杂甚至矛盾的情绪——对上新学校既兴奋又紧张，或者朋友赢了，替他高兴的同时也为自己失落"],["情绪背后的脑科学","Brain Science of Emotions",4,29,11,12,86,36.7,133.5,169.7,"了解杏仁核如何引发情绪反应，前额叶皮层（青春期仍在发育）又如何调节情绪；说明压力激素（皮质醇、肾上腺素）为什么会影响思考和记忆；理解青少年大脑的多巴胺系统会让感受更强烈；区分情绪调节（有效地处理情绪）和情绪压抑（把情绪硬压下去，反而适得其反）；介绍认知重评这一有研究支持的方法，用来改变我们对一件事的解读"],["青春期的身份认同与归属","Identity and Belonging in Adolescence",4,29,12,13,94,32,182.4,152.5,"明白青春期要主动地建立自我认同，这会带来围绕\"我是谁\"的复杂情绪；探讨同时属于多个群体（家庭、朋友圈、文化或宗教身份）在情绪上的微妙之处；理解社会比较，以及社交媒体如何放大它；认识到身份认同不是固定不变的，对自己是谁感到不确定是正常的，不是失败的表现；学会用语言表达与群体归属和个人价值观有关的情绪"],["情绪智力","Emotional Intelligence",4,29,13,14,131,27.1,240.8,133.9,"介绍戈尔曼的情绪智力模型（自我觉察、自我调节、动机、共情、社交能力）；发展描述复杂情绪状态的词汇（矛盾、倦怠、幸灾乐祸、敬畏、怀旧、认知失调）；了解情绪智力与幸福感、关系质量和长期人生结果之间联系的研究证据；回顾自己中学阶段在情绪上的成长；探讨情绪素养与心理健康的关系，知道什么时候该寻求专业帮助"],["日常的善意与关心","Everyday Kindness and Care",4,30,5,7,19,52.7,-164.7,181.8,"在日常小事上对别人表现出善意和关心——安慰难过的朋友，帮忙捡起别人掉的东西，不用别人开口就愿意分享，说友善的话"],["别人的感受与想法","Other People's Feelings and 意识","Global Citizenship",4,30,13,14,70,86.4,231.6,134.3,"明白在一个彼此相连的世界里做公民意味着什么——一个地方的决定会影响另一个地方的人；用共情的眼光看待全球性议题（气候公正、被迫迁徙、全球健康、贫困），把事实和价值判断区分开；面对\"对身边人的责任\"和\"对远方陌生人的责任\"之间的伦理张力；介绍循证捐助和有效利他主义，作为思考全球责任的一种框架；形成一个承认复杂性的、有理有据的个人全球公民立场"],["开口求助","Asking for Help",4,31,5,7,11,112.9,-169.4,71,"需要的时候开口求助——向朋友、老师或家人——并明白求助是坚强的表现，不是软弱"],["倾听他人","Listening to Others",4,31,5,7,22,162.5,-146.4,106.8,"别人说话的时候认真听——看着说话的人，等他讲完，并且回应他说的内容来表明自己听进去了，而不是只顾着讲自己的想法"],["什么样的人算好朋友","Makes someone a good friend",4,31,5,7,16,145,-148,106.7,"明白什么样的人算好朋友——友善、诚实、可靠、愿意带上别人——并认出哪些行为算不上友好，比如指使别人、把人排除在外、说难听的话"],["轮流与分享","Taking Turns and Sharing",4,31,5,7,12,140.3,-161.2,65.1,"轮流、分享用具、和别人合作着玩——明白人人都能轮到，集体活动才更顺利，等着轮到自己也是做个好朋友的一部分"],["词汇：与人合作","Vocabulary: working with others",4,31,5,8,23,145.4,-149.7,80.9,"掌握并使用与人合作的词汇——合作、分享、轮流、团队、倾听、同意、有礼貌地不同意、接纳——并明白这些词说的是友谊和小组合作赖以成立的习惯"],["沟通词汇","Communication Vocabulary",4,31,7,11,18,169.1,9.3,138.5,"掌握并使用健康沟通和处理冲突的词汇——坚定、退让、强势、妥协、冲突、化解、调解、旁观者、挺身而出的人、同伴压力——并弄清这些相对的做法之间的区别"],["友谊会随时间改变","Friendships change over time",4,31,7,9,22,133.2,-63.3,105.7,"明白友谊会随时间改变——朋友渐渐疏远或者结交新朋友都很正常——并学会怎样结交新朋友、怎样面对友谊的变化，而不觉得是自己哪里出了问题"],["化解与朋友的分歧","Resolving Disagreements with Friends",4,31,7,9,34,158.3,-52.9,136.1,"通过好好谈一谈来化解和同伴之间的小分歧——说明自己的感受，听对方怎么说，找到双方都能接受的折中办法或解决办法"],["团队中的角色","Roles in a Group",4,31,7,9,18,168.9,-34.5,123.6,"明白人在小组里会扮演不同的角色——带头的、支持的、居中调和的、出点子的——并认识到有效的小组需要各种角色搭配，不是人人都去当带头的"],["在小组中好好合作","Working Well in a Group",4,31,7,9,22,168.9,-58.5,108.4,"在小组中好好合作——提出自己的想法，听别人的想法，承担公平的一份工作，并支持小组达成共同的目标"],["坚定而不失礼的表达","Assertive Communication",4,31,9,11,48,137.4,55.3,160.5,"使用坚定的沟通方式——清楚而有礼貌地说出自己的需要、看法和界限，既不强势（咄咄逼人、提要求），也不退让（一味顺从、不出声）——包括在感觉不对的时候说不"],["给出与接受反馈","Giving and Receiving Feedback",4,31,9,11,71,156.9,68.4,114.5,"给出和接受建设性的反馈——用有帮助而不是伤人的方式告诉别人他做得好的地方和可以改进的地方，也能听别人对自己作品的反馈而不急着辩解"],["帮别人化解冲突","Helping Others Resolve Conflicts",4,31,9,11,36,157.3,51.2,135.7,"帮别人调解冲突——听吵架的两个朋友各自说完，帮他们看到对方的角度，引导他们找到一个公平的解决办法"],["在关系中反省自己","Self-Reflection in Relationships",4,31,9,11,81,12 人的行为，包括身体上的、言语上的、社交上的（孤立、传谣言）和网络霸凌——知道霸凌永远是不对的，也知道自己遭遇或看到时该怎么办"],["词汇：伦理与公民","Vocabulary: ethics and citizenship",4,32,7,11,36,17.8,4.8,207.8,"掌握并使用伦理和公民方面的词汇——霸凌、网络霸凌、旁观者、挺身而出的人、同伴压力、数字公民素养、权利、责任、合乎伦理——并弄清这些相近词之间的区别"],["社区中的权利与责任","Community Rights and Responsibilities",4,32,9,11,14,11.3,60,191.5,"明白自己作为社群一员的权利和责任——每个人都有权被尊重、有权感到安全，而有了权利也就有了同样对待别人的责任"],["两难的伦理抉择","Difficult Ethical Choices",4,32,9,11,152,18.2,63.4,162.9,"明白伦理上的抉择并不总是非黑即白——有时没有完美的答案，讲道理的人之间也会有分歧——并练习在难做的选择中权衡相互冲突的价值"],["现实议题中的伦理","Ethics in Real-World Issues",4,32,9,11,185,53.3,75.6,150.1,"评判自己遇到的现实议题中的伦理层面——比如环境责任、体育中的公平、数字伦理或社会公正——考虑多个角度，形成有理有据的个人立场"],["同伴压力与如何抵抗","Peer Pressure and Resisting It",4,32,9,11,107,34.5,59.7,204.1,"理解同伴压力——朋友和同龄人对你的选择和行为可能产生的影响——并学会一些办法，顶住那种要你去做自己明知不对、或者让自己不舒服的事的压力"],["风险、不确定性与认知偏差","Risk, Uncertainty, and Cognitive Bias",4,32,11,12,185,27,143.7,147,"区分风险（概率已知的决定）和不确定（结果未知的决定）；认出会扭曲风险判断的认知偏差：可得性启发（凭例子想起来容不容易来判断可能性）、当下偏好（过分看重眼前而轻视将来）、乐观偏差（低估自己面临的风险）和群体思维；理解青少年的大脑在生理上本就更能容忍风险；把一套有条理的决策框架用到真实的选择上；理解在事实本身无法给出答案的决定中，个人价值观所起的作用"],["网络身份与虚假信息","Online Identity and Misinformation",4,32,12,13,187,10.4,182.5,159.3,"理解网络身份的伦理，以及线上的你和线下的你保持一致的重要性；说明推荐算法和信息茧房如何收窄我们接触到的信息；分析虚假信息的心理机制：它为什么传播得快，聪明人为什么也会信，以及如何评估信息来源（横向查证、核对证据、识别情绪操纵）；理解在分享图片或个人信息时的数字同意；探讨人工智能、监控和数据隐私对日常生活的伦理影响；反思负责任地创作内容和运用网络影响力"],["伦理框架与道德推理","Ethical Frameworks and Moral Reasoning",4,32,13,14,202,16.9,219.4,167.2,"介绍三大伦理框架：后果论（按结果和整体福祉评判行为）、义务论（按是否遵守规则和义务评判行为，不看结果）和德性伦理（按行为体现出的品格评判行为）；把每种框架用到现实的道德困境上：气候责任、人工智能伦理、公民不服从、财富不平等、医疗资源分配；理解每种框架的长处和局限；培养审慎的道德推理能力——能有条理地想清楚伦理问题，而不是只凭直觉或随大流"],["说出自己的感受","Naming Your Feelings",4,33,5,6,31,63.7,-180.4,141.3,"留意自己正在感受什么，并给它起个名字——能说出一种情绪的名称，是理解和管理它的第一步"],["词汇：自我","Vocabulary: self",4,33,5,10,29,75.2,-75.6,165,"认识并使用自我反思的词汇——自我认识、反思、规律、触发点、假设、影响、视角、觉察——明白有了准确的词来说这些内心体验，就更容易理解它们、谈论它们"],["感受不等于行为","Feelings Versus Actions",4,33,6,8,31,69.6,-103.4,165,"明白感受和行为是两回事——你可以强烈地感受到某种情绪，而不必马上照着它去做"],["自己反应中的规律","Patterns in Your Own Reactions",4,33,7,9,37,68.4,-27.7,160.1,"留意自己反应中的规律——\"我累了、被冷落了或者被当众点到时，往往会这样反应\""],["你对别人的影响","Your Impact on Others",4,33,8,9,56,88.5,-23.6,158.7,"反思自己的行为落到别人身上是什么感觉——不只想自己的本意是什么，还要想想对方实际受到的影响"],["质疑第一印象","Questioning First Impressions",4,33,9,10,52,77.6,26.2,162.4,"留意自己对一个社交场面的第一判断可能是错的——你对别人为什么那样做的假设，并不总是事实"],["自我的长期成长","Personal Growth Over Time",4,33,10,11,49,72.5,86.6,152.1,"回顾自己一段时间以来的成长——现在让你觉得难的事情不是一成不变的，看到自己已经发生的变化，能建立真正的自我认识"],["应对生活的变化","Coping with Life Changes",4,34,5,7,14,43.2,-138.6,161.8,"明白变化是生活中很正常的一部分——比如开始上学、换了新老师、家里添了小宝宝、搬家——并找出一些帮助自己应对变化的简单办法"],["从错误中学习","Learning from Mistakes",4,34,5,7,26,15.8,-158.6,143.8,"明白犯错是学习中很正常的一部分，每个人——包括大人——都会犯错，开始把错误看成学习的机会，而不是放弃的理由"],["耐心与延迟满足","Patience and Delayed Gratification",4,34,5,7,4,26.2,-172.5,153.1,"想要的东西没有马上得到，也不会特别难受——在日常情境中练习耐心和延迟满足，比如等着轮到自己、等一份好吃的、等别人来帮忙"],["让自己平静下来的简单办法","Simple Calming Strategies",4,34,5,7,88,54.5,-143.5,190.3,"难过或不知所措时，用一些简单的办法让自己平静下来——比如深呼吸、数到十、去一个安静的地方——并明白这些办法能帮助身体和头脑安定下来"],["描述强烈情绪的词","Words for Big Feelings",4,34,5,8,94,25.5,-145.4,164.8,"认识并使用管理强烈情绪的关键词——平静、方法、应对、安定、耐心、不知所措、呼吸——明白有了词来说这些事，是用上它们的第一步"],["把任务拆成小步","Breaking Tasks into Steps",4,34,7,9,45,21.6,-31.3,157.6,"把一件有难度的任务拆成更小、能做得动的步骤，而不是被整件事压得喘不过气——并为一路上的进展庆祝一下"],["选择合适的应对方式","Choosing the Right Coping Strategy",4,34,7,9,22,60.6,-30,196.3,"明白不同的情况需要不同的应对方式——对付生气管用的办法，对付难过未必管用；在学校有用的办法，在家里可能不一样"],["成长型思维","Growth Mindset",4,34,7,9,37,28.1,-69.6,164.9,"理解成长型思维——能力和智力可以通过努力、练习和好的方法而增长——它与固定型思维相对，后者认为你要么擅长一件事，要么就是不擅长"],["积极的自我对话","Positive Self-Talk",4,34,7,9,30,66.8,-55.5,194.8,"用积极的自我对话应对困难处境——把\"我真笨\"\"我永远也做不到\"这类没有帮助的想法，换成\"这很难，但我可以继续试\"\"我以前也做成过难的事\"这样鼓励自己的话"],["词汇：韧性与自我","Vocabulary: resilience and self",4,34,7,10,31,47.2,-14.3,192,"认识并使用韧性和自我管理的词汇——包括调节、韧性、成长型思维、固定型思维、自我对话、触发点、挫折、坚持、痛苦——并明白每个词在实际生活中是什么意思"],["自己的情绪工具箱","Personal Coping Toolkit",4,34,9,11,115,58,82.6,173.3,"反思哪些自我调节和应对方法对自己最管用，攒出一个可以在不同情况下取用的\"工具箱\"，也把好用的方法分享给别人"],["设定个人目标","Personal Goal-Setting",4,34,9,11,90,39.5,69.8,164.2,"设定实际可行的个人目标，做一个简单的计划去实现，自己跟踪进展，在行不通的时候调整做法"],["韧性与复原","Resilience and Bouncing Back",4,34,9,11,92,56,40.6,189.8,"把韧性理解为从挫折中恢复、适应困难处境并继续走下去的能力——认识到韧性是通过经历发展出来的能力，而不是天生有或没有的特质"],["时间与注意力管理","Time and Attention Management",4,34,9,11,37,10.6,56,128.5,"有效管理自己的时间和注意力——分清任务的轻重缓急，减少干扰，即使手头的事不是最有意思的选择，也能保持专注"],["良性压力与恶性压力","Good Stress and Bad Stress",4,34,11,12,89,57.3,132.5,173,"区分良性压力（有产出、能激发动力的那种压力）和恶性压力（有害的、让人不堪重负的压力）；解释压力的生理反应（战斗-逃跑-僵住、下丘脑-垂体-肾上腺轴）以及长期压力如何影响身体和心理；找出青少年常见的压力源（学业压力、社会比较、身体变化、对未来的不确定）；评估有证据支持的应对方法（运动、睡眠、正念、社会支持、书写表达）；识别压力已经转为焦虑或抑郁的预警信号，知道去哪里求助"],["习惯与动力","Habits and Motivation",4,34,12,13,105,48.5,195.2,142.6,"通过\"提示—行为—奖励\"回路理解习惯是怎么形成的，以及如何有意地设计新习惯；区分内在动机（做一件事是因为它本身有价值）和外在动机（奖励或惩罚），明白各自在什么时候更有效；把拖延主要理解为情绪调节问题（回避不舒服的感觉），而不是时间管理的失败；运用自我决定理论（自主、胜任、归属）提升内在动机；设计能减少阻力的环境，让想做的行为更容易发生"],["在逆境中成长","Growth Through Adversity",4,34,13,14,115,48.6,241,127.6,"明白面对重大挑战可以带来真正的成长，体现在三个方面：对人生有了新的看法、关系变得更好、对自身能力更有信心（创伤后成长）；区分真正的成长与\"有毒的正能量\"（\"一切自有安排\"）以及否认现实；明白韧性不是不受逆境影响，而是在逆境中恢复并成长；形成一套自己面对挫折的想法，核心是从中找到意义；探讨如何在不轻视对方经历的前提下，支持正在经历重大困难的人"],["动物的伪装","Animal Camouflage",0,35,5,7,38,-128.7,-123.3,-165.4,"知道许多动物会用伪装——帮助自己融入周围环境的颜色和花纹——来躲避捕食者，或者悄悄接近猎物，比如长得像树叶的叶䗛，或者冬天变白的北极兔"],["动物的家","Animal Homes",0,35,5,7,134,-109.7,-151.1,-148.4,"知道动物会做出或找到各种各样的家——鸟筑巢、兔子挖洞、蜜蜂住在蜂巢里、寄居蟹用空贝壳、蜘蛛织网——这些住所保护着它们和它们的宝宝"],["动物之最","Animal Record-Holders",0,35,5,7,1,-109.6,-163.9,-112.6,"知道世界上一些动物纪录保持者——蓝鲸是有史以来最大的动物，猎豹是跑得最快的陆地动物，吸蜜蜂鸟是最小的鸟，长颈鹿是最高的——并把它们的大小和熟悉的东西作比较"],["到处都有动物","Animals Everywhere",0,35,5,7,153,-116.7,-107.4,-157.5,"知道动物生活在世界各地——陆地上、水里、空中——每一个大洲，就连冰天雪地的南极洲，都有动物生活，每种动物都适应了自己所处的环境"],["动物怎样繁育后代","How Animals Have Babies",0,35,5,7,53,-48.1,-156.5,-141.5,"知道不同的动物生宝宝的方式不一样——有的下蛋（鸟、爬行动物、鱼、昆虫），有的直接生下小宝宝（大多数哺乳动物）——宝宝可能像缩小版的成年动物，也可能和父母长得很不一样"],["夜行动物","Nocturnal Animals",0,35,5,7,40,-134.6,-145.9,-150.1,"知道有些动物是夜行性的——夜里活动，白天睡觉——夜行动物常常有特别的本领，比如大眼睛（猫头鹰、眼镜猴）、大耳朵（蝙蝠、耳廓狐），或者敏感的胡须，帮助它们在黑暗中找到食物"],["野生动物、家畜与宠物","Wild, Farm & Pet Animals",0,35,5,7,41,-86.8,-163.2,-140.8,"理解野生动物、家畜和宠物的区别——野生动物在自然中自己找食物和住处；家畜由人饲养，提供肉、羊毛或蛋；宠物是人养来作伴的——并知道野生动物应该远远地观察"],["动物的交流","Animal Communication",0,35,7,9,16,-135.1,-42,-140.4,"理解动物用许多不同的方式交流——鸟唱歌来吸引配偶、保卫领地，鲸在辽阔的海洋中远距离呼唤，蜜蜂跳舞告诉同伴食物在哪里，狼嚎叫让狼群聚在一起，萤火虫用闪光发信号——交流对生存至关重要"],["动物迁徙","Animal Migration",0,35,7,9,44,-119.9,-59.1,-174.8,"知道许多动物会进行了不起的旅行，叫做迁徙——北极燕鸥从一极飞到另一极，帝王蝶穿越北美飞行数千英里，角马追着雨水穿过塞伦盖蒂，座头鲸在极地觅食区和热带繁殖水域之间往返——这些旅行都和食物、繁殖和季节有关"],["沙漠动物","Desert Animals",0,35,7,9,36,-140.8,-59.9,-155.8,"探索沙漠里的动物——骆驼、耳廓狐、蝎子、响尾蛇、狐獴——理解沙漠动物如何靠夜里活动、储存水分或脂肪、白天钻进地下洞穴、以及用大耳朵散热，来熬过酷热和缺水"],["极地动物","Polar Animals",0,35,7,9,49,-130.8,-42,-172.6,"探索北极和南极的动物——北边有北极熊、北极狐和海象，南边有企鹅、海豹和信天翁——理解极地动物如何靠厚厚的毛皮或脂肪层、挤在一起取暖，以及冬天换白毛这样的季节性变化，来抵御严寒"],["捕食者的狩猎策略","Predator Hunting Strategies",0,35,7,9,42,-109.4,-28.7,-160.7,"理解捕食者演化出了各自的狩猎策略——狼成群围猎，变色龙用长舌头，蜘蛛织网，鳄鱼在水边伏击——被捕食的动物也演化出了防御手段——豪猪的刺、臭鼬的臭液、箭毒蛙的毒素、让捕食者眼花的斑马条纹、装死"],["雨林动物","Rainforest Animals",0,35,7,9,30,-116.1,-64,-139.5,"探索热带雨林的动物——地球上物种最丰富的栖息地——了解森林分成不同的层（林冠层、林下层、林地面），每一层住着不同的动物：巨嘴鸟和猴子在林冠层，美洲豹和蛙类在林地面，并知道雨林分布在赤道附近"],["稀树草原与草原动物","Savanna & Grassland Animals",0,35,7,9,41,-90.5,-67.9,-163,"探索草原和稀树草原的动物——非洲稀树草原上的狮子、斑马、角马、大象、猎豹；美洲草原上的野牛和草原犬鼠——理解为什么开阔的草原上会形成大群，以及捕食者和猎物在这片开阔天地里如何互动"],["小虫子的世界","The World of Minibeasts",0,35,7,9,33,-108.4,-50.1,-158.1,"知道昆虫和其他小虫子（蜘蛛、蚯蚓、蜗牛、蜈蚣）是地球上数量最多、种类最丰富的动物类群——甲虫的种类比任何别的动物都多——它们扮演着重要角色：传粉者（蜜蜂、蝴蝶）、分解者（鼠妇、蚯蚓），也是别的动物的食物"],["动物的智力","Animal Intelligence",0,35,9,11,27,-127.4,64.8,-142,"探索动物的智力和复杂行为——黑猩猩和乌鸦会使用工具，海豚能在镜子里认出自己，章鱼会解谜、会从容器里逃出来，大象会哀悼死去的同伴，狐獴会教幼崽怎么对付蝎子——理解许多动物的思考、学习和社会生活，比人们过去以为的复杂得多"],["生物多样性","Biodiversity",0,35,9,11,181,-92.5,71.5,-176.8,"理解生物多样性——一个生态系统中物种的丰富程度——对健康的生态系统必不可少，而关键种（比如黄石公园的狼、海带林里的海獭，或者作为传粉者的蜜蜂）对所在生态系统的影响格外大，失去一个关键物种就可能引发一连串变化，波及许多别的物种"],["濒危与灭绝物种","Endangered & Extinct Species",0,35,9,11,178,-100,55.7,-154.1,"理解一些动物为什么会濒危或灭绝——栖息地破坏、猎杀和盗猎、污染、气候变化、入侵物种——并知道一些例子，比如大熊猫、山地大猩猩、远东豹，以及已经灭绝的渡渡鸟和袋狼，了解 IUCN 红色名录是科学家用来追踪受威胁物种的系统"],["入侵物种","Invasive Species",0,35,9,11,168,-107.8,73.3,-161.3,"理解入侵物种是被带到本不属于它们的地方的动物（或植物）——比如在英国把红松鼠挤走的灰松鼠，在澳大利亚毒死本地捕食者的甘蔗蟾蜍，或者把澳大利亚生态系统啃得千疮百孔的兔子——它们会通过争夺食物、传播疾病，或者因为没有天敌，给本地野生动物造成严重伤害"],["保护濒危动物","Protecting Endangered Animals",0,35,9,11,179,-83.9,90,-159.8,"知道人们如何保护濒危动物——通过国家公园和海洋保护区、人工繁育项目（比如拯救了加州神鹫和阿拉伯大羚羊的项目）、反盗猎巡逻、连接栖息地的野生动物走廊，以及禁止濒危物种贸易的法律——并理解孩子也可以通过对栖息地友好的选择出一份力"],["形态上的适应","Structural Adaptations",0,35,9,11,129,-117.9,32.7,-171.1,"理解动物有形态上的适应（身体特征，比如长颈鹿的长脖子、鹰的利爪、海豚的流线型身体）、行为上的适应（迁徙、冬眠、使用工具）和生理上的适应（北极鱼血液里的抗冻物质、蝙蝠的回声定位）——这些都是通过自然选择在许多世代中形成的"],["共生","Symbiosis",0,35,9,11,124,-127.8,63.8,-168.4,"理解共生——不同物种之间的密切关系——包括互利共生（双方都获益，比如小丑鱼和海葵）、偏利共生（一方获益而不伤害另一方，比如搭鲨鱼便车的䲟鱼）和寄生（一方获益而另一方受损，比如鹿身上的蜱虫）——并能在自然中认出这些关系"],["红皇后假说","The Red Queen Hypothesis",0,35,11,12,109,-83,137.8,-149.1,"介绍红皇后假说——物种必须不断演化，才能相对于共同演化的对手维持原有的适合度；描述捕食者与猎物之间的军备竞赛（猎豹的速度对羚羊的速度，蝙蝠的回声定位对飞蛾听觉的干扰）以及寄生物与宿主的共同演化（兔子的黏液瘤病）；解释达尔文由兰花预言长喙天蛾的故事，这是互利共生式共同演化预测出未知物种的经典例子；理解共同演化是生物多样化的重要推动力"],["深海中的生存","Deep-Sea Survival",0,35,12,13,107,-111.8,166.8,-147.4,"解释深海动物如何应对巨大的压力（体内没有充气的空腔、柔韧的蛋白质、适应高压的酶）；描述体温调节的极端案例——南极鱼体内的抗冻糖蛋白、林蛙的过冷现象；介绍缓步动物和隐生（在干燥、极端温度、辐射、真空中存活）；概览其他极端环境生物（热液喷口的嗜热菌、盐滩上的嗜盐菌）；思考这些生物让我们对生命的极限有什么认识"],["性选择","Sexual Selection",0,35,12,13,118,-80.4,193.9,-127,"把性选择解释为自然选择的一种形式：孔雀尾羽的失控选择、极乐鸟的求偶展示、蛙的鸣叫；解释亲缘选择和利他行为——工蜂为什么会拼死保卫蜂巢，狐獴为什么冒着危险站岗（汉密尔顿法则、广义适合度）；用鹰鸽模型介绍动物行为中的博弈论；界定认知行为学，梳理动物具有情绪、玩耍和文化的证据"],["生物多样性危机","The Biodiversity Crisis",0,35,12,14,179,-69.6,199.7,-150.7,"量化当前的生物多样性危机：灭绝速率是背景速率的一百到一千倍；解释衡量生物多样性丧失的方法（物种—面积关系、种群生存力分析、IUCN 红色名录等级）；评估野化的案例——黄石公园重新引入狼引发营养级联，甚至改变了河道；伊比利亚猞猁的恢复；描述最小可存活种群理论和保护分诊；探讨在决定优先保护哪些物种时的伦理争论"],["用 DNA 给物种分类","Grouping Species Using DNA",0,35,13,14,178,-64.6,241.1,-128.7,"解释支序分类学：生物按共有的衍征分组，而不只是按相似程度；如何用分子数据（DNA 序列比对）和分子钟构建系统发育树；解释为什么严格来说鸟类是恐龙里的一个类群（冠群鸟跖类）；区分趋同演化（不相关的物种演化出相似的性状）和平行演化；介绍水平基因转移，以及为什么生命之树更准确地说是一张网；解释为什么分类系统会随着新数据的出现不断变化"],["恐龙有多大","Dinosaur Sizes",0,36,5,7,16,144,-165.5,-29.5,"把恐龙的大小和熟悉的东西比一比——有的恐龙有房子那么高，有的只有鸡那么小——明白恐龙的体型差别非常大"],["恐龙真实存在过","Dinosaurs Were Real",0,36,5,7,78,171.8,-127.8,-41.1,"明白恐龙是真实存在过的动物，很久很久以前生活在地球上，现在已经灭绝了——今天一只也没有了"],["著名的恐龙种类","Famous Dinosaur Species",0,36,5,7,37,158,-146.6,-29.1,"认识并说出常见的著名恐龙种类：霸王龙、三角龙、剑龙、腕龙/梁龙，并描述每一种的一个基本特征"],["化石与古生物学家","Fossils & Palaeontologists",0,36,5,7,66,161.9,-115.1,-25.5,"明白化石是古代生物保存在岩石中的遗骸，研究化石、了解恐龙的科学家叫古生物学家"],["食草恐龙与食肉恐龙","Plant-Eaters vs Meat-Eaters",0,36,5,7,26,136.3,-142,-44.6,"通过牙齿形状这样的线索，把恐龙分成食草的（植食性）和食肉的（肉食性）——平的牙齿吃植物，尖的牙齿吃肉"],["真实的恐龙与影视里的恐龙","Real Dinosaurs vs Fiction",0,36,5,7,16,139.8,-162.8,-9.9,"区分真实的恐龙和虚构的或常被弄混的动物——翼龙（会飞的爬行动物）和蛇颈龙（海生爬行动物）都不是恐龙，电影里的恐龙也不一定准确"],["世界各地的恐龙","Dinosaurs Around the World",0,36,7,9,8,184.1,-52.2,-41.7,"明白不同的恐龙生活在不同的大洲，世界各地的化石发现说明恐龙遍布全球，有些种类只在特定地区发现过"],["恐龙粪便化石","Fossilised Dinosaur Dung",0,36,7,9,30,194.1,-51.3,-26.6,"说明粪化石是什么（恐龙粪便形成的化石），以及古生物学家如何分析它们来发现恐龙吃什么，包括其中的植物碎片、骨头和种子"],["化石透露的远古环境","Fossils Reveal Ancient Environments",0,36,7,9,44,109.2,-54.7,-8.1,"明白化石告诉我们的不只是古代的动物，还有古代的环境——比如在山顶上发现海洋生物的化石，说明那个地方曾经在水下"],["化石是怎么形成的","How Fossils Form",0,36,7,9,33,155.7,-44.9,13.2,"用简单的话解释化石是怎么形成的：一个生物死亡后很快被沉积物掩埋；经过千百万年，矿物质取代了遗骸，沉积物变成岩石，把形状保存了下来"],["化石猎人玛丽·安宁","Mary Anning, Fossil Hunter",0,36,7,9,3,129.7,-60.4,-27.5,"知道玛丽·安宁是谁——英国莱姆里吉斯一位开创性的化石猎人，19 世纪初发现了鱼龙和蛇颈龙的骨骼，为人们认识史前生命作出了贡献"],["解读恐龙足迹","Reading Dinosaur Trackways",0,36,7,9,27,193.2,-41.9,-0.5,"利用恐龙的行迹（化石化的脚印）推断恐龙的体型、速度和行为——脚印间距大说明在奔跑，间距小说明在行走"],["中生代","The Mesozoic Era",0,36,7,9,16,164.5,-57.6,-24.6,"按顺序排出中生代的三个纪——三叠纪、侏罗纪、白垩纪——并明白不同的恐龙生活在不同的时期，并不是同时存在的"],["化石的种类","Types of Fossils",0,36,7,9,29,203.5,-54.1,-10.8,"区分实体化石（保存下来的骨头、牙齿、贝壳）和遗迹化石（脚印、行迹、蛋、洞穴、粪化石），并说明每一类能告诉科学家什么"],["化石作为证据","Fossils as Evidence",0,36,8,11,74,17.2,18,-12.1,"分析和解读化石中的信息，为很久以前存在过的生物和环境提供证据"],["鸟类由恐龙演化而来","Birds Evolved from Dinosaurs",0,36,9,11,100,99.2,80.4,-60,"理解现代鸟类是从一类长着羽毛的小型兽脚类恐龙演化而来的，证据包括始祖鸟化石、中国出土的带羽毛恐龙化石，以及骨骼上的共同特征"],["科学认识会改变","Changing Scientific Knowledge",0,36,9,11,287,173.6,66.1,-36.8,"通过权衡化石证据，评估关于恐龙的几种相互竞争的科学解释——理解科学知识会随着新化石的发现和新分析方法的出现而改变"],["恐龙的腰带分类","Dinosaur Hip Groups",0,36,9,11,23,125,30.4,-28.9,"根据髋部结构把恐龙分成两大类：蜥臀目（蜥蜴式的髋部，包括兽脚类和蜥脚类）和鸟臀目（鸟式的髋部，包括三角龙和剑龙）"],["古生物学家怎么工作","How Palaeontologists Work",0,36,9,11,31,200.8,39.6,-9.5,"描述古生物学家在野外和实验室里怎样工作：寻找露出地表的化石、用手工工具小心发掘、打石膏包便于运输、在实验室做修复处理，以及科学描述和发表"],["古生物复原图与推测","Palaeoart & Speculation",0,36,9,11 5.2,"观察磁体之间怎样相互吸引或排斥，以及它们能吸引哪些材料、不能吸引哪些材料"],["磁极","Magnetic Poles",0,40,7,9,12,146,-29,-6.9,"知道磁体有两个磁极（北极和南极），并根据相对的是哪两个磁极，预测两块磁体会相吸还是相斥"],["平衡力与非平衡力","Balanced & Unbalanced Forces",0,40,8,9,25,180.4,-17.4,82.7,"设计并开展探究实验，为平衡力和非平衡力对物体运动的影响提供证据"],["预测运动的规律","Predicting Motion Patterns",0,40,8,9,265,111.8,-6.7,66.6,"观察和测量物体的运动，为「可以用规律预测将来的运动」提供证据"],["空气阻力与摩擦力","Air Resistance & Friction",0,40,9,10,14,201.7,22.9,72.5,"认识空气阻力、水的阻力和摩擦力的作用，明白这些力作用在相互运动的表面之间，阻碍运动"],["力与运动的术语","Force & Motion Vocabulary",0,40,9,11,12,144.2,78,74.1,"使用力和运动的专业词汇——平衡力、非平衡力、合力、加速、减速、速度、力矩、杠杆、支点、机械效益——并用这些词解释和预测力如何影响物体的运动和位置"],["重力与下落的物体","Gravity & Falling Objects",0,40,9,11,25,195.2,47.7,64,"说明没有支撑的物体会因为地球和它之间的重力作用而落向地面"],["杠杆、滑轮与齿轮","Levers, Pulleys & Gears",0,40,9,10,14,167,57.6,80.5,"知道杠杆、滑轮、齿轮等一些机械装置能让较小的力产生较大的效果"],["读懂路程—时间图","Reading Distance-Time Graphs",0,40,10,13,261,8.1,152.6,36.4,"读懂并绘制运动物体的路程—时间图；把线的斜率（陡缓）理解为速度；识别静止的时段（水平段）、匀速运动（笔直的斜线），并通过比较斜率判断速度的快慢；用「速度 = 路程 ÷ 时间」由直线段的斜率算出平均速度"],["磁场","Magnetic Fields",0,40,11,12,12,120.7,142,-19.9,"描述磁极（北极和南极），说明磁极之间的吸引和排斥，描述用指南针描绘出的磁感线，并说明地球磁场及其实际用途"],["质量与重量的区别","Mass vs Weight",0,40,11,12,21,134.2,152.4,4.4,"区分质量（物质的多少，单位是千克）和重量（重力的大小，单位是牛顿），使用「重量 = 质量 × 重力场强度」这一公式，并解释为什么 g 在其他行星和恒星上不一样"],["相对运动","Relative Motion",0,40,11,12,260,-2.8,155.2,11.2,"解释相对运动——物体看上去的速度和方向取决于观察者自己的运动状态——用火车、汽车交会这类日常例子说明"],["合力","Resultant Forces",0,40,11,12,18,152.1,120.3,74.9,"把力描述为既有大小又有方向的矢量，区分平衡力（合力为零，运动状态不变）和非平衡力（合力不为零，引起加速或减速）"],["速度与路程—时间图","Speed & Distance-Time Graphs",0,40,11,12,260,-17.4,163.4,23.6,"用「速度 = 路程 ÷ 时间」计算平均速度，用路程—时间图表示行程，并把斜率理解为速度、把水平段理解为静止的时段"],["形变与流体压强","Deformation & Fluid Pressure",0,40,12,13,10,69.6,207.7,66.4,"说明物体形变时相关的力（弹性形变和非弹性形变）、材料的热胀冷缩，以及流体压强怎样向各个方向作用并随深度增大"],["电磁铁","Electromagnets",0,40,12,13,33,110.7,210.3,-31.8,"描述电流的磁效应（通电导线周围会产生磁场），并探究电磁铁的强弱如何取决于电流大小、线圈匝数和铁芯材料"],["力的探究实验","Investigating Forces",0,40,12,13,19,111.9,216.6,56.3,"设计并开展关于力的探究实验，包括用弹簧测力计测量力、探究胡克定律，以及收集和分析运动数据来检验牛顿定律"],["力矩、压强与胡克定律","Moments, Pressure & Hooke's Law",0,40,12,14,15,135.4,215.5,70.1,"计算转动效果（力矩 = 力 × 力臂），说明压强在液体中怎样向各方向均匀传递（帕斯卡原理）以及大气压强的概念，并描述胡克定律（在弹性限度内，伸长量与力成正比）"],["牛顿第一、第二定律","Newton's First & Second Laws",0,40,12,13,18,141,194.5,57.7,"陈述并运用牛顿第一定律（物体在不受合力作用时保持静止或匀速运动）和第二定律（力 = 质量 × 加速度），包括质量、力和加速度之间的关系"],["牛顿第三定律","Newton's Third Law",0,40,12,13,16,92.6,212.8,41,"陈述并运用牛顿第三定律：每个力都有一个大小相等、方向相反、作用在另一个物体上的反作用力，并把作用力与反作用力和平衡力区分开"],["电动机与磁场对电流的作用","Motors & the Motor Effect",0,40,13,14,33,74.9,263.1,-18.7,"说明磁场对电流的作用（通电导体在磁场中会受到力），并描述这一原理在电动机和扬声器中的应用"],["照顾小虫子","Caring for minibeasts",0,41,5,7,5,83.1,-158.4,-62.4,"照顾小虫子：轻轻地观察它们，小心地拿放，看完放回原来找到它们的地方。小虫子为什么重要——它们帮助花园里的植物生长，分解落叶，还是别的动物的食物。"],["从毛毛虫到蝴蝶","Caterpillar to butterfly",0,41,5,7,8,73.7,-159.4,-37.9,"从毛毛虫到蝴蝶：蝴蝶的生命周期是一场看得见的变化。卵 → 毛毛虫 → 蛹 → 蝴蝶。一只小生命可以彻底改变自己的模样。课堂里的养蝴蝶套装，《好饿的毛毛虫》。"],["常见小虫子的识别与命名","Common minibeasts: naming and recognising",0,41,5,7,141,104.3,-165.3,-54.1,"认识并说出常见小虫子的名字：瓢虫、蚂蚁、蜜蜂、蝴蝶、蜘蛛、蜗牛、蚯蚓、鼠妇、毛毛虫、甲虫。对所有小虫子都建立友善的态度，不只喜欢「好看的」那些。"],["小虫子怎么移动","How minibeasts move",0,41,5,7,38,113.5,-165.8,-35,"小虫子怎么移动：爬（蚂蚁、甲虫）、飞（蝴蝶、蜜蜂）、蠕动（蚯蚓、蛞蝓）、跳（蚱蜢、跳蚤）、钻洞（蚯蚓）。数腿的数目，是给生物分类的第一步。"],["小虫子的栖息地","Minibeast Habitats",0,41,5,7,123,55.3,-169.7,-80.6,"小虫子住在哪里：微栖息地。不同的小虫子喜欢不同的环境——木头下面（潮湿、阴暗）、土里（地下）、叶子上（向阳）、池塘水中（湿）。在不同的地方能找到不同的生物。"],["食物链中的小虫子","Minibeasts in the food chain",0,41,5,7,98,99.1,-142.6,-76.7,"食物链中的小虫子：简单的花园食物链。毛毛虫吃叶子，小鸟吃毛毛虫。小虫子是别的动物的食物，小虫子自己也要吃东西。"],["什么是小虫子","What is a minibeast?",0,41,5,7,146,71.3,-178.3,-54.6,"什么是小虫子？没有脊椎的小动物，在花园、公园和树林里都能找到。找虫游戏——翻开木头、石块和落叶，用放大镜近距离观察小虫子。"],["蜜蜂与传粉","Bees and pollination",0,41,7,9,12,122.9,-51.3,-75,"蜜蜂与传粉：花和昆虫怎样彼此依赖。蜜蜂到花上采蜜，花粉粘在身上，被带到下一朵花。没有传粉，很多植物结不出种子和果实。蜜蜂为什么关系到我们吃的食物。"],["伪装、警戒色与拟态","Camouflage, warning colours, and mimicry",0,41,7,9,8,162.8,-31.4,-23.4,"伪装、警戒色与拟态：昆虫怎样靠隐藏或发出视觉信号活下来。竹节虫长得像树枝，叶䗛长得像叶子。黄蜂身上有警戒条纹；食蚜蝇模仿黄蜂，其实并无危险。「你能找到它吗」的挑战。"],["昆虫之最","Incredible insects: record-breakers",0,41,7,9,7,156,-41.8,-43.9,"了不起的昆虫——纪录保持者和超能力。按体重比，蜣螂是力气最大的动物。蜻蜓是飞得最快的昆虫之一。跳蚤能跳出自身体长 150 多倍的距离。气步甲能喷出滚烫的化学物质。昆虫世界的「哇」时刻。"],["昆虫的完全变态发育","Insect life cycles: complete metamorphosis",0,41,7,9,8,82.1,-51.9,-37,"昆虫的生命周期——细看完全变态发育。卵 → 幼虫 → 蛹 → 成虫。幼虫（毛毛虫、蛴螬、蛆）和成虫长得完全不一样。在蛹里面，身体被重新组建。蝴蝶、甲虫、苍蝇和瓢虫都要经历完全变态发育。"],["不是所有小虫子都是昆虫","Not all minibeasts are insects",0,41,7,9,25,113.8,-41.3,-55,"不是所有小虫子都是昆虫：把昆虫和别的小虫子区分开。蜘蛛有 8 条腿、身体分 2 部分（蛛形纲），鼠妇有 14 条腿（甲壳类），蚯蚓没有腿，蜗牛有壳和一只足。「它是昆虫吗」的分类游戏。"],["社会性昆虫：蚂蚁与蜜蜂","Social insects: ants and bees",0,41,7,9,14,142.2,-40.8,-73.9,"社会性昆虫：蚂蚁和蜜蜂怎样在群体中共同生活和劳作。蚁后与蜂王、工蚁与工蜂、雄蜂。分工——有的找食物，有的建巢，有的守卫。蚂蚁的地道和蜜蜂的蜂巢都是有组织的家。这和人类的团队合作很像。"],["小虫子的分类与识别","Sorting and Identifying Minibeasts",0,41,7,9,18,92.1,-49.1,-60.7,"用检索表来识别小虫子。一层层的是非问题：「它有腿吗？」→「有几条腿？」→「它有翅膀吗？」二歧检索表是一种系统地分类和识别生物的工具。"],["昆虫的身体构造","The insect body plan",0,41,7,9,38,147.2,-59.8,-47.7,"昆虫的身体构造：所有昆虫都有三个体段（头、胸、腹），六条腿长在胸部，头上有触角。大多数有翅膀。它们有外骨骼——一层坚硬的外壳——而不是身体里面的骨头。"],["昆虫的适应","Insect Adaptations",0,41,9,11,11,140,59.1,-8.5,"昆虫的适应与演化：桦尺蛾是自然选择的著名例子（工业革命时期树干被煤烟熏黑，深色的蛾子更容易活下来）。竹节虫演化得像树枝。拟蚁蜘蛛演化出能骗过捕食者的样子。许多代里的微小变化，怎样造就了这些惊人的伪装。"],["昆虫解剖细说","Insect anatomy in depth",0,41,9,11,7,162.7,48.6,-22,"细说昆虫解剖：由成千上万个小眼组成的复眼、身体两侧的气门（呼吸孔）、各式各样的口器（甲虫用来咀嚼的上颚、蝴蝶用来吸食的虹吸式口器、苍蝇的舐吸式口器），以及靠蜕去外骨骼来长大。仿生学——工程师怎样模仿昆虫的设计。"],["昆虫的交流与行为","Insect communication and behaviour",0,41,9,11,8,161.2,45.9,-56.4,"昆虫的交流与行为：蜜蜂跳摇摆舞，告诉同伴花在哪里。蚂蚁留下信息素路线，让同伴跟着走。萤火虫用闪光的节奏寻找配偶。蟋蟀靠摩擦翅膀发出鸣叫。帝王蝶跨越大陆迁飞数千公里。昆虫怎样不用语言「说话」。"],["生态系统中的昆虫","Insects in ecosystems",0,41,9,11,51,114.3,31.3,-84.7,"生态系统中的昆虫：昆虫扮演的多种角色。传粉者（蜜蜂、蝴蝶、食蚜蝇）、分解者（蜣螂、蝇类幼虫）、鸟类蝙蝠鱼类和青蛙的食物来源，以及害虫的控制者（瓢虫吃蚜虫）。思想实验：如果所有昆虫都消失了，会发生什么？"],["地球上最成功的动物","The most successful animals on Earth",0,41,9,11,51,118.8,54.7,-57.2,"地球上最成功的动物：已经命名的昆虫大约有一百万种，科学家估计实际可能有 500 万到 1000 万种。昆虫的种类比其他所有动物类群加起来还多。为什么这么多？身体小意味着需要的食物少，繁殖快、后代多，会飞让它们能到达新的栖息地，外骨骼也极其百变好用。"],["昆虫面临的威胁与保护","Threats to insects and conservation",0,41,9,11,51,100.7,50.9,-71.7,"昆虫面临的威胁与保护：全世界的昆虫数量都在下降。原因包括栖息地丧失、农药使用、光污染干扰夜行昆虫，以及气候变化。传粉昆虫减少威胁到粮食生产。孩子能做的事：种适合传粉昆虫的花园、少用农药、参加「大蝴蝶普查」这样的公众科学活动。"],["变态发育的类型","Types of Metamorphosis",0,41,9,11,8,90.5,55.5,-37.8,"完全变态发育和不完全变态发育。完全变态：卵 → 幼虫 → 蛹 → 成虫（蝴蝶、甲虫、苍蝇）。不完全变态：卵 → 若虫 → 成虫——若虫长得像成虫的缩小版，一边蜕皮一边长大（蚱蜢、蜻蜓、蟋蟀）。为什么有的昆虫要彻底改变模样，有的却是慢慢长大？"],["描述材料的性质","Describing Material Properties",0,42,5,6,138,-19,-192.5,109.9,"描述日常材料简单的物理性质，比如硬/软、能拉伸/僵硬、有光泽/暗淡、粗糙/光滑、防水/吸水、透明/不透明"],["材料的分组","Grouping Materials",0,42,5,6,123,-29.7,-162.2,160,"根据简单的物理性质，比较日常材料并给它们分组"],["说出日常材料的名字","Naming Everyday Materials",0,42,5,6,137,-26.2,-203.1,83.9,"认识并说出各种日常材料的名字，包括木头、塑料、玻璃、金属、水和石头"],["物体与材料的区别","Objects vs Materials",0,42,5,6,138,-26.4,-190.7,56.9,"区分物体和做成它的材料，明白同样的物体可以用不同的材料做成"],["物态术语","States of Matter Vocabulary",0,42,5,7,186,-45.9,-137.3,171.4,"说出并区分物质的三种状态——固体、液体、气体——用性质词汇来描述：硬、坚固、稀、会流动、能保持形状、充满容器；用「物态变化」来描述材料被加热或冷却时发生的事"],["改变固体的形状","Changing Shapes of Solids",0,42,6,7,42,-29,-137.6,138.2,"探究挤压、弯折、扭转和拉伸怎样改变固体物体的形状"],["选择合适的材料","Choosing the Right Material",0,42,6,8,27,-24.5,-90.6,184.2,"认识和比较不同日常材料对特定用途的适合程度，说明为什么特定的用途要选特定的材料"],["变化与分离的术语","Changes & Separation Vocabulary",0,42,7,9,22,-73.3,-22.5,196.5,"使用描述物态变化和物质分离过程的词汇——溶解、溶液、可溶、不可溶、蒸发、凝结、熔化、凝固、过滤、筛分、混合物、分离——并准确理解每个词描述的是什么，包括溶解和熔化之间的重要区别"],["材料的分类","Classifying Materials",0,42,7,8,7,-17.2,-92.8,139.6,"设计并开展探究，按可观察到的性质给不同种类的材料分类"],["画微粒模型图","Drawing Particle Diagrams",0,42,7,11,108,-42.2,25.8,191.7,"绘制和解读微粒模型图——用小圆点表示固体（紧密、排列规则、在原位振动）、液体（紧密、排列杂乱、彼此滑动流过）和气体（间隔很大、向各个方向快速运动）中微粒的排列、间距和运动——并用这些图解释形状固定、体积固定、可压缩性等可观察到的性质"],["加热与冷却引起的变化","Heating & Cooling Changes",0,42,7,9,109,-66.6,-15.7,178.4,"观察并描述有些材料受热或遇冷会发生物态变化，并用摄氏度测量变化发生时的温度"],["拆开与重组","Taking Apart & Rebuilding",0,42,7,8,1,-22.9,-99,36.3,"观察到由少量零件拼成的物体可以拆开，再拼成一个新的物体，明白这些零件依然存在"],["检验材料的用途","Testing Materials for Uses",0,42,7,10,21,-14.7,-10.4,173.5,"根据对比实验和公平实验得到的证据，说明金属、木头、塑料等日常材料为什么用在特定的地方"],["蒸发与水循环","Evaporation & the Water Cycle",0,42,8,9,40,-104.9,1.2,166.1,"认识蒸发和凝结在水循环中的作用，把蒸发的快慢和温度联系起来"],["固体、液体与气体","Solids, Liquids & Gases",0,42,8,9,47,-41.1,-17,191,"根据可观察到的性质和表现，把材料按固体、液体、气体来比较和分组"],["进阶材料性质","Advanced Material Properties",0,42,9,11,34,-25.8,41.3,203,"根据更进阶的性质给日常材料分组和比较：硬度、溶解性、透明度、导电性和导热性，以及对磁体的反应"],["溶解与溶液","Dissolving & Solutions",0,42,9,10,51,-61.4,46.9,199.8,"明白有些材料能溶解在液体里形成溶液，并描述怎样用蒸发的方法把溶解的物质从溶液中重新得到"],["不可逆变化","Irreversible Changes",0,42,9,11,47,-22.6,82.5,171.7,"说明有些变化会生成新的物质，通常不可逆，比如燃烧、生锈和跟酸的反应"],["材料性质术语","Material Properties Vocabulary",0,42,9,11,22,-13.5,51.4,184.2,"用专业词汇描述和比较材料的性质——导体、绝缘体、导热、导电、透明、不透明、半透明、可溶、不可溶、有磁性、柔韧、坚硬、密度——并在为特定用途选材料和说明理由时准确使用这些词"],["可逆变化","Reversible Changes",0,42,9,10,47,-41.6,54,188.4,"演示溶解、混合和物态变化都是可逆变化，没有新物质生成"],["分离混合物","Separating Mixtures",0,42,9,10,37,-65.6,40.5,182.9,"运用关于固体、液体和气体的知识，判断混合物可以怎样通过过滤、筛分和蒸发来分离"],["质量守恒","Conservation of Mass",0,42,10,11,48,-29.8,102.9,181,"测量并提供证据说明：不管发生哪种变化（加热、冷却还是混合），物质的总重量都保持不变"],["物质由微粒构成","Matter Is Made of Particles",0,42,10,11,40,-44.4,79.2,192.1,"建立模型来说明物质是由小到看不见的微粒构成的，而这一点解释了固体、液体和气体的性质"],["原子、元素与化合物","Atoms, Elements & Compounds",0,42,11,12,36,-6.7,167.2,120.9,"说明原子、元素和化合物的区别；描述原子的简单玻尔模型（原子核里有质子和中子，电子分层排布）；并会写和读懂化学符号和简单的化学式"],["物态变化的过程","How Materials Change State",0,42,11,12,16,-44,134.9,166,"用微粒模型解释熔化、凝固、沸腾、凝结和升华，通过解读加热曲线和冷却曲线找出熔点和沸点"],["金属与非金属","Metals vs Non-Metals",0,42,11,13,26,-2.9,199.6,91.1,"比较金属和非金属的物理性质与化学性质，说明金属的性质（延展性、金属光泽、导电性），以及元素在元素周期表中的位置怎样预示它的活泼程度"],["物理变化与化学变化","Physical vs Chemical Changes",0,42,11,13,51,-19.5,162.6,162.5,"区分物理变化（可逆，没有新物质生成）和化学变化（有新物质生成，通常不可逆），并用质量守恒来理解这两类变化"],["纯净物与混合物","Pure Substances & Mixtures",0,42,11,13,41,-38.2,170.2,152.6,"区分纯净物和混合物，认识配制品是成分比例精确的有用混合物，并用熔点和沸点来检验纯度"],["分离混合物","Separating Mixtures",0,42,11,13,42,-57.9,167.6,154.4,"针对不同类型的混合物选择并实施合适的分离方法：过滤（不溶的固体）、蒸馏（按沸点分离液体）、结晶（溶解的固体）和色谱（有颜色的物质）"],["微粒模型","The Particle Model",0,42,11,12,38,-23.4,131.7,171.5,"用微粒模型解释固体、液体和气体的性质——包括排列、运动和间距上的差别——并用这个模型解释密度、可压缩性以及水的反常膨胀"],["元素周期表","The Periodic Table",0,42,11,12,26,3.7,161.3,97.9,"描述元素周期表按周期和族的组织方式，说明门捷列夫的贡献，并用周期表识别金属和非金属、预测活泼性的规律"],["酸的反应与盐","Acid Reactions & Salts",0,42,12,13,105,-12.2,217.4,70.2,"描述酸跟金属、碱（中和反应）以及金属氧化物/氢氧化物的反应并写出文字表达式，指出每种情况下生成的盐"],["酸、碱与 pH","Acids, Alkalis & pH",0,42,12,13,81,-14.2,215,46.4,"从氢离子浓度的角度定义酸和碱，描述 pH 值的范围（0—14），并说明怎样用指示剂判断和测量酸碱性"],["地球大气与二氧化碳","Earth's Atmosphere & CO2",0,42,12,14,208,4.5,243.2,9.2,"描述地球大气的组成（主要是氮气和氧气，还有少量二氧化碳和其他气体），说明人类活动怎样使二氧化碳增加，并描述由此对全球气候造成的影响"],["有限资源与回收利用","Finite Resources & Recycling",0,42,12,14,233,5.7,246.2,43.1,"说明许多原材料（金属、化石燃料、矿物）都是有限的资源，描述开采带来的环境代价，并评估回收利用和循环经济的好处"],["放热反应与吸热反应","Reactions That Release or Absorb Heat",0,42,12,13,82,9.2,209,111.6,"区分放热反应（放出能量，温度升高）和吸热反应（吸收能量，温度下降），并举出日常和工业中的例子"],["金属活动性顺序","The Reactivity Series",0,42,12,14,51,-2,241.6,87.3,"把常见金属按金属活动性顺序排列，说明活动性强的金属怎样把活动性弱的金属置换出来；描述工业上怎样用碳从金属氧化物中提炼金属"],["岩石循环","The Rock Cycle",0,42,12,14,59,-19.2,188.4,134.8,"说明岩石循环：岩浆怎样形成岩浆岩，沉积物受压形成沉积岩，高温高压形成变质岩，以及在漫长的地质年代里各类岩石怎样相互转化"],["化学反应的类型","Types of Chemical Reaction",0,42,12,13,53,-12.1,217.6,115,"认识并描述四类化学反应：燃烧（在氧气中烧）、氧化（得到氧）、热分解（受热分解）和置换（活动性强的金属取代活动性弱的金属）"],["陶瓷、聚合物与复合材料","Ceramics, Polymers & Composites",0,42,13,14,19,9.8,266.2,55.6,"描述陶瓷（硬、脆、耐热）、聚合物（柔韧、轻、性能多变）和复合材料（把各组分材料的性能结合起来）的性质与用途，并各举出现实中的例子"],["海岸与沙滩","Coasts & Beaches",0,43,5,7,64,-72.8,-162.4,-59.4,"知道什么是海岸或沙滩——陆地和海洋相接的地方——以及不同的海岸可能是沙质的、岩石的或泥质的，各自生长着不同的动植物"],["海洋动物的多样","Ocean Animal Variety",0,43,5,7,124,-60.3,-134.3,-121.6,"认识到海洋里生活着种类惊人的动物——从小小的海马、色彩鲜艳的小丑鱼，到庞大的鲸和鲨鱼——海洋动物的形状和大小千差万别"],["海洋食物链","Ocean Food Chains",0,43,5,7,100,-36.9,-158.3,-123.2,"描述一条简单的海洋食物链：微小的植物（浮游植物）被小动物吃掉，小动物被大鱼吃掉，大鱼又被鲨鱼这样的顶级捕食者吃掉——说明所有海洋生物都要靠别的生物获得食物"],["潮池栖息地","Rock Pool Habitats",0,43,5,7,27,-53.5,-168.4,-102.1,"把潮池当作小小的海洋栖息地来探索，在那里能找到螃蟹、海葵、海星和小鱼，并明白这些生物已经适应了拍打的海浪和不断变化的水位"],["鲸与海豚是哺乳动物","Whales & Dolphins Are Mammals",0,43,5,7,83,-34.2,-159.9,-97.6,"知道鲸和海豚是哺乳动物，不是鱼——它们呼吸空气，是温血动物，用奶喂养幼崽——尽管它们生活在海里"],["海洋是什么","What Is the Ocean?",0,43,5,7,141,-104.9,-124.6,-95.3,"知道海洋是巨大的咸水水体，覆盖了地球表面的大部分，海洋里生活着数量极其庞大的生物"],["海洋动物需要什么","What Ocean Animals Need",0,43,5,7,135,-74.8,-147.3,-126.5,"明白海洋动物和陆地动物一样，需要食物、藏身处和合适的环境条件才能生存，而海洋的不同区域满足着不同动物的需要"],["海洋动物的分类","Classifying Ocean Animals",0,43,7,9,83,-28.5,-71.7,-114.5,"把海洋动物分成几个大类：鱼类（用鳃呼吸，有鳞片）、海洋哺乳动物（呼吸空气，温血，用奶喂养幼崽）和无脊椎动物（没有脊椎——水母、章鱼、螃蟹、海星）"],["珊瑚礁","Coral Reefs",0,43,7,9,16,-79,-72.3,-118.1,"知道珊瑚礁是由叫珊瑚虫的微小动物建造的，礁上生活的物种比几乎任何其他海洋栖息地都多，它们有时被称为「海洋中的热带雨林」"],["海洋动物的适应","Ocean Animal Adaptations",0,43,7,9,52,-83.6,-46.1,-134.1,"明白海洋动物有适应环境的特殊本领：流线型的身体便于快速游动，保护色用来躲避捕食者，厚厚的脂肪层在冷水里保暖，触手或吸盘用来捕捉猎物"],["海洋的深度分层","Ocean Depth Zones",0,43,7,9,62,-75.1,-45.3,-108.9,"明白海洋按深度和光线分成不同的水层：靠近水面、大多数生物生活的有光层，光线渐暗的弱光层，以及一片漆黑的无光层"],["海洋食物网","Ocean Food Webs",0,43,7,9,75,-37.9,-39.2,-119.8,"理解海洋食物网：许多条食物链交织在一起，能量从浮游植物（生产者）流向浮游动物、小鱼和大型捕食者，而少了其中一个物种，整张网都会受影响"],["五大洋","The Five Oceans",0,43,7,9,60,-121.6,-38.5,-78,"在世界地图上说出并找到五大洋——太平洋（最大）、大西洋、印度洋、南冰洋和北冰洋（最小最冷）——并明白它们彼此相连，是一个全球性的大洋"],["海底地形","The Ocean Floor",0,43,7,9,18,-89.8,-39.7,-93.9,"知道海底并不平坦——那里有高山、峡谷，还有地球上最深的海沟——最深处是马里亚纳海沟，比珠穆朗玛峰的高度还要深"],["潮汐、海浪与洋流","Tides, Waves & Currents",0,43,7,9,49,-97,-60.8,-58.7,"知道海洋有潮汐（水位一天涨落两次，主要由月球引力引起）、海浪（由风引起）和洋流（在海洋中流动的「河流」，把热量和养分带到世界各处）"],["深海生物","Deep-Sea Creatures",0,43,9,11,21,-63.3,56.1,-107.9,"探索深海里的生命：会自己发光的动物（生物发光）、适应了巨大压力和完全黑暗的生物，以及没有阳光也生机勃勃的热液喷口"],["海洋探索","Exploring the Ocean",0,43,9,11,11,-62,80.3,-79.5,"知道海洋学家和海洋生物学家用潜水器、遥控潜水器（ROV）、卫星和潜水来研究海洋，而海洋的大部分仍未被探索——我们对月球表面的了解比对深海海底还多"],["海洋动物的迁徙","Ocean Animal Migrations",0,43,9,11,37,-102.8,29.1,-131.8,"知道许多海洋动物会进行了不起的迁徙——座头鲸在觅食地和繁殖地之间往返数千公里，海龟会回到自己孵化出来的那片沙滩产卵——并明白这些旅程和季节性的食物供应及繁殖有关"],["海洋生态系统","Ocean Ecosystems",0,43,9,11,89,-47.7,63.9,-93.6,"把海洋生态系统理解成一个彼此关联的系统：生物（生产者、消费者、分解者）和非生物因素（温度、盐度、光照、洋流）相互作用，其中一部分发生变化，整个系统都会受影响"],["海洋污染及其危害","Ocean Pollution & Harm",0,43,9,11,56,-41.5,85.8,-94.1,"认识人类伤害海洋的方式——塑料污染、过度捕捞、石油泄漏，以及二氧化碳造成的海洋酸化——并明白大部分海洋污染来自陆地上的活动，不只是船只"],["海洋与气候","Oceans & Climate",0,43,9,11,105,-105.7,60.3,-45.2,"理解海洋和气候的联系：海洋吸收热量和二氧化碳，通过蒸发驱动天气变化，洋流把热量输送到全球各地——海洋是地球的气候引擎"],["保护海洋","Protecting the Ocean",0,43,9,11,74,-76,68.8,-107.9,"理解人们怎样保护海洋：海洋保护区限制捕捞和污染，可持续渔业防止过度捕捞，海滩清洁减少塑料，国际协定则致力于减少造成海洋酸化的碳排放"],["没有阳光的深海生命","Deep-Sea Life Without Sunlight",0,43,11,13,18,-36.9,167.6,-79.9,"对比光合作用（能量来自阳光）和化能合成（能量来自氧化硫化氢等化学物质）；描述热液喷口群落：化能自养细菌构成食物网的基础，在没有阳光的情况下支撑起管虫、巨型蛤和喷口蟹；探讨深海生命对地球生命起源的启示；说明 NASA 为什么把海底喷口作为研究对象，用来类比木卫二和土卫二上热液活动周围可能存在的生命"],["洋流与全球热量输送","Ocean Currents and Global Heat",0,43,11,12,66,-63.5,150.8,-43.7,"说明温盐环流（全球传送带）由温度和盐度差异驱动，密度大的海水因此下沉；描述大西洋经向翻转环流（AMOC）怎样把热带的热量输送到欧洲；说明海洋吸收了人类排放中超过 90% 的多余热量和约 25% 的二氧化碳；探讨如果这一环流减弱，北欧的气候会怎样"],["珊瑚白化与海洋酸化","Coral Bleaching & Acidification",0,43,12,13,68,-48.1,198,-51,"说明珊瑚虫和进行光合作用的虫黄藻之间的互利共生；描述热胁迫怎样引起白化（珊瑚把虫黄藻排出体外，变成白色）；解释海洋酸化的化学过程：二氧化碳溶于海水生成碳酸，使 pH 下降，溶解碳酸钙骨骼；把珊瑚礁的消失和约 25% 的海洋物种失去栖息地联系起来；评价当前的珊瑚礁修复工作"],["顶级捕食者消失的连锁影响","Predator Loss and Ecosystem Effects",0,43,12,14,47,-47.7,225.2,-66.3,"量化能量在各营养级之间的传递效率（约 10% 法则）；说明营养级联：移除一个顶级捕食者会引发一连串生态系统变化（海獭减少 → 海胆暴发 → 海藻森林崩溃）；解释什么是「食物网下行捕捞」；评价海洋再野化的证据——重新引入鲨鱼、鲸群恢复带动养分循环；理解为什么需要基于生态系统的渔业管理"],["深海探测技术","Deep-Ocean Exploration Technology",0,43,13,14,48,-48.7,249.1,-57.5,"说明载人深潜器（阿尔文号、深海挑战者号）和遥控潜水器（ROV）怎样让人得以探索深海；描述用声呐进行海底声学测绘，以及为什么只有约 25% 的海底完成了高分辨率测绘；探讨为什么探索深海比探索月球表面更难（压力、低温、黑暗、通信困难）；概览以太阳系中的海洋星球为目标的天体生物学任务"],["动物的身体分部","Animal Body Groups",0,44,5,7,59,-20.6,-153.3,-127.9,"描述并比较鱼类、两栖类、爬行类、鸟类、哺乳类等各类常见动物的身体外部结构"],["身体部位与感官","Body Parts & Senses",0,44,5,6,38,-77.8,-173.1,-97.9,"认识、说出并指出人体的基本部位，并把每个部位和对应的感觉联系起来"],["常见植物与树木","Common Plants & Trees",0,44,5,6,190,38.6,-204.6,-73.6,"认识并说出常见的野生植物和园艺植物，包括落叶树和常绿树"],["食草、食肉与杂食动物","Herbivores, Carnivores & Omnivores",0,44,5,6,130,12.4,-174.1,-96.1,"把常见动物分成食肉动物（吃肉）、食草动物（吃植物）和杂食动物（两者都吃）"],["生物词汇","Living Things Vocabulary",0,44,5,7,185,32.7,-171,-49.5,"说出并使用描述“什么算生物”的词汇——活的、死的、从未活过的、运动、营养、生长、繁殖、应激性、排泄——并用这些词给物体分类，解释植物和动物为什么算生物"],["说出常见动物的名字","Naming Common Animals",0,44,5,6,220,1,-184.5,-112.4,"认识并说出鱼类、两栖类、爬行类、鸟类、哺乳类这几大类中的常见动物"],["植物的各部分","Parts of a Plant",0,44,5,6,62,50.6,-192.3,-63.9,"认识并描述常见开花植物（根、茎、叶、花）和树木（根、树干、树枝、树叶）的基本结构"],["生物需要什么","What Living Things Need",0,44,5,7,171,30.3,-162.5,-78.2,"知道植物和动物（包括人）生存需要什么：水、食物、空气和合适的环境条件"],["动物的生长阶段","Animal Life Stages",0,44,6,7,59,15.4,-103.8,-95.8,"知道动物（包括人）会产生后代，后代长大成为成体，并能说出动物基本的生长阶段"],["后代像亲代","Offspring resemble parents",0,44,6,11,12,-14.6,-41.2,-139.3,"观察到幼小的植物和动物像亲代但并不完全一样，认识遗传带来的相似和个体之间的差异"],["种子与植物生长","Seeds & Plant Growth",0,44,6,7,57,49.1,-131.3,- 0.3,-28.2,"说明酒精、烟草和违禁品等消遣性药物对行为、健康和身体各系统的影响，并区分抑制剂、兴奋剂和致幻剂"],["北极与南极的区别","Arctic vs Antarctic",0,45,5,7,59,-95.2,-153.1,-179.5,"知道北极（北极点）和南极（南极点）非常不同——北极是被陆地环绕的结冰海洋，那里有人居住，也有北极熊；南极是被海洋环绕的巨大冰封大陆，那里有企鹅，但没有人长期定居"],["勇敢的极地探险家","Brave Polar Explorers",0,45,5,7,7,-74.9,-154.4,-160,"知道极地探险家的简单故事——罗伯特·福尔肯·斯科特和罗尔德·阿蒙森为到达南极点展开竞赛；欧内斯特·沙克尔顿的“坚忍号”被冰挤碎，但他把所有队员安全带了回来——并明白极地探险需要非凡的勇气和毅力"],["冰与雪","Ice & Snow",0,45,5,7,12,-100.2,-155.2,-124.8,"知道水可以是固体（冰和雪），也可以是液体；雪是由细小的冰晶组成的；冰山是漂在海上的大块冰，大部分体积藏在水面以下；冰能浮起来，是因为它比液态水轻"],["极昼与极夜","Midnight Sun & Polar Night",0,45,5,7,4,-85.5,-162.6,-114.8,"知道两极的白天和黑夜都很极端——夏天太阳不会完全落下（极昼），冬天太阳一连几个月不升起（极夜）——这和我们在家里每天都有白天和黑夜很不一样"],["企鹅","Penguins",0,45,5,7,57,-77.2,-165,-176,"知道企鹅的主要特点——它们生活在南极和南半球，不会飞但很会游泳；帝企鹅个头最大，冬天会挤在一起取暖；企鹅爸爸妈妈会轮流把蛋放在脚上，在严寒中保暖"],["极地动物","Polar Animals",0,45,5,7,59,-91.6,-134.3,-192.8,"知道除了企鹅和北极熊以外的其他极地动物——在冰下游泳的海豹、长着长牙的海象、冬天变白的北极狐、雪鸮、有独角兽般长牙的独角鲸，还有迁徙到极地海域觅食的鲸——并知道这些动物都有特殊的本领来熬过极端寒冷"],["北极熊","Polar Bears",0,45,5,7,57,-61.9,-156.2,-185.7,"知道北极熊的主要特点——它们只生活在北极（不在南极），有厚厚的白色皮毛和一层脂肪来保暖，很会游泳，会守在海冰的洞口捕猎海豹"],["两极在哪里","Where Are the Poles?",0,45,5,7,152,-74,-173.9,-147,"知道地球有北极点和南极点——地球上最冷的两个地方——并能在地球仪上找到它们，明白它们在地球的最上端和最下端，离赤道最远"],["对严寒的适应","Cold-Weather Adaptations",0,45,7,9,8,-65.9,-68.9,-194,"理解极地动物如何适应极端寒冷——厚厚的脂肪层给海豹和鲸保温，中空的毛发能锁住空气为北极熊保暖，企鹅鳍状肢里的逆流热交换减少热量散失，北极狐长出厚厚的白色冬毛，既保暖又能伪装，还有些动物靠迁徙躲开最难熬的月份"],["北极与南极的比较","Comparing Arctic & Antarctic",0,45,7,9,19,-105.9,-44.8,-184.6,"详细比较北极和南极——北极是覆盖着浮动海冰的海洋，四周环绕着陆地（加拿大、俄罗斯、格陵兰、斯堪的纳维亚）；南极洲则是一块比欧洲还大的大陆，埋在最厚可达4公里的冰层之下。北极熊、北极狐和海象只生活在北极，而企鹅、豹形海豹和信天翁只见于南极"],["冰与物态变化","Ice & States of Matter",0,45,7,9,12,-130.4,-40.4,-117.6,"了解冰的不同形态和物质的状态——海冰是海水结冰形成的（含盐，相对较薄），冰川冰是积雪经过几百年压实形成的（是淡水，很厚），冰山则是从冰川上崩落、漂在海里的；知道水有固态（冰）、液态（水）和气态（水蒸气），也知道盐会降低水的凝固点"],["因纽特人与萨米人","Inuit & Sami Peoples",0,45,7,9,10,-77.6,-41.1,-161.1,"知道原住民已经在北极生活了几千年——因纽特人分布在加拿大、阿拉斯加和格陵兰，萨米人在斯堪的纳维亚北部——他们对环境有非凡的了解，用狗拉雪橇和皮划艇出行，穿兽皮衣服保暖，搭冰屋作临时住所，并对赖以生存的动物和土地怀有深深的敬意"],["极地食物链","Polar Food Chains",0,45,7,9,14,-83.5,-55,-184.3,"了解极地食物链——在南极，浮游植物被磷虾吃掉，磷虾被鱼和企鹅吃掉，企鹅又被豹形海豹和虎鲸吃掉；在北极，冰下的藻类养活浮游动物，浮游动物养活鱼，鱼养活海豹，海豹养活北极熊——并知道磷虾、浮游生物这样的微小生物是全部极地生命的基础"],["北极苔原","The Arctic Tundra",0,45,7,9,12,-86.8,-28.5,-176.2,"知道北极苔原是什么——一片辽阔无树的土地，地表下面就是永久冻土（常年结冻的土层），夏天有很短的生长季，苔藓、地衣和坚韧的野草会在这时迸发生机；这里是驯鹿、麝牛、旅鼠和雪鸮的家"],["南极点竞赛","The Race to the South Pole",0,45,7,9,14,-88.4,-43.3,-197.5,"详细了解南极点竞赛的故事——挪威人罗尔德·阿蒙森和英国人罗伯特·福尔肯·斯科特都在1911年出发，阿蒙森靠狗拉雪橇和周密的计划在12月14日率先抵达；斯科特用人力拉雪橇，晚到34天，返程途中和队员一起不幸遇难；也了解沙克尔顿1914年的“坚忍号”探险，船被冰困住并挤碎，沙克尔顿驾小艇远航南乔治亚岛，救出了全体船员"],["极地季节为何如此极端","Why Polar Seasons Are Extreme",0,45,7,9,7,-116.9,-60.6,-112.6,"理解两极的季节为什么如此极端——地球的地轴倾斜约23.5°，因此在绕太阳公转时，每个极地有半年朝向太阳（持续白昼，夏天较暖），有半年背对太阳（持续黑暗，冬天酷寒）；这种倾斜还带来海冰冬季扩张、夏季退缩的年度循环，并触发动物迁徙和繁殖等行为"],["《南极条约》与科考","Antarctic Treaty & Research",0,45,9,11,14,-88.6,49.3,-198.1,"知道南极洲由《南极条约》管理（1959年签署，1961年生效）——条约把南极洲留作和平用途和科学研究，禁止军事活动和采矿，已有50多个国家签署；理解各国的科考站在这里研究气候、天文、生物和地质，南极洲是地球上最接近“属于科学而不属于政治”的一块大陆"],["两极的气候变化","Climate Change at the Poles",0,45,9,11,107,-112,64.8,-130.4,"理解气候变化如何影响极地——北极海冰急剧减少（1979年以来每十年减少约13%），格陵兰和南极冰盖不断损失质量，推高海平面；永久冻土正在融化，释放出甲烷（一种强效温室气体）；这些变化会形成正反馈：融化带来更多升温，升温又带来更多融化"],["地球上的固态水","Earth's Frozen Water",0,45,9,11,79,-131,63.1,-57.9,"理解冰冻圈及它在地球水系统中的作用——冰冻圈指地球上所有的固态水（冰盖、冰川、海冰、永久冻土、积雪）；极地冰盖存有地球约69%的淡水；如果极地的冰全部融化，海平面会上升超过65米；水循环通过蒸发、降水和融水入海，把极地的冰和全球系统连在一起"],["冰川与冰盖","Glaciers & Ice Sheets",0,45,9,11,8,-124.6,58.4,-105.5,"理解冰川和冰盖如何形成、如何活动——积雪经过几百年压实成致密的冰，冰川在自身重量下缓慢向下流动，刻出U形谷并堆积冰碛；格陵兰和南极冰盖所含的冰足以让海平面上升超过65米；从冰盖钻取的冰芯里封着气泡，能揭示地球80万年来的气候历史"],["极地气候带","Polar Climate Zone",0,45,9,11,42,-139.4,35.4,-104.8,"理解极地属于极地气候带——地球五大气候带（热带、干旱带、温带、大陆性、极地）之一——特点是即使夏天气温也很少超过10℃，降水很少（极地荒漠的降水比撒哈拉还少），风很大；知道纬度是决定气候带的关键因素，极地位于南北纬60°以上"],["极地保护与未来","Polar Conservation & Future",0,45,9,11,112,-77.1,61.9,-165,"理解极地面临的保护难题——南大洋的海洋保护区旨在保护南极生态系统；随着冰层退缩，北极各国就北方航道和资源的主权争执不下；原住民为土地权利和在环境决策中的发言权而抗争；国际合作（《巴黎协定》《南极条约》）不可或缺，但在经济压力不断增大的情况下越来越难维持"],["极地生态系统的比较","Polar Ecosystems Compared",0,45,9,11,12,-75,34.5,-187,"比较北极和南极的生态系统——北极既有陆地（苔原）生态系统，也有海洋生态系统，能养活大型陆生哺乳动物和原住民社群；南极几乎完全以海洋为基础，陆地上几乎没有植物和哺乳动物；两地的食物链都很短、很集中，以浮游植物和磷虾为基础；两地受气候变化和人类活动的影响都格外严重"],["极地探索的今昔","Polar Exploration Then & Now",0,45,9,11,12,-93.8,51.8,-181.9,"比较历史上的极地探险和今天的极地科学——英雄时代（1897—1922）靠船只、狗和人的耐力，伤亡很多；今天的极地科学家使用GPS、卫星、破冰船、有暖气的科考站和飞机；理解现在的挑战包括研究气候变化数据，而且极地科学如今有来自各国的多元团队，包括冰川学家利兹·托马斯、海洋生物学家西尔维娅·厄尔这样的女科学家"],["极地海洋与全球气候","Polar Oceans and World Climate",0,45,9,11,75,-132.3,43.5,-124.8,"理解极地海洋如何与全球气候系统相连——寒冷、密度大的极地海水下沉，驱动温盐环流（一条全球洋流的传送带）；海冰把阳光反射回太空（反照率效应），帮助调节地球温度；南极周围的南大洋因为上升流带来养分，是地球上生产力最高的海洋生态系统之一"],["来自雨林的日常食物","Everyday Foods from Rainforests",0,46,5,7,3,-134.3,-141.8,-89.8,"知道很多日常食物来自雨林——巧克力是用可可豆做成的，香蕉长在热带森林里，咖啡果在林荫下成熟，巴西坚果从高大的树上掉下来——把我们的日常生活和远方的森林联系起来"],["雨林中的原住民","Indigenous Rainforest Peoples",0,46,5,7,5,-132.1,-159.4,-54.6,"知道亚诺马米人等原住民已经在雨林里生活了几千年，用森林里的材料盖房子，靠打猎、捕鱼和采集找食物，对森林和其中的动植物了解得非常透彻"],["走进雨林","Inside a Rainforest",0,46,5,7,1,-95.6,-172.6,-56.9,"描述身处雨林中是什么感觉——又热又黏（潮湿），地面很暗，因为树冠挡住了光线；到处是动物的叫声和昆虫的嗡嗡声；雨水和凝结的水珠不停往下滴"],["雨林动物","Rainforest Animals",0,46,5,7,116,-52,-138,-98.4,"说出并认识雨林中的标志性动物——美洲豹、巨嘴鸟、树懒、箭毒蛙、吼猴、金刚鹦鹉和蝴蝶——并知道它们各自生活在雨林的哪一层"],["雨林昆虫","Rainforest Insects",0,46,5,7,5,-25.9,-174.3,-69.7,"知道雨林里住着数百万种昆虫——会“种”真菌的切叶蚁、巨大的甲虫、宝石色的蝴蝶、大蜘蛛和竹节虫——并知道昆虫是雨林中数量最多的动物"],["雨林的分层","Rainforest Layers",0,46,5,7,122,-81,-142.5,-87.5,"知道雨林从地面到天空分为四层——林地层（阴暗潮湿，满是腐烂的落叶）、林下层（阴影里的小树和灌木）、树冠层（树顶组成的厚厚屋顶，大多数动物住在这里）和露生层（最高的树穿出树冠，伸进明亮的阳光里）"],["雨林植物","Rainforest Plants",0,46,5,7,56,-71.7,-132.2,-71.4,"知道雨林里的植物种类极其丰富——高耸的木棉树和巴西坚果树、叫作藤本的攀缘藤蔓、长在树枝上的鲜艳兰花、巨大的睡莲，还有把雨水导流下来的大叶子"],["雨林是什么","What Is a Rainforest?",0,46,5,7,148,-127,-161.5,-86.6,"知道雨林是靠近赤道的炎热多雨地区里茂密高大的森林，那里几乎天天下雨，形成温暖潮湿的环境，动植物在其中蓬勃生长"],["雨林分布在哪里","Where Rainforests Are",0,46,5,7,15,-156,-147.2,-82.3,"知道雨林分布在地球中部的一条带状区域——南美洲（亚马逊）、中非（刚果）和东南亚——除了南极洲和欧洲，各个大洲都有雨林"],["雨林生物的分类","Classifying Rainforest Organisms",0,46,7,9,30,-63.2,-56.9,-88.9,"把雨林生物分成几大类——哺乳动物（美洲豹、猴、蝙蝠）、鸟类（巨嘴鸟、金刚鹦鹉、蜂鸟）、爬行动物（蛇、蜥蜴、凯门鳄）、两栖动物（树蛙、箭毒蛙）、昆虫（蝴蝶、蚂蚁、甲虫）和植物（树木、附生植物、蕨类）——依据可以观察到的特征来分类"],["原住民的生态知识","Indigenous Ecological Knowledge",0,46,7,9,5,-137.2,-58.5,-43.8,"理解雨林原住民在几千年里积累了深厚的生态知识——把植物用作药材、食物和建筑材料，采用轮耕这样可持续的耕作方式，对动物行为和森林生态的了解，现代科学才刚刚开始体会到它的价值"],["雨林动物的生存本领","Rainforest Animal Survival Tricks",0,46,7,9,4,-66.3,-75.7,-79.8,"知道雨林动物如何适应环境——保护色帮助叶䗛和树蛙藏起来，鲜艳的警戒色表明箭毒蛙有毒，卷尾让猴子抓住树枝，巨嘴鸟的大喙帮它够到远处的果实，很多动物在夜间活动以避开白天的炎热"],["雨林食物网","Rainforest Food Webs",0,46,7,9,33,-35.2,-56.1,-87.6,"理解能量和养分如何在雨林食物网中流动——从植物（生产者）到食草动物（初级消费者），再到捕食者（次级消费者）——并知道真菌、昆虫这些分解者在林地层分解死去的有机物，把养分送回土壤，供植物再次利用"],["雨林植物的适应","Rainforest Plant Adaptations",0,46,7,9,5,-60.5,-66.6,-66.2,"知道雨林植物如何适应环境——滴水叶尖让水迅速流走，防止叶片腐烂；板状根向四周伸展，在贫瘠的薄土上支撑起高大的树；附生植物（如兰花和凤梨科植物）长在树枝上，不需要土壤也能获得阳光；藤本植物沿树干攀爬，够到树冠层"],["雨林的水循环","Rainforest Water Cycle",0,46,7,9,30,-146.3,-48,-27.3,"理解雨林中的水循环如何运转——树木用根吸水，再通过叶片释放出去（蒸腾作用），这些水汽在树冠上方形成云，云再把雨降回森林——形成一个自我维持的循环，雨林的降雨大部分是自己造出来的"],["亚马逊雨林","The Amazon Rainforest",0,46,7,9,21,-160.2,-52.8,-94.3,"知道亚马逊是地球上最大的雨林——横跨南美洲九个国家，拥有世界上水量最大的河流，据估计地球上10%的物种生活在这里，包括4万种植物、1300种鸟和3000种鱼"],["热带雨林气候","Tropical Rainforest Climate",0,46,7,9,23,-156.9,-65.2,-65.5,"理解雨林属于热带气候——常年炎热（25—30℃），年降水量超过2000毫米——这种高温多雨的组合为植物快速生长和惊人的生物多样性创造了理想条件"],["森林砍伐的成因与规模","Deforestation Causes & Scale",0,46,9,11,55,-146.7,57.3,-77.5,"理解雨林被砍伐的原因和规模——养牛业（亚马逊最大的推手）、大豆和棕榈油种植园、伐木取材以及采矿——并知道全球每年约有1000万公顷森林消失，给生物多样性、气候和原住民社群带来严重后果"],["贫瘠土壤中的养分循环","Nutrient Cycling in Thin Soil",0,46,9,11,8,-26.9,45,-81.3,"理解雨林养分循环的矛盾之处——尽管草木繁茂，雨林的土壤通常很薄、养分很少，因为大部分养分锁在活的生物体内，而不在土里；温暖潮湿的条件下分解很快，死去的有机物释放出的养分立刻被植物的根和真菌吸收，形成一个快速的闭环循环"],["雨林的生物多样性","Rainforest Biodiversity",0,46,9,11,26,-112.6,45.8,-90.7,"理解雨林是生物多样性热点地区——只占地球陆地面积的6%，却拥有超过50%的已知动植物物种——这种惊人的丰富度让雨林无可替代，也使它成为保护工作的重点"],["雨林保护","Rainforest Conservation",0,46,9,11,55,-172.5,61,-40.7,"知道保护雨林的主要办法——设立保护区和国家公园，开展重新造林和野化项目，推行可持续认证（雨林联盟、FSC），承认原住民的土地权利（这是最有效的森林保护方式），以及像REDD+这样付钱让各国保住森林的国际协议"],["雨林的未来与取舍","Rainforest Futures & Trade-Offs",0,46,9,11,107,-163.5,72.3,-52,"理解雨林的未来取决于如何平衡各方需求——当地社区的经济发展、原住民对祖辈土地的权利、全球生物多样性保护和气候稳定——这里没有简单的答案，需要各国政府、企业、科学家、原住民领袖和全世界的消费者共同合作"],["日常生活中的雨林产物","Rainforest Products in Daily Life",0,46,9,11,52,-134.1,36.9,-83.1,"理解雨林产物如何通过全球供应链进入日常生活——棕榈油出现在零食、肥皂和化妆品里；大豆喂养着世界各地的牲畜；可可做成巧克力；橡胶用在轮胎和手套上；木材做成家具；很多药物也源自雨林植物——消费者的选择既可能推动破坏，也可能推动可持续的做法"],["雨林与全球气候","Rainforests & Global Climate",0,46,9,11,103,-151,55.4,-42.8,"理解雨林和全球气候的关系——雨林通过光合作用吸收二氧化碳、释放氧气，在生物量中储存大量的碳，并通过蒸腾作用产生降雨；森林被烧毁或砍伐时，储存的碳会以二氧化碳的形式释放出来，加剧气候变化，扰乱区域降雨规律"],["温带雨林","Temperate Rainforests",0,46,9,11,34,-128.9,35.6,-51.5,"知道并非所有雨林都在热带——温带雨林分布在较凉爽湿润的地区，如北美太平洋西北地区、苏格兰西部和威尔士、智利南部和新西兰——它们有相似的特点（降雨多、树上挂满苔藓、树冠茂密），但物种不同，包括古老的橡树、巨杉和树蕨"],["提出科学问题","Asking scientific questions",0,47,5,8,57,21.2,-150.8,91.5,"提出简单的科学问题，并知道这些问题可以用不同方式来回答，包括观察、测试和查资料"],["比较不同的设计方案","Comparing Design Solutions",0,47,5,8,36,-32.6,-125.8,115.2,"分析对两个为解决同一问题而设计的物体所做的测试数据，比较两种设计各自的优点和不足"],["用草图建模","Modelling with Sketches",0,47,5,8,33,-24.3,-146.3,100.8,"做出简单的草图、图画或实物模型，说明一个物体的形状如何帮助它实现所需的功能，从而解决给定的问题"],["用简单器材观察","Observing with simple equipment",0,47,5,7,55,3.6,-162.8,109.4,"用放大镜等简单器材仔细观察，并根据观察来描述、比较和辨认事物"],["记录数据","Recording Data",0,47,5,7,49,-23.4,-157.4,118.3,"用表格、计数表和图画等简单方法收集和记录数据，帮助回答问题"],["简单的测试与实验","Simple tests and experiments",0,47,5,7,51,-2.9,-160.6,127.8,"做简单的测试，用观察和想法为问题给出可能的答案"],["依据证据改变看法","Changing Your Mind with Evidence",0,47,6,8,37,35.7,-103.2,90.1,"当证据不支持你的预测时，愿意改变想法——一个出乎意料的结果，比一个印证你原有想法的结果更有价值"],["观察与解释的区别","Observation vs Interpretation",0,47,6,7,56,36.9,-139,86.9,"注意区分你观察到了什么和你认为它意味着什么——“冰化了”是观察，“冰是因为受热才化的”是解释"],["生物的分类","Classifying living things",0,47,7,9,57,-8.9,-50.1,94,"用多种方式收集、记录、分类和呈现数据，包括表格、条形统计图、标注图和检索表"],["会不会有别的解释","Could there be another explanation?",0,47,7,9,63,47.7,-42.2,80.9,"面对任何结果都要问一句：会不会有别的解释？——最先想到的、说得通的解释未必就是对的，好的科学家会主动去找别的可能"],["从证据得出结论","Drawing conclusions from evidence",0,47,7,9,103,40.3,-44.7,101.6,"用口头和书面的方式报告探究的发现，得出简单的结论，作出预测，并提出改进建议"],["公平实验","Fair testing",0,47,7,9,40,16.8,-50.6,121.1,"开展简单的实践探究、对比测试和公平实验，明白每次只改变一个变量的重要性"],["准确测量","Measuring accurately",0,47,7,9,47,-6.8,-62.2,108.5,"系统而细致地观察，用标准单位和包括温度计、数据采集器在内的器材进行准确的测量"],["用证据回答问题","Using evidence to answer questions",0,47,7,9,116,29.6,-30.7,83.7,"找出与科学概念有关的异同或变化，用直白的科学证据回答问题或支持结论"],["比较可行方案","Comparing Possible Solutions",0,47,8,11,36,-41.8,34.4,112.2," ystem",0,48,5,7,51,67.1,-144.1,-108.5,"知道除了地球还有别的行星，围绕太阳运转的这一组行星叫太阳系——太空则是地球天空之外那片广阔的区域"],["认星座","Spotting Constellations",0,48,5,7,10,39.3,-143.9,-92.8,"认识夜空中几个由星星组成的图案（星座），先从北斗七星开始，并知道可以借助北斗七星找到北极星"],["太阳、月亮与星星","Sun, Moon & Stars",0,48,5,7,53,44.9,-160.7,-111.7,"认出太阳、月亮和星星都是天上的物体，并说出基本区别：太阳在白天发光发热，星星是夜里细小的光点，月亮白天和夜里都可能看到"],["宇航员做什么","What Astronauts Do",0,48,5,7,14,79.5,-130.7,-82.6,"知道宇航员是乘火箭去太空的人，人类曾在月球上行走（阿波罗任务），今天的宇航员在国际空间站上生活和工作"],["小行星、彗星与矮行星","Asteroids, Comets & Dwarf Planets",0,48,7,9,12,44.8,-55.3,-71.2,"认出太阳系里行星之外的其他天体：小行星（多分布在火星与木星之间的岩石天体）、彗星（靠近太阳时拖出尾巴的冰质天体），以及流星体／流星／陨石（进入地球大气层的太空石块）"],["地球的自转与公转","Earth's Spin & Orbit",0,48,7,9,26,9.1,-23.4,-116.1,"明白地球有两种运动：绕地轴自转，每24小时一圈，形成昼夜；绕太阳公转，每365天一圈，就是一年"],["望远镜的原理","How Telescopes Work",0,48,7,9,11,28.6,-52.5,-90.3,"知道望远镜是帮我们看清太空中遥远天体的仪器，哈勃、詹姆斯·韦布这样的空间望远镜在地球大气层之上的轨道上运行，能更清楚地观测宇宙"],["行星的特征","Planet Features",0,48,7,9,16,84,-50.2,-99.1,"说出每颗行星的一个主要特征：水星最小、离太阳最近，金星最热，火星因铁锈而呈红色，木星最大且有大红斑，土星有光环，天王星侧躺着转，海王星最远也非常冷"],["太空机器人与巡视器","Space Robots & Rovers",0,48,7,9,18,91.9,-57.5,-84,"说说机器人和巡视器如何探索人类难以到达的地方——好奇号、毅力号这样的火星车在火星上行驶，拍照片、采集岩石样本，寻找过去有水的迹象"],["八大行星","The Eight Planets",0,48,7,9,22,75.2,-42.8,-119.4,"按离太阳由近到远说出八大行星（水星、金星、地球、火星、木星、土星、天王星、海王星），知道冥王星是矮行星，并能区分内侧的岩质行星和外侧的气态巨行星"],["月球的轨道","The Moon's Orbit",0,48,7,9,16,13.7,-64,-114.9,"知道月球大约每月绕地球一圈，它自己不发光，只是反射太阳光，它看上去的变化（月相）是因为我们在地球上能看到的受光面多少不同"],["太阳是一颗恒星","The Sun is a star",0,48,7,9,49,53.1,-34.9,-121.2,"知道太阳是一颗恒星——离地球最近的恒星——它位于太阳系的中心，八大行星都绕着它运转"],["人类太空观念的变迁","Changing Ideas About Space",0,48,9,11,15,10.6,59.2,-101,"明白人们对太阳系的认识是逐步改变的：古人认为地球在中心（地心说，托勒密），直到哥白尼提出太阳在中心（日心说），后来又被伽利略用望远镜的观测证实"],["重力把东西往下拉","Gravity Pulls Things Down",0,48,9,11,19,28.3,75.1,-124.2,"把重力理解为把物体拉向地心的力，明白不论站在球面上的哪个位置，“下”都是指朝向地心，重力还让月球绕地球转、行星绕太阳转"],["恒星的一生","Life Cycle of Stars",0,48,9,11,14,43.7,77,-80,"了解恒星一生的基本过程：恒星在气体和尘埃云（星云）中诞生，靠氢聚变发光几百万到几十亿年，最终死亡——大质量恒星以超新星爆发结束，较小的恒星则逐渐变成白矮星"],["太阳系的尺度","Scale of the Solar System",0,48,9,11,14,74.9,54.8,-112.4,"用比例模型、示意图或计算来表示太阳系中天体的相对大小和距离，理解行星之间的距离远远大 y",0,53,5,6,16,-122.1,-175.4,104.8,"提问以了解天气预报的作用，以及人们如何为恶劣天气做准备、如何应对"],["风是什么","What Is Wind?",0,53,5,7,62,-141.9,-149.1,93.6,"知道风是流动的空气，可以很轻柔（微风），也可以很强（大风），风能吹动树叶、风筝、旗子，甚至能推动人"],["云的种类","Cloud Types",0,53,7,9,83,-172.2,-61.4,109.5,"认出三种主要的云——积云（蓬松，好天气）、层云（平铺成层，阴天或毛毛雨）和卷云（高空细丝状）——并明白云是空气中的水汽遇冷凝结成小水滴形成的"],["地形与本地天气","Geography & Local Weather",0,53,7,9,94,-163.8,-57,0.6,"知道世界各地典型的天气很不一样——热带地区全年又热又湿，沙漠非常干燥，极地极为寒冷——而地理条件（离赤道的远近、海拔、离海的远近）会影响当地天气"],["水循环","The Water Cycle",0,53,7,9,92,-156.6,-34.3,96.2,"了解水循环：太阳加热海洋和湖泊里的水，水蒸发成水汽，水汽上升遇冷形成云（凝结），再以雨、雪或冰雹的形式落回地面（降水）——然后循环重新开始"],["雷与闪电","Thunder & Lightning",0,53,7,9,10,-152.9,-54.8,94.3,"知道雷和闪电发生在雷暴天气里：闪电是云中形成的巨大电火花，雷是闪电发出的声音，我们先看到闪电后听到雷声，是因为光比声音传得快"],["使用气象仪器","Using Weather Instruments",0,53,7,9,12,-178.7,-74.8,77.2,"用气象仪器测量并记录天气数据：温度计测气温（℃）、雨量器测降水、风向标测风向、风速计测风速——并长期坚持记天气日记"],["天气预报","Weather Forecasting",0,53,7,9,16,-180.5,-52.3,93.4,"知道气象学家是研究和预报天气的科学家，他们借助卫星、雷达、探空气球和计算机模式工作，天气预报帮助人们安排活动、为危险天气做准备"],["天气与气候的区别","Weather vs Climate",0,53,7,9,85,-157.7,-37.8,32.4,"区分天气和气候：天气是大气此刻或今天的状况（可以一小时一变），气候则是一个地方多年来天气的典型状况"],["风是怎么形成的","What Causes Wind",0,53,7,9,57,-137.8,-32.7,75.5,"明白风是怎么来的：太阳把地表加热得不均匀，暖空气因为轻而上升，较冷的空气涌过来补上——这种空气的流动就是风"],["针对气象灾害的设计","Designing for Weather Hazards",0,53,8,9,40,-119.5,-21.2,137.6,"就一个设计方案的优劣提出主张，这个方案要能减轻洪水、大风破坏或极端气温等气象灾害的影响"],["气候变化入门","Climate Change Basics",0,53,9,11,120,-107,73.7,-23.2,"了解气候变化的基本道理：地球大气会留住一部分太阳的热量（温室效应），燃烧化石燃料增加了额外的温室气体（尤其是二氧化碳），使地球逐渐变暖，而变暖又改变天气规律、融化冰、抬高海平面"],["气候带","Climate Zones",0,53,9,11,75,-139.5,57.1,7.7,"明白地球有不同的气候带——热带（赤道附近又热又湿）、温带（气候温和、四季分明）、寒带（极为寒冷）、干旱带／沙漠（非常干燥）和高山（高海拔寒冷）——每个气候带养育着不同的生态系统和生活方式"],["极端天气事件","Extreme Weather Events",0,53,9,11,26,-142.1,57.4,90.2,"了解极端天气事件——飓风（在温暖洋面上旋转的风暴）、龙卷风（猛烈旋转的气柱）、洪水、干旱和暴风雪——它们如何形成、通常发生在哪里，以及对人和环境的影响"],["自然资源","Natural resources",0,53,9,10,79,20.2,45,-39.2,"获取并整合信息，说明能源和燃料来自自然资源，而它们的使用会影响环境"],["读天气图","Reading Weather Maps",0,53,9,11,38,-172.6,30,90.1,"读懂并解读天气图、数据表和图表——认出晴、雨、风和气温的符号；发现几周、几个月或几个季节里天气数据的趋势和规律；并用数据做简单的预测"],["太阳驱动的天气系统","Sun-Driven Weather Systems",0,53,9,11,77,-129.4,42.6,69.3,"明白太阳如何驱动天气：太阳把地表加热得不均匀（陆地比水升温快，赤道得到的热量比两极多），造成气压差异，从而形成风的分布、洋流和大尺度的天气系统"],["大气层","The Atmosphere",0,53,9,11,37,-122.3,59.1,51,"知道地球被一层空气包围着，叫做大气层，空气有重量、会产生压力，大气层保护我们免受有害辐射，并让地球保持适合生命的温度，天气则发生在最下面的一层（对流层）"],["抗气象灾害的工程","Weather-Resistant Engineering",0,53,9,11,55,-141.7,61.2,115.2,"明白工程师设计建筑、防洪设施和预警系统来保护社区免受极端天气侵害——抗飓风屋顶、挡水屏障、龙卷风避难所和早期预警系统——并评价这些方案的优劣"],["全球风带","Global Wind Patterns",0,53,11,13,47,-90.9,173.5,21.6,"解释太阳加热不均如何驱动大尺度大气环流：哈得来环流圈（0-30°）、费雷尔环流圈（30-60°）和极地环流圈（60-90°）产生了信风、西风带和极地东风；描述地球自转产生的科里奥利效应如何使北半球的风向右偏；把急流解释为引导天气系统的高空强风；并把急流的波动和北极放大效应与持续的极端天气联系起来"],["温室气体的科学","Greenhouse Gas Science",0,53,11,12,45,-48.9,154.2,38.7,"描述电磁波谱，区分太阳的短波辐射和地球放出的长波红外辐射；解释温室气体分子（CO2、CH4、N2O、H2O）如何通过分子振动吸收并再发射红外辐射，而氧气和氮气不会；区分自然温室效应（它使地球适合居住）和人类排放造成的增强温室效应；并评价不同温室气体的相对增温能力"],["飓风、龙卷风与季风","Hurricanes, Tornadoes & Monsoons",0,53,12,13,97,-87.4,198.9,42.8,"解释飓风如何在温暖洋面上形成并增强（潜热释放、低压螺旋）；描述龙卷风在超级单体雷暴中的形成；解释由海陆温差驱动的季风机制；并介绍归因科学——科学家如何用气候模式计算气候变化是否以及在多大程度上提高了某次极端天气事件的发生概率或强度"],["解读古气候记录","Reading Ancient Climate Records",0,53,12,14,93,-59.3,228.8,12.5,"解释冰芯如何保存远古的气泡、同位素比值和火山标志层，让人们能重建80万年来的温度和二氧化碳浓度；描述树轮、海洋沉积岩芯、珊瑚骨骼和孢粉记录这些其他的气候代用指标；解释气候模式如何建立、又如何用古气候记录来检验；并描述IPCC如何综合数千项研究的科学证据、形成共识性评估"],["净零排放与能源转型","Net Zero & Energy Transition",0,53,13,14,213,-13.9,268.8,12,"评价实现净零排放所需的能源转型：可再生能源规模化、交通和供热的电气化、绿氢；描述碳捕集与封存（CCS）和直接空气捕集（DAC）；介绍已提出的太阳辐射管理技术（平流层气溶胶注入、海洋云增白）及其潜在风险和治理难题；并批判性地评估个人行为改变与系统性政策在减排中各自的作用"]],"edges":[[1546,1539,1],[1546,1537,1],[107,104,0],[107,103,1],[1216,1222,1],[609,589,1],[1137,1127,1],[1137,1059,0],[1137,1128,1],[1137,1330,0],[1137,1288,0],[1307,1304,1],[1390,1392,1],[1264,1263,0],[1264,1266,0],[1041,1040,1],[1041,1037,1],[376,372,0],[376,373,0],[1115,660,0],[170,138,0],[170,412,0],[170,154,1],[1339,1336,0],[1339,1321,1],[1339,1342,0],[61,39,0],[61,50,1],[448,443,0],[448,449,1],[1504,1143,1],[1086,1432,0],[1086,1088,0],[1086,1089,0],[1086,1076,0],[1086,1092,0],[1086,1085,0],[1393,1392,1],[818,813,1],[818,534,0],[1040,1038,
