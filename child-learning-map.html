<style>
:root{
  --bg:#070A0F; --panel:#0D1219; --panel-2:#131A24;

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink); overflow:hidden;

  overscroll-behavior:none;
}
.song{ font-family:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif; }
.mono{ font-family:ui-monospace,"SF Mono",Menlo,monospace; font-variant-numeric:tabular-nums; }

#stage{ position:fixed; inset:0; touch-action:none; cursor:grab; display:block; }
#stage.drag{ cursor:grabbing; }

/* ── title block ──────────────────────── */
#intro{
  position:fixed; left:44px; top:14vh; max-width:min(30rem,42vw);
  pointer-events:none; z-index:5;
  transition:opacity .45s ease, transform .45s ease;
}
#intro.away{ opacity:0; transform:translateX(-14px); }
.eyebrow{
  display:flex; align-items:center; gap:9px;
  font-size:10.5px; letter-spacing:.2em; color:var(--ink-3); margin:0 0 22px;
}
.eyebrow i{ width:5px; height:5px; border-radius:50%; background:var(--accent); font-style:normal; }
h1{
  font-size:clamp(2.4rem,4.6vw,3.9rem); line-height:1.16; font-weight:700;
  letter-spacing:.02em; margin:0 0 24px; text-wrap:balance;
}
#intro p{ color:var(--ink-2); margin:0; max-width:26em; font-size:14.5px; }
#intro p b{ color:var(--ink); font-weight:600; }
#intro .cta{ margin-top:18px; color:var(--ink-3); font-size:12.5px; }

/* ── legend ───────────────────────────── */
#legend{
  position:fixed; left:44px; bottom:38px; z-index:6;
  background:color-mix(in srgb,var(--panel) 82%,transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--rule); border-radius:4px; padding:14px 4px 10px;
  min-width:212px;
}
#legend h2{
  font-size:9.5px; letter-spacing:.2em; color:var(--ink-3);
  margin:0 0 10px; padding:0 14px; font-weight:500;
}
.lg{
  display:grid; grid-template-columns:9px 1fr auto; align-items:center; gap:0 10px;
  width:100%; padding:5px 14px; background:none; border:0; cursor:pointer;
  font:inherit; font-size:12.5px; color:var(--ink-2); text-align:left;
  transition:color .15s, background .15s;
}
.lg:hover{ color:var(--ink); background:#ffffff08; }
.lg:focus-visible{ outline:1px solid var(--accent); outline-offset:-2px; }
.lg .dot{ width:9px; height:9px; border-radius:50%; background:var(--c); transition:opacity .15s; }
.lg .n{ font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums;
  font-family:ui-monospace,"SF Mono",Menlo,monospace; }
.lg[aria-pressed="false"]{ color:var(--ink-3); }
.lg[aria-pressed="false"] .dot{ opacity:.2; }

/* ── age filter ───────────────────────── */
#age{
  position:fixed; left:50%; transform:translateX(-50%); bottom:38px; z-index:6;
  display:flex; align-items:center; gap:16px;
  background:color-mix(in srgb,var(--panel) 82%,transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--rule); border-radius:100px; padding:9px 20px;
}
#age label{ font-size:10px; letter-spacing:.18em; color:var(--ink-3); white-space:nowrap; }
#ageOut{ font-size:13px; color:var(--accent); min-width:4.4em; white-space:nowrap; }
#ageR{ -webkit-appearance:none; appearance:none; width:190px; height:18px; background:none; cursor:pointer; margin:0; }
#ageR::-webkit-slider-runnable-track{ height:2px; background:var(--rule-2); border-radius:2px; }
#ageR::-moz-range-track{ height:2px; background:var(--rule-2); border-radius:2px; }
#ageR::-webkit-slider-thumb{ -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
  background:var(--accent); border:2px solid var(--bg); margin-top:-5.5px; }
#ageR::-moz-range-thumb{ width:13px; height:13px; border-radius:50%; background:var(--accent); border:2px solid var(--bg); }
#ageR:focus-visible{ outline:1px solid var(--accent); outline-offset:4px; border-radius:4px; }
#ageAll{
  font:inherit; font-size:11.5px; padding:2px 11px; border-radius:100px; cursor:pointer;
  background:none; color:var(--ink-3); border:1px solid var(--rule-2); white-space:nowrap;
}
#ageAll:hover{ color:var(--accent); border-color:var(--accent); }
#ageAll[aria-pressed="true"]{ color:var(--accent); border-color:var(--accent); }

/* ── hints + credit ───────────────────── */
#hint{
  position:fixed; right:44px; bottom:38px; z-index:6; text-align:right;
  font-size:11px; color:var(--ink-3); letter-spacing:.04em; line-height:2;
}
#hint a{ color:var(--ink-3); text-decoration:none; border-bottom:1px solid var(--rule-2); }
#hint a:hover{ color:var(--accent); border-color:var(--accent); }
#hint .k{ color:var(--ink-2); }

#panel{
  position:fixed; right:0; top:0; bottom:0; width:min(430px,92vw); z-index:20;

}
#panel.open{ transform:none; }
#close{
  position:absolute; right:22px; top:22px; width:28px; height:28px; border-radius:50%;
  background:none; border:1px solid var(--rule-2); color:var(--ink-3);
  font-size:15px; line-height:1; cursor:pointer; padding:0;
}
#close:hover{ color:var(--ink); border-color:var(--ink-3); }
.p-sub{ display:flex; align-items:center; gap:8px; font-size:11px; letter-spacing:.1em; margin:0 0 14px; }
.p-sub .dot{ width:8px; height:8px; border-radius:50%; }
.p-name{ font-size:1.72rem; font-weight:700; line-height:1.3; margin:0 0 8px; letter-spacing:.02em; }
.p-en{ font-size:12px; color:var(--ink-3); margin:0 0 22px; letter-spacing:.01em; }
.p-meta{ display:flex; flex-wrap:wrap; gap:7px; margin:0 0 26px; }
.chip{
  font-size:11px; padding:3px 10px; border-radius:100px;
  border:1px solid var(--rule-2); color:var(--ink-2); white-space:nowrap;
}
.chip.age{ color:var(--accent); border-color:color-mix(in srgb,var(--accent) 40%,transparent); }
.p-h{
  font-size:10px; letter-spacing:.2em; color:var(--ink-3);

  display:flex; justify-content:space-between; align-items:baseline;
}
.p-h .c{ font-size:11px; color:var(--ink-2); letter-spacing:0;
  font-family:ui-monospace,"SF Mono",Menlo,monospace; }
.depth{ margin:0 0 4px; }
.depth-l{ font-size:10.5px; color:var(--ink-3); margin:14px 0 6px; letter-spacing:.06em; }
.depth:first-child .depth-l{ margin-top:2px; }
.item{
  display:grid; grid-template-columns:7px 1fr auto; align-items:baseline; gap:0 10px;
  width:100%; padding:5px 0; background:none; border:0; cursor:pointer;
  font:inherit; font-size:13px; color:var(--ink-2); text-align:left; line-height:1.55;
}
.item:hover{ color:var(--accent); }
.item:focus-visible{ outline:1px solid var(--accent); outline-offset:1px; }
.item .dot{ width:7px; height:7px; border-radius:50%; transform:translateY(-1px); }
.item .a{ font-size:10.5px; color:var(--ink-3);
  font-family:ui-monospace,"SF Mono",Menlo,monospace; }
.item.soft .dot{ opacity:.35; }
.empty{ font-size:12.5px; color:var(--ink-3); margin:0; }
.p-foot{
  margin-top:38px; padding-top:18px; border-top:1px solid var(--rule);
  font-size:11px; color:var(--ink-3); line-height:1.85;
}
.p-foot a{ color:var(--ink-2); }

#loading{
  position:fixed; inset:0; display:grid; place-items:center; z-index:40;
  background:var(--bg); color:var(--ink-3); font-size:12px; letter-spacing:.2em;
  transition:opacity .5s ease;
}
#loading.gone{ opacity:0; pointer-events:none; }

  .lg{ padding:4px 11px; font-size:11.5px; }
  #age{ bottom:26px; padding:7px 15px; gap:11px; width:calc(100vw - 44px); justify-content:center; }
  #age label{ display:none; }
  #ageR{ width:100%; min-width:0; }
  #hint{ display:none; }
  #panel{ padding:26px 22px 40px; }
}
@media (prefers-reduced-motion:reduce){
  #panel,#intro{ transition:none; }
}

1255,1],[1266,1268,1],[927,930,1],[927,922,1],[457,530,1],[646,638,1],[646,637,1],[1399,1570,0],[1399,1401,1],[1399,1391,0],[1253,1259,1],[464,454,0],[464,473,1],[292,288,0],[292,145,1],[482,890,1],[482,485,1],[386,387,1],[386,373,0]]};

const COL = ["#45C4A8","#6B95F0","#A98AF0","#E2A253","#F0748F","#9BCB5C","#4FD8E8","#F5DC72"];
const N = G.nodes.length;

// node fields
const NX=7, NY=8, NZ=9, ZH=0, EN=1, SU=2, DO=3, A0=4, A1=5, CE=6;

// adjacency
const pre = Array.from({length:N}, () => []);   // what this needs first
const post = Array.from({length:N}, () => []);  // what needs this
for (const [a,b,hard] of G.edges) { pre[a].push([b,hard]); post[b].push([a,hard]); }

const subjOn = G.subjects.map(() => true);
let ageFilter = null;

function visible(i){
  if (!subjOn[G.nodes[i][SU]]) return false;
  if (ageFilter !== null) { const n = G.nodes[i]; if (ageFilter < n[A0] || ageFilter > n[A1]) return false; }
  return true;
}

/* ─────────── renderer ─────────── */
const cv = document.getElementById("stage");
const ctx = cv.getContext("2d", { alpha:false });
let W=0, H=0, DPR=1;

function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width = W+"px"; cv.style.height = H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize", resize); resize();

let rotY = 0.4, rotX = -0.13, zoom = 1, spin = 0.0016;
const px = new Float32Array(N), py = new Float32Array(N), pz = new Float32Array(N), pr = new Float32Array(N);
const order = new Int32Array(N);
let selected = -1, hovered = -1, chain = null;

function project(){
  const cy=Math.cos(rotY), sy=Math.sin(rotY), cx=Math.cos(rotX), sx=Math.sin(rotX);
  const cxc = camX, cyc = H*0.52;
  const base = Math.min(W,H)/760;
  const s = base * zoom * 1.05;
  const FOV = 1250;
  for (let i=0;i<N;i++){
    const n = G.nodes[i];
    let x=n[NX], y=n[NY], z=n[NZ];
    let X = x*cy + z*sy, Z = z*cy - x*sy;
    let Y = y*cx - Z*sx;  Z = Z*cx + y*sx;
    const d = FOV / (FOV + Z*s + 260);
    px[i] = cxc + X*s*d;
    py[i] = cyc + Y*s*d;
    pz[i] = Z;
    pr[i] = (1.15 + (n[CE]/1000)*13) * d * Math.min(zoom,2.4) * (base*0.92+0.34);
  }
}

function draw(){
  ctx.fillStyle = "#070A0F";
  ctx.fillRect(0,0,W,H);

  // ---- edges ----
  const hi = chain;
  ctx.lineWidth = 0.55;
  ctx.strokeStyle = hi ? "rgba(150,175,200,0.045)" : "rgba(150,175,200,0.105)";
  ctx.beginPath();
  for (let e=0;e<G.edges.length;e++){
    const a=G.edges[e][0], b=G.edges[e][1];
    if (!visible(a) || !visible(b)) continue;
    if (hi && hi.edge.has(e)) continue;
    ctx.moveTo(px[a],py[a]); ctx.lineTo(px[b],py[b]);
  }
  ctx.stroke();

  if (hi){
    ctx.lineWidth = 1.15;
    ctx.strokeStyle = "rgba(79,216,232,0.5)";
    ctx.beginPath();
    for (const e of hi.edge){
      const a=G.edges[e][0], b=G.edges[e][1];
      ctx.moveTo(px[a],py[a]); ctx.lineTo(px[b],py[b]);
    }
    ctx.stroke();
  }

  // ---- nodes, back to front ----
  let m=0;
  for (let i=0;i<N;i++) if (visible(i)) order[m++]=i;
  const view = order.subarray(0,m);
  Array.prototype.sort.call(view, (a,b)=> pz[b]-pz[a]);

  for (let k=0;k<m;k++){
    const i = view[k];
    const dim = hi && !hi.node.has(i);
    const depth = Math.max(0, Math.min(1, (pz[i]+330)/660));
    let alpha = 0.30 + depth*0.70;
    if (dim) alpha *= 0.13;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = COL[G.nodes[i][SU]];
    ctx.beginPath();
    ctx.arc(px[i], py[i], Math.max(0.55, pr[i]), 0, 6.2832);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ---- focus rings + label ----
  for (const [i,c] of [[selected,"#4FD8E8"],[hovered,"#FFFFFF"]]){
    if (i < 0 || !visible(i)) continue;
    ctx.strokeStyle = c; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(px[i],py[i], Math.max(pr[i],3)+6, 0, 6.2832); ctx.stroke();
  }
  if (hovered >= 0 && hovered !== selected && visible(hovered)){
    const n = G.nodes[hovered];
    ctx.font = '13px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
    const t = n[ZH], w = ctx.measureText(t).width;
    let lx = px[hovered]+14, ly = py[hovered]+4;
    if (lx + w > W-16) lx = px[hovered]-14-w;
    ctx.fillStyle = "rgba(7,10,15,0.82)";
    ctx.fillRect(lx-7, ly-15, w+14, 22);
    ctx.fillStyle = "#E8EDF2";
    ctx.fillText(t, lx, ly);
  }
}

// camera pans left when the detail panel takes over the right side
function camTarget(){
  if (W <= 980) return W/2;
  return panelOpen ? Math.max(W*0.30, (W - Math.min(430, W*0.92))/2) : W*0.63;
}
let camX = 0;

let needsDraw = true;
function frame(){
  if (!dragging && !panelOpen) { rotY += spin; needsDraw = true; }
  const t = camTarget();
  if (Math.abs(camX - t) > 0.4){ camX += (t - camX) * 0.12; needsDraw = true; }
  else camX = t;
  if (needsDraw){ project(); draw(); needsDraw = false; }
  requestAnimationFrame(frame);
}

/* ─────────── interaction ─────────── */
let dragging=false, moved=false, lx=0, ly=0, panelOpen=false;

function pick(mx,my){
  let best=-1, bd=18*18;
  for (let i=0;i<N;i++){
    if (!visible(i)) continue;
    const dx=px[i]-mx, dy=py[i]-my, d=dx*dx+dy*dy;
    const r = Math.max(pr[i],4)+5;
    if (d < r*r && d < bd){ bd=d; best=i; }
  }
  return best;
}

cv.addEventListener("pointerdown", e => {
  dragging=true; moved=false; lx=e.clientX; ly=e.clientY;
  cv.classList.add("drag"); cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", e => {
  if (dragging){
    const dx=e.clientX-lx, dy=e.clientY-ly;
    if (Math.abs(dx)+Math.abs(dy) > 3) moved=true;
    rotY += dx*0.0052; rotX += dy*0.0042;
    rotX = Math.max(-1.35, Math.min(1.35, rotX));
    lx=e.clientX; ly=e.clientY; needsDraw=true;
  } else {
    const h = pick(e.clientX, e.clientY);
    if (h !== hovered){ hovered=h; needsDraw=true; cv.style.cursor = h>=0 ? "pointer" : "grab"; }
  }
});
cv.addEventListener("pointerup", e => {
  dragging=false; cv.classList.remove("drag");
  if (!moved){ const i = pick(e.clientX, e.clientY); i>=0 ? open(i) : close(); }
});
cv.addEventListener("pointercancel", () => { dragging=false; cv.classList.remove("drag"); });
cv.addEventListener("wheel", e => {
  e.preventDefault();
  zoom = Math.max(0.35, Math.min(6, zoom * (e.deltaY > 0 ? 0.92 : 1.087)));
  needsDraw = true;
}, { passive:false });

// pinch
let pinch = 0;
cv.addEventListener("touchmove", e => {
  if (e.touches.length !== 2) return;
  const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  if (pinch) { zoom = Math.max(0.35, Math.min(6, zoom * d/pinch)); needsDraw = true; }
  pinch = d;
}, { passive:true });
cv.addEventListener("touchend", () => { pinch = 0; });

/* ─────────── prerequisite closure ─────────── */
function closure(start){
  const node = new Set([start]), edge = new Set(), levels = [];
  let front = [start], depth = 0;
  const eIndex = new Map();
  G.edges.forEach((ed,i) => {
    const k = ed[0]+"_"+ed[1];
    eIndex.set(k, i);
  });
  while (front.length && depth < 40){
    const next = [];
    for (const a of front){
      for (const [b,hard] of pre[a]){
        const ei = eIndex.get(a+"_"+b);
        if (ei !== undefined) edge.add(ei);
        if (!node.has(b)){ node.add(b); next.push(b); }
      }
    }
    if (next.length) levels.push(next.slice());
    front = next; depth++;
  }
  return { node, edge, levels };
}

/* ─────────── panel ─────────── */
const panel = document.getElementById("panel");
const body = document.getElementById("panelBody");
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function row(i, hard){
  const n = G.nodes[i];
  return `<button class="item${hard===0?" soft":""}" data-i="${i}">
    <span class="dot" style="background:${COL[n[SU]]}"></span>
    <span>${esc(n[ZH])}</span>
    <span class="a">${n[A0]}–${n[A1]}</span>
  </button>`;
}

function open(i){
  selected = i; chain = closure(i); panelOpen = true; needsDraw = true;
  document.getElementById("intro").classList.add("away");
  const n = G.nodes[i];
  const total = chain.node.size - 1;
  const downstream = post[i].map(([a]) => a);

  const levels = chain.levels.map((lv, d) => `
    <div class="depth">
      <div class="depth-l mono">↑ 再往前 ${d+1} 层 · ${lv.length} 项</div>
      ${lv.sort((a,b)=>G.nodes[a][A0]-G.nodes[b][A0]).map(x => row(x,1)).join("")}
    </div>`).join("");

  body.innerHTML = `
    <div class="p-sub"><span class="dot" style="background:${COL[n[SU]]}"></span>
      <span>${esc(G.subjects[n[SU]])} · ${esc(G.domains[n[DO]])}</span></div>
    <h2 class="p-name song">${esc(n[ZH])}</h2>
    <p class="p-en mono">${esc(n[EN])}</p>
    <div class="p-meta">
      <span class="chip age">${n[A0]}–${n[A1]} 岁</span>
      <span class="chip">直接前置 ${pre[i].length}</span>
      <span class="chip">后续 ${downstream.length}</span>
    </div>

    <div class="p-h"><span>此前必须学会</span><span class="c">${total} 项</span></div>
    ${total ? levels : `<p class="empty">没有前置——这是图上的起点之一，可以直接开始。</p>`}

    <div class="p-h"><span>学会之后才能学</span><span class="c">${downstream.length} 项</span></div>
    ${downstream.length
      ? downstream.sort((a,b)=>G.nodes[a][A0]-G.nodes[b][A0]).map(x => row(x,1)).join("")
      : `<p class="empty">图上没有以它为前置的知识点。</p>`}

    <div class="p-foot">
      数据来自 <a href="https://github.com/withmarbleapp/os-taxonomy" target="_blank" rel="noopener">Marble Skill Taxonomy v1</a>，
      锚定 NGSS、Common Core 与英国 DfE 课标。原始数据 ODbL 1.0，撰写内容 CC BY-SA 4.0；
      本页中文翻译同以 CC BY-SA 4.0 共享。
    </div>`;
  panel.classList.add("open");
  panel.scrollTop = 0;
}

function close(){
  selected = -1; chain = null; panelOpen = false; needsDraw = true;
  panel.classList.remove("open");
  document.getElementById("intro").classList.remove("away");
}

document.getElementById("close").addEventListener("click", close);
body.addEventListener("click", e => {
  const b = e.target.closest(".item");
  if (b) open(+b.dataset.i);
});
addEventListener("keydown", e => { if (e.key === "Escape") close(); });

/* ─────────── legend ─────────── */
const counts = G.subjects.map(() => 0);
for (const n of G.nodes) counts[n[SU]]++;
document.getElementById("legendRows").innerHTML = G.subjects
  .map((s,i) => [s,i])
  .sort((a,b) => counts[b[1]] - counts[a[1]])
  .map(([s,i]) => `<button class="lg" data-s="${i}" aria-pressed="true" style="--c:${COL[i]}">
      <span class="dot"></span><span>${esc(s)}</span><span class="n">${counts[i]}</span>
    </button>`).join("");

document.getElementById("legendRows").addEventListener("click", e => {
  const b = e.target.closest(".lg"); if (!b) return;
  const s = +b.dataset.s;
  subjOn[s] = !subjOn[s];
  b.setAttribute("aria-pressed", String(subjOn[s]));
  needsDraw = true;
});

/* ─────────── age filter ─────────── */
const ageR = document.getElementById("ageR"), ageOut = document.getElementById("ageOut"),
      ageAll = document.getElementById("ageAll");
function syncAge(){
  ageOut.textContent = ageFilter === null ? "全部" : ageFilter + " 岁";
  ageAll.setAttribute("aria-pressed", String(ageFilter === null));
  needsDraw = true;
}
ageR.addEventListener("input", () => { ageFilter = +ageR.value; syncAge(); });
ageAll.addEventListener("click", () => { ageFilter = null; syncAge(); });

/* ─────────── go ─────────── */
