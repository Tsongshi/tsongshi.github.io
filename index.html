<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tsongshi</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --text: #1a1a1a; --muted: #6b7280; --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --text: #e6e9ef; --muted: #9aa3b2; --accent: #6ea8ff; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    line-height: 1.7; -webkit-font-smoothing: antialiased;
  }
  .card { max-width: 420px; padding: 0 28px; }
  h1 { font-size: 1.5rem; font-weight: 700; margin: 0 0 0.5rem; letter-spacing: -0.01em; }
  p { color: var(--muted); margin: 0 0 1.75rem; font-size: 0.95rem; }
  a {
    display: inline-block; color: var(--accent); text-decoration: none;
    border: 1px solid currentColor; border-radius: 9px;
    padding: 7px 18px; font-size: 0.9rem; transition: opacity 0.12s;
  }
  a:hover { opacity: 0.7; }
</style>
</head>
<body>
  <div class="card">
    <h1>Tsongshi</h1>
    <p>这里主要放一些自用的东西，需要密码。</p>
    <a href="private/">进入 →</a>
  </div>
</body>
</html>
