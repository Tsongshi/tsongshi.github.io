<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>法考主观题记忆训练</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
    --text:#e6e9ef; --muted:#9aa3b2; --accent:#4f8cff; --accent2:#3b6fd4;
    --good:#10b981; --easy:#22c55e; --hard:#f59e0b; --again:#ef4444;
    --radius:14px; --shadow:0 6px 24px rgba(0,0,0,.35);
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f6fb; --panel:#ffffff; --panel2:#f0f3f9; --border:#e2e7f0;
           --text:#1a2030; --muted:#5c6678; --shadow:0 6px 24px rgba(20,30,60,.08); }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
       background:var(--bg);color:var(--text);line-height:1.65;-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto;padding:20px 18px 80px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.5px}
  .sub{color:var(--muted);font-size:13px}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-size:14px;transition:.12s;color:var(--text)}
  button:active{transform:translateY(1px)}
  .ghost{background:var(--panel2);border:1px solid var(--border);padding:8px 14px}
  .ghost:hover{background:var(--panel)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  /* dashboard */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center}
  .stat b{display:block;font-size:26px;font-weight:800}
  .stat span{color:var(--muted);font-size:12px}
  .stat.due b{color:var(--accent)} .stat.newc b{color:var(--good)}

  .decks{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .chip{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--border);
        padding:7px 12px;border-radius:999px;font-size:13px;cursor:pointer;user-select:none}
  .chip .dot{width:9px;height:9px;border-radius:50%}
  .chip.off{opacity:.4}
  .chip .cnt{color:var(--muted);font-variant-numeric:tabular-nums}

  .cta{display:block;width:100%;padding:16px;font-size:16px;font-weight:700;background:var(--accent);
       color:#fff;border-radius:var(--radius);box-shadow:var(--shadow)}
  .cta:hover{background:var(--accent2)}
  .cta:disabled{opacity:.5;cursor:default;background:var(--panel2);color:var(--muted);box-shadow:none}

  /* review card */
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
        box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
  .card .meta{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;
              border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)}
  .badge{padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;color:#fff}
  .card .front{padding:24px 20px;font-size:18px;font-weight:600}
  .card .back{padding:0 20px 20px;animation:fade .2s}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
  .sec-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:16px 0 8px}
  ul.points{margin:0;padding-left:4px;list-style:none}
  ul.points li{padding:7px 12px;margin-bottom:7px;background:var(--panel2);border-left:3px solid var(--accent);
               border-radius:8px;font-size:15px}
  .note{background:var(--panel2);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--text)}
  .laws{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .law{font-size:12px;background:var(--panel2);border:1px solid var(--border);padding:3px 9px;border-radius:7px;color:var(--muted)}
  .tags{margin-top:14px;display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:11px;color:var(--muted)}
  .source{margin-top:12px;padding-top:10px;border-top:1px dashed var(--border);
          font-size:12px;color:var(--muted)}

  .reveal{display:block;width:100%;padding:14px;font-weight:700;background:var(--panel2);border:1px solid var(--border)}
  .reveal:hover{background:var(--panel)}
  .grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .grades button{padding:13px 6px;font-weight:700;color:#fff}
  .g-again{background:var(--again)} .g-hard{background:var(--hard)}
  .g-good{background:var(--good)} .g-easy{background:var(--easy)}
  .grades small{display:block;font-weight:400;opacity:.85;font-size:11px}

  .done{text-align:center;padding:50px 20px}
  .done .big{font-size:46px}
  .hint{color:var(--muted);font-size:12px;text-align:center;margin-top:10px}
  .err{background:#3a1f24;border:1px solid #7a2e38;color:#ffd7dd;padding:16px;border-radius:var(--radius);font-size:14px}
  @media (prefers-color-scheme: light){.err{background:#fdecee;border-color:#f3c0c7;color:#9b1c2b}}
  code{background:var(--panel2);padding:2px 6px;border-radius:5px;font-size:13px}
  .hide{display:none}
</style>

 "front": "【必背金句】商事留置权的构成要件——对债务人的动产 vs 对第三人的动产（各四项）？", "points": ["【对债务人的动产】1.债权已到期；2.合法占有债务人的动产；3.营业债权（企业持续经营中发生的债权）；4.不违反法律规定、当事人约定，不违背公序良俗", "【对第三人的动产】1.债权已到期；2.合法占有第三人的动产；3.基于同一法律关系且属于营业债权；4.不违反法律规定、当事人约定，不违背公序良俗", "注意：受让债权不属于营业债权，不得行使商事留置权"], "law": ["《民法典》第447—449条", "《民法典担保制度解释》第62条"], "source": "26民法考前必背金句 p.2-3", "tags": ["必背金句", "留置权", "商事留置"], "difficulty": 4}, {"id": "civ-213", "type": "goldline", "topic": "缔约过失责任", "front": "【必背金句】缔约过失责任的构成要件（四项）？", "points": ["1. 行为发生于缔约的过程中", "2. 一方违反基于诚信原则而产生的先合同义务", "3. 导致对方信赖利益损失", "4. 一方违反先合同义务与他方所受损失之间存在因果关系"], "law": ["《民法典》第500、501条"], "source": "26民法考前必背金句 p.3", "tags": ["必背金句", "缔约过失"], "difficulty": 3}, {"id": "civ-214", "type": "goldline", "topic": "第三人代为履行", "front": "【必背金句】第三人代为履行的构成要件（四项）？", "points": ["1. 合同未约定第三人具有履行义务", "2. 债务人不履行债务", "3. 第三人对履行该债务具有合法利益", "4. 根据债务性质、合同约定或法律规定，未明确将第三人代为履行排除在外"], "law": ["《民法典》第524条", "《民法典合同编通则解释》第30条"], "source": "26民法考前必背金句 p.3", "tags": ["必背金句", "第三人代为履行"], "difficulty": 4}, {"id": "civ-215", "type": "goldline", "topic": "情势变更", "front": "【必背金句】情势变更的构成要件（三项）？", "points": ["1. 发生在合同成立后履行完毕前", "2. 无法预见且不属于商业风险", "3. 继续履行对一方当事人明显不公平"], "law": ["《民法典》第533条"], "source": "26民法考前必背金句 p.3", "tags": ["必背金句", "情势变更", "高频"], "difficulty": 3}, {"id": "civ-216", "type": "goldline", "topic": "债权人代位权", "front": "【必背金句】债权人代位权的构成要件（四项）？", "points": ["1. 原则上债权人对债务人、债务人对相对人的权利均合法且到期（注意：债权人代位保存权 /《民法典》第536条）", "2. 债务人怠于行使权利", "3. 债务人怠于行使权利已危害债权人的债权（有直接因果关系）", "4. 债务人的权利非专属于债务人自身"], "law": ["《民法典》第535条", "《民法典》第536条"], "source": "26民法考前必背金句 p.3", "tags": ["必背金句", "代位权", "高频"], "difficulty": 4}, {"id": "civ-217", "type": "goldline", "topic": "债权人撤销权", "front": "【必背金句】债权人撤销权的构成要件（四项）？", "points": ["1. 债权人对债务人有合法有效的债权", "2. 主观上，债务人具有诈害债权的恶意且相对人知情", "3. 客观上，债务人实施了诈害债权的行为", "4. 债务人的行为已危害债权人的债权（即导致自己陷入无资力而无法清偿其债务／因果关系）"], "law": ["《民法典》第538、539条"], "source": "26民法考前必背金句 p.3", "tags": ["必背金句", "撤销权", "高频"], "difficulty": 4}, {"id": "civ-218", "type": "goldline", "topic": "债权转让", "front": "【必背金句】债权转让的构成要件（三项）？", "points": ["1. 存在合法有效的债权", "2. 被让与的债权具有可让与性", "3. 让与人与受让人达成债权让与协议"], "law": ["《民法典》第546条"], "source": "26民法考前必背金句 p.3", "tags": ["必背金句", "债权转让"], "difficulty": 2}, {"id": "civ-219", "type": "goldline", "topic": "债务承担", "front": "【必背金句】债务承担的构成要件（三项）？", "points": ["1. 存在合法有效的债务", "2. 被移转的债务具有可让与性", "3. 存在合法有效的债务承担协议"], "law": ["《民法典》第551、552条"], "source": "26民法考前必背金句 p.3-4", "tags": ["必背金句", "债务承担"], "difficulty": 2}, {"id": "civ-220", "type": "goldline", "topic": "违约责任", "front": "【必背金句】违约责任的构成要件（三项）？", "points": ["1. 存在合法有效的合同", "2. 存在违约行为", "3. 不存在法定或约定的免责事由"], "law": ["《民法典》第577条"], "source": "26民法考前必背金句 p.4", "tags": ["必背金句", "违约责任", "高频"], "difficulty": 2}, {"id": "civ-221", "type": "goldline", "topic": "无因管理", "front": "【必背金句】无因管理的构成要件（四项）？", "points": ["1. 没有法定或约定的义务", "2. 主观上具有为了避免他人利益受损失而管理他人事务的意思", "3. 客观上实施了管理他人事务的行为", "4. 不违反本人明示或可推知的意思，但是本人真实意思违反法律或违背公序良俗的除外"], "law": ["《民法典》第121、979条"], "source": "26民法考前必背金句 p.4", "tags": ["必背金句", "无因管理"], "difficulty": 3}, {"id": "civ-222", "type": "goldline", "topic": "不当得利", "front": "【必背金句】不当得利的构成要件（四项）？", "points": ["1. 没有法定或约定的原因", "2. 一方获益", "3. 一方受损", "4. 获益和受损之间存在直接因果关系"], "law": ["《民法典》第122、985条"], "source": "26民法考前必背金句 p.4", "tags": ["必背金句", "不当得利"], "difficulty": 2}, {"id": "civ-223", "type": "goldline", "topic": "一般侵权责任", "front": "【必背金句】一般侵权责任的构成要件（四项）？", "points": ["1. 加害人存在侵害行为", "2. 受害人存在损害后果", "3. 侵害行为和损害后果之间存在因果关系", "4. 加害人主观上存在过错"], "law": ["《民法典》第1165条"], "source": "26民法考前必背金句 p.4", "tags": ["必背金句", "侵权责任", "高频"], "difficulty": 2}]}, "刑法.json": {"deck": "刑法", "cards": [{"id": "crim-101", "type": "framework", "topic": "专题一 犯罪构成体系", "front": "默写主观题定罪标准：四要件犯罪构成体系的完整清单（含排除犯罪事由）。", "points": ["1. 犯罪客体：社会关系（法益）", "2. 犯罪主体：(1)自然人；(2)单位", "3. 客观要件：(1)行为；(2)结果；(3)因果关系", "4. 主观要件：(1)故意；(2)过失", "5. 排除犯罪事由：", "　(1) 排除违法事由：①正当防卫 ②紧急避险 ③被害人承诺", "　(2) 排除责任事由：①责任年龄 ②责任能力 ③违法性认识可能性 ④期待可能性"], "back": "答主观题需体系审查思维，按此清单逐项排查才不遗漏考点。注意：这是完整\"零部件清单\"，具体犯罪按需搭配——如故意杀人罪的成立不需要实害结果与因果关系，那是既遂条件。", "law": [], "source": "2026主观题刑法攻略（精讲） p.12-14", "tags": ["犯罪构成", "四要件", "答题框架"], "difficulty": 3}, {"id": "crim-102", "type": "distinguish", "topic": "专题一 犯罪构成体系", "front": "辨析：犯罪客体 vs 犯罪对象（行为对象）。甲盗窃乙的手机，二者分别是什么？", "points": ["犯罪客体 = 法律保护的利益（法益），如乙的财产权", "犯罪对象 = 行为所指向的载体，如乙的手机", "关系：犯罪对象是犯罪客体的载体；犯罪客体是犯罪对象蕴含的利益"], "back": "教材原例：甲盗窃乙的手机——犯罪对象是手机，犯罪客体是乙的财产权。刑法设立盗窃罪是为保护财产权（保护法益）。", "law": [], "source": "2026主观题刑法攻略（精讲） p.12", "tags": ["犯罪客体", "易混辨析"], "difficulty": 2}, {"id": "crim-103", "type": "framework", "topic": "专题一 犯罪构成体系", "front": "犯罪构成体系的三项判断任务分别是什么？（四要件→排除违法事由→排除责任事由各自回答什么问题）", "points": ["① 四个要件（客体、主体、客观、主观）：行为人有没有干坏事？", "② 排除违法事由：干的事到底是不是坏事？有没有可能是正当的事？", "③ 排除责任事由：行为人是不是坏人？能不能谴责他？有没有可能宽恕他？"], "back": "定罪机制 = 先判断坏事（是否制造违法事实），后判断坏人（应否被刑法谴责）。10岁孩子偷手机：干了坏事，但不是坏人（不可谴责）。", "law": [], "source": "2026主观题刑法攻略（精讲） p.13-14", "tags": ["犯罪构成", "判断顺序", "答题框架"], "difficulty": 3}, {"id": "crim-104", "type": "framework", "topic": "专题一 犯罪构成体系", "front": "\"犯罪\"概念的阶段化理解：10岁的甲盗窃乙的手机，丙为甲保管该手机。甲、丙各如何处理？", "points": ["\"犯罪\"是阶段性概念，不是终局意义的\"点\"概念", "① \"制造违法事实\"意义上的犯罪：具备客观+主观要件、无排除违法事由 → 干了坏事（对事不对人）", "② 最终负刑事责任的犯罪：还须无排除责任事由 → 干了坏事且是坏人（对事又对人）", "甲未达责任年龄 → 不负刑事责任、最终无罪；但其行为仍是\"制造违法事实\"意义上的犯罪行为", "因此甲盗窃的手机属于\"犯罪所得\" → 丙构成掩饰、隐瞒犯罪所得罪"], "back": "关键：责任阻却不否定违法层面的\"犯罪行为\"定性。教材注引2025年8月26日两高《关于办理掩饰、隐瞒犯罪所得、犯罪所得收益刑事案件适用法律若干问题的解释》第十条。", "law": ["两高掩饰隐瞒犯罪所得司法解释(2025)第10条"], "source": "2026主观题刑法攻略（精讲） p.14", "tags": ["阶段化犯罪概念", "掩饰隐瞒犯罪所得", "高频"], "difficulty": 4}, {"id": "crim-105", "type": "framework", "topic": "专题一 犯罪构成体系", "front": "（2002年卷二38题·头痛粉案）甲将头痛粉冒充海洛因骗乙去出卖，约定均分货款。乙卖得4000元，分赃前被查获。甲、乙如何处理？", "points": ["甲不构成对乙的诈骗罪（未骗乙的钱财）", "甲利用乙的不知情，让乙充当自己诈骗买家的工具 → 甲是诈骗罪的间接正犯", "制造违法事实层面甲乙构成诈骗罪共同犯罪：甲教唆犯、乙客观层面\"实行犯\"；但乙无诈骗故意，最终不构成诈骗罪", "甲既是间接正犯又是教唆犯 → 就高不就低，认定为诈骗罪间接正犯", "乙是否构成贩卖毒品罪？少数说：有故意有行为 → 未遂；多数说：对象是头痛粉，无侵犯毒品法益的危险性，客观上不属贩毒行为 → 不构成（定罪先看客观行为）"], "back": "本题综合考查间接正犯、阶段化共犯认定与\"先客观后主观\"的定罪顺序，是观点展示型答题的范本。", "law": [], "source": "2026主观题刑法攻略（精讲） p.14-15", "tags": ["间接正犯", "观点展示", "真题"], "difficulty": 5}, {"id": "crim-106", "type": "framework", "topic": "专题二 不作为犯", "front": "不作为犯的成立条件（三项）及记忆公式？", "points": ["① 负有作为义务（应为）", "② 有能力履行该特定义务（能为）", "③ 不履行该义务（不为）", "记忆公式：应为 — 能为 — 不为"], "back": "应试提示：不作为犯中作为义务是判断重点；主观题常将不作为犯与共同犯罪结合考查。", "law": [], "source": "2026主观题刑法攻略（精讲） p.16", "tags": ["不作为犯", "成立条件", "答题框架"], "difficulty": 2}, {"id": "crim-107", "type": "framework", "topic": "专题二 不作为犯", "front": "作为义务的来源：默写\"实质的二分说\"完整体系图（法考理论立场）。", "points": ["【一、对危险源的监管义务】", "　1. 对危险物的监管（自己养的狗咬人；危险动物/物品/设施；机动车；房东告知危房）", "　2. 对他人危险行为的监管（自己的熊孩子打人；监护/监管关系）", "　3. 对自己先行行为的监管：(1)先行行为对法益创设危险；(2)正当防卫有防止过当结果的义务", "【二、对法益对象的保护义务】", "　1. 特定关系：(1)法律规定（父救子）(2)职务业务（警察阻止犯罪）(3)合同约定（保管财物）(4)自愿救助形成依赖关系（弃婴捡回家）", "　2. 特定领域：①行为人是该领域管理者；②形成依赖关系（出租车上乘客强奸乘客）"], "back": "传统\"形式四分说\"过于形式化，不足以应对法考真题；本书采实质二分说（教材注引张明楷《刑法学》第六版 p.198-204）。此图是全专题的总骨架，案例先定位义务类型再展开。", "law": [], "source": "2026主观题刑法攻略（精讲） p.16, 21", "tags": ["不作为犯", "作为义务", "实质二分说", "答题框架", "高频"], "difficulty": 4}, {"id": "crim-108", "type": "qa", "topic": "专题二 不作为犯", "front": "对危险源的监管义务有哪三类？各举教材实例。", "points": ["① 对危险物：主人对凶狗（动物咬人时有阻止义务）；道路/电力设施、矿井、广告牌负责人；机动车所有人（阻止无照者、醉酒者、小孩驾驶）；房东发现房屋危险须告知租客", "② 对他人危险行为（须有监护监管关系）：父母对年幼子女；家属对狂躁症成员；军官对士兵；幼儿园阿姨对小朋友", "③ 对自己先行行为：饭店食物致客人中毒须救助；制造商对有隐患产品有召回义务（2021年试题）；黑夜停车高速路不设警示致追尾须救助；明知乙有癫痫故意吵架诱发不救 → 不作为故意杀人罪（2019年试题）"], "back": "反例（无义务）：儿子看到父亲盗窃无阻止义务（2011年52题等）；成年兄妹、夫妻间无监管关系——妻子对丈夫贪污受贿不阻止，不构成不作为帮助犯（2013年51题）。", "law": [], "source": "2026主观题刑法攻略（精讲） p.16-17", "tags": ["不作为犯", "危险源监管", "真题"], "difficulty": 3}, {"id": "crim-109", "type": "distinguish", "topic": "专题二 不作为犯", "front": "正当防卫人对被其打伤的不法侵害人，有无救助义务？（分情形 + 两说）", "points": ["少数说：先行行为须是违法行为，正当防卫是合法行为，不产生救助义务", "多数说（注引张明楷）：防卫行为若会导致过当结果，防卫人有防止过当结果发生的义务；先行行为不要求违法", "情形一（2013年7题）：甲仅一般性伤害，乙防卫致甲重伤倒地——若甲死亡则属过当 → 乙有救助义务，故意不救 → 不作为故意杀人罪", "情形二（2014年5题·藏獒案）：小偷入户被藏獒咬（防卫措施），若死亡即过当 → 主人有阻止/救助义务，不救 → 不作为故意杀人罪", "情形三：甲持刀杀乙，乙反击致甲重伤——即使甲死亡也不过当 → 乙无救助义务，不构成不作为犯"], "back": "判断口诀：看\"放任下去会不会过当\"。会过当 → 有防止义务；不会过当（如对行凶的反击）→ 无义务。", "law": [], "source": "2026主观题刑法攻略（精讲） p.17-18", "tags": ["不作为犯", "正当防卫", "先行行为", "易混辨析", "真题"], "difficulty": 4}, {"id": "crim-110", "type": "qa", "topic": "专题二 不作为犯", "front": "（火把案，2020/2023年试题）甲故意伤害乙，乙防卫扔火把恰落入稻草堆后趁机逃离；甲见起火不灭离开，火势烧毁邻居家。谁有灭火义务？谁构成不作为犯罪？", "points": ["争点：防卫行为对第三方造成危险，谁有作为义务", "多数说：不法侵害人和防卫人都有作为义务（少数说：仅不法侵害人）", "甲（不法侵害人）有灭火义务，不灭火 → 构成不作为犯罪", "乙客观上制造了危险也有灭火义务，但甲正在伤害乙，乙缺乏作为可能性（能为）→ 最终不构成不作为犯罪"], "back": "本题同时落点\"作为义务\"与\"作为可能性\"两个条件——乙是因\"能为\"要件不满足而出罪，不是没有义务。", "law": [], "source": "2026主观题刑法攻略（精讲） p.18", "tags": ["不作为犯", "防卫与第三方", "真题"], "difficulty": 4}, {"id": "crim-111", "type": "qa", "topic": "专题二 不作为犯", "front": "紧急避险行为、犯罪行为能否成为产生作为义务的先行行为？各举教材实例。", "points": ["① 紧急避险可以：甲驾大巴刹车失灵，为避免坠崖撞伤路边老大爷——避险虽合法，但给老大爷创设危险 → 有救助义务", "② 犯罪行为可以：甲盗伐林木，树木倒下砸晕乙，甲不救离去致乙死亡 → 盗伐林木罪 + 不作为的故意杀人罪，数罪并罚（2010年52题）"], "back": "与正当防卫卡（crim-109）呼应：先行行为不要求违法性——合法行为（避险）与犯罪行为都可产生作为义务，核心看是否对法益创设了危险。", "law": [], "source": "2026主观题刑法攻略（精讲） p.18", "tags": ["不作为犯", "先行行为", "数罪并罚", "真题"], "difficulty": 3}, {"id": "crim-112", "type": "framework", "topic": "专题二 不作为犯", "front": "（考验男人案，2015年52题/2020年试题）女友和母亲同时落水，狗蛋只救女友，母亲溺亡，如何处理？若妻子与母亲同时落水，丈夫只救妻子呢？", "points": ["母亲落水：子女有法律产生的救助义务（特定关系）", "女友落水：仅道德义务，法律未规定 → 男友无刑法上的救助义务", "故狗蛋不救母亲 → 构成不作为犯罪", "妻子与母亲都落水：丈夫（儿子）对两人都有救助义务；救了妻子未救母亲 → 对母亲属不作为，但在排除违法事由阶段以\"义务冲突\"排除违法性", "义务冲突 = 负两项义务，履行其一必然无法履行另一项 → 未履行的那项不具有违法性"], "back": "教材脚注例：家庭医生发现男主人感染艾滋病，保密义务与告知女主人义务冲突，选择告知则未保密不违法。", "law": [], "source": "2026主观题刑法攻略（精讲） p.16, 18", "tags": ["不作为犯", "特定关系", "义务冲突", "真题", "高频"], "difficulty": 4}, {"id": "crim-113", "type": "qa", "topic": "专题二 不作为犯", "front": "路人甲看到附近大楼火灾没有报警，《消防法》规定任何人发现火灾都有报警义务——甲是否构成不作为犯罪？", "points": ["不构成。报警义务 ≠ 保护义务", "无论根据何种法律，甲对大楼均没有保护义务 → 没有刑法上的作为义务"], "back": "一般法律义务（如报警）不能直接升格为刑法上的作为义务；刑法上的保护义务以特定依赖关系为实质根据。", "law": [], "source": "2026主观题刑法攻略（精讲） p.18", "tags": ["不作为犯", "报警义务", "易错"], "difficulty": 3}, {"id": "crim-114", "type": "qa", "topic": "专题二 不作为犯", "front": "多个作为义务人之间的先后关系如何处理？（岳母受伤案 / 妻子殴打自己母亲案，2020年试题）", "points": ["结论：若第一位作为义务人不救助甚至侵害法益，不能期待第二位作为义务人实施救助", "例1：岳母受伤，妻子（第一义务人）不救，丈夫（第二义务人）也不救 → 丈夫不构成不作为犯", "例2：妻子殴打自己母亲，丈夫不阻止 → 不构成不作为犯（2020年试题）"], "back": "义务有位序：近亲属/直接关系人是第一位。第一位不作为时，第二位欠缺期待可能性。", "law": [], "source": "2026主观题刑法攻略（精讲） p.19", "tags": ["不作为犯", "义务位序", "真题"], "difficulty": 3}, {"id": "crim-115", "type": "qa", "topic": "专题二 不作为犯", "front": "（2023年试题）下班民警在辖区酒吧喝酒，发现有人强奸乙女，认为自己已下班未制止——是否构成不作为犯罪？卫生局局长路过杀人现场呢（2006年4题）？", "points": ["民警构成不作为犯罪：《警察法》规定警察非工作时间遇职责范围内紧急情况应履行职责，不受是否穿警服影响（职务产生的保护义务）", "卫生局局长不构成：虽是公务员但不是警察，职务上没有保护义务"], "back": "职务/业务产生的保护义务限于该职务的职责范围——警察、消防员、医生、救生员等对其职责对象负保护义务。", "law": ["《警察法》（非工作时间履职条款）"], "source": "2026主观题刑法攻略（精讲） p.19", "tags": ["不作为犯", "职务义务", "真题"], "difficulty": 3}, {"id": "crim-116", "type": "qa", "topic": "专题二 不作为犯", "front": "自愿救助何时产生继续救助义务？（井底绳子案 2014年5题 / 救生圈案 2024年试题 / 弃婴案 2013年51题）", "points": ["条件：① 自愿救助 + ② 法益对象对行为人形成依赖关系", "弃婴：视而不见不构成犯罪；捡回家 → 形成依赖关系 → 有继续救助义务", "井底绳子：绳到井底尚未上拉 → 未形成依赖 → 可不拉；拉到半空 → 有继续拉的义务（\"救人救到底\"），此时放绳摔死人 = 作为与不作为竞合 → 认定为作为", "救生圈：乙尚未抓到救生圈即捞走 → 未形成依赖 → 无救助义务", "酒局：请人喝酒属生活行为不创设危险，直接离开无义务（2025年试题，但酒吧基于特定领域有保护义务）；一旦扶上车开车送回家 → 形成依赖 → 有继续送达义务"], "back": "判断锚点是\"依赖关系是否已经形成\"——救助着手且对方因此放弃/丧失其他获救可能时，义务产生。", "law": [], "source": "2026主观题刑法攻略（精讲） p.19", "tags": ["不作为犯", "自愿救助", "依赖关系", "真题", "高频"], "difficulty": 4}, {"id": "crim-117", "type": "distinguish", "topic": "专题二 不作为犯", "front": "辨析：相约登山（2023年试题）vs 相约打羽毛球（2024年试题）——同伴遇险时有无救助义务？", "points": ["登山（危险的山）：意味着愿意相互照顾，形成危险共同体 → 特定关系产生保护义务 → 有救助义务", "打羽毛球：未形成危险共同体 → 甲突发心脏病，乙没有刑法上的救助义务"], "back": "区分核心：活动本身是否有危险性、参与者是否以相互照顾为前提结成\"危险共同体\"。", "law": [], "source": "2026主观题刑法攻略（精讲） p.20", "tags": ["不作为犯", "危险共同体", "易混辨析", "真题"], "difficulty": 3}, {"id": "crim-118", "type": "framework", "topic": "专题二 不作为犯", "front": "基于\"特定领域\"产生保护义务的两个条件？并用宿舍着火案、嫖娼案、吸毒案（均2023年试题）检验。", "points": ["条件①：行为人是特定领域的管理者，被害人不是该领域的管理者", "条件②：行为人对领域内危险有控制力，被害人对其形成依赖关系", "宿舍着火：甲乙共同居住，乙也是管理者 → 甲无救助义务", "嫖娼案：在谁家里谁有义务（卖淫女家中嫖客发病→卖淫女有义务；反之无）；酒店看谁开的房（视为谁家），酒店管理者另基于职务业务有义务；二人共同管理的房间 → 另一方无义务", "吸毒案：甲乙常在乙家吸毒，乙发病甲无义务；甲发病则乙（领域管理者）有义务"], "back": "口诀：\"在谁的地盘，谁管\"。共同管理 = 互相都不是\"依赖方\" → 无义务。", "law": [], "source": "2026主观题刑法攻略（精讲） p.20", "tags": ["不作为犯", "特定领域", "真题", "高频"], "difficulty": 4}, {"id": "crim-119", "type": "qa", "topic": "专题二 不作为犯", "front": "出租车司机见男乘客强奸女乘客（巩固题1）、大巴司机见乘客甲盗窃乘客乙（2023年试题）——司机有无阻止义务？\"依赖关系\"如何定义？", "points": ["都有阻止义务，且来源有二：① 职务、业务产生的保护义务；② 特定领域产生的保护义务", "出租车司机不阻止强奸 → 构成强奸罪的不作为形式的帮助犯", "大巴有其他乘客≠乙可依赖他们：其他乘客没有刑法上的作为义务 → 乙只能依赖司机", "依赖关系定义：现场没有其他人；或有其他人但他们无作为义务；或有义务但缺乏作为能力——被害人只能依赖行为人消除危险"], "back": "这段\"依赖关系\"的定义是教材给出的标准表述，主观题论证特定领域义务时可直接引用。", "law": [], "source": "2026主观题刑法攻略（精讲） p.20", "tags": ["不作为犯", "特定领域", "依赖关系", "真题"], "difficulty": 4}, {"id": "crim-120", "type": "qa", "topic": "专题二 不作为犯", "front": "不作为犯的\"能为\"与\"不为\"要件分别如何判断？（脚抽筋案 / 车间压伤案 2010年52题 / 逃逸致死）", "points": ["【能为=作为可能性】从行为人自身能力 + 客观条件两方面判断。例：大叔带小孩游泳双双落水，大叔脚抽筋自身难保 → 不构成不作为犯", "【不为的前提=结果避免可能性】履行义务危害结果就不会发生，处罚不履行才有意义", "车间案：甲操作不当致机器压伤乙、乙濒临死亡，甲不救乙很快死亡 → 救了也救不活 → 不构成不作为犯罪，只构成过失致人死亡罪", "交通肇事\"因逃逸致人死亡\"：若伤者头盖骨破裂，立即送最近医院也无法挽救 → 肇事者逃逸不属于\"因逃逸致人死亡\""], "back": "结果避免可能性是隐蔽考点：先确认\"救得活\"，再谈不作为的因果关系与归责。", "law": [], "source": "2026主观题刑法攻略（精讲） p.21", "tags": ["不作为犯", "作为可能性", "结果避免可能性", "真题"], "difficulty": 4}, {"id": "crim-121", "type": "framework", "topic": "专题二 不作为犯", "front": "（专业训练·追赶小偷溺亡案，2025年案例分析指导用书）颜某(17岁)、韩某(当天14岁生日)追打偷自行车的周某(13岁)致其跳河；二人见周某呼救不救并阻止船主蒋某拉绳；公务人员张某旁观未救；周某溺亡。各行为人如何定性？", "points": ["颜某、韩某：先前严重暴力追打致周某迫不得已跳水 → 先行行为产生救助义务；明知会死拒不救助且阻碍他人救助 → 直接故意 → 不作为的故意杀人罪（追赶扭送有正当性，但不作为杀人明显超过扭送限度）", "蒋某被扳手顶头被迫解绳：解绳使周某丧失自救条件、直接致死 → 作为方式的故意杀人行为；但受暴力威胁保命 → 具紧急避险性质，以命换命超过限度 → 避险过当，减轻或免除处罚；从共犯角度系胁从犯，减轻或免除处罚", "张某：围观者无法定救助义务（我国无\"见危不救罪\"），无职务/业务/其他义务来源 → 不构成犯罪", "韩某当天14岁生日 = 不满14周岁；对妨害公务、故意伤害致人重伤（事实五，系颜某所为且无共同故意）不负责；事实五也不属于《刑法》第17条第3款低龄追诉情形", "韩某逃跑推倒朱某致其心脏病发死亡：特殊体质不影响因果关系 → 疏忽大意的过失 → 过失致人死亡罪（若情节显著轻微、结果过于异常可排除刑法上因果关系）"], "back": "一案串五考点：先行行为义务、直接故意认定、避险过当与胁从犯竞合、见危不救的无罪结论、特殊体质因果关系。生日当天 = 不满周岁（满周岁从生日次日起算）是隐蔽得分点。", "law": ["《刑法》第17条第3款"], "source": "2026主观题刑法攻略（精讲） p.21-23", "tags": ["不作为犯", "案例分析", "共同犯罪", "避险过当", "高频"], "difficulty": 5}, {"id": "crim-201", "type": "goldline", "topic": "无法查明", "front": "【必背金句】结果无法查明时的答题表述？（单独犯罪 / 共同犯罪）", "points": ["单独犯罪：根据事实存疑有利于被告人的原则，行为人不需要对××结果负责", "共同犯罪：由于无法查明谁的行为造成××结果，但甲、乙构成共同犯罪（共同正犯），无须查明，根据\"部分实行，全部责任\"的原则，甲、乙均应对××结果负责"], "law": [], "source": "26刑法考前必背金句 p.1", "tags": ["必背金句", "因果关系"], "difficulty": 3}, {"id": "crim-202", "type": "goldline", "topic": "不作为犯罪", "front": "【必背金句】不作为犯罪的答题表述模板？", "points": ["客观上行为人负有××义务，有能力而不履行该义务，造成某某结果。主观上行为人对该结果具有故意（过失），故构成不作为形式的××罪"], "law": [], "source": "26刑法考前必背金句 p.1", "tags": ["必背金句", "不作为犯"], "difficulty": 2}, {"id": "crim-203", "type": "goldline", "topic": "结果加重犯", "front": "【必背金句】结果加重犯的答题表述模板？", "points": ["行为人的××行为造成了基本犯以外的加重结果（重伤、死亡），由于××行为与加重结果具有因果关系，故行为人构成××罪的结果加重犯"], "law": [], "source": "26刑法考前必背金句 p.1", "tags": ["必背金句", "结果加重犯"], "difficulty": 2}, {"id": "crim-204", "type": "goldline", "topic": "因果关系", "front": "【必背金句】介入因素下因果关系的两种答题表述？", "points": ["肯定：由于介入因素并不异常，前行为与××结果之间具有因果关系", "否定：由于介入因素异常且作用更大，中断了前行为与××结果之间的因果关系，故行为人的前行为与××结果没有因果关系"], "law": [], "source": "26刑法考前必背金句 p.1", "tags": ["必背金句", "因果关系", "介入因素"], "difficulty": 3}, {"id": "crim-205", "type": "goldline", "topic": "正当防卫六种情形", "front": "【必背金句】正当防卫六种情形的答题表述？（一般／假想／不适时／过当／特殊／偶然）", "points": ["① 一般防卫（手段过当、结果不过当）：行为人××制止不法侵害的行为，虽然防卫手段过当，但没有造成过当结果，故成立正当防卫", "② 假想防卫：不构成故意犯罪；有过失 → 过失犯罪（过失致人死亡/重伤）；无过失 → 意外事件", "③ 防卫不适时：不法侵害尚未开始（或已经结束），反击行为属于事前（事后）防卫，应认定为××罪", "④ 防卫过当：明显超过必要限度且造成过当结果（重伤/死亡），对过当结果至少有过失，认定为××罪，但应当减轻或者免除处罚", "⑤ 特殊防卫：××的行为属于严重危及人身安全的暴力犯罪，反击属特殊防卫，即使造成××死亡也不属于防卫过当，不构成犯罪", "⑥ 偶然防卫（观点展示）：客观上制止了不法侵害但主观上缺乏防卫认识——防卫认识不要说 → 正当防卫；防卫认识必要说 → ××罪未遂（故意场合，因未造成法益侵害结果）/ 不构成犯罪（过失场合）"], "law": [], "source": "26刑法考前必背金句 p.1", "tags": ["必背金句", "正当防卫", "观点展示", "高频"], "difficulty": 4}, {"id": "crim-206", "type": "goldline", "topic": "犯罪故意", "front": "【必背金句】犯罪故意的答题表述模板？", "points": ["认识到结果必然/可能发生，希望/放任结果的发生，构成××罪（故意犯罪）"], "law": [], "source": "26刑法考前必背金句 p.1", "tags": ["必背金句", "主观要件"], "difficulty": 2}, {"id": "crim-207", "type": "goldline", "topic": "犯罪过失", "front": "【必背金句】犯罪过失的答题表述模板？", "points": ["认识到结果可能发生／应当预 <body>
<div class="wrap">
  <header>
    <div>
      <h1>⚖️ 法考主观题记忆训练</h1>
      <div class="sub" id="subtitle">间隔重复 · 数据由 Claude 维护</div>
    </div>
    <div class="row">
      <button class="ghost" id="reloadBtn" title="Claude 修改数据后点此刷新">↻ 重新加载</button>
      <button class="ghost" id="settingsBtn">⚙︎</button>
    </div>
  </header>

  <div id="settings" class="card hide">
    <div class="meta"><span>设置</span></div>
    <div style="padding:16px 18px">
      <label class="row" style="justify-content:space-between">
        <span>每日新卡上限</span>
        <input id="newPerDay" type="number" min="0" max="200" style="width:80px;padding:6px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text)">
      </label>
      <div class="row" style="margin-top:14px;justify-content:space-between">
        <button class="ghost" id="exportBtn">⬇︎ 导出学习进度</button>
        <button class="ghost" id="resetBtn" style="color:var(--again)">清空学习进度</button>
      </div>
      <div class="hint" style="text-align:left;margin-top:10px">进度保存在本浏览器（localStorage），与卡片内容分离。Claude 增删改卡片不会丢失你的进度。</div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard">
    <div class="stats">
      <div class="stat due"><b id="s-due">0</b><span>待复习</span></div>
      <div class="stat newc"><b id="s-new">0</b><span>新卡</span></div>
      <div class="stat"><b id="s-learned">0</b><span>已学</span></div>
      <div class="stat"><b id="s-total">0</b><span>卡片总数</span></div>
    </div>
    <div class="decks" id="deckChips"></div>
    <button class="cta" id="startBtn">开始今日复习</button>
    <div class="hint" id="dashHint"></div>
  </div>

  <!-- REVIEW -->
  <div id="review" class="hide">
    <div class="card">
      <div class="meta">
        <span><span class="badge" id="r-type"></span> <span id="r-topic"></span></span>
        <span id="r-progress"></span>
      </div>
      <div class="front" id="r-front"></div>
      <div class="back hide" id="r-back"></div>
    </div>
    <button class="reveal" id="revealBtn">显示答案 <span style="color:var(--muted)">(空格)</span></button>
    <div class="grades hide" id="gradeBtns">
      <button class="g-again" data-g="again">重来<small id="t-again"></small></button>
      <button class="g-hard"  data-g="hard">困难<small id="t-hard"></small></button>
      <button class="g-good"  data-g="good">良好<small id="t-good"></small></button>
      <button class="g-easy"  data-g="easy">简单<small id="t-easy"></small></button>
    </div>
    <div class="hint">快捷键：空格 翻面 · 1/2/3/4 评分 · Esc 退出</div>
  </div>

  <div id="error" class="hide"></div>
</div>

<script>
const DAY = 86400000;
const LS_PROGRESS = 'fakao.progress.v1';
const LS_SETTINGS = 'fakao.settings.v1';
const LS_NEWLOG   = 'fakao.newlog.v1';

let CARDS = [];          // all cards (flat), each gets ._deck and ._color
let DECKS = [];          // manifest decks
let progress = load(LS_PROGRESS, {});
let settings = load(LS_SETTINGS, { newPerDay: 15 });
let activeDecks = null;  // Set of enabled deck ids (null = all)
let queue = [], cur = null, reviewedThisSession = 0, introducedToday = new Set();

function load(k, d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch{ return d; } }
function save(k, v){ localStorage.setItem(k, JSON.stringify(v)); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }

// ---------- new-card daily budget ----------
function newLog(){
  let l = load(LS_NEWLOG, {date:'', count:0});
  if(l.date !== todayStr()) l = {date:todayStr(), count:0};
  return l;
}
function newRemaining(){ return Math.max(0, (settings.newPerDay||0) - newLog().count); }
function bumpNew(id){
  if(introducedToday.has(id)) return;
  introducedToday.add(id);
  let l = newLog(); l.count++; save(LS_NEWLOG, l);
}

// ---------- data loading ----------
async function loadData(){
  try{
    const man = window.__FAKAO_DATA__.manifest;
    DECKS = man.decks;
    document.getElementById('subtitle').textContent =
      (man.title||'法考') + ' · ' + (man.stage||'') + ' · 数据由 Claude 维护';
    const all = [];
    for(const d of DECKS){
      try{
        const dj = window.__FAKAO_DATA__.decks[d.file];
        (dj.cards||[]).forEach(c => { c._deck=d.id; c._color=d.color; all.push(c); });
      }catch(e){ console.warn('deck failed', d.file, e); }
    }
    CARDS = all;
    if(activeDecks===null) activeDecks = new Set(DECKS.map(d=>d.id));
    document.getElementById('error').classList.add('hide');
    renderDashboard();
  }catch(e){
    showLoadError();
  }
}
function showLoadError(){
  const el = document.getElementById('error');
  el.className='err';
  el.innerHTML = `<b>无法加载卡片数据。</b><br>本应用需要通过本地服务器打开（不能直接双击 html）。<br><br>
    在终端运行：<br><code>cd "$(pwd)"/fakao-trainer && python3 -m http.server 8000</code><br><br>
    然后用 <b>Chrome</b> 打开 <code>http://localhost:8000</code> 。`;
  document.getElementById('dashboard').classList.add('hide');
}

// ---------- scheduling (SM-2 variant) ----------
function isDue(c){
  const p = progress[c.id];
  if(!p) return false;            // new handled separately
  return p.due <= Date.now();
}
function isNew(c){ return !progress[c.id]; }

function predict(c, grade){
  // returns {ease,intervalDays,reps,lapses,state} WITHOUT saving
  let p = progress[c.id] || { ease:2.5, intervalDays:0, reps:0, lapses:0, state:'new' };
  p = {...p};
  const fresh = (p.state==='new' || p.reps===0);
  if(grade==='again'){
    p.lapses = (p.lapses||0) + (fresh?0:1);
    p.ease = Math.max(1.3, p.ease - 0.2);
    p.intervalDays = 0; p.reps = 0; p.state = fresh ? 'new':'review';
  } else if(grade==='hard'){
    p.ease = Math.max(1.3, p.ease - 0.15);
    p.intervalDays = fresh ? 1 : Math.max(1, Math.round(p.intervalDays*1.2));
    p.reps++; p.state='review';
  } else if(grade==='good'){
    p.intervalDays = fresh ? 1 : Math.max(1, Math.round(p.intervalDays*p.ease));
    p.reps++; p.state='review';
  } else { // easy
    p.ease = p.ease + 0.15;
    p.intervalDays = fresh ? 3 : Math.max(1, Math.round(p.intervalDays*p.ease*1.3));
    p.reps++; p.state='review';
  }
  return p;
}
function fmtInterval(days){
  if(days<=0) return '<1分钟';
  if(days===1) return '1天';
  if(days<30) return days+'天';
  if(days<365) return Math.round(days/30)+'个月';
  return (days/365).toFixed(1)+'年';
}

// ---------- dashboard ----------
function inActive(c){ return activeDecks.has(c._deck); }
function renderDashboard(){
  const due = CARDS.filter(c=>inActive(c) && isDue(c)).length;
  const newAvail = Math.min(newRemaining(), CARDS.filter(c=>inActive(c) && isNew(c)).length);
  const learned = CARDS.filter(c=>progress[c.id]).length;
  document.getElementById('s-due').textContent = due;
  document.getElementById('s-new').textContent = newAvail;
  document.getElementById('s-learned').textContent = learned;
  document.getElementById('s-total').textContent = CARDS.length;

  const chips = document.getElementById('deckChips');
  chips.innerHTML='';
  for(const d of DECKS){
    const total = CARDS.filter(c=>c._deck===d.id).length;
    const dueN = CARDS.filter(c=>c._deck===d.id && isDue(c)).length;
    const newN = CARDS.filter(c=>c._deck===d.id && isNew(c)).length;
    const on = activeDecks.has(d.id);
    const el = document.createElement('div');
    el.className = 'chip'+(on?'':' off');
    el.innerHTML = `<span class="dot" style="background:${d.color}"></span>${d.id}
      <span class="cnt">${dueN}/${newN}/${total}</span>`;
    el.title = '待复习/新卡/总数';
    el.onclick = ()=>{ on?activeDecks.delete(d.id):activeDecks.add(d.id);
      if(activeDecks.size===0) activeDecks.add(d.id); renderDashboard(); };
    chips.appendChild(el);
  }
  const start = document.getElementById('startBtn');
  const ready = due + newAvail;
  start.disabled = ready===0;
  start.textContent = ready>0 ? `开始复习（${ready} 张）` : '今日已无待复习卡片 🎉';
  document.getElementById('dashHint').textContent =
    `共 ${CARDS.length} 张卡片，覆盖 ${DECKS.length} 个学科 · 每日新卡上限 ${settings.newPerDay}`;
}

// ---------- review session ----------
function buildQueue(){
  const dueCards = CARDS.filter(c=>inActive(c) && isDue(c));
  let newCards = CARDS.filter(c=>inActive(c) && isNew(c)).slice(0, newRemaining());
  // interleave a little: due first, then new
  queue = [...shuffle(dueCards), ...newCards].map(c=>c.id);
  reviewedThisSession = 0; introducedToday = new Set();
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const k=Math.floor(Math.random()*(i+1));[a[i],a[k]]=[a[k],a[i]];} return a; }

function startReview(){
  buildQueue();
  if(queue.length===0){ renderDashboard(); return; }
  document.getElementById('dashboard').classList.add('hide');
  document.getElementById('settings').classList.add('hide');
  document.getElementById('review').classList.remove('hide');
  nextCard();
}
function nextCard(){
  if(queue.length===0) return finishReview();
  cur = CARDS.find(c=>c.id===queue[0]);
  if(!cur){ queue.shift(); return nextCard(); }
  // front
  document.getElementById('r-back').classList.add('hide');
  document.getElementById('gradeBtns').classList.add('hide');
  document.getElementById('revealBtn').classList.remove('hide');
  const typeMap={framework:'分析框架',essay:'论述要点',statute:'法条记忆',distinguish:'易混辨析',qa:'知识点',goldline:'必背金句'};
  const t=document.getElementById('r-type');
  t.textContent = typeMap[cur.type]||cur.type||'卡片';
  t.style.background = cur._color || 'var(--accent)';
  document.getElementById('r-topic').textContent = cur._deck + (cur.topic? ' · '+cur.topic : '');
  document.getElementById('r-progress').textContent = '剩余 '+queue.length;
  document.getElementById('r-front').textContent = cur.front || '';
  renderBack();
}
function renderBack(){
  const b=document.getElementById('r-back');
  let h='';
  if(cur.points && cur.points.length){
    h+='<div class="sec-label">要点</div><ul class="points">';
    cur.points.forEach(p=> h+='<li>'+escapeHtml(p)+'</li>');
    h+='</ul>';
  }
  if(cur.back){ h+='<div class="sec-label">说明 / 易错</div><div class="note">'+escapeHtml(cur.back)+'</div>'; }
  if(cur.law && cur.law.length){
    h+='<div class="sec-label">法条</div><div class="laws">';
    cur.law.forEach(l=> h+='<span class="law">'+escapeHtml(l)+'</span>');
    h+='</div>';
  }
  if(cur.tags && cur.tags.length){
    h+='<div class="tags">';
    cur.tags.forEach(t=> h+='<span class="tag">#'+escapeHtml(t)+'</span>');
    h+='</div>';
  }
  if(cur.source){
    h+='<div class="source">📖 来源：'+escapeHtml(cur.source)+'</div>';
  }
  b.innerHTML = h || '<div class="note">（此卡暂无答案内容，可让 Claude 补充）</div>';
}
function reveal(){
  document.getElementById('r-back').classList.remove('hide');
  document.getElementById('revealBtn').classList.add('hide');
  // interval previews
  ['again','hard','good','easy'].forEach(g=>{
    const p=predict(cur,g);
    document.getElementById('t-'+g).textContent = fmtInterval(p.intervalDays);
  });
  document.getElementById('gradeBtns').classList.remove('hide');
}
function grade(g){
  if(document.getElementById('gradeBtns').classList.contains('hide')) return;
  const wasNew = isNew(cur);
  const p = predict(cur, g);
  p.due = p.intervalDays<=0 ? Date.now() : Date.now() + p.intervalDays*DAY;
  progress[cur.id] = p; save(LS_PROGRESS, progress);
  if(wasNew) bumpNew(cur.id);
  reviewedThisSession++;
  // requeue if again (relearn this session), else remove
  if(g==='again'){ queue.push(queue.shift()); }
  else { queue.shift(); }
  nextCard();
}
function finishReview(){
  document.getElementById('review').innerHTML =
    `<div class="done"><div class="big">🎉</div>
      <h2>本轮完成！</h2>
      <p class="sub">本次复习 ${reviewedThisSession} 张卡片</p>
      <button class="cta" style="max-width:240px;margin:18px auto 0" onclick="backToDash()">返回</button>
    </div>`;
}
function backToDash(){ location.reload(); }

function escapeHtml(s){ return String(s).replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

// ---------- wires ----------
document.getElementById('startBtn').onclick = startReview;
document.getElementById('revealBtn').onclick = reveal;
document.getElementById('reloadBtn').onclick = loadData;
document.getElementById('gradeBtns').onclick = e=>{ const b=e.target.closest('button'); if(b) grade(b.dataset.g); };
document.getElementById('settingsBtn').onclick = ()=>{
  const s=document.getElementById('settings'); s.classList.toggle('hide');
  document.getElementById('newPerDay').value = settings.newPerDay;
};
document.getElementById('newPerDay').onchange = e=>{
  settings.newPerDay = Math.max(0, parseInt(e.target.value)||0); save(LS_SETTINGS, settings); renderDashboard();
};
document.getElementById('resetBtn').onclick = ()=>{
  if(confirm('确定清空所有学习进度？卡片内容不受影响。')){ progress={}; save(LS_PROGRESS,progress);
    localStorage.removeItem(LS_NEWLOG); renderDashboard(); alert('已清空。'); }
};
document.getElementById('exportBtn').onclick = ()=>{
  const blob=new Blob([JSON.stringify({progress,exported:todayStr()},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='fakao-progress-'+todayStr()+'.json'; a.click();
};
document.addEventListener('keydown', e=>{
  if(document.getElementById('review').classList.contains('hide')) return;
  if(e.key===' '||e.key==='Enter'){ e.preventDefault();
    if(!document.getElementById('revealBtn').classList.contains('hide')) reveal(); }
  else if(['1','2','3','4'].includes(e.key)){ grade({'1':'again','2':'hard','3':'good','4':'easy'}[e.key]); }
  else if(e.key==='Escape'){ backToDash(); }
});

loadData();
</script>
