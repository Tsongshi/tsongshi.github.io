<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>民诉提升大案例 · 大力公司仲裁裁决司法审查</title>
<style>
  :root{
    --bg:#f6f5f2; --card:#ffffff; --ink:#2b2a28; --sub:#78756e;
    --accent:#3d5a80; --accent2:#e07a5f; --accent3:#5c8a72; --accent4:#8a6fa8;
    --line:#e7e3da; --good:#5c8a72; --mid:#c9a227; --bad:#c15c4a;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px;}
  h1{font-size:20px;margin:4px 0 2px;}
  .meta{color:var(--sub);font-size:13px;margin-bottom:16px;}
  .timer-box{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:16px;font-size:13px;flex-wrap:wrap;}
  .timer-box #timerDisplay{font-variant-numeric:tabular-nums;font-size:18px;font-weight:700;color:var(--accent3);}
  .timer-box.over #timerDisplay{color:var(--bad);}
  .timer-box button{border:none;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;background:#eee;}
  .timer-box button.primary{background:var(--accent);color:#fff;}
  .progress-outer{background:var(--line);border-radius:99px;height:10px;overflow:hidden;margin-bottom:18px;}
  .progress-inner{background:var(--accent3);height:100%;width:0%;transition:width .3s;}
  .otabs{display:flex;gap:8px;margin-bottom:18px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:10;}
  .otab-btn{flex:1;padding:10px 6px;border:none;border-radius:12px;background:var(--card);color:var(--sub);font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--line);}
  .otab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .otabpanel{display:none;}
  .otabpanel.active{display:block;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.03);}

  /* 时间线 */
  .tl-item{display:flex;gap:12px;margin-bottom:10px;}
  .avatar{flex:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;}
  .av-dali{background:var(--accent);}
  .av-chen{background:var(--accent2);}
  .av-court{background:var(--accent4);}
  .av-arb{background:var(--accent3);}
  .tl-body{background:#faf9f6;border-radius:12px;padding:8px 12px;flex:1;font-size:14.5px;}
  .tl-date{font-size:12px;color:var(--sub);margin-bottom:2px;}

  /* 漫画式竖版时间线：一条主线穿起每一格，读起来是"先…然后…" */
  .va-timeline{position:relative;padding-left:46px;margin-bottom:6px;}
  .va-timeline::before{content:'';position:absolute;left:18px;top:2px;bottom:2px;width:2px;background:var(--line);}
  .va-node{position:relative;margin-bottom:12px;}
  .va-node:last-child{margin-bottom:0;}
  .va-node .va-avatar{position:absolute;left:-46px;top:2px;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13.5px;z-index:1;box-shadow:0 0 0 4px var(--bg);}
  .va-node .va-arrow{position:absolute;left:-32px;top:44px;width:12px;height:12px;color:var(--sub);opacity:.55;}
  .va-node:last-child .va-arrow{display:none;}
  .va-card{background:#faf9f6;border:1px solid var(--line);border-radius:14px;padding:10px 14px 11px;}
  .va-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;}
  .va-date{font-size:11px;color:var(--sub);white-space:nowrap;}
  .va-badge{display:inline-block;color:#fff;font-size:10.5px;font-weight:600;border-radius:5px;padding:2px 7px;white-space:nowrap;margin-bottom:4px;}
  .va-badge.reason{background:var(--accent2);}
  .va-badge.key{background:var(--accent3);}
  .va-body{display:flex;align-items:flex-start;gap:9px;}
  .va-body + .va-body{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
  .va-icon{flex:none;width:25px;height:25px;margin-top:1px;}
  .va-icon svg{width:100%;height:100%;display:block;}
  .va-text{flex:1;font-size:13.5px;min-width:0;}
  .bi-en{font-size:12px;color:var(--accent);font-style:italic;margin-top:2px;}

  /* 题目 */
  .qcard{border-left:4px solid var(--accent);}
  .qnum{display:inline-block;background:var(--accent);color:#fff;border-radius:8px;padding:2px 10px;font-size:13px;font-weight:700;margin-bottom:8px;}
  .qscore{display:inline-block;color:var(--sub);font-size:12px;margin-left:8px;}
  .stem-line{margin:2px 0;}
  .stem-ask{font-weight:700;color:var(--accent2);}
  textarea{width:100%;min-height:120px;border-radius:12px;border:1px solid var(--line);padding:10px;font-size:14.5px;font-family:inherit;resize:vertical;background:#fff;}
  .btnrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  button.act{border:none;border-radius:10px;padding:8px 14px;font-size:13.5px;font-weight:600;cursor:pointer;background:#eee;color:var(--ink);}
  button.act.primary{background:var(--accent);color:#fff;}
  .hint-box{background:#fff7ec;border:1px dashed #d8c08a;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:8px;color:#6b5a2e;display:none;}
  .answer-box{display:none;background:#f1f6f3;border-radius:12px;padding:12px;margin-top:10px;font-size:14px;}
  .answer-box .src{font-size:12px;color:var(--sub);margin-top:8px;}
  .answer-box ul{margin:6px 0;padding-left:20px;}
  .kp-conclusion{background:var(--accent3);color:#fff;border-radius:10px;padding:8px 12px;font-weight:700;margin-bottom:8px;}
  .grade-row{display:flex;gap:8px;margin-top:10px;}
  .grade-btn{flex:1;border:none;border-radius:10px;padding:8px 4px;font-size:13px;font-weight:600;cursor:pointer;background:#eee;}
  .grade-btn.g-good.selected{background:var(--good);color:#fff;}
  .grade-btn.g-mid.selected{background:var(--mid);color:#fff;}
  .grade-btn.g-bad.selected{background:var(--bad);color:#fff;}

  /* 考点图解 */
  .kp-card{display:flex;gap:12px;align-items:flex-start;}
  .kp-icon{flex:none;width:44px;height:44px;}
  .kp-tag{display:inline-block;background:var(--accent3);color:#fff;font-size:11px;border-radius:6px;padding:2px 8px;margin-bottom:4px;}
  .kp-title{font-weight:700;margin-bottom:4px;}
  .kp-analogy{background:#fdf3ee;border-radius:10px;padding:8px 10px;font-size:13.5px;color:#7a4a36;margin-top:6px;}

  /* 闯关游戏 */
  .tabs{display:flex;gap:6px;margin-bottom:12px;}
  .tab-btn{flex:1;padding:8px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:13px;cursor:pointer;}
  .tab-btn.active{background:var(--ink);color:#fff;}
  .tabpanel{display:none;}
  .tabpanel.active{display:block;}
  .flashcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;min-height:160px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;}
  .flashcard .side-label{font-size:11px;color:var(--sub);margin-bottom:8px;}
  .fc-nav{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
  .fc-input{width:100%;margin-top:10px;border-radius:10px;border:1px solid var(--line);padding:8px;font-size:13.5px;min-height:60px;}
  .mastery-row{display:flex;gap:8px;margin-top:10px;justify-content:center;}
  .quiz-opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;font-size:14px;cursor:pointer;}
  .quiz-opt.correct{background:#e4f1e8;border-color:var(--good);}
  .quiz-opt.wrong{background:#fbeae7;border-color:var(--bad);}
  .quiz-stat{font-size:13px;color:var(--sub);margin-bottom:8px;}
  .small{font-size:12px;color:var(--sub);}
  .eng-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  .eng-zh{font-weight:700;margin-bottom:6px;}
  .eng-en{color:var(--accent);font-style:italic;margin-bottom:8px;}
  .eng-src{font-size:11px;color:var(--sub);}

  /* 朗读播放按钮：右侧小圆钮 + 隐藏 audio，代替行内大播放条 */
  .tts-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .tts-row>.tts-txt{flex:1;min-width:0;}
  .tts-btn{flex:none;width:28px;height:20px;border:none;border-radius:6px;background:var(--accent3);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:2px;padding:0;margin-top:3px;transition:opacity .15s;}
  .tts-btn:hover{opacity:.88;}
  .tts-btn .bar{width:2.5px;background:#fff;border-radius:1px;height:6px;}
  .tts-btn .bar:nth-child(2){height:11px;}
  .tts-btn .bar:nth-child(3){height:8px;}
  .tts-btn.playing .bar{animation:tts-wave .9s ease-in-out infinite;}
  .tts-btn.playing .bar:nth-child(2){animation-delay:.15s;}
  .tts-btn.playing .bar:nth-child(3){animation-delay:.3s;}
  @keyframes tts-wave{0%,100%{height:5px;}50%{height:12px;}}
</style>
</head>

<div class="wrap">
  <h1>民诉提升大案例 · 仲裁裁决司法审查</h1>
  <div class="meta">大力公司 vs 陈某某 · 仲裁机构确定 / 程序违法 / 枉法裁决 / 不予执行 · 官方民诉窗口（提升大案例） · V2：参考答案已按竹马官方解析核对更新，含分值</div>

  <div class="timer-box" id="timerBox">
    <span>⏱ 建议限时 45 分钟</span>
    <span id="timerDisplay">45:00</span>
    <button class="primary" id="timerToggle">开始</button>
    <button id="timerReset">重置</button>
  </div>

  <div class="progress-outer"><div class="progress-inner" id="progressBar"></div></div>

  <div class="otabs">
    <button class="otab-btn active" data-otab="do">做题及批改</button>
    <button class="otab-btn" data-otab="kp">考点图解</button>
    <button class="otab-btn" data-otab="game">闯关游戏</button>
  </div>

  <!-- ============ 做题及批改 ============ -->
  <div class="otabpanel active" id="otab-do">

    <div class="va-timeline" id="timeline-container"></div>

    <div id="questions"></div>
  </div>

  <!-- ============ 考点图解 ============ -->
  <div class="otabpanel" id="otab-kp">
    <div id="kpContainer"></div>
  </div>

  <!-- ============ 闯关游戏 ============ -->
  <div class="otabpanel" id="otab-game">
    <div class="tabs">
      <button class="tab-btn active" data-tab="flash">记忆闪卡</button>
      <button class="tab-btn" data-tab="quiz">选择题闯关</button>
      <button class="tab-btn" data-tab="eng">英文金句</button>
    </div>
    <div class="tabpanel active" id="tab-flash">
      <div class="quiz-stat" id="fcCounter"></div>
      <div class="flashcard" id="flashcardEl"></div>
      <textarea class="fc-input" id="fcSelfInput" placeholder="先自己写一遍答案，再点卡片翻面对答案…"></textarea>
      <div class="fc-nav">
        <button class="act" id="fcPrev">‹ 上一张</button>
        <button class="act primary" id="fcToggle">显示/隐藏答案</button>
        <button class="act" id="fcNext">下一张 ›</button>
      </div>
      <div class="mastery-row">
        <button class="act" id="fcNotYet">还没记住</button>
        <button class="act primary" id="fcMastered">记住了 ✓</button>
      </div>
    </div>
    <div class="tabpanel" id="tab-quiz">
      <div class="quiz-stat" id="quizStat"></div>
      <div id="quizStem" style="font-weight:700;margin-bottom:10px;"></div>
      <div id="quizOpts"></div>
      <button class="act primary" id="quizNext" style="display:none;">下一题 ›</button>
    </div>
    <div class="tabpanel" id="tab-eng">
      <div id="engContainer"></div>
    </div>
  </div>

</div>

const TTS_BARS = '<span class="bar"></span><span class="bar"></span><span class="bar"></span>';
function ttsTag(id){
  if(!TTS_AUDIO[id]) return '';
  return `<button type="button" class="tts-btn" aria-label="朗读" onclick="playTTS('${id}',this)">${TTS_BARS}</button><audio id="ttsaud-${id}" data-tts style="display:none" preload="none"></audio>`;
}
function playTTS(id, btn){
  const audio = document.getElementById('ttsaud-'+id);
  if(!audio) return;
  if(!audio.src && TTS_AUDIO[id]){
    audio.src = TTS_AUDIO[id];
  }
  document.querySelectorAll('audio[data-tts]').forEach(a=>{
    if(a !== audio && !a.paused){ a.pause(); a.currentTime = 0; }
  });
  document.querySelectorAll('.tts-btn.playing').forEach(b=>{
    if(b !== btn) b.classList.remove('playing');
  });
  if(audio.paused){
    audio.currentTime = 0;
    audio.play();
    btn.classList.add('playing');
    audio.onended = ()=>{ btn.classList.remove('playing'); };
  } else {
    audio.pause();
    btn.classList.remove('playing');
  }
}

/* ---- 选择题闯关 ---- */
// 用 5 道题的结论句作为正确项，互相之间作为干扰项
const quizPool = qData.map(q=>({stem: q.stem.join('') + ' ' + q.ask, correct: q.points[0]}));
let quizIdx = 0;
let quizStreak = 0;
let quizBest = state.quizBest || 0;
function shuffle(arr){ return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]); }
function renderQuiz(){
  const item = quizPool[quizIdx % quizPool.length];
  document.getElementById('quizStem').textContent = item.stem;
  document.getElementById('quizStat').textContent = `连对 ${quizStreak}（最佳 ${quizBest}） · 第 ${quizIdx+1} 题`;
  const distractors = quizPool.filter(p=>p!==item).map(p=>p.correct);
  const opts = shuffle([item.correct, ...shuffle(distractors).slice(0,3)]);
  const optEl = document.getElementById('quizOpts');
  optEl.innerHTML = '';
  document.getElementById('quizNext').style.display = 'none';
  opts.forEach(opt=>{
    const b = document.createElement('button');
    b.className = 'quiz-opt';
    b.textContent = opt;
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.quiz-opt').forEach(o=>o.disabled=true);
      if(opt === item.correct){
        b.classList.add('correct');
        quizStreak++;
        if(quizStreak > quizBest){ quizBest = quizStreak; state.quizBest = quizBest; saveState(state); }
      }else{
        b.classList.add('wrong');
        quizStreak = 0;
        document.querySelectorAll('.quiz-opt').forEach(o=>{ if(o.textContent===item.correct) o.classList.add('correct'); });
      }
      document.getElementById('quizNext').style.display = 'inline-block';
    });
    optEl.appendChild(b);
  });
}
document.getElementById('quizNext').addEventListener('click', ()=>{
  quizIdx++; renderQuiz();
});
renderQuiz();

/* ---------------- 限时计时器 ---------------- */
let timerSeconds = 45*60;
let timerInterval = null;
const timerDisplay = document.getElementById('timerDisplay');
const timerBox = document.getElementById('timerBox');
const timerToggle = document.getElementById('timerToggle');
function formatTime(s){
  const sign = s < 0 ? '-' : '';
  const abs = Math.abs(s);
  const m = Math.floor(abs/60);
  const sec = abs%60;
  return `${sign}${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
function tickTimer(){
  timerSeconds--;
  timerDisplay.textContent = formatTime(timerSeconds);
  timerBox.classList.toggle('over', timerSeconds < 0);
}
timerToggle.addEventListener('click', ()=>{
  if(timerInterval){
    clearInterval(timerInterval);
    timerInterval = null;
    timerToggle.textContent = '继续';
  }else{
    timerInterval = setInterval(tickTimer, 1000);
    timerToggle.textContent = '暂停';
  }
});
document.getElementById('timerReset').addEventListener('click', ()=>{
  clearInterval(timerInterval);
  timerInterval = null;
  timerSeconds = 45*60;
  timerDisplay.textContent = formatTime(timerSeconds);
  timerBox.classList.remove('over');
  timerToggle.textContent = '开始';
});
</script>

<div style="max-width:820px;margin:36px auto 56px;padding:16px 18px 4px;border-top:1px solid currentColor;border-color:rgba(128,128,128,.28);text-align:center;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',Arial,sans-serif;font-size:13px;">
  <div style="opacity:.6;margin-bottom:10px;">练习进度保存在本机浏览器。换设备或换网址前，可以导出带走。</div>
  <button type="button" id="pioExport" style="font:inherit;cursor:pointer;background:transparent;color:inherit;border:1px solid currentColor;border-radius:8px;padding:6px 14px;margin:0 4px;opacity:.75;">导出进度</button>
  <button type="button" id="pioImport" style="font:inherit;cursor:pointer;background:transparent;color:inherit;border:1px solid currentColor;border-radius:8px;padding:6px 14px;margin:0 4px;opacity:.75;">导入进度</button>
  <input type="file" id="pioFile" accept="application/json,.json" style="display:none">
  <div id="pioMsg" style="margin-top:10px;min-height:1.2em;opacity:.7;"></div>
</div>
<script>
(function(){
  var KEY = "minsu_zhongcai_dali2026";
  var msgEl = document.getElementById("pioMsg");
  function msg(t){ msgEl.textContent = t; if(t) setTimeout(function(){ if(msgEl.textContent===t) msgEl.textContent=""; }, 4000); }

  document.getElementById("pioExport").addEventListener("click", function(){
    var raw = localStorage.getItem(KEY);
    if(!raw){ msg("还没有进度可以导出"); return; }
    var payload;
    try{ payload = JSON.parse(raw); }catch(e){ msg("本机进度已损坏，无法导出"); return; }
    var out = JSON.stringify({ key: KEY, savedAt: new Date().toISOString(), data: payload }, null, 2);
    var blob = new Blob([out], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = KEY + "-" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    msg("已导出，文件在下载文件夹");
  });

  var fileEl = document.getElementById("pioFile");
  document.getElementById("pioImport").addEventListener("click", function(){ fileEl.value=""; fileEl.click(); });

  fileEl.addEventListener("change", function(){
    var f = fileEl.files && fileEl.files[0];
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try{ parsed = JSON.parse(reader.result); }catch(e){ msg("读取失败：不是有效的进度文件"); return; }
      if(!parsed || parsed.data === undefined){ msg("读取失败：文件格式不对"); return; }
      if(parsed.key && parsed.key !== KEY){
        if(!confirm("这份进度来自「" + parsed.key + "」，与当前练习不是同一个。仍要导入并覆盖当前进度吗？")) { msg("已取消"); return; }
      } else if(localStorage.getItem(KEY)){
        if(!confirm("将覆盖本机当前进度，确定吗？")) { msg("已取消"); return; }
      }
      try{ localStorage.setItem(KEY, JSON.stringify(parsed.data)); }
      catch(e){ msg("写入失败：浏览器存储空间不足"); return; }
      msg("导入成功，正在刷新…");
      setTimeout(function(){ location.reload(); }, 700);
    };
    reader.onerror = function(){ msg("读取文件失败"); };
    reader.readAsText(f);
  });
})();
</script>
