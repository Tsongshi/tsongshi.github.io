<style>

    --line:#e7e3da; --good:#5c8a72; --mid:#c9a227; --bad:#c15c4a;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px;}
  h1{font-size:20px;margin:4px 0 2px;}
  .meta{color:var(--sub);font-size:13px;margin-bottom:16px;}
  .progress-outer{background:var(--line);border-radius:99px;height:10px;overflow:hidden;margin-bottom:18px;}
  .progress-inner{background:var(--accent3);height:100%;width:0%;transition:width .3s;}
  .otabs{display:flex;gap:8px;margin-bottom:18px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:10;}
  .otab-btn{flex:1;padding:10px 6px;border:none;border-radius:12px;background:var(--card);color:var(--sub);font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--line);}
  .otab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .otabpanel{display:none;}
  .otabpanel.active{display:block;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.03);}

  .topic-head{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;}
  .topic-num{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .topic-name{font-size:16px;font-weight:700;}
  .topic-name-en{font-size:12.5px;color:var(--sub);font-style:italic;}
  .sub-label{font-size:12px;color:var(--accent3);font-weight:600;margin:10px 0 4px;}
  .sub-label:first-child{margin-top:0;}
  .tmpl-row{background:#faf9f6;border-radius:12px;padding:10px 12px;margin-bottom:8px;}
  .tmpl-row:last-child{margin-bottom:0;}
  .tmpl-row.done{outline:1.5px solid var(--accent3);}
  .ph{color:var(--accent2);font-weight:700;}


  .tts-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .tts-row>.tts-txt{flex:1;min-width:0;font-size:14px;}
  .bi-en{font-size:12px;color:var(--accent);font-style:italic;margin-top:4px;}
  .tts-btn{flex:none;width:28px;height:20px;border:none;border-radius:6px;background:var(--accent3);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:2px;padding:0;margin-top:2px;transition:opacity .15s;}
  .tts-btn:hover{opacity:.88;}
  .tts-btn .bar{width:2.5px;background:#fff;border-radius:1px;height:6px;}
  .tts-btn .bar:nth-child(2){height:11px;}
  .tts-btn .bar:nth-child(3){height:8px;}
  .tts-btn.playing .bar{animation:tts-wave .9s ease-in-out infinite;}
  .tts-btn.playing .bar:nth-child(2){animation-delay:.15s;}
  .tts-btn.playing .bar:nth-child(3){animation-delay:.3s;}
  @keyframes tts-wave{0%,100%{height:5px;}50%{height:12px;}}

  /* 辨析对比 */
  .dis-card .dis-title{font-weight:700;font-size:15px;margin-bottom:2px;}
  .dis-card .dis-title-en{font-size:12.5px;color:var(--sub);font-style:italic;margin-bottom:10px;}
  .dis-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .dis-col{background:#faf9f6;border-radius:12px;padding:10px 12px;}
  .dis-col .dis-col-h{font-size:12px;font-weight:700;color:var(--accent4);margin-bottom:6px;}
  .dis-key{background:#fdf3ee;border-radius:10px;padding:8px 10px;font-size:13.5px;color:#7a4a36;}
  @media (max-width:480px){.dis-grid{grid-template-columns:1fr;}}

  /* 闯关游戏 */
  .tabs{display:flex;gap:6px;margin-bottom:12px;}
  .tab-btn{flex:1;padding:8px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:13px;cursor:pointer;}
  .tab-btn.active{background:var(--ink);color:#fff;}
  .tabpanel{display:none;}
  .tabpanel.active{display:block;}
  .flashcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;min-height:160px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;}
  .flashcard .side-label{font-size:11px;color:var(--sub);margin-bottom:8px;}
  .fc-nav{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
  .fc-input{width:100%;margin-top:10px;border-radius:10px;border:1px solid var(--line);padding:8px;font-size:13.5px;min-height:60px;}
  .mastery-row{display:flex;gap:8px;margin-top:10px;justify-content:center;}
  .quiz-opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;font-size:14px;cursor:pointer;}
  .quiz-opt.correct{background:#e4f1e8;border-color:var(--good);}
  .quiz-opt.wrong{background:#fbeae7;border-color:var(--bad);}
  .quiz-stat{font-size:13px;color:var(--sub);margin-bottom:8px;}
  button.act{border:none;border-radius:10px;padding:8px 14px;font-size:13.5px;font-weight:600;cursor:pointer;background:#eee;color:var(--ink);}
  button.act.primary{background:var(--accent);color:#fff;}
  .small{font-size:12px;color:var(--sub);}
</style>

<script>

};
function ttsTag(id){
  if(!TTS_AUDIO[id]) return '';
  return `<button type="button" class="tts-btn" aria-label="朗读" onclick="playTTS('${id}',this)"><span class="bar"></span><span class="bar"></span><span class="bar"></span></button><audio id="ttsaud-${id}" data-tts style="display:none" preload="none"></audio>`;
}
function playTTS(id, btn){
  const audio = document.getElementById('ttsaud-'+id);
  if(!audio) return;
  if(!audio.src && TTS_AUDIO[id]){
    audio.src = TTS_AUDIO[id];
  }
  document.querySelectorAll('audio[data-tts]').forEach(a=>{
    if(a !== audio && !a.paused){ a.pause(); a.currentTime = 0; }
  });
  document.querySelectorAll('.tts-btn.playing').forEach(b=>{
    if(b !== btn) b.classList.remove('playing');
  });
  if(audio.paused){
    audio.currentTime = 0;
    audio.play();
    btn.classList.add('playing');
    audio.onended = ()=>{ btn.classList.remove('playing'); };
  } else {
    audio.pause();
    btn.classList.remove('playing');
  }
}
function hl(text){
  return text.replace(/(XX|YY|某某)/g, '<span class="ph">$1</span>');
}
function biLine(zhId, zhText, enId, enText){
  return `
    <div class="tts-row"><span class="tts-txt">${hl(zhText)}</span>${ttsTag(zhId)}</div>
    <div class="tts-row bi-en"><span class="tts-txt">${hl(enText)}</span>${ttsTag(enId)}</div>`;
}

/* ---------------- 数据：10个考点，18条金句模板 ---------------- */
const TOPICS = [
  {num:'一', name:'无法查明', nameEn:'Unable to Ascertain', items:[
    {id:'t1-0', label:'单独犯罪', zh:'根据事实存疑有利于被告人的原则，行为人不需要对XX结果负责。',
     en:'Under the principle that factual doubt favors the defendant, the actor need not be held responsible for the XX outcome.'},
    {id:'t1-1', label:'共同犯罪', zh:'由于无法查明谁的行为造成XX结果，但甲、乙构成共同犯罪（共同正犯），无须查明，根据"部分实行，全部责任"的原则，甲、乙均应对XX结果负责。',
     en:'Since it cannot be ascertained whose act caused the XX outcome, but A and B constitute joint principal offenders, ascertainment is unnecessary — under the principle "partial performance, full responsibility," both A and B are liable for the XX outcome.'}
  ]},
  {num:'二', name:'不作为犯罪', nameEn:'Crime of Omission', items:[
    {id:'t2-0', label:'', zh:'客观上行为人负有XX义务，有能力而不履行该义务，造成某某结果。主观上行为人对该结果具有故意（过失），故构成不作为形式的YY罪。',
     en:'Objectively, the actor owed a duty to XX, had the ability to perform it but failed to, causing the outcome. Subjectively, the actor acted with intent (or negligence) as to that outcome — therefore constituting the omission form of crime YY.'}
  ]},
  {num:'三', name:'结果加重犯', nameEn:'Aggravated-Result Offense', items:[
    {id:'t3-0', label:'', zh:'行为人的XX行为造成了基本犯以外的加重结果（重伤、死亡），由于XX行为与加重结果具有因果关系，故行为人构成XX罪的结果加重犯。',
     en:"The actor's XX conduct caused an aggravated result beyond the base offense (serious injury or death); because that conduct is causally linked to the aggravated result, the actor constitutes the aggravated-result form of crime XX."}
  ]},
  {num:'四', name:'因果关系', nameEn:'Causation', items:[
    {id:'t4-0', label:'介入因素不异常', zh:'由于介入因素并不异常，前行为与XX结果之间具有因果关系。',
     en:'Since the intervening factor was not abnormal, the prior conduct is causally linked to the XX outcome.'},
    {id:'t4-1', label:'介入因素异常', zh:'由于介入因素异常且作用更大，中断了前行为与XX结果之间的因果关系，故行为人的前行为与XX结果没有因果关系。',
     en:"Since the intervening factor was abnormal and played the greater role, it broke the causal chain between the prior conduct and the XX outcome — so the actor's prior conduct is not causally linked to the outcome."}
  ]},
  {num:'五', name:'正当防卫', nameEn:'Justifiable Defense', items:[
    {id:'t5-0', label:'一般防卫·手段过当结果不过当', zh:'行为人XX制止不法侵害的行为，虽然防卫手段过当，但没有造成过当结果，故行为人成立正当防卫。',
     en:"The actor's act of XX to stop the unlawful infringement, though excessive in means, did not produce an excessive result — so the actor's conduct constitutes justifiable self-defense."},
    {id:'t5-1', label:'假想防卫', zh:'假想防卫不构成故意犯罪，如果行为人有过失，就是过失犯罪（过失致人死亡、过失致人重伤），如果防卫人没有过失，就按照意外事件处理。',
     en:'Putative (mistaken) self-defense does not constitute an intentional crime; if the actor was negligent, it is a negligence offense (negligent homicide or negligent serious injury); if the defender was not negligent, it is treated as an accident.'},
    {id:'t5-2', label:'防卫不适时', zh:'由于不法侵害尚未开始（或者已经结束），故行为人反击XX的行为，属于事前（事后）防卫，应当认定为XX罪。',
     en:"Since the unlawful infringement had not yet begun (or had already ended), the actor's counterattack against XX constitutes premature (or after-the-fact) defense, and should be found to constitute crime XX."},
    {id:'t5-3', label:'防卫过当', zh:'行为人的防卫行为明显超过了必要限度，且造成了过当结果（重伤/死亡），故构成防卫过当，对过当结果至少有过失，应当认定为XX罪，但应当减轻或者免除处罚。',
     en:"The actor's defensive act clearly exceeded the necessary limit and caused an excessive result (serious injury/death), constituting excessive defense; being at least negligent as to that result, the actor should be found guilty of crime XX, but the penalty should be mitigated or waived."},
    {id:'t5-4', label:'特殊防卫', zh:'由于XX的行为属于严重危及人身安全的暴力犯罪，故行为人反击XX的行为属于特殊防卫，即使造成XX死亡，也不属于防卫过当，不构成犯罪。',
     en:"Since XX's conduct constitutes a violent crime seriously endangering personal safety, the actor's counterattack against XX is special self-defense; even causing XX's death does not amount to excessive defense and does not constitute a crime."},
    {id:'t5-5', label:'偶然防卫', zh:'行为人在客观上虽然制止了XX的不法侵害，但是主观上缺乏防卫认识，属于偶然防卫：（1）根据防卫认识不要说，行为人构成正当防卫。（2）根据防卫认识必要说，行为人构成XX罪未遂（故意的场合），或不构成犯罪（过失的场合，因未造成法益侵害结果）。',
     en:'Although the actor objectively stopped XX\'s unlawful infringement, he subjectively lacked awareness of defending — this is coincidental defense. (1) Under the "defensive awareness not required" view, the actor\'s conduct constitutes justifiable self-defense. (2) Under the "defensive awareness required" view, the actor constitutes attempted crime XX (if intentional), or no crime at all (if negligent, since no legally protected interest was actually harmed).'}
  ]},
  {num:'六', name:'犯罪故意', nameEn:'Criminal Intent', items:[
    {id:'t6-0', label:'', zh:'认识到结果必然/可能发生，希望/放任结果的发生，构成XX罪。（故意犯罪）',
     en:'Being aware that the outcome would certainly or possibly occur, and hoping for or acquiescing in its occurrence, constitutes crime XX (an intentional offense).'}
  ]},
  {num:'七', name:'犯罪过失', nameEn:'Criminal Negligence', items:[
    {id:'t7-0', label:'', zh:'认识到结果可能发生/应当预见而没有预见到结果可能发生，排斥、反对结果的发生，构成XX罪。（过失犯罪）',
     en:'Being aware the outcome might occur — or failing to foresee it when one should have — while opposing or rejecting its occurrence, constitutes crime XX (a negligence offense).'}
  ]},
  {num:'八', name:'事实认识错误', nameEn:'Mistake of Fact', items:[
    {id:'t8-0', label:'对象错误', zh:'行为人误将A当作B，属于对象错误，应当认定为XX罪既遂。',
     en:'The actor mistook A for B — this is a mistake as to the object, and should be found to constitute the completed offense of XX.'},
    {id:'t8-1', label:'打击错误', zh:'行为人欲XX甲，因客观行为偏差XX乙，属于打击错误：（1）根据法定符合说，行为人构成XX罪（对乙）与XX罪未遂（对甲），想象竞合，从一重罪处罚。（2）根据具体符合说，行为人构成过失致人重伤、死亡（对乙）罪与XX罪未遂（对甲），想象竞合，从一重罪处罚。',
     en:'The actor intended to XX A, but due to a deviation in the act, XX\'d B instead — this is an aberratio ictus (error in the blow). (1) Under the "statutory correspondence" theory, the actor constitutes crime XX against B and attempted crime XX against A, an imaginative concurrence resolved by the more serious offense. (2) Under the "concrete correspondence" theory, the actor constitutes negligent serious injury/homicide against B and attempted crime XX against A, again resolved by the more serious offense.'}
  ]},
  {num:'九', name:'事前故意', nameEn:'Antecedent Intent (Dolus Generalis)', items:[
    {id:'t9-0', label:'', zh:'行为人以为A已经死亡，为毁灭罪证而将A抛入水中（掩埋等）导致其死亡，属于结果的推迟发生（事前故意）。多数说：前行为构成故意杀人既遂，后行为构成过失致人死亡，用故意杀人既遂吸收过失致人死亡，定故意杀人既遂。少数说：前行为构成故意杀人未遂，后行为构成过失致人死亡，两罪并罚。',
     en:"The actor, believing A was already dead, threw A into the water (or buried A) to destroy evidence, thereby actually causing A's death — this is a delayed occurrence of the result (antecedent intent). Majority view: the completed intentional-homicide offense absorbs the negligent-homicide offense, resulting in a single conviction for completed intentional homicide. Minority view: the first act constitutes attempted intentional homicide and the second constitutes negligent homicide, punished as two separate offenses."}
  ]},
  {num:'十', name:'结果的提前实现', nameEn:'Premature Realization of the Result', items:[
    {id:'t10-0', label:'', zh:'行为人计划通过第YY行为（第2个）造成XX结果，实际上XX行为（第1个）便造成了危害结果，这属于结果的提前实现。若第1个行为没有着手，成立故意犯罪预备与过失犯罪的想象竞合。若已经着手，有两种意见：（1）第1个行为已有致人死亡的紧迫危险，故意存在于着手实行时即可，应对死亡承担故意杀人既遂的责任。（2）行为人没有认识到第1个行为会导致死亡，缺乏既遂故意，只能认定为故意杀人未遂与过失致人死亡的想象竞合。',
     en:'The actor planned to bring about outcome XX through a second act, but the first act alone already produced the harmful result — this is premature realization of the result. If the first act had not yet reached the stage of commencement, it constitutes an imaginative concurrence of preparation for an intentional offense and a negligence offense. If it had already commenced, two views exist: (1) since the first act posed an imminent danger of causing death, intent can be found to exist at the point of commencement, so the actor bears responsibility for completed intentional homicide; (2) since the actor did not realize the first act would cause death — lacking intent as to the completed result — the actor instead constitutes an imaginative concurrence of attempted intentional homicide and negligent homicide.'}
  ]}
];

const DISTINGUISH = [
  {id:'dis1', title:'事前故意 vs 结果的提前实现', titleEn:'Antecedent Intent vs. Premature Realization of the Result',
   left:'事前故意（韦伯的概括故意）', leftEn:'Antecedent Intent (Dolus Generalis)',
   leftDesc:'两个行为都实施了，行为人以为第1个行为已经既遂（死亡已发生），第2个行为（处理"尸体"）才真正导致死亡——结果比行为人以为的"更晚"发生。',
   leftDescEn:'Both acts occur. The actor believes the first act already succeeded (death had occurred), but the second act (disposing of the "corpse") is what actually causes death — the result occurs later than the actor believed.',
   right:'结果的提前实现（构成要件提前实现）', rightEn:'Premature Realization of the Result',
   rightDesc:'行为人计划分两步实施（第2步才是"真正杀招"），但第1步（准备/预备性质的行为）意外提前导致了结果——结果比行为人计划的"更早"发生。',
   rightDescEn:'The actor plans a two-step process (the second step is meant to be the actual "killing blow"), but the first step — meant only as preparation — unexpectedly causes the result early. The result occurs earlier than planned.',
   key:'一句话记忆：事前故意是"以为杀完了，其实还没杀完，后面收尾时才真杀死"；结果提前实现是"还没到杀的那一步，前面准备工作就已经杀死了"。',
   keyEn:'One-line memory hook: in antecedent intent, the actor thinks the killing is already done but it isn\'t — death actually comes later during "clean-up." In premature realization, the actor hasn\'t even reached the killing step yet — death already happened during "preparation."'},
  {id:'dis2', title:'对象错误 vs 打击错误', titleEn:'Mistake as to Object vs. Aberratio Ictus (Error in the Blow)',
   left:'对象错误', leftEn:'Mistake as to Object',
   leftDesc:'行为人认错了人——把B误认成A，然后对着"自以为是A、实际是B"的这个人实施了行为。打击本身没有偏差。',
   leftDescEn:'The actor identifies the wrong person — mistaking B for A — and then acts against that person (whom he believes to be A but who is actually B). The act itself does not go astray.',
   right:'打击错误', rightEn:'Aberratio Ictus (Error in the Blow)',
   rightDesc:'行为人认对了目标（就是要对A下手），但行为、手段本身出现偏差，实际打击到了旁边的B。目标认知没错，是"打偏了"。',
   rightDescEn:"The actor correctly identifies the intended target (A), but the act or means itself goes astray, actually striking B nearby instead. The actor's identification of the target was correct — the execution simply missed.",
   key:'一句话记忆：对象错误是"人认错了"，打击错误是"手打偏了"。',
   keyEn:'One-line memory hook: mistake as to object is "misidentifying the person"; aberratio ictus is "missing with the act."'}
];

/* ---------------- 渲染：背诵卡片 ---------------- */
const topicsContainer = document.getElementById('topics-container');
TOPICS.forEach(t=>{
  const card = document.createElement('div');
  card.className = 'card';

    itemsHtml += `
      <div class="tmpl-row">

  card.innerHTML = `

      <div>
        <div class="topic-name">${t.name}</div>
        <div class="topic-name-en">${t.nameEn}</div>

/* 恢复已选自评按钮高亮 */
Object.keys(state.grades).forEach(id=>{
  const b = document.querySelector(`[data-grade="${id}|${state.grades[id]}"]`);
  if(b) b.classList.add('selected');
});

/* ---------------- 渲染：辨析对比 ---------------- */

DISTINGUISH.forEach(d=>{

/* ---------------- 顶部 tabs ---------------- */
document.querySelectorAll('.otab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.otab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.otabpanel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('otab-'+btn.dataset.otab).classList.add('active');
  });
});

/* ---------------- 状态存取 ---------------- */
function saveState(s){ localStorage.setItem(LSKEY, JSON.stringify(s)); }

/* 展平成闪卡池：每条金句模板一张卡 */
const CARD_POOL = [];
TOPICS.forEach(t=>{
  t.items.forEach(it=>{
    CARD_POOL.push({id:it.id, topic:`${t.num}、${t.name}`, label:it.label, zh:it.zh, en:it.en});
  });
});

function updateProgress(){
  const total = CARD_POOL.length;
  let done = 0;
  CARD_POOL.forEach(c=>{ if(state.mastery[c.id]) done++; });
  document.getElementById('progressBar').style.width = Math.round(done/total*100)+'%';
}
updateProgress();

/* ---------------- 闯关游戏：内部 tabs ---------------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tabpanel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
  });
});

/* ---- 记忆闪卡 ---- */
state.answers = state.answers || {};
let fcIndex = 0;
let fcShowAnswer = false;
let fcLastIndex = -1;
function renderFlashcard(){
  const c = CARD_POOL[fcIndex];
  const el = document.getElementById('flashcardEl');
  const input = document.getElementById('fcSelfInput');
  document.getElementById('fcCounter').textContent = `第 ${fcIndex+1} / ${CARD_POOL.length} 张`;
  if(fcIndex !== fcLastIndex){
    input.value = state.answers[c.id] || '';
    fcLastIndex = fcIndex;
  }
  if(!fcShowAnswer){
    el.innerHTML = `<div class="side-label">${c.topic}${c.label ? ' · '+c.label : ''}</div><div>这条金句怎么背？</div>`;
  }else{
    el.innerHTML = `<div class="side-label">参考金句</div><div style="text-align:left;font-size:14px;">${hl(c.zh)}</div><div class="bi-en" style="text-align:left;margin-top:8px;">${hl(c.en)}</div>`;
  }
  document.getElementById('fcMastered').style.opacity = state.mastery[c.id] ? 1 : .55;
}
document.getElementById('fcSelfInput').addEventListener('input', (e)=>{
  state.answers[CARD_POOL[fcIndex].id] = e.target.value;
  saveState(state);
});
document.getElementById('flashcardEl').addEventListener('click', ()=>{
  fcShowAnswer = !fcShowAnswer; renderFlashcard();
});
document.getElementById('fcToggle').addEventListener('click', ()=>{
  fcShowAnswer = !fcShowAnswer; renderFlashcard();
});
document.getElementById('fcPrev').addEventListener('click', ()=>{
  fcIndex = (fcIndex - 1 + CARD_POOL.length) % CARD_POOL.length; fcShowAnswer = false; renderFlashcard();
});
document.getElementById('fcNext').addEventListener('click', ()=>{
  fcIndex = (fcIndex + 1) % CARD_POOL.length; fcShowAnswer = false; renderFlashcard();
});
document.getElementById('fcMastered').addEventListener('click', ()=>{
  state.mastery[CARD_POOL[fcIndex].id] = true; saveState(state); renderFlashcard(); updateProgress();
});
document.getElementById('fcNotYet').addEventListener('click', ()=>{
  state.mastery[CARD_POOL[fcIndex].id] = false; saveState(state); renderFlashcard(); updateProgress();
});
renderFlashcard();

/* ---- 选择题闯关：给考点名，选对应金句（干扰项来自同一 Session 的其他条目） ---- */
let quizIdx = 0;
let quizStreak = 0;
let quizBest = state.quizBest || 0;
function shuffle(arr){ return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]); }
function renderQuiz(){
  const item = CARD_POOL[quizIdx % CARD_POOL.length];
  document.getElementById('quizStem').textContent = `${item.topic}${item.label ? '·'+item.label : ''} 的答题金句是？`;
  document.getElementById('quizStat').textContent = `连对 ${quizStreak}（最佳 ${quizBest}） · 第 ${quizIdx+1} 题`;
  const distractors = CARD_POOL.filter(p=>p!==item).map(p=>p.zh);
  const opts = shuffle([item.zh, ...shuffle(distractors).slice(0,3)]);
  const optEl = document.getElementById('quizOpts');
  optEl.innerHTML = '';
  document.getElementById('quizNext').style.display = 'none';
  opts.forEach(opt=>{
    const b = document.createElement('button');
    b.className = 'quiz-opt';
    b.innerHTML = hl(opt);
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.quiz-opt').forEach(o=>o.disabled=true);
      if(opt === item.zh){
        b.classList.add('correct');
        quizStreak++;
        if(quizStreak > quizBest){ quizBest = quizStreak; state.quizBest = quizBest; saveState(state); }
      }else{
        b.classList.add('wrong');
        quizStreak = 0;
        document.querySelectorAll('.quiz-opt').forEach(o=>{ if(o.innerHTML===hl(item.zh)) o.classList.add('correct'); });
      }
      document.getElementById('quizNext').style.display = 'inline-block';
    });
    optEl.appendChild(b);
  });
}
document.getElementById('quizNext').addEventListener('click', ()=>{
  quizIdx++; renderQuiz();
});
renderQuiz();
</script>

<!-- progress-io:v1 -->
<div style="max-width:820px;margin:36px auto 56px;padding:16px 18px 4px;border-top:1px solid currentColor;border-color:rgba(128,128,128,.28);text-align:center;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',Arial,sans-serif;font-size:13px;">
  <div style="opacity:.6;margin-bottom:10px;">练习进度保存在本机浏览器。换设备或换网址前，可以导出带走。</div>
  <button type="button" id="pioExport" style="font:inherit;cursor:pointer;background:transparent;color:inherit;border:1px solid currentColor;border-radius:8px;padding:6px 14px;margin:0 4px;opacity:.75;">导出进度</button>
  <button type="button" id="pioImport" style="font:inherit;cursor:pointer;background:transparent;color:inherit;border:1px solid currentColor;border-radius:8px;padding:6px 14px;margin:0 4px;opacity:.75;">导入进度</button>
  <input type="file" id="pioFile" accept="application/json,.json" style="display:none">
  <div id="pioMsg" style="margin-top:10px;min-height:1.2em;opacity:.7;"></div>
</div>
<script>
(function(){
  var KEY = "xingfa_jinju_session1";
  var msgEl = document.getElementById("pioMsg");
  function msg(t){ msgEl.textContent = t; if(t) setTimeout(function(){ if(msgEl.textContent===t) msgEl.textContent=""; }, 4000); }

  document.getElementById("pioExport").addEventListener("click", function(){
    var raw = localStorage.getItem(KEY);
    if(!raw){ msg("还没有进度可以导出"); return; }
    var payload;
    try{ payload = JSON.parse(raw); }catch(e){ msg("本机进度已损坏，无法导出"); return; }
    var out = JSON.stringify({ key: KEY, savedAt: new Date().toISOString(), data: payload }, null, 2);
    var blob = new Blob([out], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = KEY + "-" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    msg("已导出，文件在下载文件夹");
  });

  var fileEl = document.getElementById("pioFile");
  document.getElementById("pioImport").addEventListener("click", function(){ fileEl.value=""; fileEl.click(); });

  fileEl.addEventListener("change", function(){
    var f = fileEl.files && fileEl.files[0];
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try{ parsed = JSON.parse(reader.result); }catch(e){ msg("读取失败：不是有效的进度文件"); return; }
      if(!parsed || parsed.data === undefined){ msg("读取失败：文件格式不对"); return; }
      if(parsed.key && parsed.key !== KEY){
        if(!confirm("这份进度来自「" + parsed.key + "」，与当前练习不是同一个。仍要导入并覆盖当前进度吗？")) { msg("已取消"); return; }
      } else if(localStorage.getItem(KEY)){
        if(!confirm("将覆盖本机当前进度，确定吗？")) { msg("已取消"); return; }
      }
      try{ localStorage.setItem(KEY, JSON.stringify(parsed.data)); }
      catch(e){ msg("写入失败：浏览器存储空间不足"); return; }
      msg("导入成功，正在刷新…");
      setTimeout(function(){ location.reload(); }, 700);
    };
    reader.onerror = function(){ msg("读取文件失败"); };
    reader.readAsText(f);
  });
})();
</script>
