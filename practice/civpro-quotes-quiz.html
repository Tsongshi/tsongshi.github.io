<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>民诉金句小练 · 台阶式</title>
<style>
  :root{
    --bg:#f6f5f2; --card:#ffffff; --ink:#2b2a28; --sub:#78756e;
    --accent:#5c8a72; --accent2:#e07a5f; --line:#e7e3da;
    --radius:20px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;}
  .wrap{max-width:600px;margin:0 auto;padding:24px 16px 60px;}
  h1{font-size:19px;margin:2px 0 4px;}
  .sub{color:var(--sub);font-size:13px;margin-bottom:6px;}
  .note{font-size:12px;color:var(--sub);margin-bottom:12px;}
  .progress-outer{background:var(--line);border-radius:99px;height:8px;overflow:hidden;margin-bottom:18px;}
  .progress-inner{background:var(--accent);height:100%;width:0%;transition:width .3s;}
  .stage-strip{display:flex;gap:4px;margin-bottom:16px;}
  .stage-dot{flex:1;height:5px;border-radius:99px;background:var(--line);}
  .stage-dot.on{background:var(--accent);}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 20px;min-height:220px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .card .tag{display:inline-block;background:var(--accent);color:#fff;font-size:11px;border-radius:6px;padding:2px 10px;margin:0 0 6px;align-self:flex-start;}
  .card .stage-label{font-size:11.5px;color:var(--accent2);font-weight:700;margin-bottom:10px;}
  .card .front-text{font-size:15.5px;font-weight:600;margin-bottom:10px;}
  .card .back-text{font-size:14.5px;background:#faf9f6;border-radius:12px;padding:12px;margin-top:10px;}
  .card .back-text.hidden{display:none;}
  .card .cloze-text{font-size:14.5px;background:#faf9f6;border-radius:12px;padding:12px;}
  .card .cloze-text .blank{color:var(--accent2);font-weight:700;}
  .card .src{font-size:11.5px;color:var(--sub);margin-top:10px;text-align:right;}
  textarea.recall{width:100%;min-height:80px;border-radius:12px;border:1px solid var(--line);padding:10px;font-size:14px;font-family:inherit;margin-top:10px;resize:vertical;}

  .btnrow{display:flex;gap:10px;margin-top:16px;}
  button.act{flex:1;border:none;border-radius:12px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;background:#eee;color:var(--ink);}
  button.act.primary{background:var(--accent);color:#fff;}
  button.act.ghost{background:#fff;border:1px solid var(--line);}

  .done-screen{display:none;text-align:center;padding:40px 10px;}
  .done-screen.show{display:block;}
  .done-emoji{font-size:44px;margin-bottom:12px;}
  .done-title{font-size:19px;font-weight:700;margin-bottom:6px;}
  .done-sub{color:var(--sub);font-size:14px;margin-bottom:20px;}
  .done-stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;}
  .done-stat b{color:var(--accent);}
  .legend{font-size:11.5px;color:var(--sub);margin-top:18px;line-height:1.8;}
  .migrate-note{font-size:11.5px;color:#6b5a2e;background:#fff7ec;border:1px dashed #d8c08a;border-radius:12px;padding:8px 12px;margin-bottom:14px;display:none;}
  .migrate-note.show{display:block;}
</style>
</head>
<body>
<div class="wrap">
  <h1>民诉金句小练 · 台阶式</h1>
  <div class="sub">同一批 8 条金句，混着来，每条从"读一读"慢慢升到"套案例应用"</div>
  <div class="note">不问你背没背下来——每一步只是"做完了"就往前走，没有对错判断。想停随时停，下次接着来。</div>
  <div class="migrate-note" id="migrateNote"></div>
  <div class="progress-outer"><div class="progress-inner" id="progressBar"></div></div>

  <div id="cardArea">
    <div class="card" id="cardEl"></div>
    <div id="actionArea"></div>
  </div>

  <div class="done-screen" id="doneScreen">
    <div class="done-emoji">🎉</div>
    <div class="done-title">8 条都练到"应用"这一步了</div>
    <div class="done-sub">不用现在就全部滚瓜烂熟，隔几天回来再走一遍这个流程，印象会自然加深。</div>
    <div class="done-stat" id="doneStat"></div>
    <button class="act primary" id="restartBtn" style="width:100%;">全部重新开始一轮</button>
  </div>

  <div class="legend" id="legendArea"></div>
</div>

<script>
const OLD_LSKEY = 'minsu_jinju_xiaolian_001'; // 旧版翻卡式的记录，只读一次用来迁移起点，不会清除
const LSKEY = 'minsu_jinju_v2';
const STAGE_NAMES = ["初读", "朗读 / 默一遍", "挖空回忆", "试着默写", "套进小案例"];
const NUM_STAGES = STAGE_NAMES.length; // 0..4，走完第4步（套案例）= 毕业

/* 8 条民诉金句（管辖/当事人/证明责任），与旧版顺序一一对应；
   caseSrc 标"真题原题节选"的 6 条（专属管辖/协议管辖/无民事行为能力人/法人工作人员/无权代理/证明标准）
   均取自《民诉攻略基础版》教材例题原文；另外 2 条（合同履行地/应诉管辖的正向例子）教材中没有现成的独立例题，
   是 Claude 自编小案例练手用——已标注区分，不是真题原文。 */
const items = [
  {
    tag:"管辖·专属管辖",
    front:"本案是因不动产纠纷提起的诉讼，管辖法院怎么定？",
    back:"由不动产所在地人民法院管辖（专属管辖）。范围包括：不动产权利确认、分割、相邻关系等物权纠纷；以及农村土地承包经营合同、房屋租赁合同、建设工程施工合同、政策性房屋买卖合同纠纷。",
    clozeBlanked:"由＿＿＿＿人民法院管辖（专属管辖）。范围包括：不动产权利确认、分割、相邻关系等物权纠纷；以及农村土地承包经营合同、＿＿＿＿合同、建设工程施工合同、政策性房屋买卖合同纠纷。",
    caseQ:"甲区张三和乙区李四在丙区签订一份房屋租赁合同，约定将张三位于丁区的一处房屋出租给李四，后来张三拒不履行合同，李四向自己所在的乙区人民法院起诉张三，张三没有提出管辖权异议。请问：本案中乙区法院是否享有管辖权？",
    caseA:"没有管辖权。本案为房屋租赁合同纠纷，按不动产纠纷确定管辖，应当由不动产所在地即丁区法院专属管辖；专属管辖不能通过应诉管辖或协议改变，就算张三没有提出管辖权异议，乙区法院也不能取得管辖权。",
    caseSrc:"真题原题节选 ·《民诉攻略基础版》专题四 例题（甲区张三、乙区李四案）"
  },
  {
    tag:"管辖·协议管辖",
    front:"管辖协议里约定了两个以上与争议有实际联系地点的法院，原告能否随便选？",
    back:"可以。根据司法解释规定，当事人可以选择向其中一个法院起诉。",
    clozeBlanked:"可以。根据司法解释规定，当事人可以选择向＿＿＿＿起诉。",
    caseQ:"甲市A县的刘某与乙市B区的何某签订了木材买卖合同，约定何某在丙市C区将一批木材交付给刘某。合同约定，因合同履行发生的一切纠纷，提交位于甲市的M仲裁委员会仲裁；之后双方又签订补充协议，约定发生纠纷也可以向乙市B区或者甲市A县人民法院起诉。后来因合同履行发生纠纷，刘某可以向哪个（些）法院起诉？",
    caseA:"刘某可以选择向乙市B区或者甲市A县人民法院起诉。首先，本案原约定的仲裁与后来约定的诉讼并存（或裁或审），该仲裁协议无效，案件应由人民法院主管；其次，本案存在管辖协议，约定由乙市B区或者甲市A县人民法院管辖——根据司法解释规定，管辖协议约定两个以上与争议有实际联系地点的法院管辖的，原告可以选择向其中一个法院起诉，故刘某可以选择向B区或者A县法院起诉。",
    caseSrc:"真题原题节选 ·《民诉攻略基础版》专题四 例2（刘某何某木材买卖合同案；原书该处OCR有缺字，题干中补充协议的具体约定内容按同页分析部分补全）"
  },
  {
    tag:"管辖·合同纠纷",
    front:"普通合同纠纷（没有专属/协议管辖）由谁管？",
    back:"由被告住所地或者合同履行地人民法院管辖。注意：约定履行地与实际履行地不一致的，以约定履行地为合同履行地。",
    clozeBlanked:"由＿＿＿＿或者＿＿＿＿人民法院管辖。注意：约定履行地与实际履行地不一致的，以＿＿＿＿为合同履行地。",
    caseQ:"甲市A区的公司与乙市B区的公司签订买卖合同，合同约定“合同履行地为甲市A区”，但实际交货是在乙市B区仓库完成的。因合同纠纷起诉，合同履行地应认定为哪里？",
    caseA:"应认定为甲市A区。合同约定履行地点的，以约定的履行地点为合同履行地，即使约定履行地与实际履行地不一致，仍以约定履行地为准。故本案原告可以选择被告住所地（乙市B区）或合同履行地（甲市A区）法院起诉。",
    caseSrc:"Claude 自编小案例（非真题原文），供练手用"
  },
  {
    tag:"管辖·应诉管辖",
    front:"被告没提管辖异议、直接答辩或提反诉，管辖会怎样？",
    back:"受诉法院取得应诉管辖权——前提是没有违反级别管辖和专属管辖的规定。",
    clozeBlanked:"受诉法院取得＿＿＿＿——前提是没有违反＿＿＿＿和＿＿＿＿的规定。",
    caseQ:"甲住所地在A区，乙住所地在B区，两人签订一般买卖合同（非不动产、非专属管辖事项），合同未约定管辖法院。乙向自己所在的B区法院起诉甲，甲未提出管辖权异议，直接进行了实体答辩。B区法院是否取得管辖权？",
    caseA:"取得管辖权。本案是普通合同纠纷，不涉及专属管辖或级别管辖问题；甲在提交答辩状期间没有提出管辖权异议，且进行了实体答辩，视为受诉法院（B区）取得应诉管辖权。",
    caseSrc:"Claude 自编小案例（非真题原文），供练手用——可以和上一条“丁区专属管辖不能被应诉管辖突破”对照着看"
  },
  {
    tag:"当事人",
    front:"无民事行为能力人/限制民事行为能力人致人损害，谁做被告？",
    back:"以其本人和监护人作为共同被告。",
    clozeBlanked:"以其＿＿＿＿和＿＿＿＿作为共同被告。",
    caseQ:"张三的儿子张小三（15岁）将甲公司董事长兼法定代表人李四的办公室砸毁，造成甲公司经济损失1万元，甲公司拟通过诉讼方式请求赔偿。请分析张三、张小三、李四是否是本案的当事人？其诉讼地位是什么？",
    caseA:"张三、张小三是本案的当事人，诉讼地位是共同被告；李四不是本案当事人，其诉讼地位是原告甲公司的法定代表人。理由：无、限制民事行为能力人致人损害的，无、限制民事行为能力人和其监护人为共同被告，故张三、张小三为共同被告；李四不是本案侵权法律关系的一方当事人，不是适格原告，应以原告甲公司法定代表人身份参加诉讼。",
    caseSrc:"真题原题节选 ·《民诉攻略基础版》专题五 例题（张三张小三案）"
  },
  {
    tag:"当事人",
    front:"法人的工作人员执行工作任务造成他人损害，谁是当事人？",
    back:"该法人（或其他组织）为当事人；工作人员本人不作为当事人。",
    clozeBlanked:"该＿＿＿＿（或其他组织）为当事人；＿＿＿＿本人不作为当事人。",
    caseQ:"甲公司与乙公司签订钢材买卖合同，约定甲公司向乙公司支付40万元，乙公司分三批向甲公司提供100吨钢材。乙公司收到货款、提供两批钢材后不再继续提供。甲公司起诉乙公司要求继续履行合同并支付违约金。乙公司称剩余钢材已交付给甲公司的业务员张某，并出示张某的签收条和甲公司对张某的授权委托书；甲公司称张某确实是业务员但未获授权收货，张某也未收到钢材。甲、乙公司申请法院追加张某为共同被告，法院准许。请评价法院的做法。",
    caseA:"法院将张某追加为共同被告的做法是错误的。张某是甲公司的业务员，其执行工作任务引发的纠纷应当以甲公司为当事人，即不能以工作人员本人为当事人，故张某不是本案当事人，不能作为共同被告。",
    caseSrc:"真题原题节选 ·《民诉攻略基础版》专题五 例题（改编自2010年主观题·甲乙公司钢材案）"
  },
  {
    tag:"证明责任",
    front:"无权代理未被追认、相对人请求行为人履行债务或者赔偿损失的，由谁对“相对人知道或应当知道行为人无权代理”这一事实承担证明责任？",
    back:"由行为人对相对人知道或应当知道其无权代理的事实承担证明责任。",
    clozeBlanked:"由＿＿＿＿对相对人知道或应当知道其无权代理的事实承担＿＿＿＿。",
    caseQ:"曹某伪造甲公司的公章与乙公司签订了《商务推广合同》，约定甲公司向乙公司支付1624万元，乙公司为甲公司进行商务推广。甲公司拒绝追认该合同，乙公司起诉曹某要求曹某赔偿损失。曹某抗辩称乙公司当时是知情的（即知道曹某没有代理权）。该事实应由谁承担证明责任？",
    caseA:"推定乙公司对曹某没有代理权这一事实是不知情的（善意推定）；如果曹某主张乙公司知情，应当由曹某（行为人）对乙公司知情的事实承担证明责任。",
    caseSrc:"真题原题节选 ·《民诉攻略基础版》专题九 例题（曹某伪造公章案）"
  },
  {
    tag:"证明标准",
    front:"民事诉讼一般证明标准是什么表述？",
    back:"负有证明责任的当事人提供的证据，法院确信待证事实的存在具有高度可能性的，应认定该事实存在。（欺诈/胁迫/恶意串通/口头遗嘱或赠与——标准更高：确信到能够排除合理怀疑。）",
    clozeBlanked:"负有证明责任的当事人提供的证据，法院确信待证事实的存在具有＿＿＿＿的，应认定该事实存在。（欺诈/胁迫/恶意串通/口头遗嘱或赠与——标准更高：确信到能够＿＿＿＿。）",
    caseQ:"原、被告因合同纠纷诉至法院，被告主张合同存在欺诈而要求撤销合同。请判断：\"被告主张合同存在欺诈而要求撤销合同，应当将存在欺诈的事实证明到高度可能性标准，否则将承担证明责任的不利后果\"，这一说法对不对？",
    caseA:"错误。对于合同是否存在欺诈的事实，应当由主张存在欺诈事实的被告承担证明责任，但欺诈属于特殊事实，应适用特殊标准即排除合理怀疑，而不是高度可能性标准。",
    caseSrc:"真题原题节选 ·《民诉攻略基础版》专题九 例题（合同欺诈四问案）"
  }
];

function loadRaw(key){
  try{ return JSON.parse(localStorage.getItem(key)) || {}; }catch(e){ return {}; }
}
function saveState(s){ localStorage.setItem(LSKEY, JSON.stringify(s)); }

let state = loadRaw(LSKEY);
let migratedNow = false;
if(!state.itemStage){
  // 第一次用新版引擎：看看旧版翻卡记录里有没有标过"背下来了"，有的话直接从"试着默写"这一步起步，不从零开始
  const oldState = loadRaw(OLD_LSKEY);
  const oldMastered = oldState.mastered || {};
  const hadOldRecord = oldState.completions > 0 || Object.keys(oldMastered).length > 0;
  state.itemStage = items.map((it, idx)=> oldMastered[idx] ? 3 : 0);
  saveState(state);
  migratedNow = hadOldRecord;
}
if(state.itemStage.length !== items.length){ state.itemStage = items.map(()=>0); saveState(state); }

let queue = [];
let current = null; // {idx, stage}
let recallShown = false;
let clozeRevealed = false;
let draftText = ''; // 暂存"试着默写/套案例"里正在打的字，翻答案时不能丢

function totalSteps(){ return items.length * NUM_STAGES; }
function doneSteps(){
  return state.itemStage.reduce((sum, s)=> sum + Math.min(s, NUM_STAGES), 0);
}
function updateProgress(){
  document.getElementById('progressBar').style.width = Math.round(doneSteps()/totalSteps()*100) + '%';
}

function buildQueue(){
  const pending = [];
  items.forEach((it, idx)=>{
    if(state.itemStage[idx] < NUM_STAGES) pending.push(idx);
  });
  // 洗牌，尽量不让同一条连续出现
  for(let i=pending.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [pending[i],pending[j]] = [pending[j],pending[i]];
  }
  queue = pending;
}

function nextCard(){
  if(queue.length === 0) buildQueue();
  if(queue.length === 0){
    showDone();
    return;
  }
  const idx = queue.shift();
  const stage = state.itemStage[idx];
  if(stage >= NUM_STAGES){ nextCard(); return; }
  current = {idx, stage};
  recallShown = false;
  clozeRevealed = false;
  draftText = '';
  renderCard();
}

function stageStrip(stage){
  let html = '<div class="stage-strip">';
  for(let i=0;i<NUM_STAGES;i++){
    html += `<div class="stage-dot ${i<=stage?'on':''}"></div>`;
  }
  html += '</div>';
  return html;
}

function renderCard(){
  const it = items[current.idx];
  const stage = current.stage;
  const el = document.getElementById('cardEl');
  const actionArea = document.getElementById('actionArea');
  updateProgress();

  let bodyHtml = stageStrip(stage);
  bodyHtml += `<div class="tag">${it.tag}</div><div class="stage-label">第 ${stage+1} 步 · ${STAGE_NAMES[stage]}</div>`;

  if(stage === 0){
    bodyHtml += `<div class="front-text"><!-- TTS:it${current.idx}-front -->${it.front}</div>`;
    bodyHtml += `<div class="back-text"><!-- TTS:it${current.idx}-back -->${it.back}</div>`;
    el.innerHTML = bodyHtml;
    actionArea.innerHTML = `<div class="btnrow"><button class="act primary" id="continueBtn">读完了，下一步 ›</button></div>`;
  } else if(stage === 1){
    bodyHtml += `<div class="front-text">${it.front}</div>`;
    bodyHtml += `<div class="back-text">${it.back}</div>`;
    bodyHtml += `<div class="note" style="margin-top:8px;">大声读三遍，或者读一遍后闭眼在心里默一遍——选一种，做完点下一步。</div>`;
    el.innerHTML = bodyHtml;
    actionArea.innerHTML = `<div class="btnrow"><button class="act primary" id="continueBtn">做完了，下一步 ›</button></div>`;
  } else if(stage === 2){
    bodyHtml += `<div class="front-text">${it.front}</div>`;
    bodyHtml += `<div class="cloze-text" id="clozeBox">${clozeRevealed ? it.back : it.clozeBlanked}</div>`;
    bodyHtml += `<div class="note" style="margin-top:8px;">先自己把空填上（心里想或说出来都行），点卡片看完整答案。</div>`;
    el.innerHTML = bodyHtml;
    el.onclick = ()=>{ clozeRevealed = !clozeRevealed; renderCard(); };
    actionArea.innerHTML = `<div class="btnrow"><button class="act primary" id="continueBtn">想起来了，下一步 ›</button></div>`;
  } else if(stage === 3){
    bodyHtml += `<div class="front-text">${it.front}</div>`;
    bodyHtml += `<textarea class="recall" id="recallInput" placeholder="试着把整句默写出来，写多写少都行……"></textarea>`;
    if(recallShown){
      bodyHtml += `<div class="back-text">原文对照：${it.back}</div>`;
    }
    el.innerHTML = bodyHtml;
    el.onclick = null;
    document.getElementById('recallInput').value = draftText;
    document.getElementById('recallInput').addEventListener('input', (e)=>{ draftText = e.target.value; });
    actionArea.innerHTML = recallShown
      ? `<div class="btnrow"><button class="act primary" id="continueBtn">看完对比了，下一步 ›</button></div>`
      : `<div class="btnrow"><button class="act ghost" id="revealBtn">对比一下原文</button></div>`;
    if(!recallShown){
      document.getElementById('revealBtn').addEventListener('click', ()=>{
        draftText = document.getElementById('recallInput').value;
        recallShown = true; renderCard();
      });
    }
  } else if(stage === 4){
    bodyHtml += `<div class="front-text">${it.caseQ}</div>`;
    if(recallShown){
      bodyHtml += `<div class="back-text">${it.caseA}<div class="src">${it.caseSrc}</div></div>`;
    }
    el.innerHTML = bodyHtml;
    el.onclick = null;
    actionArea.innerHTML = `
      <textarea class="recall" id="recallInput" placeholder="套用这条金句的模板，自己写一版分析……"></textarea>
      ${recallShown
        ? `<div class="btnrow"><button class="act ghost" id="retryBtn">这条没吃透，退回重练</button><button class="act primary" id="continueBtn">这条练完了 ✓</button></div>`
        : `<div class="btnrow"><button class="act ghost" id="revealBtn">看参考应用</button></div>`}
    `;
    document.getElementById('recallInput').value = draftText;
    document.getElementById('recallInput').addEventListener('input', (e)=>{ draftText = e.target.value; });
    if(!recallShown){
      document.getElementById('revealBtn').addEventListener('click', ()=>{
        draftText = document.getElementById('recallInput').value;
        recallShown = true; renderCard();
      });
    } else {
      document.getElementById('retryBtn').addEventListener('click', ()=>{
        // 不是"错了"的记录，只是让这条从头再走一遍——常见于发现自己整个方向理解错了，不只是背得不熟
        state.itemStage[current.idx] = 0;
        saveState(state);
        nextCard();
      });
    }
  }

  const cBtn = document.getElementById('continueBtn');
  if(cBtn) cBtn.addEventListener('click', advance);
}

function advance(){
  const idx = current.idx;
  state.itemStage[idx] = state.itemStage[idx] + 1;
  saveState(state);
  nextCard();
}

function showDone(){
  document.getElementById('cardArea').style.display = 'none';
  document.getElementById('doneScreen').classList.add('show');
  document.getElementById('doneStat').innerHTML = `全部 ${items.length} 条都走完了"套案例应用"这一步。`;
}

document.getElementById('restartBtn').addEventListener('click', ()=>{
  state.itemStage = items.map(()=>0);
  saveState(state);
  document.getElementById('cardArea').style.display = '';
  document.getElementById('doneScreen').classList.remove('show');
  buildQueue();
  nextCard();
});

document.getElementById('legendArea').innerHTML =
  `5 个台阶：① 初读 → ② 朗读/默一遍 → ③ 挖空回忆 → ④ 试着默写 → ⑤ 套进小案例应用。8 条混着来，每完成一步该条就先歇会儿，轮到别的条目，不会连续磨同一条。`;

if(migratedNow){
  const note = document.getElementById('migrateNote');
  note.classList.add('show');
  note.textContent = '已经把你之前翻卡练过、标了"背下来了"的条目，起点换算到了第4步"试着默写"，不用从头来。';
}

buildQueue();
nextCard();
</script>

<!-- progress-io:v1 -->
<div style="max-width:820px;margin:36px auto 56px;padding:16px 18px 4px;border-top:1px solid currentColor;border-color:rgba(128,128,128,.28);text-align:center;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',Arial,sans-serif;font-size:13px;">
  <div style="opacity:.6;margin-bottom:10px;">练习进度保存在本机浏览器。换设备或换网址前，可以导出带走。</div>
  <button type="button" id="pioExport" style="font:inherit;cursor:pointer;background:transparent;color:inherit;border:1px solid currentColor;border-radius:8px;padding:6px 14px;margin:0 4px;opacity:.75;">导出进度</button>
  <button type="button" id="pioImport" style="font:inherit;cursor:pointer;background:transparent;color:inherit;border:1px solid currentColor;border-radius:8px;padding:6px 14px;margin:0 4px;opacity:.75;">导入进度</button>
  <input type="file" id="pioFile" accept="application/json,.json" style="display:none">
  <div id="pioMsg" style="margin-top:10px;min-height:1.2em;opacity:.7;"></div>
</div>
<script>
(function(){
  var KEY = "minsu_jinju_v2";
  var msgEl = document.getElementById("pioMsg");
  function msg(t){ msgEl.textContent = t; if(t) setTimeout(function(){ if(msgEl.textContent===t) msgEl.textContent=""; }, 4000); }

  document.getElementById("pioExport").addEventListener("click", function(){
    var raw = localStorage.getItem(KEY);
    if(!raw){ msg("还没有进度可以导出"); return; }
    var payload;
    try{ payload = JSON.parse(raw); }catch(e){ msg("本机进度已损坏，无法导出"); return; }
    var out = JSON.stringify({ key: KEY, savedAt: new Date().toISOString(), data: payload }, null, 2);
    var blob = new Blob([out], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = KEY + "-" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    msg("已导出，文件在下载文件夹");
  });

  var fileEl = document.getElementById("pioFile");
  document.getElementById("pioImport").addEventListener("click", function(){ fileEl.value=""; fileEl.click(); });

  fileEl.addEventListener("change", function(){
    var f = fileEl.files && fileEl.files[0];
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try{ parsed = JSON.parse(reader.result); }catch(e){ msg("读取失败：不是有效的进度文件"); return; }
      if(!parsed || parsed.data === undefined){ msg("读取失败：文件格式不对"); return; }
      if(parsed.key && parsed.key !== KEY){
        if(!confirm("这份进度来自「" + parsed.key + "」，与当前练习不是同一个。仍要导入并覆盖当前进度吗？")) { msg("已取消"); return; }
      } else if(localStorage.getItem(KEY)){
        if(!confirm("将覆盖本机当前进度，确定吗？")) { msg("已取消"); return; }
      }
      try{ localStorage.setItem(KEY, JSON.stringify(parsed.data)); }
      catch(e){ msg("写入失败：浏览器存储空间不足"); return; }
      msg("导入成功，正在刷新…");
      setTimeout(function(){ location.reload(); }, 700);
    };
    reader.onerror = function(){ msg("读取文件失败"); };
    reader.readAsText(f);
  });
})();
</script>
