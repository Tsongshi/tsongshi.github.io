<style>
:root{
  --bg:#0A0E14; --card:#111823; --card-2:#18212E;
  --ink:#E8EDF2; --ink-2:#9FB0C0; --ink-3:#65778A;
  --rule:#1E2937; --rule-2:#2B3846;
  --accent:#4FD8E8; --good:#5FD0A0; --hard:#F5B942; --again:#F0748F;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
  font-size:16px; line-height:1.75; -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
}
.mono{ font-family:ui-monospace,"SF Mono",Menlo,monospace; font-variant-numeric:tabular-nums; }

/* ── 常驻状态条（ADHD：状态永远在，不用记）── */
#bar{
  position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:14px;
  padding:10px 16px; background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--rule); flex-wrap:wrap;
}
/* 主屏幕 PWA 模式下内容延伸到状态栏底下，状态条要让出刘海/灵动岛 */
@media (display-mode: standalone){
  #bar{ padding-top:calc(10px + env(safe-area-inset-top)); }
}
#bar .seg{ font-size:12px; color:var(--ink-3); white-space:nowrap; }
#bar .seg b{ color:var(--ink); font-weight:600; font-size:13px; }
#bar .grow{ flex:1 1 auto; }
/* 陪练累计计时：正向走，跟题内倒计时（⏱）区分开——这个用 ▶，只在状态条里 */
#sLap{ font-size:12px; color:var(--ink-3); white-space:nowrap; transition:color .4s; }
#sLap.paused{ opacity:.45; }
#sLap.hit{ color:var(--good); }
/* 成就提示：达成才出现，不达成不显示任何"还差多少" */
#toast{
  position:fixed; left:50%; transform:translateX(-50%) translateY(-8px);
  bottom:calc(22px + env(safe-area-inset-bottom)); z-index:50;
  background:color-mix(in srgb,var(--good) 16%,var(--bg)); color:var(--good);
  border:1px solid color-mix(in srgb,var(--good) 45%,transparent); border-radius:100px;
  padding:9px 18px; font-size:13px; white-space:nowrap;
  opacity:0; pointer-events:none; transition:opacity .35s,transform .35s;
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
.iconbtn{
  font:inherit; font-size:12px; padding:4px 11px; border-radius:100px; cursor:pointer;
  background:none; color:var(--ink-3); border:1px solid var(--rule-2); white-space:nowrap;
}
.iconbtn:hover{ color:var(--accent); border-color:var(--accent); }
#btnSync.ok{ color:var(--good); border-color:color-mix(in srgb,var(--good) 45%,transparent); }
#btnSync.off{ opacity:.5; }

#wrap{ max-width:760px; margin:0 auto; padding:22px 16px 120px; }

/* ── 卡片 ── */
.lvtag{
  display:inline-flex; align-items:center; gap:7px; font-size:11px; letter-spacing:.12em;
  color:var(--accent); border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
  border-radius:100px; padding:3px 11px; margin-bottom:14px;
}
.meta{ font-size:12px; color:var(--ink-3); margin:0 0 6px; }
h2.title{ font-size:1.32rem; line-height:1.4; margin:0 0 16px; font-weight:700; }
.body{
  background:var(--card); border:1px solid var(--rule); border-radius:8px;
  padding:18px 20px; margin:0 0 18px; white-space:pre-wrap; font-size:15.5px; line-height:1.9;
}
.body.quiet{ color:var(--ink-2); }
.hint{ font-size:13px; color:var(--ink-3); margin:0 0 16px; }
/* 大案例背景：第二问起折叠，别让同一段读八遍 */
.stemfold{ margin:0 0 14px; }
.stemfold > summary{
  cursor:pointer; font-size:13px; color:var(--ink-3);
  padding:8px 12px; border:1px solid var(--rule-2); border-radius:8px; list-style:none;
}
.stemfold > summary::-webkit-details-marker{ display:none; }
.stemfold > summary::before{ content:"▸ "; }
.stemfold[open] > summary::before{ content:"▾ "; }
.stemfold[open] > summary{ margin-bottom:8px; }
.pts{ margin:0 0 18px; padding:0; list-style:none; }
.pts li{
  display:grid; grid-template-columns:auto 1fr; gap:0 10px; align-items:baseline;
  padding:7px 0; border-bottom:1px solid var(--rule); font-size:15px;
}
.pts li:last-child{ border-bottom:0; }
.pts .n{ font-size:11px; color:var(--ink-3); }

textarea{
  width:100%; min-height:120px; font:inherit; font-size:15.5px; line-height:1.85;
  color:var(--ink); background:var(--card); border:1px solid var(--rule-2);
  border-radius:8px; padding:14px 16px; resize:vertical; outline:none;
}
textarea:focus{ border-color:var(--accent); }
.inputrow{ position:relative; margin:0 0 16px; }
.mic{
  position:absolute; right:10px; bottom:10px; width:34px; height:34px; border-radius:50%;
  background:var(--card-2); border:1px solid var(--rule-2); color:var(--ink-2);
  font-size:15px; line-height:1; cursor:pointer; padding:0;
}
.mic:hover{ color:var(--accent); border-color:var(--accent); }
.mic.rec{ color:#fff; background:var(--again); border-color:var(--again); }

/* ── 动作区（一屏一个下一步）── */
#acts{ display:flex; flex-wrap:wrap; gap:10px; margin:22px 0 0; }
.btn{
  font:inherit; font-size:15px; font-weight:600; padding:12px 22px; border-radius:8px;
  cursor:pointer; border:1px solid var(--rule-2); background:var(--card-2); color:var(--ink);
  flex:1 1 auto; min-width:120px;
}
.btn:hover{ border-color:var(--accent); }
.btn.primary{ background:var(--accent); color:#06222a; border-color:var(--accent); }
.btn.g-again{ color:var(--again); border-color:color-mix(in srgb,var(--again) 45%,transparent); }
.btn.g-hard{ color:var(--hard); border-color:color-mix(in srgb,var(--hard) 45%,transparent); }
.btn.g-good{ color:var(--good); border-color:color-mix(in srgb,var(--good) 45%,transparent); }
.btn small{ display:block; font-size:11px; font-weight:400; color:var(--ink-3); margin-top:2px; }

/* ── 溯源（默认收起）── */
#srcBtn{ margin-top:22px; }
#srcBox{ display:none; margin-top:12px; }
#srcBox.on{ display:block; }
.srow{
  display:grid; grid-template-columns:auto 1fr auto; gap:0 9px; align-items:baseline;
  font-size:12.5px; color:var(--ink-2); padding:5px 0; border-bottom:1px solid var(--rule);
}
.srow:last-child{ border-bottom:0; }
.srow .t{ font-size:10.5px; letter-spacing:.08em; color:var(--ink-3); white-space:nowrap; }
.srow .loc{ font-size:12px; color:var(--accent); white-space:nowrap; }
.srow .loc.weak{ color:var(--ink-3); }

/* ── 反馈框（随手写，不打断）── */
#fb{ margin-top:26px; border-top:1px solid var(--rule); padding-top:18px; }
#fb h3{ font-size:11px; letter-spacing:.16em; color:var(--ink-3); margin:0 0 10px; font-weight:500; }
#fbText{ min-height:70px; font-size:14.5px; }
#fbSaved{ font-size:12px; color:var(--good); margin-left:10px; }

/* ── 收工页 ── */
#done{ text-align:center; padding:60px 0; }
#done h2{ font-size:1.5rem; margin:0 0 10px; }
#done p{ color:var(--ink-2); margin:0 0 22px; }
.stat{ display:flex; justify-content:center; gap:28px; margin:0 0 30px; flex-wrap:wrap; }
.stat div{ font-size:12px; color:var(--ink-3); }
.stat b{ display:block; font-size:1.7rem; color:var(--ink); font-weight:700; }

#drop{
  margin-top:34px; border:1px dashed var(--rule-2); border-radius:8px; padding:16px;
  font-size:12.5px; color:var(--ink-3); text-align:center;
}
#drop.over{ border-color:var(--accent); color:var(--accent); }
.warn{ color:var(--hard); font-size:12.5px; }

@media (max-width:600px){
  body{ font-size:15px; }
  #wrap{ padding:16px 13px 110px; }
  .btn{ min-width:100px; padding:12px 16px; }
}
/* 首屏骨架：整份文件下载完 boot() 才有内容，中间那半秒不能是白屏。
   静态写在 HTML 里 → 浏览器边下边画，第一眼就有东西。boot() 一跑就被真卡片顶掉。 */
#skel{ pointer-events:none; }
#skel .skl{
  height:14px; border-radius:7px; margin:11px 0;
  background:linear-gradient(90deg,var(--rule) 25%,var(--rule-2) 37%,var(--rule) 63%);
  background-size:400% 100%; animation:shimmer 1.4s ease-in-out infinite;
}
#skel .skl-t{ height:26px; width:64%; margin:16px 0 20px; }
@keyframes shimmer{ 0%{ background-position:100% 50%; } 100%{ background-position:0 50%; } }
@media (prefers-reduced-motion:reduce){ *{ transition:none !important; } #skel .skl{ animation:none; } }
</style>

<div id="bar">
  <span class="seg mono" id="sLap">▶ 0:00</span>
  <span class="seg">今日 <b id="sDone">0</b></span>
  <span class="seg">队列 <b id="sQueue">0</b></span>
  <span class="seg" id="sWhere">—</span>
  <span class="grow"></span>
  <button class="iconbtn" id="btnSync" title="跨设备同步">⇅</button>
  <button class="iconbtn" id="btnQuest">副本</button>
  <button class="iconbtn" id="btnEnd">收工</button>
</div>

<div id="wrap"><div id="view"><div id="skel" aria-hidden="true">
  <span class="lvtag">装载中</span>
  <div class="skl skl-t"></div><div class="skl"></div><div class="skl"></div>
  <div class="skl" style="width:58%"></div>
</div></div></div>

const DECKS = [{"deck": "民法提升大案例 · 2017房屋租赁（8 问中 7 问为教材案例的扩展设问，非官方答案）", "kind": "case", "origin": "互动练习Session/大案例练习/民法提升大案例二_2017房屋租赁纠纷_V1.html", "items": [{"id": "cs-mf-001", "topicIds": ["mf068"], "title": "第一组·合同效力·第1问", "prompt": "当事人：甲公司（承租人）／乙公司（出租人）／丙公司（买二楼）／丁公司（买三楼）\n【2014.1.2】甲乙签25年房屋租赁合同，租一二三楼开利民超市。约定\"登记备案之日起生效\"；但双方一直未去登记备案\n【2014 – 2017.1.15】甲连续三年（2014-2016）按时付租金，2017.1.15又付清2017全年租金\n【2017.6.30】乙把二楼卖给丙、三楼卖给丁，都办了过户，但没通知甲；甲事后查登记才知道\n【2017.8.1】交通管理部门统一规定，300㎡免费停车位改成计时收费，客流受影响，超市严重亏损（叠加网购冲击）\n【2017.8.18】甲以\"停车位问题\"为由，发《解除租赁合同通知书》，单方解除\n【2017.12.1】乙起诉，请求确认甲的解除行为无效；距8.18通知已3个月13天\n【2018.1.19】丙起诉甲，要求支付2017.7.1-12.31二楼房屋租金\n问：《房屋租赁合同》约定的租赁期限是25年，该合同条款的效力如何？为什么？", "answer": "租期条款部分无效：超过20年的部分（即第21年至第25年）无效，前20年有效，合同本身不因此整体无效。\n《民法典》第705条：租赁期限不得超过二十年，超过部分无效。\n该条属于强制性规定，但仅使超期部分无效，不导致合同整体无效或前20年部分无效。\n本案约定25年，超出法定上限5年，故21-25年这5年无效；1-20年的租期条款仍然有效。", "points": ["租期条款部分无效：超过20年的部分（即第21年至第25年）无效，前20年有效，合同本身不因此整体无效。", "《民法典》第705条：租赁期限不得超过二十年，超过部分无效。", "该条属于强制性规定，但仅使超期部分无效，不导致合同整体无效或前20年部分无效。", "本案约定25年，超出法定上限5年，故21-25年这5年无效；1-20年的租期条款仍然有效。"], "ladder": [1, 2, 3, 4, 5], "audio": "audio/civil-lease-case/q1.mp3", "sources": [["note", "本 HTML 作者在教材【主观工坊】同一事实上的扩展设问（非教材原题）", "互动练习Session/大案例练习/民法提升大案例二_2017房屋租赁纠纷_V1.html#QUESTIONS[0]", "exact", "C-素材抽取"], ["book", "2026主观题民法攻略（精讲）·孟献贵", "p.127（案情出处；本问设问与答案教材未收录）", "range", "C-素材抽取"]]}, {"id": "cs-mf-002", "topicIds": ["mf005"], "title": "第一组·合同效力·第2问", "prompt": "当事人：甲公司（承租人）／乙公司（出租人）／丙公司（买二楼）／丁公司（买三楼）\n【2014.1.2】甲乙签25年房屋租赁合同，租一二三楼开利民超市。约定\"登记备案之日起生效\"；但双方一直未去登记备案\n【2014 – 2017.1.15】甲连续三年（2014-2016）按时付租金，2017.1.15又付清2017全年租金\n【2017.6.30】乙把二楼卖给丙、三楼卖给丁，都办了过户，但没通知甲；甲事后查登记才知道\n【2017.8.1】交通管理部门统一规定，300㎡免费停车位改成计时收费，客流受影响，超市严重亏损（叠加网购冲击）\n【2017.8.18】甲以\"停车位问题\"为由，发《解除租赁合同通知书》，单方解除\n【2017.12.1】乙起诉，请求确认甲的解除行为无效；距8.18通知已3个月13天\n【2018.1.19】丙起诉甲，要求支付2017.7.1-12.31二楼房屋租金\n问：甲公司与乙公司双方签署合同后并未办理租赁登记备案手续，《房屋租赁合同》效力如何？为什么？", "answer": "合同已经生效。虽然双方约定'自登记备案之日起生效'且始终未登记备案，但结合双方2014-2017年连续实际履行（甲按年支付租金、乙受领租金）的事实，应认定双方已经以实际行为对该附条件生效条款予以变更/放弃，合同发生法律效力。\n《民法典》第706条：未依法办理租赁合同登记备案手续，不影响合同效力（这是对'法定'登记备案的一般规则）。\n本案是当事人自行特别约定登记备案为生效条件，属于附条件的民事法律行为（第158、159条），原则上应尊重当事人意思自治。\n但当事人此后长期实际履行、无人以未登记备案为由主张合同未生效，可认定双方已通过实际行为放弃该附条件，或视为对合同效力的追认。\n2014-2016连续三年按时支付租金、2017.1.15又付清全年租金，乙方均正常受领——双方均以行动认可合同已经生效并全面履行，不能事后再以未登记为由否认效力。", "points": ["合同已经生效。虽然双方约定'自登记备案之日起生效'且始终未登记备案，但结合双方2014-2017年连续实际履行（甲按年支付租金、乙受领租金）的事实，应认定双方已经以实际行为对该附条件生效条款予以变更/放弃，合同发生法律效力。", "《民法典》第706条：未依法办理租赁合同登记备案手续，不影响合同效力（这是对'法定'登记备案的一般规则）。", "本案是当事人自行特别约定登记备案为生效条件，属于附条件的民事法律行为（第158、159条），原则上应尊重当事人意思自治。", "但当事人此后长期实际履行、无人以未登记备案为由主张合同未生效，可认定双方已通过实际行为放弃该附条件，或视为对合同效力的追认。", "2014-2016连续三年按时支付租金、2017.1.15又付清全年租金，乙方均正常受领——双方均以行动认可合同已经生效并全面履行，不能事后再以未登记为由否认效力。"], "ladder": [1, 2, 3, 4, 5], "audio": "audio/civil-lease-case/q2.mp3", "sources": [["note", "本 HTML 作者在教材【主观工坊】同一事实上的扩展设问（非教材原题）", "互动练习Session/大案例练习/民法提升大案例二_2017房屋租赁纠纷_V1.html#QUESTIONS[1]", "exact", "C-素材抽取"], ["book", "2026主观题民法攻略（精讲）·孟献贵", "p.127（案情出处；本问设问与答案教材未收录）", "range", "C-素材抽取"]]}, {"id": "cs-mf-003", "topicIds": ["mf069"], "title": "第二组·所有权变动与承租人权利·第3问", "prompt": "当事人：甲公司（承租人）／乙公司（出租人）／丙公司（买二楼）／丁公司（买三楼）\n【2014.1.2】甲乙签25年房屋租赁合同，租一二三楼开利民超市。约定\"登记备案之日起生效\"；但双方一直未去登记备案\n【2014 – 2017.1.15】甲连续三年（2014-2016）按时付租金，2017.1.15又付清2017全年租金\n【2017.6.30】乙把二楼卖给丙、三楼卖给丁，都办了过户，但没通知甲；甲事后查登记才知道\n【2017.8.1】交通管理部门统一规定，300㎡免费停车位改成计时收费，客流受影响，超市严重亏损（叠加网购冲击）\n【2017.8.18】甲以\"停车位问题\"为由，发《解除租赁合同通知书》，单方解除\n【2017.12.1】乙起诉，请求确认甲的解除行为无效；距8.18通知已3个月13天\n【2018.1.19】丙起诉甲，要求支付2017.7.1-12.31二楼房屋租金\n问：2018.1.19，丙公司起诉要求甲公司支付2017.7.1-12.31二楼房屋租金，能否得到支持？为什么？", "answer": "不能得到支持。\n《民法典》第725条（买卖不破租赁）：租赁物在承租人占有使用期间发生所有权变动的，不影响租赁合同效力——丙自过户之日起概括承受出租人地位。\n但甲已于2017.1.15依约向原出租人乙一次性预付了2017全年租金，该给付行为对受让人丙具有约束力，丙不能就已经受领对价的期间向甲重复主张租金。\n丙的救济途径应是向乙主张不当得利返还（乙收取了本应归属丙的下半年租金部分），而非另行向甲收取。\n转让发生在6.30，此前甲已付清全年租金给乙，丙受让房屋时应当知悉（或可查询）租金已被预收的事实，其风险应通过向乙追偿解决。", "points": ["不能得到支持。", "《民法典》第725条（买卖不破租赁）：租赁物在承租人占有使用期间发生所有权变动的，不影响租赁合同效力——丙自过户之日起概括承受出租人地位。", "但甲已于2017.1.15依约向原出租人乙一次性预付了2017全年租金，该给付行为对受让人丙具有约束力，丙不能就已经受领对价的期间向甲重复主张租金。", "丙的救济途径应是向乙主张不当得利返还（乙收取了本应归属丙的下半年租金部分），而非另行向甲收取。", "转让发生在6.30，此前甲已付清全年租金给乙，丙受让房屋时应当知悉（或可查询）租金已被预收的事实，其风险应通过向乙追偿解决。"], "ladder": [1, 2, 3, 4, 5], "audio": "audio/civil-lease-case/q3.mp3", "sources": [["note", "本 HTML 作者在教材【主观工坊】同一事实上的扩展设问（非教材原题）", "互动练习Session/大案例练习/民法提升大案例二_2017房屋租赁纠纷_V1.html#QUESTIONS[2]", "exact", "C-素材抽取"], ["book", "2026主观题民法攻略（精讲）·孟献贵", "p.127（案情出处；本问设问与答案教材未收录）", "range", "C-素材抽取"]]}, {"id": "cs-mf-004", "topicIds": ["mf057"], "title": "第二组·所有权变动与承租人权利·第4问", "prompt": "当事人：甲公司（承租人）／乙公司（出租人）／丙公司（买二楼）／丁公司（买三楼）\n【2014.1.2】甲乙签25年房屋租赁合同，租一二三楼开利民超市。约定\"登记备案之日起生效\"；但双方一直未去登记备案\n【2014 – 2017.1.15】甲连续三年（2014-2016）按时付租金，2017.1.15又付清2017全年租金\n【2017.6.30】乙把二楼卖给丙、三楼卖给丁，都办了过户，但没通知甲；甲事后查登记才知道\n【2017.8.1】交通管理部门统一规定，300㎡免费停车位改成计时收费，客流受影响，超市严重亏损（叠加网购冲击）\n【2017.8.18】甲以\"停车位问题\"为由，发《解除租赁合同通知书》，单方解除\n【2017.12.1】乙起诉，请求确认甲的解除行为无效；距8.18通知已3个月13天\n【2018.1.19】丙起诉甲，要求支付2017.7.1-12.31二楼房屋租金\n问：甲公司起诉请求确认乙公司与丙公司之间的房屋买卖合同无效，能否得到支持？为什么？", "answer": "不能得到支持。\n乙未通知甲即出卖房屋，侵害的是甲依《民法典》第726条享有的房屋承租人优先购买权，救济方式是请求损害赔偿（缔约过失/侵权），而非否定出卖人与第三人之间买卖合同的效力——这是法考通说与主流裁判观点。\n本案也不存在乙丙恶意串通损害甲利益（第154条无效情形）的事实，买卖合同不存在其他法定无效事由。\n且甲的承租人利益已经通过第725条买卖不破租赁得到保障，无需以确认买卖合同无效的方式救济。\n乙未通知甲出售二楼即完成过户，甲仅能就优先购买权受侵害主张损害赔偿，无权请求确认乙丙买卖合同无效。\n\n法律依据：《民法典》第726条（优先购买权及通知义务）、第728条（救济：请求出租人承担赔偿责任，不影响房屋买卖合同的效力）。（教材 p.127 明确引第728条）", "points": ["不能得到支持。", "乙未通知甲即出卖房屋，侵害的是甲依《民法典》第726条享有的房屋承租人优先购买权，救济方式是请求损害赔偿（缔约过失/侵权），而非否定出卖人与第三人之间买卖合同的效力——这是法考通说与主流裁判观点。", "本案也不存在乙丙恶意串通损害甲利益（第154条无效情形）的事实，买卖合同不存在其他法定无效事由。", "且甲的承租人利益已经通过第725条买卖不破租赁得到保障，无需以确认买卖合同无效的方式救济。", "乙未通知甲出售二楼即完成过户，甲仅能就优先购买权受侵害主张损害赔偿，无权请求确认乙丙买卖合同无效。"], "ladder": [1, 2, 3, 4, 5], "audio": "audio/civil-lease-case/q4.mp3", "sources": [["book", "2026主观题民法攻略（精讲）·孟献贵", "p.127", "exact", "C-素材抽取"], ["book", "民法孟献贵百日冲关内部精讲", "p.87", "exact", "C-素材抽取"]]}, {"id": "cs-mf-005", "topicIds": ["mf051"], "title": "第三组·合同解除·第5问", "prompt": "当事人：甲公司（承租人）／乙公司（出租人）／丙公司（买二楼）／丁公司（买三楼）\n【2014.1.2】甲乙签25年房屋租赁合同，租一二三楼开利民超市。约定\"登记备案之日起生效\"；但双方一直未去登记备案\n【2014 – 2017.1.15】甲连续三年（2014-2016）按时付租金，2017.1.15又付清2017全年租金\n【2017.6.30】乙把二楼卖给丙、三楼卖给丁，都办了过户，但没通知甲；甲事后查登记才知道\n【2017.8.1】交通管理部门统一规定，300㎡免费停车位改成计时收费，客流受影响，超市严重亏损（叠加网购冲击）\n【2017.8.18】甲以\"停车位问题\"为由，发《解除租赁合同通知书》，单方解除\n【2017.12.1】乙起诉，请求确认甲的解除行为无效；距8.18通知已3个月13天\n【2018.1.19】丙起诉甲，要求支付2017.7.1-12.31二楼房屋租金\n问：乙公司于2017.12.1向法院起诉请求确认甲公司2017.8.18的解除行为无效，能否得到支持？为什么？", "answer": "不能得到支持——但注意：不是因为甲的解除'合法'，而是因为乙未在法定异议期内行使异议权，异议权已经消灭。这是本题最容易漏掉的采分点，请重点标注。\n先看甲是否有解除权：停车位由免费改收费，是行政机关统一政策所致、不可归责于乙，且免费停车位属合同附随义务而非主给付义务，客流下降、亏损主要还叠加了网络交易冲击，尚不足以认定'致使不能实现合同目的'，甲缺乏《民法典》第563条法定解除事由，其单方解除本身在实体上站不住脚。\n但《民法典》第565条第1款：对方对解除有异议的，应当在合理期限内提出，否则异议权消灭（实务上沿用原《合同法解释二》第24条确立的三个月除斥期间规则，现行合同编通则相关解释延续了这一精神——具体条号建议以最新讲义/听课为准）。\n乙自2017.8.18收到解除通知，至2017.12.1起诉已逾3个月（约105天），已超过异议期，其异议权归于消灭。\n即便甲的解除缺乏法定依据，乙未及时行使异议权，解除通知已经产生了终止合同的法律效果，故乙请求确认解除无效不能得到支持。\n\n【待核】本条涉及的三个月异议期条号（原《合同法解释二》第24条的现行对应条文）未经教材核对，暂不进入默写与限时作答。", "points": ["不能得到支持——但注意：不是因为甲的解除'合法'，而是因为乙未在法定异议期内行使异议权，异议权已经消灭。这是本题最容易漏掉的采分点，请重点标注。", "先看甲是否有解除权：停车位由免费改收费，是行政机关统一政策所致、不可归责于乙，且免费停车位属合同附随义务而非主给付义务，客流下降、亏损主要还叠加了网络交易冲击，尚不足以认定'致使不能实现合同目的'，甲缺乏《民法典》第563条法定解除事由，其单方解除本身在实体上站不住脚。", "但《民法典》第565条第1款：对方对解除有异议的，应当在合理期限内提出，否则异议权消灭（实务上沿用原《合同法解释二》第24条确立的三个月除斥期间规则，现行合同编通则相关解释延续了这一精神——具体条号建议以最新讲义/听课为准）。", "乙自2017.8.18收到解除通知，至2017.12.1起诉已逾3个月（约105天），已超过异议期，其异议权归于消灭。", "即便甲的解除缺乏法定依据，乙未及时行使异议权，解除通知已经产生了终止合同的法律效果，故乙请求确认解除无效不能得到支持。"], "ladder": [1, 2], "audio": "audio/civil-lease-case/q5.mp3", "sources": [["note", "本 HTML 作者在教材【主观工坊】同一事实上的扩展设问（非教材原题）", "互动练习Session/大案例练习/民法提升大案例二_2017房屋租赁纠纷_V1.html#QUESTIONS[4]", "exact", "C-素材抽取"], ["book", "2026主观题民法攻略（精讲）·孟献贵", "p.127（案情出处；本问设问与答案教材未收录）", "range", "C-素材抽取"]]}, {"id": "cs-mf-006", "topicIds": ["mf051"], "title": "第三组·合同解除·第6问", "prompt": "当事人：甲公司（承租人）／乙公司（出租人）／丙公司（买二楼）／丁公司（买三楼）\n【2014.1.2】甲乙签25年房屋租赁合同，租一二三楼开利民超市。约定\"登记备案之日起生效\"；但双方一直未去登记备案\n【2014 – 2017.1.15】甲连续三年（2014-2016）按时付租金，2017.1.15又付清2017全年租金\n【2017.6.30】乙把二楼卖给丙、三楼卖给丁，都办了过户，但没通知甲；甲事后查登记才知道\n【2017.8.1】交通管理部门统一规定，300㎡免费停车位改成计时收费，客流受影响，超市严重亏损（叠加网购冲击）\n【2017.8.18】甲以\"停车位问题\"为由，发《解除租赁合同通知书》，单方解除\n【2017.12.1】乙起诉，请求确认甲的解除行为无效；距8.18通知已3个月13天\n【2018.1.19】丙起诉甲，要求支付2017.7.1-12.31二楼房屋租金\n问：对于解除合同的方式，甲公司可否直接向法院起诉请求解除《房屋租赁合同》，而不通知乙公司？为什么？", "answer": "可以。这是法律认可的另一种行使解除权的方式，只是合同解除生效的时间点不同。\n《民法典》第565条第2款：当事人一方未通知对方，直接以提起诉讼或申请仲裁的方式主张解除合同，人民法院或仲裁机构确认该主张的，合同自起诉状副本或仲裁申请书副本送达对方时解除。\n与第1款'先通知、通知到达即解除'并列，是解除权行使的两种法定路径之一，不以先通知为前提要件。\n若甲选择这一方式，需注意合同解除的时间点将后移至起诉状副本送达乙之时，而非提起诉讼之时，与本案实际采用的通知解除（Q5情形）相比，法律效果发生的时点不同，请结合具体题目要求的解除时间点判断对甲是否有利。", "points": ["可以。这是法律认可的另一种行使解除权的方式，只是合同解除生效的时间点不同。", "《民法典》第565条第2款：当事人一方未通知对方，直接以提起诉讼或申请仲裁的方式主张解除合同，人民法院或仲裁机构确认该主张的，合同自起诉状副本或仲裁申请书副本送达对方时解除。", "与第1款'先通知、通知到达即解除'并列，是解除权行使的两种法定路径之一，不以先通知为前提要件。", "若甲选择这一方式，需注意合同解除的时间点将后移至起诉状副本送达乙之时，而非提起诉讼之时，与本案实际采用的通知解除（Q5情形）相比，法律效果发生的时点不同，请结合具体题目要求的解除时间点判断对甲是否有利。"], "ladder": [1, 2, 3, 4, 5], "audio": "audio/civil-lease-case/q6.mp3", "sources": [["note", "本 HTML 作者在教材【主观工坊】同一事实上的扩展设问（非教材原题）", "互动练习Session/大案例练习/民法提升大案例二_2017房屋租赁纠纷_V1.html#QUESTIONS[5]", "exact", "C-素材抽取"], ["book", "2026主观题民法攻略（精讲）·孟献贵", "p.127（案情出处；本问设问与答案教材未收录）", "range", "C-素材抽取"]]}, {"id": "cs-mf-007", "topicIds": ["mf005"], "title": "第四组·假设变式·第7问", "prompt": "当事人：甲公司（承租人）／乙公司（出租人）／丙公司（买二楼）／丁公司（买三楼）\n【2014.1.2】甲乙签25年房屋租赁合同，租一二三楼开利民超市。约定\"登记备案之日起生效\"；但双方一直未去登记备案\n【2014 – 2017.1.15】甲连续三年（2014-2016）按时付租金，2017.1.15又付清2017全年租金\n【2017.6.30】乙把二楼卖给丙、三楼卖给丁，都办了过户，但没通知甲；甲事后查登记才知道\n【2017.8.1】交通管理部门统一规定，300㎡免费停车位改成计时收费，客流受影响，超市严重亏损（叠加网购冲击）\n【2017.8.18】甲以\"停车位问题\"为由，发《解除租赁合同通知书》，单方解除\n【2017.12.1】乙起诉，请求确认甲的解除行为无效；距8.18通知已3个月13天\n【2018.1.19】丙起诉甲，要求支付2017.7.1-12.31二楼房屋租金\n问：假设情境（独立于主线）：若签约后双方因经营模式和停车场问题存在争议，甲公司未进场装修营业，也未实际支付租金，两年半后甲公司书面表示因信任基础丧失、不再履行合同。乙公司起诉请求甲公司继续履行合同，能否得到支持？为什么？", "answer": "不能得到支持。请与Q2对照：这里的关键区别是甲从未以实际履行行为对'登记备案之日起生效'的附条件予以追认或放弃。\n双方特别约定'自登记备案之日起生效'，属于附生效条件的民事法律行为（《民法典》第158、159条）；未登记备案，条件未成就，合同原则上未生效。\n与Q2不同，本假设情境下甲自始未装修、未营业、未付租金，没有任何以实际行为追认合同效力的事实基础，故不能像Q2那样认定条件已被双方放弃。\n合同未生效，不产生履行请求权基础，乙请求'继续履行'缺乏依据。\n甲乙自始存在争议、甲从未实际履行，两年半的沉默与最终的书面拒绝进一步印证双方并未通过行为使合同发生效力，乙的继续履行请求不能得到支持。", "points": ["不能得到支持。请与Q2对照：这里的关键区别是甲从未以实际履行行为对'登记备案之日起生效'的附条件予以追认或放弃。", "双方特别约定'自登记备案之日起生效'，属于附生效条件的民事法律行为（《民法典》第158、159条）；未登记备案，条件未成就，合同原则上未生效。", "与Q2不同，本假设情境下甲自始未装修、未营业、未付租金，没有任何以实际行为追认合同效力的事实基础，故不能像Q2那样认定条件已被双方放弃。", "合同未生效，不产生履行请求权基础，乙请求'继续履行'缺乏依据。", "甲乙自始存在争议、甲从未实际履行，两年半的沉默与最终的书面拒绝进一步印证双方并未通过行为使合同发生效力，乙的继续履行请求不能得到支持。"], "ladder": [1, 2, 3, 4, 5], "audio": "audio/civil-lease-case/q7.mp3", "sources": [["note", "本 HTML 作者在教材【主观工坊】同一事实上的扩展设问（非教材原题）", "互动练习Session/大案例练习/民法提升大案例二_2017房屋租赁纠纷_V1.html#QUESTIONS[6]", "exact", "C-素材抽取"], ["book", "2026主观题民法攻略（精讲）·孟献贵", "p.127（案情出处；本问设问与答案教材未收录）", "range", "C-素材抽取"]]}, {"id": "cs-mf-008", "topicIds": ["mf070"], "title": "第四组·假设变式·第8问", "prompt": "当事人：甲公司（承租人）／乙公司（出租人）／丙公司（买二楼）／丁公司（买三楼）\n【2014.1.2】甲乙签25年房屋租赁合同，租一二三楼开利民超市。约定\"登记备案之日起生效\"；但双方一直未去登记备案\n【2014 – 2017.1.15】甲连续三年（2014-2016）按时付租金，2017.1.15又付清2017全年租金\n【2017.6.30】乙把二楼卖给丙、三楼卖给丁，都办了过户，但没通知甲；甲事后查登记才知道\n【2017.8.1】交通管理部门统一规定，300㎡免费停车位改成计时收费，客流受影响，超市严重亏损（叠加网购冲击）\n【2017.8.18】甲以\"停车位问题\"为由，发《解除租赁合同通知书》，单方解除\n【2017.12.1】乙起诉，请求确认甲的解除行为无效；距8.18通知已3个月13天\n【2018.1.19】丙起诉甲，要求支付2017.7.1-12.31二楼房屋租金\n问：三楼转让给丁公司后，甲公司将三楼转租给他人（用途相同），丁公司以甲公司未征得其同意为由要求甲公司承担损害赔偿责任，丁公司的主张是否成立？", "answer": "成立。丁公司自房屋过户之日起已经是三楼新的出租人，甲公司转租理应征得丁公司（而非原出租人乙公司）的同意。\n《民法典》第725条买卖不破租赁：丙丁自过户之日起概括承受原出租人在租赁合同项下的权利义务，成为新出租人。\n《民法典》第716条：承租人转租应当经出租人同意；未经出租人同意转租的，出租人可以主张相应责任（含请求解除合同、损害赔偿）。\n转租行为发生在丁取得三楼所有权之后，'出租人'已经变更为丁，甲若仍以曾获乙同意（或未获任何同意）为由转租，都不能对抗丁作为现出租人的同意权。\n甲在丁受让三楼后转租，未证明已征得丁的同意，构成未经出租人同意的违法转租，丁可依第716条主张甲承担相应责任，其主张成立。", "points": ["成立。丁公司自房屋过户之日起已经是三楼新的出租人，甲公司转租理应征得丁公司（而非原出租人乙公司）的同意。", "《民法典》第725条买卖不破租赁：丙丁自过户之日起概括承受原出租人在租赁合同项下的权利义务，成为新出租人。", "《民法典》第716条：承租人转租应当经出租人同意；未经出租人同意转租的，出租人可以主张相应责任（含请求解除合同、损害赔偿）。", "转租行为发生在丁取得三楼所有权之后，'出租人'已经变更为丁，甲若仍以曾获乙同意（或未获任何同意）为由转租，都不能对抗丁作为现出租人的同意权。", "甲在丁受让三楼后转租，未证明已征得丁的同意，构成未经出租人同意的违法转租，丁可依第716条主张甲承担相应责任，其主张成立。"], "ladder": [1, 2, 3, 4, 5], "audio": "audio/civil-lease-case/q8.mp3", "sources": [["note", "本 HTML 作者在教材【主观工坊】同一事实上的扩展设问（非教材原题）", "互动练习Session/大案例练习/民法提升大案例二_2017房屋租赁纠纷_V1.html#QUESTIONS[7]", "exact", "C-素材抽取"], ["book", "2026主观题民法攻略（精讲）·孟献贵", "p.127（案情出处；本问设问与答案教材未收录）", "range", "C-素材抽取"]]}]}, {"deck": "民诉提升大案例·仲裁裁决司法审查", "kind": "exam", "origin": "互动练习Session/大案例练习/民诉提升大案例_大力公司仲裁裁决司法审查_V2.html", "items": [{"id": "ex-ms-001", "topicIds": ["ms195", "ms191"], "title": "仲裁机构如何确定", "prompt": "【2026-03-01】大力养生会所（大力公司的分公司，住所地北京市朝阳区）与陈某某签订《合作协议书》。；约定：因本合同引起的任何争议，均提交\"大力公司所在地仲裁委员会\"仲裁，裁决终局。\n【经营中 → 2026-03-20】陈某某与大力公司在经营战略上产生分歧，依仲裁协议提交北京仲裁委员会仲裁。；预交仲裁费后，北京仲裁委员会邮寄立案受理，依规则确定3名仲裁员组成仲裁庭。\n【开庭前3天 → 庭审中】双方同意在线开庭，首席仲裁员组织双方整理争议焦点并发布庭审提纲，另外2名仲裁员全程参加、均发表了看法。；大力公司未对北仲的管辖权提出异议，参加了仲裁庭审理的全部过程。\n【2026-05-01】仲裁庭裁决：解除《合作协议书》；大力公司向陈某某返还投资款20万元。\n【2026-06-01】大力公司向北京市第四中级人民法院，申请撤销仲裁裁决，理由有三：；理由①：不存在仲裁协议——分公司签的，且\"大力公司所在地仲裁委员会\"指向不明。；理由②：程序违法——宣读答辩意见的半小时内，首席仲裁员不时闭目缓缓点头，两名仲裁员到处走动、不时离开摄像头。；理由③：枉法裁决——仲裁员故意错误认定法律关系性质，法律适用有误。\n【2026-08-14】北京市第四中级人民法院裁定：驳回大力公司撤销仲裁裁决的申请。\n【补充查明】关键：北京仲裁委员会位于朝阳区；中国国际经济贸易仲裁委员会、中国海事仲裁委员会均位于西城区。\n问：本案双方当事人约定的仲裁机构为“大力公司所在地仲裁委员会”。法院在认定仲裁机构时应当如何理解？请说明理由。", "answer": "结论：可直接推定当事人约定的仲裁机构就是北京仲裁委员会（1分）。\n法理：仲裁协议约定由某地仲裁机构仲裁、该地仅有一个仲裁机构的，该机构视为约定的仲裁机构（2分）。\n涵摄：本案仲裁条款约定的是“大力公司所在地仲裁委员会”，大力公司住所地在北京市朝阳区，朝阳区仅有北京仲裁委员会一家仲裁机构，故应认定双方约定了明确的仲裁机构（2分）。", "points": ["结论：可直接推定当事人约定的仲裁机构就是北京仲裁委员会（1分）。", "法理：仲裁协议约定由某地仲裁机构仲裁、该地仅有一个仲裁机构的，该机构视为约定的仲裁机构（2分）。", "涵摄：本案仲裁条款约定的是“大力公司所在地仲裁委员会”，大力公司住所地在北京市朝阳区，朝阳区仅有北京仲裁委员会一家仲裁机构，故应认定双方约定了明确的仲裁机构（2分）。"], "ladder": [1, 2, 3, 4, 5], "exam": {"year": 2026, "paper": "民诉·众合提升大案例（官方窗口）", "qno": 1}, "audio": "audio/civpro-arbitration-case/q1-ask.mp3", "sources": [["note", "众合官方（竹马）解析·民诉提升大案例·大力公司仲裁裁决司法审查", "第1题 · 5分（2+2+1）", "exact", "C-素材抽取"], ["book", "2026主观题民诉攻略（精讲）·戴鹏", "考点见 topicIds；页码待主线用 tools/locate.py 回填", "none", "C-素材抽取"]]}, {"id": "ex-ms-002", "topicIds": ["ms199", "ms213", "ms033"], "title": "仲裁协议效力异议 —— 过了这村没这店", "prompt": "【2026-03-01】大力养生会所（大力公司的分公司，住所地北京市朝阳区）与陈某某签订《合作协议书》。；约定：因本合同引起的任何争议，均提交\"大力公司所在地仲裁委员会\"仲裁，裁决终局。\n【经营中 → 2026-03-20】陈某某与大力公司在经营战略上产生分歧，依仲裁协议提交北京仲裁委员会仲裁。；预交仲裁费后，北京仲裁委员会邮寄立案受理，依规则确定3名仲裁员组成仲裁庭。\n【开庭前3天 → 庭审中】双方同意在线开庭，首席仲裁员组织双方整理争议焦点并发布庭审提纲，另外2名仲裁员全程参加、均发表了看法。；大力公司未对北仲的管辖权提出异议，参加了仲裁庭审理的全部过程。\n【2026-05-01】仲裁庭裁决：解除《合作协议书》；大力公司向陈某某返还投资款20万元。\n【2026-06-01】大力公司向北京市第四中级人民法院，申请撤销仲裁裁决，理由有三：；理由①：不存在仲裁协议——分公司签的，且\"大力公司所在地仲裁委员会\"指向不明。；理由②：程序违法——宣读答辩意见的半小时内，首席仲裁员不时闭目缓缓点头，两名仲裁员到处走动、不时离开摄像头。；理由③：枉法裁决——仲裁员故意错误认定法律关系性质，法律适用有误。\n【2026-08-14】北京市第四中级人民法院裁定：驳回大力公司撤销仲裁裁决的申请。\n【补充查明】关键：北京仲裁委员会位于朝阳区；中国国际经济贸易仲裁委员会、中国海事仲裁委员会均位于西城区。\n问：大力公司在申请撤销仲裁裁决时认为：其与陈某某之间不存在仲裁协议。从本案程序经过的角度考虑，法院是否会支持其主张？请说明理由。", "answer": "结论：申请人就该纠纷自愿接受北京仲裁委员会管辖，北京仲裁委员会有权审理本案（1分）。\n法理：当事人对仲裁协议的效力有异议的，应当在仲裁庭首次开庭前提出（2分）。\n涵摄：大力公司虽然在撤销程序中主张双方之间没有仲裁协议，但在仲裁庭审理过程中并未对北京仲裁委员会具有管辖权提出异议，且参加了仲裁庭审理的全部过程（2分）。", "points": ["结论：申请人就该纠纷自愿接受北京仲裁委员会管辖，北京仲裁委员会有权审理本案（1分）。", "法理：当事人对仲裁协议的效力有异议的，应当在仲裁庭首次开庭前提出（2分）。", "涵摄：大力公司虽然在撤销程序中主张双方之间没有仲裁协议，但在仲裁庭审理过程中并未对北京仲裁委员会具有管辖权提出异议，且参加了仲裁庭审理的全部过程（2分）。"], "ladder": [1, 2, 3, 4, 5], "exam": {"year": 2026, "paper": "民诉·众合提升大案例（官方窗口）", "qno": 2}, "audio": "audio/civpro-arbitration-case/q2-ask.mp3", "sources": [["note", "众合官方（竹马）解析·民诉提升大案例·大力公司仲裁裁决司法审查", "第2题 · 5分（2+2+1）", "exact", "C-素材抽取"], ["book", "2026主观题民诉攻略（精讲）·戴鹏", "考点见 topicIds；页码待主线用 tools/locate.py 回填", "none", "C-素材抽取"]]}, {"id": "ex-ms-003", "topicIds": ["ms208", "ms203"], "title": "程序违法 vs 举止散漫", "prompt": "【2026-03-01】大力养生会所（大力公司的分公司，住所地北京市朝阳区）与陈某某签订《合作协议书》。；约定：因本合同引起的任何争议，均提交\"大力公司所在地仲裁委员会\"仲裁，裁决终局。\n【经营中 → 2026-03-20】陈某某与大力公司在经营战略上产生分歧，依仲裁协议提交北京仲裁委员会仲裁。；预交仲裁费后，北京仲裁委员会邮寄立案受理，依规则确定3名仲裁员组成仲裁庭。\n【开庭前3天 → 庭审中】双方同意在线开庭，首席仲裁员组织双方整理争议焦点并发布庭审提纲，另外2名仲裁员全程参加、均发表了看法。；大力公司未对北仲的管辖权提出异议，参加了仲裁庭审理的全部过程。\n【2026-05-01】仲裁庭裁决：解除《合作协议书》；大力公司向陈某某返还投资款20万元。\n【2026-06-01】大力公司向北京市第四中级人民法院，申请撤销仲裁裁决，理由有三：；理由①：不存在仲裁协议——分公司签的，且\"大力公司所在地仲裁委员会\"指向不明。；理由②：程序违法——宣读答辩意见的半小时内，首席仲裁员不时闭目缓缓点头，两名仲裁员到处走动、不时离开摄像头。；理由③：枉法裁决——仲裁员故意错误认定法律关系性质，法律适用有误。\n【2026-08-14】北京市第四中级人民法院裁定：驳回大力公司撤销仲裁裁决的申请。\n【补充查明】关键：北京仲裁委员会位于朝阳区；中国国际经济贸易仲裁委员会、中国海事仲裁委员会均位于西城区。\n问：大力公司认为，3名仲裁员在庭审中“走神”的行为构成程序违法。法院是否会支持其主张？请说明理由。", "answer": "结论：不构成程序违法，法院不会支持。\n法理：仲裁庭开庭应满足《仲裁法》及仲裁规则对法定程序的要求（2分）。\n涵摄：仲裁员在大力公司宣读书面答辩意见的半小时中出现“走神”，但并未侵犯大力公司的程序性权利，未对其发表意见的机会造成实质影响，不违反《仲裁法》及仲裁规则的法定程序规定，不构成程序违法（2分）。", "points": ["结论：不构成程序违法，法院不会支持。", "法理：仲裁 与陈某某签订《合作协议书》。；约定：因本合同引起的任何争议，均提交\"大力公司所在地仲裁委员会\"仲裁，裁决终局。\n【经营中 → 2026-03-20】陈某某与大力公司在经营战略上产生分歧，依仲裁协议提交北京仲裁委员会仲裁。；预交仲裁费后，北京仲裁委员会邮寄立案受理，依规则确定3名仲裁员组成仲裁庭。\n【开庭前3天 → 庭审中】双方同意在线开庭，首席仲裁员组织双方整理争议焦点并发布庭审提纲，另外2名仲裁员全程参加、均发表了看法。；大力公司未对北仲的管辖权提出异议，参加了仲裁庭审理的全部过程。\n【2026-05-01】仲裁庭裁决：解除《合作协议书》；大力公司向陈某某返还投资款20万元。\n【2026-06-01】大力公司向北京市第四中级人民法院，申请撤销仲裁裁决，理由有三：；理由①：不存在仲裁协议——分公司签的，且\"大力公司所在地仲裁委员会\"指向不明。；理由②：程序违法——宣读答辩意见的半小时内，首席仲裁员不时闭目缓缓点头，两名仲裁员到处走动、不时离开摄像头。；理由③：枉法裁决——仲裁员故意错误认定法律关系性质，法律适用有误。\n【2026-08-14】北京市第四中级人民法院裁定：驳回大力公司撤销仲裁裁决的申请。\n【补充查明】关键：北京仲裁委员会位于朝阳区；中国国际经济贸易仲裁委员会、中国海事仲裁委员会均位于西城区。\n问：在仲裁裁决的执行过程中，大力公司能否申请不予执行仲裁裁决？请说明理由。", "answer": "结论：不能以相同理由申请不予执行，但可以以不同理由申请不予执行。\n法理①：当事人向人民法院申请撤销仲裁裁决被驳回后，又在执行程序中以相同理由提出不予执行抗辩的，人民法院不予支持（2分）。\n法理②：本案当事人不服仲裁裁决的，可以先申请撤销仲裁裁决，进入执行程序后，再以不同理由申请不予执行仲裁裁决（2分）——这一半是常见漏答点，别只写“不能”就收尾。", "points": ["结论：不能以相同理由申请不予执行，但可以以不同理由申请不予执行。", "法理①：当事人向人民法院申请撤销仲裁裁决被驳回后，又在执行程序中以相同理由提出不予执行抗辩的，人民法院不予支持（2分）。", "法理②：本案当事人不服仲裁裁决的，可以先申请撤销仲裁裁决，进入执行程序后，再以不同理由申请不予执行仲裁裁决（2分）——这一半是常见漏答点，别只写“不能”就收尾。"], "ladder": [1, 2, 3, 4, 5], "exam": {"year": 2026, "paper": "民诉·众合提升大案例（官方窗口）", "qno": 5}, "audio": "audio/civpro-arbitration-case/q5-ask.mp3", "sources": [["note", "众合官方（竹马）解析·民诉提升大案例·大力公司仲裁裁决司法审查", "第5题 · 4分（2+2）", "exact", "C-素材抽取"], ["book", "2026主观题民诉攻略（精讲）·戴鹏", "考点见 topicIds；页码待主线用 tools/locate.py 回填", "none", "C-素材抽取"]]}]}, {"deck": "民诉金句小练·台阶式", "kind": "goldline", "origin": "互动练习Session/金句挑战/民诉金句小练_V1.html", "items": [{"id": "gl-ms-001", "topicIds": ["ms046", "ms047"], "title": "管辖·专属管辖", "prompt": "甲区张三和乙区李四在丙区签订一份房屋租赁合同，约定将张三位于丁区的一处房屋出租给李四，后来张三拒不履行合同，李四向自己所在的乙区人民法院起诉张三，张三没有提出管辖权异议。请问：本案中乙区法院是否享有管辖权？", "answer": "由不动产所在地人民法院管辖（专属管辖）。范围包括：不动产权利确认、分割、相邻关系等物权纠纷；以及农村土地承包经营合同、房屋租赁合同、建设工程施工合同、政策性房屋买卖合同纠纷。", "points": ["没有管辖权。", "本案为房屋租赁合同纠纷，按不动产纠纷确定管辖，应当由不动产所在地即丁区法院专属管辖；", "专属管辖不能通过应诉管辖或协议改变，就算张三没有提出管辖权异议，乙区法院也不能取得管辖权。"], "cloze": ["不动产所在地", "房屋租赁"], "ladder": [1, 2, 3, 4, 5], "sources": [["book", "民诉攻略基础版", "专题四 例题（甲区张三、乙区李四案）（本条 L5 小案例出处）", "range", "C-素材抽取"], ["book", "2026主观题民诉攻略（精讲）·戴鹏", "考点见 topicIds；页码待主线用 tools/locate.py 回填", "none", "C-素材抽取"]]}, {"id": "gl-ms-002", "topicIds": ["ms048", "ms049"], "title": "管辖·协议管辖", "prompt": "甲市A县的刘某与乙市B区的何某签订了木材买卖合同，约定何某在丙市C区将一批木材交付给刘某。合同约定，因合同履行发生的一切纠纷，提交位于甲市的M仲裁委员会仲裁；之后双方又签订补充协议，约定发生纠纷也可以向乙市B区或者甲市A县人民法院起诉。后来因合同履行发生纠纷，刘某可以向哪个（些）法院起诉？", "answer": "可以。根据司法解释规定，当事人可以选择向其中一个法院起诉。", "points": ["刘某可以选择向乙市B区或者甲市A县人民法院起诉。", "首先，本案原约定的仲裁与后来约定的诉讼并存（或裁或审），该仲裁协议无效，案件应由人民法院主管；", "其次，本案存在管辖协议，约定由乙市B区或者甲市A县人民法院管辖——根据司法解释规定，管辖协议约定两个以上与争议有实际联系地点的法院管辖的，原告可以选择向其中一个法院起诉，故刘某可以选择向B区或者A县法院起诉。"], "cloze": ["其中一个法院"], "ladder": [1, 2, 3, 4, 5], "sources": [["book", "民诉攻略基础版", "专题四 例2（刘某何某木材买卖合同案；原书该处OCR有缺字，题干中补充协议的具体约定内容按同页分析部分补全）（本条 L5 小案例出处）", "range", "C-素材抽取"], ["book", "2026主观题民诉攻略（精讲）·戴鹏", "考点见 topicIds；页码待主线用 tools/locate.py 回填", "none", "C-素材抽取"]]}, {"id": "gl-ms-003", "topicIds": ["ms043", "ms044"], "title": "管辖·合同纠纷", "prompt": "甲市A区的公司与乙市B区的公司签订买卖合同，合同约定“合同履行地为甲市A区”，但实际交货是在乙市B区仓库完成的。因合同纠纷起诉，合同履行地应认定为哪里？", "answer": "由被告住所地或者合同履行地人民法院管辖。注意：约定履行地与实际履行地不一致的，以约定履行地为合同履行地。", "points": ["应认定为甲市A区。", "合同约定履行地点的，以约定的履行地点为合同履行地，即使约定履行地与实际履行地不一致，仍以约定履行地为准。", "故本案原告可以选择被告住所地（乙市B区）或合同履行地（甲市A区）法院起诉。"], "cloze": ["被告住所地", "合同履行地", "约定履行地"], "ladder": [1, 2, 3, 4, 5], "sources": [["note", "Claude 自编小案例（非真题原文），供练手用", "互动练习Session/金句挑战/民诉金句小练_V1.html#items[2].caseQ", "exact", "C-素材抽取"], ["book", "2026主观题民诉攻略（精讲）·戴鹏", "考点见 topicIds；页码待主线用 tools/locate.py 回填", "none", "C-素材抽取"]]}, {"id": "gl-ms-004", "topicIds": ["ms054"], "title": "管辖·应诉管辖", "prompt": "甲住所地在A区，乙住所地在B区，两人签订一般买卖合同（非不动产、非专属管辖事项），合同未约定管辖法院。乙向自己所在的B区法院起诉甲，甲未提出管辖权异议，直接进行了实体答辩。B区法院是否取得管辖权？", "answer": "受诉法院取得应诉管辖权——前提是没有违反级别管辖和专属管辖的规定。", "points": ["取得管辖权。", "本案是普通合同纠纷，不涉及专属管辖或级别管辖问题；", "甲在提交答辩状期间没有提出管辖权异议，且进行了实体答辩，视为受诉法院（B区）取得应诉管辖权。"], "cloze": ["应诉管辖权", "级别管辖", "专属管辖"], "ladder": [1, 2, 3, 4, 5], "sources": [["note", "Claude 自编小案例（非真题原文），供练手用", "互动练习Session/金句挑战/民诉金句小练_V1.html#items[3].caseQ", "exact", "C-素材抽取"], ["book", "2026主观题民诉攻略（精讲）·戴鹏", "考点见 topicIds；页码待主线用 tools/locate.py 回填", "none", "C-素材抽取"]]}, {"id": "gl-ms-005", "topicIds": ["ms056", "ms068"], "title": "当事人", "prompt": "张三的儿子张小三（15岁）将甲公司董事长兼法定代表人李四的办公室砸毁，造成甲公司经济损失1万元，甲公司拟通过诉讼方式请求赔偿。请分析张三、张小三、李四是否是本案的当事人？其诉讼地位是什么？", "answer": "以其本人和监护人作为共同被告。", "points": ["张三、张小三是本案的当事人，诉讼地位是共同被告；", "李四不是本案当事人，其诉讼地位是原告甲公司的法定代表人。", "理由：无、限制民事行为能力人致人损害的，无、限制民事行为能力人和其监护人为共同被告，故张三、张小三为共同被告；", "李四不是本案侵权法律关系的一方当事人，不是适格原告，应以原告甲公司法定代表人身份参加诉讼。"], "cloze": ["本人", "监护人"], "ladder": [1, 2, 3, 4, 5], "sources": [["book", "民诉攻略基础版", "专题五 例题（张三张小三案）（本条 L5 小案例出处）", "range", "C-素材抽取"], ["book", "2026主观题民诉攻略（精讲）·戴鹏", "考点见 topicIds；页码待主线用 tools/locate.py 回填", "none", "C-素材抽取"]]}, {"id": "gl-ms-006", "topicIds": ["ms062"], "title": "当事人", "prompt": "甲公司与乙公司签订钢材买卖合同，约定甲公司向乙公司支付40万元，乙公司分三批向甲公司提供100吨钢材。乙公司收到货款、提供两批钢材后不再继续提供。甲公司起诉乙公司要求继续履行合同并支付违约金。乙公司称剩余钢材已交付给甲公司的业务员张某，并出示张某的签收条和甲公司对张某的授权委托书；甲公司称张某确实是业务员但未获授权收货，张某也未收到钢材。甲、乙公司申请法院追加张某为共同被告，法院准许。请评价法院的做法。", "answer": "该法人（或其他组织）为当事人；工作人员本人不作为当事人。", "points": ["法院将张某追加为共同被告的做法是错误的。", "张某是甲公司的业务员，其执行工作任务引发的纠纷应当以甲公司为当事人，即不能以工作人员本人为当事人，故张某不是本案当事人，不能作为共同被告。"], "cloze": ["法人", "工作人员"], "ladder": [1, 2, 3, 4, 5], "sources": [["book", "民诉攻略基础版", "专题五 例题（改编自2010年主观题·甲乙公司钢材案）（本条 L5 小案例出处）", "range", "C-素材抽取"], ["book", "2026主观题民诉攻略（精讲）·戴鹏", "考点见 topicIds；页码待主线用 tools/locate.py 回填", "none", "C-素材抽取"]]}, {"id": "gl-ms-007", "topicIds": ["ms088"], "title": "证明责任", "prompt": "曹某伪造甲公司的公章与乙公司签订了《商务推广合同》，约定甲公司向乙公司支付1624万元，乙公司为甲公司进行商务推广。甲公司拒绝追认该合同，乙公司起诉曹某要求曹某赔偿损失。曹某抗辩称乙公司当时是知情的（即知道曹某没有代理权）。该事实应由谁承担证明责任？", "answer": "由行为人对相对人知道或应当知道其无权代理的事实承担证明责任。", "points": ["推定乙公司对曹某没有代理权这一事实是不知情的（善意推定）；", "如果曹某主张乙公司知情，应当由曹某（行为人）对乙公司知情的事实承担证明责任。"], "cloze": ["行为人", "证明责任"], "ladder": [1, 2, 3, 4, 5], "sources": [["book", "民诉攻略基础版", "专题九 例题（曹某伪造公章案）（本条 L5 小案例出处）", "range", "C-素材抽取"], ["book", "2026主观题民诉攻略（精讲）·戴鹏", "考点见 topicIds；页码待主线用 tools/locate.py 回填", "none", "C-素材抽取"]]}, {"id": "gl-ms-008", "topicIds": ["ms093", "ms094"], "title": "证明标准", "prompt": "原、被告因合同纠纷诉至法院，被告主张合同存在欺诈而要求撤销合同。请判断：\"被告主张合同存在欺诈而要求撤销合同，应当将存在欺诈的事实证明到高度可能性标准，否则将承担证明责任的不利后果\"，这一说法对不对？", "answer": "负有证明责任的当事人提供的证据，法院确信待证事实的存在具有高度可能性的，应认定该事实存在。（欺诈/胁迫/恶意串通/口头遗嘱或赠与——标准更高：确信到能够排除合理怀疑。）", "points": ["错误。", "对于合同是否存在欺诈的事实，应当由主张存在欺诈事实的被告承担证明责任，但欺诈属于特殊事实，应适用特殊标准即排除合理怀疑，而不是高度可能性标准。"], "cloze": ["高度可能性", "排除合理怀疑"], "ladder": [1, 2, 3, 4, 5], "sources": [["book", "民诉攻略基础版", "专题九 例题（合同欺诈四问案）（本条 L5 小案例出处）", "range", "C-素材抽取"], ["book", "2026主观题民诉攻略（精讲）·戴鹏", "考点见 topicIds；页码待主线用 tools/locate.py 回填", "none", "C-素材抽取"]]}]}, {"deck": "刑法金句小练·台阶式", "kind": "goldline", "origin": "互动练习Session/金句挑战/刑法金句小练_V2.html", "items": [{"id": "gl-xf-101", "topicIds": ["xf006", "xf008"], "title": "结果加重犯", "prompt": "甲将乙打成轻伤（故意伤害的基本犯是轻伤），乙在搏斗中摔倒磕破头部，感染后死亡，该行为与死亡结果之间具有因果关系。怎么定？", "answer": "行为人的XX行为造成了基本犯以外的加重结果（重伤、死亡），由于XX行为与加重结果具有因果关系，故行为人构成XX罪的结果加重犯。", "points": ["甲的故意伤害行为造成了基本犯（轻伤）以外的加重结果（死亡），由于故意伤害行为与死亡结果具有因果关系，故甲构成故意伤害罪的结果加重犯（故意伤害致人死亡）。"], "cloze": ["加重", "因果关系", "结果加重犯"], "ladder": [1, 2, 3, 4, 5], "sources": [["book", "刑法考前必背金句", "p.1-7", "range", "C-素材抽取"], ["note", "Claude 自编小案例（非真题原文），供练手用", "互动练习Session/金句挑战/刑法金句小练_V2.html#items[0].caseQ", "exact", "C-素材抽取"]]}, {"id": "gl-xf-102", "topicIds": ["xf003", "xf004", "xf005"], "title": "不作为犯罪", "prompt": "母亲甲明知刚出生的婴儿有生命危险却不喂养（甲有能力喂养），婴儿因此死亡。怎么定？", "answer": "客观上行为人负有XX义务，有能力而不履行该义务，造成某某结果；主观上行为人对该结果具有故意（过失），故构成不作为形式的YY罪。", "points": ["甲基于母亲身份负有法定的抚养义务，有能力履行而不履行，导致婴儿死亡；", "主观上对死亡结果至少具有放任的故意，构成不作为形式的故意杀人罪。"], "cloze": ["义务", "故意", "不作为"], "ladder": [1, 2, 3, 4, 5], "sources": [["book", "刑法考前必背金句", "p.1-7", "range", "C-素材抽取"], ["note", "Claude 自编小案例（非真题原文），供练手用", "互动练习Session/金句挑战/刑法金句小练_V2.html#items[1].caseQ", "exact", "C-素材抽取"]]}, {"id": "gl-xf-103", "topicIds": ["xf021"], "title": "正当防卫·假想防卫", "prompt": "深夜，甲误以为跟在身后的路人乙要行凶，遂将乙打成重伤，实际上乙只是同路而已，没有任何不法侵害。怎么定？", "answer": "假想防卫不构成故意犯罪。如果行为人有过失，按过失犯罪（过失致人死亡/过失致人重伤）处理；如果没有过失，按意外事件处理。", "points": ["甲的行为属于假想防卫，不构成故意犯罪。", "如果甲应当预见乙不是行凶者而没有预见（存在过失），构成过失致人重伤罪；", "如果甲已尽到注意义务、没有过失，按意外事件处理。"], "cloze": ["故意犯罪", "过失犯罪", "意外事件"], "ladder": [1, 2, 3, 4, 5], "sources": [["book", "刑法考前必背金句", "p.1-7", "range", "C-素材抽取"], ["note", "Claude 自编小案例（非真题原文），供练手用", "互动练习Session/金句挑战/刑法金句小练_V2.html#items[2].caseQ", "exact", "C-素材抽取"]]}, {"id": "gl-xf-104", "topicIds": ["xf025", "xf012"], "title": "正当防卫·防卫过当", "prompt": "田某持砍刀砍向金某，金某夺刀反击，田某逃跑准备再找刀。金某持刀追赶，田某摔倒在地后，金某又砍了一刀致田某死亡，且经查无法确定致命一刀是田某倒地前还是倒地后所砍。金某的行为如何认定？", "answer": "行为人的防卫行为明显超过了必要限度，且造成了过当结果（重伤/死亡），构成防卫过当，对过当结果至少有过失，应当认定为XX罪，但应当减轻或者免除处罚。", "points": ["若致命一刀是倒地前所砍，金某的追砍仍属防卫适时（田某逃跑找刀，不法侵害危险尚未解除），且未过当，构成正当防卫；", "若致命一刀是倒地后所砍，此时田某已无凶器、丧失侵害能力，属于防卫过当。", "根据存疑时有利于被告人原则，应认定为第一种情形，金某构成正当防卫，而非防卫过当。"], "cloze": ["必要限度", "防卫过当", "过失"], "ladder": [1, 2, 3, 4, 5], "sources": [["book", "刑法考前必背金句", "p.1-7", "range", "C-素材抽取"], ["book", "主观尊享私教-刑法基础小案例汇总", "2026/4/8 金某案（本条 L5 小案例出处）", "exact", "C-素材抽取"]]}, {"id": "gl-xf-105", "topicIds": ["xf019"], "title": "事实认识错误·对象错误", "prompt": "甲误将熟睡的丙当作仇人乙实施杀害行为，致丙死亡。怎么定？", "answer": "行为人误将A当作B，属于对象错误，应当认定为XX罪既遂。", "points": ["甲误将丙当作乙，属于对象错误，应当认定为故意杀人罪既遂。"], "cloze": ["对象错误", "既遂"], "ladder": [1, 2, 3, 4, 5], "sources": [["book", "刑法考前必背金句", "p.1-7", "range", "C-素材抽取"], ["note", "Claude 自编小案例（非真题原文），供练手用", "互动练习Session/金句挑战/刑法金句小练_V2.html#items[4].caseQ", "exact", "C-素材抽取"]]}, {"id": "gl-xf-106", "topicIds": ["xf019"], "title": "事实认识错误·打击错误", "prompt": "甲举枪射击仇人乙，因手抖导致子弹偏离，打死了旁边路过的丙。怎么定？", "answer": "属于打击错误。根据法定符合说，行为人构成XX罪（对乙，既遂）与XX罪未遂（对甲），属于想象竞合，从一重罪处罚。", "points": ["属于打击错误。", "根据法定符合说，甲构成故意杀人罪既遂（对丙）与故意杀人罪未遂（对乙），属于想象竞合，从一重罪处罚。"], "cloze": ["打击错误", "想象竞合"], "ladder": [1, 2, 3, 4, 5], "sources": [["book", "刑法考前必背金句", "p.1-7", "range", "C-素材抽取"], ["note", "Claude 自编小案例（非真题原文），供练手用", "互动练习Session/金句挑战/刑法金句小练_V2.html#items[5].caseQ", "exact", "C-素材抽取"]]}, {"id": "gl-xf-107", "topicIds": ["xf052"], "title": "共同犯罪·实行过限", "prompt": "孔某、陶某共谋伤害姜某。孔某临时起意强奸姜某，随后又产生灭口想法杀害姜某。陶某始终不知道孔某要杀人这件事。孔某的杀人行为，陶某要不要负责？", "answer": "甲的XX行为超出了共同犯罪的范围，属于实行过限，乙对甲的XX行为造成的XX结果不负责任。", "points": ["孔某构成故意杀人罪（未遂）。", "陶某对孔某的杀人行为不用负责，因为陶某并不知道孔某要杀人——孔某的杀人行为超出了二人事先共谋的伤害（及后续强奸、抢劫）范围，属于实行过限，对超出部分乙不负责任。"], "cloze": ["实行过限", "不负责任"], "ladder": [1, 2, 3, 4, 5], "sources": [["book", "刑法考前必背金句", "p.1-7", "range", "C-素材抽取"], ["book", "主观尊享私教-刑法基础小案例汇总", "2026/4/10 孔某陶某案（本条 L5 小案例出处）", "exact", "C-素材抽取"]]}, {"id": "gl-xf-108", "topicIds": ["xf137"], "title": "自首", "prompt": "陈某勒死李某后逃至外地，几日后走投无路，向公安机关投案，如实交代了杀人事实。陈某是否成立自首？", "answer": "行为人犯X罪后自动投案，如实供述自己所犯罪行，成立自首，可以从轻或者减轻处罚。", "points": ["成立自首。", "走投无路而投案的，仍然属于自动投案，不影响自首的成立；", "陈某如实供述了故意杀人的事实，成立自首，可以从轻或者减轻处罚。"], "cloze": ["自动投案", "自首"], "ladder": [1, 2, 3, 4, 5], "sources": [["book", "刑法考前必背金句", "p.1-7", "range", "C-素材抽取"], ["book", "主观尊享私教-刑法基础小案例汇总", "2026/4/3 陈某案（本条 L5 小案例出处）", "exact", "C-素材抽取"]]}]}, {"deck": "刑法必背金句·总论1-10", "kind": "goldline", "origin": "互动练习Session/金句练习/刑法必背金句_Session1_总论1-10_V1.html", "items": [{"id": "gl-xf-001", "topicIds": ["xf012"], "title": "无法查明·单独犯罪", "prompt": "用「无法查明·单独犯罪」这条金句答一道小题：给定案情后，如何落笔表述？", "answer": "根据事实存疑有利于被告人的原则，行为人不需要对XX结果负责。", "ladder": [1, 2, 3, 4], "audio": "audio/criminal-quotes-s1/t1-0.mp3", "sources": [["book", "刑法考前必背金句", "p.1-2", "range", "C-素材抽取"]]}, {"id": "gl-xf-002", "topicIds": ["xf011"], "title": "无法查明·共同犯罪", "prompt": "用「无法查明·共同犯罪」这条金句答一道小题：给定案情后，如何落笔表述？", "answer": "由于无法查明谁的行为造成XX结果，但甲、乙构成共同犯罪（共同正犯），无须查明，根据\"部分实行，全部责任\"的原则，甲、乙均应对XX结果负责。", "ladder": [1, 2, 3, 4], "audio": "audio/criminal-quotes-s1/t1-1.mp3", "sources": [["book", "刑法考前必背金句", "p.1-2", "range", "C-素材抽取"]]}, {"id": "gl-xf-003", "topicIds": ["xf003", "xf004", "xf005"], "title": "不作为犯罪", "prompt": "用「不作为犯罪」这条金句答一道小题：给定案情后，如何落笔表述？", "answer": "客观上行为人负有XX义务，有能力而不履行该义务，造成某某结果。主观上行为人对该结果具有故意（过失），故构成不作为形式的YY罪。", "ladder": [1, 2, 3, 4], "audio": "audio/criminal-quotes-s1/t2-0.mp3", "sources": [["book", "刑法考前必背金句", "p.1-2", "range", "C-素材抽取"]]}, {"id": "gl-xf-004", "topicIds": ["xf006", "xf008"], "title": "结果加重犯", "prompt": "用「结果加重犯」这条金句答一道小题：给定案情后，如何落笔表述？", "answer": "行为人的XX行为造成了基本犯以外的加重结果（重伤、死亡），由于XX行为与加重结果具有因果关系，故行为人构成XX罪的结果加重犯。", "ladder": [1, 2, 3, 4], "audio": "audio/criminal-quotes-s1/t3-0.mp3", "sources": [["book", "刑法考前必背金句", "p.1-2", "range", "C-素材抽取"]]}, {"id": "gl-xf-005", "topicIds": ["xf009"], "title": "因果关系·介入因素不异常", "prompt": "用「因果关系·介入因素不异常」这条金句答一道小题：给定案情后，如何落笔表述？", "answer": "由于介入因素并不异常，前行为与XX结果之间具有因果关系。", "ladder": [1, 2, 3, 4], "audio": "audio/criminal-quotes-s1/t4-0.mp3", "sources": [["book", "刑法考前必背金句", "p.1-2", "range", "C-素材抽取"]]}, {"id": "gl-xf-006", "topicIds": ["xf009"], "title": "因果关系·介入因素异常", "prompt": "用「因果关系·介入因素异常」这条金句答一道小题：给定案情后，如何落笔表述？", "answer": "由于介入因素异常且作用更大，中断了前行为与XX结果之间的因果关系，故行为人的前行为与XX结果没有因果关系。", "ladder": [1, 2, 3, 4], "audio": "audio/criminal-quotes-s1/t4-1.mp3", "sources": [["book", "刑法考前必背金句", "p.1-2", "range", "C-素材抽取"]]}, {"id": "gl-xf-007", "topicIds": ["xf025"], "title": "正当防卫·一般防卫·手段过当结果不过当", "prompt": "用「正当防卫·一般防卫·手段过当结果不过当」这条金句答一道小题：给定案情后，如何落笔表述？", "answer": "行为人XX制止不法侵害的行为，虽然防卫手段过当，但没有造成过当结果，故行为人成立正当防卫。", "ladder": [1, 2, 3, 4], "audio": "audio/criminal-quotes-s1/t5-0.mp3", "sources": [["book", "刑法考前必背金句", "p.1-2", "range", "C-素材抽取"]]}, {"id": "gl-xf-008", "topicIds": ["xf021"], "title": "正当防卫·假想防卫", "prompt": "用「正当防卫·假想防卫」这条金句答一道小题：给定案情后，如何落笔表述？", "answer": "假想防卫不构成故意犯罪，如果行为人有过失，就是过失犯罪（过失致人死亡、过失致人重伤），如果防卫人没有过失，就按照意外事件处理。", "ladder": [1, 2, 3, 4], "audio": "audio/criminal-quotes-s1/t5-1.mp3", "sources": [["book", "刑法考前必背金句", "p.1-2", "range", "C-素材抽取"]]}, {"id": "gl-xf-009", "topicIds": ["xf022"], "title": "正当防卫·防卫不适时", "prompt": "用「正当防卫·防卫不适时」这条金句答一道小题：给定案情后，如何落笔表述？", "answer": "由于不法侵害尚未开始（或者已经结束），故行为人反击XX的行为，属于事前（事后）防卫，应当认定为XX罪。", "ladder": [1, 2, 3, 4], "audio": "audio/criminal-quotes-s1/t5-2.mp3", "sources": [["book", "刑法考前必背金句", "p.1-2", "range", "C-素材抽取"]]}, {"id": "gl-xf-010", "topicIds": ["xf025"], "title": "正当防卫·防卫过当", "prompt": "用「正当防卫·防卫过当」这条金句答一道小题：给定案情后，如何落笔表述？", "answer": "行为人的防卫行为明显超过了必要限度，且造成了过当结果（重伤/死亡），故构成防卫过当，对过当结果至少有过失，应当认定为XX罪，但应当减轻或者免除处罚。", "ladder": [1, 2, 3, 4], "audio": "audio/criminal-quotes-s1/t5-3.mp3", "sources": [["book", "刑法考前必背金句", "p.1-2", "range", "C-素材抽取"]]}, {"id": "gl-xf-011", "topicIds": ["xf026"], "title": "正当防卫·特殊防卫", "prompt": "用「正当防卫·特殊防卫」这条金句答一道小题：给定案情后，如何落笔表述？", "answer": "由于XX的行为属于严重危及人身安全的暴力犯罪，故行为人反击XX的行为属于特殊防卫，即使造成XX死亡，也不属于防卫过当，不构成犯罪。", "ladder": [1, 2, 3, 4], "audio": "audio/criminal-quotes-s1/t5-4.mp3", "sources": [["book", "刑法考前必背金句", "p.1-2", "range", "C-素材抽取"]]}, {"id": "gl-xf-012", "topicIds": ["xf023"], "title": "正当防卫·偶然防卫", "prompt": "用「正当防卫·偶然防卫」这条金句答一道小题：给定案情后，如何落笔表述？", "answer": "行为人在客观上虽然制止了XX的不法侵害，但是主观上缺乏防卫认识，属于偶然防卫：（1）根据防卫认识不要说，行为人构成正当防卫。（2）根据防卫认识必要说，行为人构成XX罪未遂（故意的场合），或不构成犯罪（过失的场合，因未造成法益侵害结果）。", "ladder": [1, 2, 3, 4], "audio": "audio/criminal-quotes-s1/t5-5.mp3", "sources": [["book", "刑法考前必背金句", "p.1-2", "range", "C-素材抽取"]]}, {"id": "gl-xf-013", "topicIds": ["xf013"], "title": "犯罪故意", "prompt": "用「犯罪故意」这条金句答一道小题：给定案情后，如何落笔表述？", "answer": "认识到结果必然/可能发生，希望/放任结果的发生，构成XX罪。（故意犯罪）", "ladder": [1, 2, 3, 4], "audio": "audio/criminal-quotes-s1/t6-0.mp3", "sources": [["book", "刑法考前必背金句", "p.1-2", "range", "C-素材抽取"]]}, {"id": "gl-xf-014", "topicIds": ["xf015", "xf016"], "title": "犯罪过失", "prompt": "用「犯罪过失」这条金句答一道小题：给定案情后，如何落笔表述？", "answer": "认识到结果可能发生/应当预见而没有预见到结果可能发生，排斥、反对结果的发生，构成XX罪。（过失犯罪）", "ladder": [1, 2, 3, 4], "audio": "audio/criminal-quotes-s1/t7-0.mp3", "sources": [["book", "刑法考前必背金句", "p.1-2", "range", "C-素材抽取"]]}, {"id": "gl-xf-015", "topicIds": ["xf019"], "title": "事实认识错误·对象错误", "prompt": "用「事实认识错误·对象错误」这条金句答一道小题：给定案情后，如何落笔表述？", "answer": "行为人误将A当作B，属于对象错误，应当认定为XX罪既遂。", "ladder": [1, 2, 3, 4], "audio": "audio/criminal-quotes-s1/t8-0.mp3", "sources": [["book", "刑法考前必背金句", "p.1-2", "range", "C-素材抽取"]]}, {"id": "gl-xf-016", "topicIds": ["xf019"], "title": "事实认识错误·打击错误", "prompt": "用「事实认识错误·打击错误」这条金句答一道小题：给定案情后，如何落笔表述？", "answer": "行为人欲XX甲，因客观行为偏差XX乙，属于打击错误：（1）根据法定符合说，行为人构成XX罪（对乙）与XX罪未遂（对甲），想象竞合，从一重罪处罚。（2）根据具体符合说，行为人构成过失致人重伤、死亡（对乙）罪与XX罪未遂（对甲），想象竞合，从一重罪处罚。", "ladder": [1, 2, 3, 4], "audio": "audio/criminal-quotes-s1/t8-1.mp3", "sources": [["book", "刑法考前必背金句", "p.1-2", "range", "C-素材抽取"]]}, {"id": "gl-xf-017", "topicIds": ["xf018", "xf019"], "title": "事前故意", "prompt": "用「事前故意」这条金句答一道小题：给定案情后，如何落笔表述？", "answer": "行为人以为A已经死亡，为毁灭罪证而将A抛入水中（掩埋等）导致其死亡，属于结果的推迟发生（事前故意）。多数说：前行为构成故意杀人既遂，后行为构成过失致人死亡，用故意杀人既遂吸收过失致人死亡，定故意杀人既遂。少数说：前行为构成故意杀人未遂，后行为构成过失致人死亡，两罪并罚。", "ladder": [1, 2, 3, 4], "audio": "audio/criminal-quotes-s1/t9-0.mp3", "sources": [["book", "刑法考前必背金句", "p.1-2", "range", "C-素材抽取"]]}, {"id": "gl-xf-018", "topicIds": ["xf019", "xf032"], "title": "结果的提前实现", "prompt": "用「结果的提前实现」这条金句答一道小题：给定案情后，如何落笔表述？", "answer": "行为人计划通过第YY行为（第2个）造成XX结果，实际上XX行为（第1个）便造成了危害结果，这属于结果的提前实现。若第1个行为没有着手，成立故意犯罪预备与过失犯罪的想象竞合。若已经着手，有两种意见：（1）第1个行为已有致人死亡的紧迫危险，故意存在于着手实行时即可，应对死亡承担故意杀人既遂的责任。（2）行为人没有认识到第1个行为会导致死亡，缺乏既遂故意，只能认定为故意杀人未遂与过失致人死亡的想象竞合。", "ladder": [1, 2, 3, 4], "audio": "audio/criminal-quotes-s1/t10-0.mp3", "sources": [["book", "刑法考前必背金句", "p.1-2", "range", "C-素材抽取"]]}, {"id": "gl-xf-019", "topicIds": ["xf018", "xf019", "xf032"], "title": "辨析：事前故意 vs 结果的提前实现", "prompt": "辨析 事前故意 vs 结果的提前实现：两者的区别是什么？结果发生的时点有何不同？", "answer": "事前故意（韦伯的概括故意）：两个行为都实施了，行为人以为第1个行为已经既遂（死亡已发生），第2个行为（处理\"尸体\"）才真正导致死亡——结果比行为人以为的\"更晚\"发生。\n结果的提前实现（构成要件提前实现）：行为人计划分两步实施（第2步才是\"真正杀招\"），但第1步（准备/预备性质的行为）意外提前导致了结果——结果比行为人计划的\"更早\"发生。\n一句话记忆：事前故意是\"以为杀完了，其实还没杀完，后面收尾时才真杀死\"；结果提前实现是\"还没到杀的那一步，前面准备工作就已经杀死了\"。", "points": ["事前故意（韦伯的概括故意）：两个行为都实施了，行为人以为第1个行为已经既遂（死亡已发生），第2个行为（处理\"尸体\"）才真正导致死亡——结果比行为人以为的\"更晚\"发生。", "结果的提前实现（构成要件提前实现）：行为人计划分两步实施（第2步才是\"真正杀招\"），但第1步（准备/预备性质的行为）意外提前导致了结果——结果比行为人计划的\"更早\"发生。", "一句话记忆：事前故意是\"以为杀完了，其实还没杀完，后面收尾时才真杀死\"；结果提前实现是\"还没到杀的那一步，前面准备工作就已经杀死了\"。"], "ladder": [1, 2, 3, 4], "audio": "audio/criminal-quotes-s1/dis1-k.mp3", "sources": [["book", "刑法考前必背金句", "p.1-2", "range", "C-素材抽取"]]}, {"id": "gl-xf-020", "topicIds": ["xf019"], "title": "辨析：对象错误 vs 打击错误", "prompt": "辨析 对象错误 vs 打击错误：两者的区别是什么？结果发生的时点有何不同？", "answer": "对象错误：行为人认错了人——把B误认成A，然后对着\"自以为是A、实际是B\"的这个人实施了行为。打击本身没有偏差。\n打击错误：行为人认对了目标（就是要对A下手），但行为、手段本身出现偏差，实际打击到了旁边的B。目标认知没错，是\"打偏了\"。\n一句话记忆：对象错误是\"人认错了\"，打击错误是\"手打偏了\"。", "points": ["对象错误：行为人认错了人——把B误认成A，然后对着\"自以为是A、实际是B\"的这个人实施了行为。打击本身没有偏差。", "打击错误：行为人认对了目标（就是要对A下手），但行为、手段本身出现偏差，实际打击到了旁边的B。目标认知没错，是\"打偏了\"。", "一句话记忆：对象错误是\"人认错了\"，打击错误是\"手打偏了\"。"], "ladder": [1, 2, 3, 4], "audio": "audio/criminal-quotes-s1/dis2-k.mp3", "sources": [["book", "刑法考前必背金句", "p.1-2", "range", "C-素材抽取"]]}]}, {"deck": "副本·0730竹马任务：金句28-36＋骗贷小案例＋26刑法提升大案例一", "kind": "goldline", "side": true, "origin": "互动练习Session/大案例练习/26刑法提升大案例一_竹马任务0730_V1.md", "items": [{"id": "gl-xf-228", "topicIds": ["xf143"], "title": "合同诈骗罪", "prompt": "【必背金句】合同诈骗罪的表述？", "answer": "以非法占有为目的，在签订、履行合同过程中，骗取对方当事人××财物 → 合同诈骗罪", "points": ["以非法占有为目的，在签订、履行合同过程中，骗取对方当事人××财物 → 合同诈骗罪"], "ladder": [1, 2, 3, 4], "sources": [["book", "刑法考前必背金句", "p.4", "exact", "C-素材抽取"], ["note", "data/刑法.json 卡片 crim-228", "crim-228", "exact", "C-素材抽取"]]}, {"id": "gl-xf-229", "topicIds": ["xf144"], "title": "故意伤害罪", "prompt": "【必背金句】故意伤害罪（轻伤／重伤／致死）的表述？", "answer": "轻伤：故意对×实施伤害行为致其轻伤 → 故意伤害罪\n重伤：致其重伤 → 故意伤害致人重伤\n死亡：伤害行为与死亡结果有因果关系，主观上存在过失 → 故意伤害致人死亡，适用加重的法定刑", "points": ["轻伤：故意对×实施伤害行为致其轻伤 → 故意伤害罪", "重伤：致其重伤 → 故意伤害致人重伤", "死亡：伤害行为与死亡结果有因果关系，主观上存在过失 → 故意伤害致人死亡，适用加重的法定刑"], "ladder": [1, 2, 3, 4], "sources": [["book", "刑法考前必背金句", "p.4", "exact", "C-素材抽取"], ["note", "data/刑法.json 卡片 crim-229", "crim-229", "exact", "C-素材抽取"]]}, {"id": "gl-xf-230", "topicIds": ["xf145"], "title": "故意杀人罪", "prompt": "【必背金句】故意杀人罪的表述 + 灭口／绑架杀人的罪数？", "answer": "基本：客观上行为具有致人死亡的高度危险，主观上对死亡结果具有故意 → 故意杀人罪\n① 犯A罪后为灭口杀死× → A罪与故意杀人罪数罪并罚\n② 绑架×过程中将其杀死 → \"绑架杀害被绑架人\" → 绑架罪一罪", "points": ["基本：客观上行为具有致人死亡的高度危险，主观上对死亡结果具有故意 → 故意杀人罪", "① 犯A罪后为灭口杀死× → A罪与故意杀人罪数罪并罚", "② 绑架×过程中将其杀死 → \"绑架杀害被绑架人\" → 绑架罪一罪"], "ladder": [1, 2, 3, 4], "sources": [["book", "刑法考前必背金句", "p.4", "exact", "C-素材抽取"], ["note", "data/刑法.json 卡片 crim-230", "crim-230", "exact", "C-素材抽取"]]}, {"id": "gl-xf-231", "topicIds": ["xf054"], "title": "非法拘禁罪", "prompt": "【必背金句】非法拘禁罪的表述 + 索债拘禁／被骗拘禁？", "answer": "基本：非法剥夺×的人身自由 → 非法拘禁罪\n① 为索取合法债务非法拘禁他人 → 非法拘禁罪\n② 被欺骗后非法拘禁×，主观上无勒索财物（非法占有）目的 → 仅构成非法拘禁罪，不构成绑架罪（或抢劫罪）", "points": ["基本：非法剥夺×的人身自由 → 非法拘禁罪", "① 为索取合法债务非法拘禁他人 → 非法拘禁罪", "② 被欺骗后非法拘禁×，主观上无勒索财物（非法占有）目的 → 仅构成非法拘禁罪，不构成绑架罪（或抢劫罪）"], "ladder": [1, 2, 3, 4], "sources": [["book", "刑法考前必背金句", "p.5", "exact", "C-素材抽取"], ["note", "data/刑法.json 卡片 crim-231", "crim-231", "exact", "C-素材抽取"]]}, {"id": "gl-xf-232", "topicIds": ["xf055", "xf072"], "title": "绑架罪", "prompt": "【必背金句】绑架罪的表述 + 绑架中伤害／释放后杀人的罪数？", "answer": "基本：以勒索财物为目的非法控制× → 绑架罪\n① 绑架后故意伤害×致其重伤（死亡）→ 结合犯 → 绑架罪一罪\n② 释放人质之后，为防止其报警又将其杀死 → 绑架罪与故意杀人罪数罪并罚", "points": ["基本：以勒索财物为目的非法控制× → 绑架罪", "① 绑架后故意伤害×致其重伤（死亡）→ 结合犯 → 绑架罪一罪", "② 释放人质之后，为防止其报警又将其杀死 → 绑架罪与故意杀人罪数罪并罚"], "ladder": [1, 2, 3, 4], "sources": [["book", "刑法考前必背金句", "p.5", "exact", "C-素材抽取"], ["note", "data/刑法.json 卡片 crim-232", "crim-232", "exact", "C-素材抽取"]]}, {"id": "gl-xf-233", "topicIds": ["xf056", "xf057"], "title": "拐卖妇女、儿童罪", "prompt": "【必背金句】拐卖妇女、儿童罪的表述 + 三个关联结论？", "answer": "基本：以出卖为目的，拐骗、绑架、收买、贩卖、接送、中转妇女、儿童 → 拐卖妇女、儿童罪\n① 以出卖为目的使用暴力控制致其重伤、死亡 → 结果加重犯，适用加重法定刑\n② 拐卖妇女后奸淫被拐卖的妇女 → 拐卖妇女罪一罪，适用加重法定刑\n③ 收买被拐卖的妇女、儿童后又出卖 → 拐卖妇女、儿童罪一罪，不数罪并罚", "points": ["基本：以出卖为目的，拐骗、绑架、收买、贩卖、接送、中转妇女、儿童 → 拐卖妇女、儿童罪", "① 以出卖为目的使用暴力控制致其重伤、死亡 → 结果加重犯，适用加重法定刑", "② 拐卖妇女后奸淫被拐卖的妇女 → 拐卖妇女罪一罪，适用加重法定刑", "③ 收买被拐卖的妇女、儿童后又出卖 → 拐卖妇女、儿童罪一罪，不数罪并罚"], "ladder": [1, 2, 3, 4], "sources": [["book", "刑法考前必背金句", "p.5", "exact", "C-素材抽取"], ["note", "data/刑法.json 卡片 crim-233", "crim-233", "exact", "C-素材抽取"]]}, {"id": "gl-xf-234", "topicIds": ["xf146"], "title": "遗弃罪", "prompt": "【必背金句】遗弃罪的表述？", "answer": "行为人对×负有扶养义务，而拒绝扶养，情节恶劣 → 遗弃罪", "points": ["行为人对×负有扶养义务，而拒绝扶养，情节恶劣 → 遗弃罪"], "ladder": [1, 2, 3, 4], "sources": [["book", "刑法考前必背金句", "p.5", "exact", "C-素材抽取"], ["note", "data/刑法.json 卡片 crim-234", "crim-234", "exact", "C-素材抽取"]]}, {"id": "gl-xf-235", "topicIds": ["xf147"], "title": "刑讯逼供罪", "prompt": "【必背金句】刑讯逼供罪的表述 + 致人伤残死亡的转化？", "answer": "基本：司法工作人员为逼取口供，对犯罪嫌疑人、被告人使用肉刑（或变相肉刑）→ 刑讯逼供罪\n关联：刑讯逼供致使被害人伤残、死亡 → 应当认定为故意伤害罪或者故意杀人罪", "points": ["基本：司法工作人员为逼取口供，对犯罪嫌疑人、被告人使用肉刑（或变相肉刑）→ 刑讯逼供罪", "关联：刑讯逼供致使被害人伤残、死亡 → 应当认定为故意伤害罪或者故意杀人罪"], "ladder": [1, 2, 3, 4], "sources": [["book", "刑法考前必背金句", "p.5", "exact", "C-素材抽取"], ["note", "data/刑法.json 卡片 crim-235", "crim-235", "exact", "C-素材抽取"]]}, {"id": "gl-xf-236", "topicIds": ["xf069", "xf070", "xf071"], "title": "抢劫罪", "prompt": "【必背金句】抢劫罪的表述 + 结果加重 + 转化型抢劫？", "answer": "基本：以非法占有为目的，实施××行为压制被害人反抗，取走其××财物 → 抢劫罪\n结果加重：压制反抗时致其重伤（死亡）→ 抢劫致人重伤（死亡）的结果加重犯\n转化型：在盗窃、诈骗、抢夺过程中，为抗拒抓捕、毁灭罪证或窝藏赃物而当场使用暴力或以暴力相威胁 → 依刑法规定构成抢劫罪", "points": ["基本：以非法占有为目的，实施××行为压制被害人反抗，取走其××财物 → 抢劫罪", "结果加重：压制反抗时致其重伤（死亡）→ 抢劫致人重伤（死亡）的结果加重犯", "转化型：在盗窃、诈骗、抢夺过程中，为抗拒抓捕、毁灭罪证或窝藏赃物而当场使用暴力或以暴力相威胁 → 依刑法规定构成抢劫罪"], "ladder": [1, 2, 3, 4], "sources": [["book", "刑法考前必背金句", "p.5", "exact", "C-素材抽取"], ["note", "data/刑法.json 卡片 crim-236", "crim-236", "exact", "C-素材抽取"]]}, {"id": "cs-xf-001", "kind": "case", "topicIds": ["xf050", "xf119", "xf106", "xf141"], "title": "小案例·银行经理与申请人内外勾结骗贷（共犯与身份）", "prompt": "【竹马小案例·骗贷】国有银行经理乙（国家工作人员）和贷款申请人甲内外勾结，各自分工，乙负责骗有处分权的大领导，骗出贷款一起分掉。\n问：对甲、乙应如何处理？", "answer": "教材立场（柏浪涛攻略 p.210 例3）：\n① 贪污罪：乙系国家工作人员，利用职务便利骗取本单位（国有银行）财物，构成贪污罪的实行犯；甲构成贪污罪的帮助犯。\n② 贷款诈骗罪：甲以非法占有为目的骗取银行贷款，构成贷款诈骗罪的实行犯；乙构成贷款诈骗罪的帮助犯。\n③ 罪数：甲、乙每人均同时触犯贪污罪与贷款诈骗罪两个罪名，属想象竞合，各自择一重罪论处。\n（竹马官方参考答案待回填，若有出入以更新为准）", "points": ["定性框架：内外勾结＝共同犯罪与身份的交叉命题，须分别以两个罪名检验每个人", "贪污罪：乙（国家工作人员）利用职务便利骗取本单位财物 → 贪污罪实行犯；甲 → 贪污罪帮助犯", "贷款诈骗罪：甲骗取银行贷款 → 贷款诈骗罪实行犯；乙 → 贷款诈骗罪帮助犯", "罪数：每人均同时触犯两罪，想象竞合，择一重罪论处"], "ladder": [2, 3, 4, 5], "sources": [["book", "2026主观题刑法攻略（精讲）·柏浪涛", "p.210 例3", "exact", "sources/刑法/pages/p0221.md"], ["note", "竹马·26主观尊享私教小案例（官方参考答案待回填）", "2026-07-30", "none", ""]]}, {"id": "cs-xf-002", "kind": "case", "topicIds": ["xf071", "xf018"], "title": "提升大案例一·题1：误民宅为商店，'入户抢劫'还能升格吗", "prompt": "【26刑法提升大案例一·题1】安某酒后想弄点钱，深夜误将一处亮灯的村民住宅认作仍在营业的商店，持木棍闯入，威胁屋内独居老人，劫得现金800余元后逃离。公诉机关认为属'入户抢劫'，应以抢劫罪加重犯处罚；律师认为安某误以为民宅是商店，属认识错误，主观上不具有入户的故意，应在抢劫罪基本犯幅度内处罚。\n问：你是否支持律师的这一主张？", "answer": "支持律师的主张。安某不符合'入户抢劫'的升格处罚条件，只承担抢劫罪基本犯的刑事责任。《刑法》第263条的'入户抢劫'是加重构成要件（兼侵犯住宅安宁、人身危险更高）；适用加重构成要件仍需遵循责任主义——只有行为人对升格处罚条件具有故意，才能适用更重刑罚。安某未认识到进入的是'住宅'，属于对升格处罚条件的事实认识错误，缺乏实施加重构成要件行为的故意，故不应升格处罚。", "points": ["结论：支持律师主张；只承担抢劫罪基本犯的刑事责任", "'入户抢劫'的性质：第263条的加重构成要件，兼侵犯住宅安宁、人身危险更高", "大前提：适用加重构成要件须遵循责任主义——对升格处罚条件有故意才能升格", "涵摄：安某未认识到进入的是'住宅'＝对升格处罚条件的事实认识错误", "落点：缺乏实施加重构成要件行为的故意 → 不承担升格处罚的刑事责任"], "ladder": [2, 3, 4, 5], "sources": [["note", "竹马·26年刑法提升大案例一·官方参考答案（Simon 2026-07-30 提供）", "题1", "exact", ""], ["law", "《中华人民共和国刑法》", "第263条", "exact", "学习资料/法律法规库/05_刑法"]]}, {"id": "cs-xf-003", "kind": "case", "topicIds": ["xf152"], "title": "提升大案例一·题2：针扎幼儿未达轻微伤——虐待被监护、看护人罪", "prompt": "【26刑法提升大案例一·题2】私立幼儿园教师马某以'上课不听话'等为由，用缝衣针扎刺多名4-5岁幼儿的手心、手背，园长郑某知晓后因与家长有矛盾未予制止，行为持续一年。经鉴定幼儿损伤均未达轻微伤标准。马某与郑某辩称无罪：其一，与被害幼儿无家庭成员关系；其二，伤害未达轻伤；其三，所有家长均未告诉。\n问：马某与郑某的辩解是否成立？", "answer": "辩解不成立。幼儿与马某、郑某无家庭成员关系，确实不构成虐待罪；但幼儿属于幼儿园的被看护人，马某长期以针扎方式折磨幼儿身体，在未致轻伤的场合，构成虐待被监护、看护人罪（第260条之一）。本罪并非亲告罪，不以家长告诉为启动刑事诉讼的条件。郑某作为私立幼儿园园长默许员工虐待幼儿，幼儿园构成单位犯罪，郑某作为单位主管人员应承担本罪刑事责任。", "points": ["结论：辩解不成立", "辩解一只能排除虐待罪：幼儿与二人无家庭成员关系 → 不构成虐待罪", "但幼儿属幼儿园的'被看护人'：长期针扎折磨＋未致轻伤 → 构成虐待被监护、看护人罪", "辩解三不成立：本罪非亲告罪，不以家长告诉为诉讼条件", "郑某：园长默许员工虐待 → 幼儿园构成单位犯罪，郑某作为主管人员担责"], "ladder": [2, 3, 4, 5], "sources": [["note", "竹马·26年刑法提升大案例一·官方参考答案（Simon 2026-07-30 提供）", "题2", "exact", ""], ["law", "《中华人民共和国刑法》", "第260条之一", "exact", "学习资料/法律法规库/05_刑法"]]}, {"id": "cs-xf-004", "kind": "case", "topicIds": ["xf153", "xf154", "xf051"], "title": "提升大案例一·题3：驾校闹事定何罪；配偶知情不阻止是否共犯", "prompt": "【26刑法提升大案例一·题3】安某因驾校拒退学费，威胁老板'你不退我钱，也休想踏实赚钱'，随后纠集十余名亲友，连续数月到驾校训练场内拉标语、大声喧哗，阻碍正常教学，致驾校声誉受损、生源锐减、半年后倒闭。马某知晓此事，既未去现场也未阻止。公诉机关认为安某构成破坏生产经营罪，马某知情不阻止属不作为犯罪、系共同犯罪人。\n问：如果你是法官，应当如何看待这一主张？", "answer": "不认可公诉机关的主张。(1) 安某不构成破坏生产经营罪，应以聚众扰乱社会秩序罪定罪，且系首要分子，应承担比其他积极参加者更重的刑罚：破坏生产经营罪的实行行为须具有与'毁坏机器设备、残害耕畜'相当的破坏性，对象是生产经营赖以存续的物理基础；拉标语、喧哗未对教学车辆、场地、设施造成物理性/功能性损毁。而'纠集十余名亲友'＝聚众，'连续数月拉标语、喧哗、阻碍教学'＝扰乱，致正常教学无法进行且驾校倒闭＝情节严重、造成严重损失，符合聚众扰乱社会秩序罪（第290条）。(2) 马某不是共同犯罪人：《民法典》第1059条夫妻相互扶养义务指经济供养、生活照料和精神慰藉，不包含阻止配偶犯罪的义务，故马某未阻止也不构成不作为犯罪。", "points": ["总结论：不认可公诉机关的主张", "否定破坏生产经营罪：实行行为须与'毁坏机器设备、残害耕畜'相当，毁损生产经营的物质条件；拉标语、喧哗无物理性/功能性损毁", "肯定聚众扰乱社会秩序罪：纠集十余人＝聚众；连续数月拉标语喧哗＝扰乱；教学无法进行＋倒闭＝情节严重、损失严重", "身份与量刑：安某系聚众者/首要分子，承担比积极参加者更重的刑罚", "马某不构成共犯：夫妻扶养义务（民法典第1059条）不含阻止配偶犯罪的义务 → 无作为义务 → 不构成不作为犯罪"], "ladder": [2, 3, 4, 5], "sources": [["note", "竹马·26年刑法提升大案例一·官方参考答案（Simon 2026-07-30 提供）", "题3", "exact", ""], ["law", "《中华人民共和国刑法》", "第290条、第276条", "exact", "学习资料/法律法规库/05_刑法"]]}, {"id": "cs-xf-005", "kind": "case", "topicIds": ["xf139"], "title": "提升大案例一·题4：贿买来的贩毒线索，立功吗", "prompt": "【26刑法提升大案例一·题4】安某为争取从宽处理，私下以高价贿买他人，获取同乡孙某贩卖毒品的线索，随后向司法机关提供。经查证线索属实，公安机关据此成功破获孙某贩毒一案。\n问：安某提供线索协助破案，是否构成立功？", "answer": "不构成立功。安某获取线索的方式是私下贿买，属于2010年最高人民法院《关于处理自首和立功若干具体问题的意见》中不能认定为立功的第一种情形：'犯罪分子通过贿买、暴力、胁迫等非法手段，或者被羁押后与律师、亲友会见过程中违反监管规定，获取他人犯罪线索并检举揭发的，不能认定为有立功表现'。即使线索属实并实际破案，仍不构成立功。", "points": ["结论：不构成立功（即使线索属实并实际破案）", "关键事实：线索系私下贿买获取＝非法手段", "依据：2010最高法《关于处理自首和立功若干具体问题的意见》——贿买、暴力、胁迫等非法手段获取线索并'检举揭发'的，不能认定立功"], "ladder": [2, 3, 4, 5], "sources": [["note", "竹马·26年刑法提升大案例一·官方参考答案（Simon 2026-07-30 提供）", "题4", "exact", ""], ["law", "最高人民法院《关于处理自首和立功若干具体问题的意见》（2010）", "非法获取线索不认定立功之情形", "exact", ""]]}]}, {"deck": "SRS·民法必背金句", "kind": "goldline", "origin": "data/民法.json", "items": [{"id": "gl-mf-201", "topicIds": ["mf062"], "title": "有效的民事法律行为", "prompt": "【必背金句】有效的民事法律行为的构成要件（四项）？", "answer": "1. 不违反法律、行政法规的强制性规定\n2. 不违背公序良俗\n3. 行为人具有相应的民事行为能力\n4. 意思表示真实", "points": ["1. 不违反法律、行政法规的强制性规定", "2. 不违背公序良俗", "3. 行为人具有相应的民事行为能力", "4. 意思表示真实"], "ladder": [1, 2, 3, 4], "sources": [["book", "民法考前必背金句", "p.1", "exact", "C-素材抽取"], ["law", "《民法典》第143条", "", "exact", "C-素材抽取"], ["note", "data/民法.json 卡片 civ-201", "civ-201", "exact", "C-素材抽取"]]}, {"id": "gl-mf-202", "topicIds": ["mf010"], "title": "恶意串通", "prompt": "【必背金句】恶意串通的构成要件（三项）？", "answer": "1. 行为人双方在实施民事法律行为时有串通一气、互相勾结的行为\n2. 行为人双方在实施民事法律行为时为了牟取不正当利益\n3. 该民事法律行为履行的结果损害他人合法权益", "points": ["1. 行为人双方在实施民事法律行为时有串通一气、互相勾结的行为", "2. 行为人双方在实施民事法律行为时为了牟取不正当利益", "3. 该民事法律行为履行的结果损害他人合法权益"], "ladder": [1, 2, 3, 4], "sources": [["book", "民法考前必背金句", "p.1", "exact", "C-素材抽取"], ["law", "《民法典》第154条", "", "exact", "C-素材抽取"], ["note", "data/民法.json 卡片 civ-202", "civ-202", "exact", "C-素材抽取"]]}, {"id": "gl-mf-203", "topicIds": ["mf063"], "title": "欺诈", "prompt": "【必背金句】欺诈的构成要件（四项）？", "answer": "1. 行为人主观上存在欺诈的故意\n2. 行为人客观上实施了欺诈行为\n3. 相对人因行为人的欺诈陷入错误认识\n4. 相对人基于错误认识而实施了与内心真实意思表示不一致的行为", "points": ["1. 行为人主观上存在欺诈的故意", "2. 行为人客观上实施了欺诈行为", "3. 相对人因行为人的欺诈陷入错误认识", "4. 相对人基于错误认识而实施了与内心真实意思表示不一致的行为"], "ladder": [1, 2, 3, 4], "sources": [["book", "民法考前必背金句", "p.1", "exact", "C-素材抽取"], ["law", "《民法典》第148条", "", "exact", "C-素材抽取"], ["note", "data/民法.json 卡片 civ-203", "civ-203", "exact", "C-素材抽取"]]}, {"id": "gl-mf-204", "topicIds": ["mf049"], "title": "代物清偿", "prompt": "【必背金句】代物清偿的构成要件（四项）？", "answer": "1. 有原债务存在\n2. 经双方当事人约定，以他种给付代替原定给付\n3. 有双方当事人关于代物清偿的合意\n4. 债权人或其他有履行受领权的人现实地受领给付", "points": ["1. 有原债务存在", "2. 经双方当事人约定，以他种给付代替原定给付", "3. 有双方当事人关于代物清偿的合意", "4. 债权人或其他有履行受领权的人现实地受领给付"], "ladder": [1, 2, 3, 4], "sources": [["book", "民法考前必背金句", "p.1", "exact", "C-素材抽取"], ["law", "《民法典合同编通则解释》第27、28条", "", "exact", "C-素材抽取"], ["note", "data/民法.json 卡片 civ-204", "civ-204", "exact", "C-素材抽取"]]}, {"id": "gl-mf-205", "topicIds": ["mf003"], "title": "表见代理", "prompt": "【必背金句】表见代理的构成要件（二项，含细分）？", "answer": "1. 主观上，相对人善意且无过失：\n　(1) 善意 = 不知情、不了解、不知悉\n　(2) 无过失 = 对权利外观尽到了形式审查义务，但无需核实（实质审查义务）\n2. 客观上，存在权利外观，包括：\n　(1) 授权委托书；(2) 介绍信\n　(3) 盖有公章或合同专用章的空白合同书（公章与合同专用章效力相同）\n　(4) 交易习惯，如经常、往常、通常、常常、长期等", "points": ["1. 主观上，相对人善意且无过失：", "　(1) 善意 = 不知情、不了解、不知悉", "　(2) 无过失 = 对权利外观尽到了形式审查义务，但无需核实（实质审查义务）", "2. 客观上，存在权利外观，包括：", "　(1) 授权委托书；(2) 介绍信", "　(3) 盖有公章或合同专用章的空白合同书（公章与合同专用章效力相同）", "　(4) 交易习惯，如经常、往常、通常、常常、长期等"], "ladder": [1, 2, 3, 4], "sources": [["book", "民法考前必背金句", "p.1", "exact", "C-素材抽取"], ["law", "《民法典》第172条", "", "exact", "C-素材抽取"], ["note", "data/民法.json 卡片 civ-205", "civ-205", "exact", "C-素材抽取"]]}, {"id": "gl-mf-206", "topicIds": ["mf012"], "title": "不动产抵押预告登记", "prompt": "【必背金句】不动产抵押预告登记产生抵押权（优先受偿权）的条件（三项）？", "answer": "1. 不动产登记机构已经办理建筑物所有权首次登记\n2. 预告登记的财产与办理建筑物所有权首次登记时的财产一致\n3. 抵押预告登记并未失效", "points": ["1. 不动产登记机构已经办理建筑物所有权首次登记", "2. 预告登记的财产与办理建筑物所有权首次登记时的财产一致", "3. 抵押预告登记并未失效"], "ladder": [1, 2, 3, 4], "sources": [["book", "民法考前必背金句", "p.1-2", "exact", "C-素材抽取"], ["law", "《民法典》第221条", "", "exact", "C-素材抽取"], ["law", "《民法典担保制度解释》第52条", "", "exact", "C-素材抽取"], ["note", "data/民法.json 卡片 civ-206", "civ-206", "exact", "C-素材抽取"]]}, {"id": "gl-mf-207", "topicIds": ["mf064"], "title": "善意取得", "prompt": "【必背金句】善意取得所有权的构成要件（四项）？", "answer": "1. 行为人无权处分（以自己的名义处分他人或共有的财产）\n2. 相对人主观上善意且无重大过失\n3. 相对人客观上支付合理对价\n4. 已经完成公示（不动产已经登记 / 动产已经交付）", "points": ["1. 行为人无权处分（以自己的名义处分他人或共有的财产）", "2. 相对人主观上善意且无重大过失", "3. 相对人客观上支付合理对价", "4. 已经完成公示（不动产已经登记 / 动产已经交付）"], "ladder": [1, 2, 3, 4], "sources": [["book", "民法考前必背金句", "p.2", "exact", "C-素材抽取"], ["law", "《民法典》第311条", "", "exact", "C-素材抽取"], ["note", "data/民法.json 卡片 civ-207", "civ-207", "exact", "C-素材抽取"]]}, {"id": "gl-mf-208", "topicIds": ["mf018"], "title": "担保物权的物上代位权", "prompt": "【必背金句】担保物权物上代位权的构成要件（三项）？", "answer": "1. 担保财产已经设立担保物权\n2. 担保期间，担保财产毁损、灭失或被征收\n3. 担保财产存在保险金、赔偿金或补偿金等代位物", "points": ["1. 担保财产已经设立担保物权", "2. 担保期间，担保财产毁损、灭失或被征收", "3. 担保财产存在保险金、赔偿金或补偿金等代位物"], "ladder": [1, 2, 3, 4], "sources": [["book", "民法考前必背金句", "p.2", "exact", "C-素材抽取"], ["law", "《民法典》第390条", "", "exact", "C-素材抽取"], ["note", "data/民法.json 卡片 civ-208", "civ-208", "exact", "C-素材抽取"]]}, {"id": "gl-mf-209", "topicIds": ["mf020"], "title": "动产抵押权正常经营买受人", "prompt": "【必背金句】动产抵押权\"正常经营买受人\"的构成要件（四项）？", "answer": "1. 出卖人营业执照上明确记载的经营范围\n2. 出卖人持续销售同类商品\n3. 买受人已经支付合理价款\n4. 买受人已经取得抵押财产的所有权", "points": ["1. 出卖人营业执照上明确记载的经营范围", "2. 出卖人持续销售同类商品", "3. 买受人已经支付合理价款", "4. 买受人已经取得抵押财产的所有权"], "ladder": [1, 2, 3, 4], "sources": [["book", "民法考前必背金句", "p.2", "exact", "C-素材抽取"], ["law", "《民法典》第404条", "", "exact", "C-素材抽取"], ["law", "《民法典担保制度解释》第56条", "", "exact", "C-素材抽取"], ["note", "data/民法.json 卡片 civ-209", "civ-209", "exact", "C-素材抽取"]]}, {"id": "gl-mf-210", "topicIds": ["mf025"], "title": "汇票质押权", "prompt": "【必背金句】汇票质押权的构成要件（四项）？", "answer": "1. 合法有效的书面汇票质押合同\n2. 汇票上以背书记载\"质押\"字样（背书连续）\n3. 出质人在汇票上签章\n4. 汇票已经交付质权人或电子汇票已经进行质押登记（采\"公示生效主义\"立法模式）", "points": ["1. 合法有效的书面汇票质押合同", "2. 汇票上以背书记载\"质押\"字样（背书连续）", "3. 出质人在汇票上签章", "4. 汇票已经交付质权人或电子汇票已经进行质押登记（采\"公示生效主义\"立法模式）"], "ladder": [1, 2, 3, 4], "sources": [["book", "民法考前必背金句", "p.2", "exact", "C-素材抽取"], ["law", "《民法典》第441条", "", "exact", "C-素材抽取"], ["note", "data/民法.json 卡片 civ-210", "civ-210", "exact", "C-素材抽取"]]}, {"id": "gl-mf-211", "topicIds": ["mf025"], "title": "保证金账户质押权", "prompt": "【必背金句】保证金账户质押权的构成要件（二项）？", "answer": "1. 保证金（金钱）特定化\n2. 债权人对保证金账户实际控制（即移交占有或交付）", "points": ["1. 保证金（金钱）特定化", "2. 债权人对保证金账户实际控制（即移交占有或交付）"], "ladder": [1, 2, 3, 4], "sources": [["book", "民法考前必背金句", "p.2", "exact", "C-素材抽取"], ["law", "《民法典担保制度解释》第70条", "", "exact", "C-素材抽取"], ["note", "data/民法.json 卡片 civ-211", "civ-211", "exact", "C-素材抽取"]]}, {"id": "gl-mf-212", "topicIds": ["mf026"], "title": "商事留置权", "prompt": "【必背金句】商事留置权的构成要件——对债务人的动产 vs 对第三人的动产（各四项）？", "answer": "【对债务人的动产】1.债权已到期；2.合法占有债务人的动产；3.营业债权（企业持续经营中发生的债权）；4.不违反法律规定、当事人约定，不违背公序良俗\n【对第三人的动产】1.债权已到期；2.合法占有第三人的动产；3.基于同一法律关系且属于营业债权；4.不违反法律规定、当事人约定，不违背公序良俗\n注意：受让债权不属于营业债权，不得行使商事留置权", "points": ["【对债务人的动产】1.债权已到期；2.合法占有债务人的动产；3.营业债权（企业持续经营中发生的债权）；4.不违反法律规定、当事人约定，不违背公序良俗", "【对第三人的动产】1.债权已到期；2.合法占有第三人的动产；3.基于同一法律关系且属于营业债权；4.不违反法律规定、当事人约定，不违背公序良俗", "注意：受让债权不属于营业债权，不得行使商事留置权"], "ladder": [1, 2, 3, 4], "sources": [["book", "民法考前必背金句", "p.2-3", "exact", "C-素材抽取"], ["law", "《民法典》第447—449条", "", "exact", "C-素材抽取"], ["law", "《民法典担保制度解释》第62条", "", "exact", "C-素材抽取"], ["note", "data/民法.json 卡片 civ-212", "civ-212", "exact", "C-素材抽取"]]}, {"id": "gl-mf-213", "topicIds": ["mf042"], "title": "缔约过失责任", "prompt": "【必背金句】缔约过失责任的构成要件（四项）？", "answer": "1. 行为发生于缔约的过程中\n2. 一方违反基于诚信原则而产生的先合同义务\n3. 导致对方信赖利益损失\n4. 一方违反先合同义务与他方所受损失之间存在因果关系", "points": ["1. 行为发生于缔约的过程中", "2. 一方违反基于诚信原则而产生的先合同义务", "3. 导致对方信赖利益损失", "4. 一方违反先合同义务与他方所受损失之间存在因果关系"], "ladder": [1, 2, 3, 4], "sources": [["book", "民法考前必背金句", "p.3", "exact", "C-素材抽取"], ["law", "《民法典》第500、501条", "", "exact", "C-素材抽取"], ["note", "data/民法.json 卡片 civ-213", "civ-213", "exact", "C-素材抽取"]]}, {"id": "gl-mf-214", " : ["xf001"], "title": "专题一 犯罪构成体系", "prompt": "辨析：犯罪客体 vs 犯罪对象（行为对象）。甲盗窃乙的手机，二者分别是什么？", "answer": "犯罪客体 = 法律保护的利益（法益），如乙的财产权\n犯罪对象 = 行为所指向的载体，如乙的手机\n关系：犯罪对象是犯罪客体的载体；犯罪客体是犯罪对象蕴含的利益\n【易错点】教材原例：甲盗窃乙的手机——犯罪对象是手机，犯罪客体是乙的财产权。刑法设立盗窃罪是为保护财产权（保护法益）。", "points": ["犯罪客体 = 法律保护的利益（法益），如乙的财产权", "犯罪对象 = 行为所指向的载体，如乙的手机", "关系：犯罪对象是犯罪客体的载体；犯罪客体是犯罪对象蕴含的利益"], "ladder": [1, 2, 3, 4], "sources": [["book", "2026主观题刑法攻略（精讲）·柏浪涛", "p.12", "exact", "C-素材抽取"], ["note", "data/刑法.json 卡片 crim-102", "crim-102", "exact", "C-素材抽取"]]}, {"id": "qa-xf-103", "topicIds": ["xf001", "xf002"], "title": "专题一 犯罪构成体系", "prompt": "犯罪构成体系的三项判断任务分别是什么？（四要件→排除违法事由→排除责任事由各自回答什么问题）", "answer": "① 四个要件（客体、主体、客观、主观）：行为人有没有干坏事？\n② 排除违法事由：干的事到底是不是坏事？有没有可能是正当的事？\n③ 排除责任事由：行为人是不是坏人？能不能谴责他？有没有可能宽恕他？\n【易错点】定罪机制 = 先判断坏事（是否制造违法事实），后判断坏人（应否被刑法谴责）。10岁孩子偷手机：干了坏事，但不是坏人（不可谴责）。", "points": ["① 四个要件（客体、主体、客观、主观）：行为人有没有干坏事？", "② 排除违法事由：干的事到底是不是坏事？有没有可能是正当的事？", "③ 排除责任事由：行为人是不是坏人？能不能谴责他？有没有可能宽恕他？"], "ladder": [1, 2, 3, 4], "sources": [["book", "2026主观题刑法攻略（精讲）·柏浪涛", "p.13-14", "exact", "C-素材抽取"], ["note", "data/刑法.json 卡片 crim-103", "crim-103", "exact", "C-素材抽取"]]}, {"id": "qa-xf-104", "topicIds": ["xf002", "xf115"], "title": "专题一 犯罪构成体系", "prompt": "\"犯罪\"概念的阶段化理解：10岁的甲盗窃乙的手机，丙为甲保管该手机。甲、丙各如何处理？", "answer": "\"犯罪\"是阶段性概念，不是终局意义的\"点\"概念\n① \"制造违法事实\"意义上的犯罪：具备客观+主观要件、无排除违法事由 → 干了坏事（对事不对人）\n② 最终负刑事责任的犯罪：还须无排除责任事由 → 干了坏事且是坏人（对事又对人）\n甲未达责任年龄 → 不负刑事责任、最终无罪；但其行为仍是\"制造违法事实\"意义上的犯罪行为\n因此甲盗窃的手机属于\"犯罪所得\" → 丙构成掩饰、隐瞒犯罪所得罪\n【易错点】关键：责任阻却不否定违法层面的\"犯罪行为\"定性。教材注引2025年8月26日两高《关于办理掩饰、隐瞒犯罪所得、犯罪所得收益刑事案件适用法律若干问题的解释》第十条。", "points": ["\"犯罪\"是阶段性概念，不是终局意义的\"点\"概念", "① \"制造违法事实\"意义上的犯罪：具备客观+主观要件、无排除违法事由 → 干了坏事（对事不对人）", "② 最终负刑事责任的犯罪：还须无排除责任事由 → 干了坏事且是坏人（对事又对人）", "甲未达责任年龄 → 不负刑事责任、最终无罪；但其行为仍是\"制造违法事实\"意义上的犯罪行为", "因此甲盗窃的手机属于\"犯罪所得\" → 丙构成掩饰、隐瞒犯罪所得罪"], "ladder": [1, 2, 3, 4], "sources": [["book", "2026主观题刑法攻略（精讲）·柏浪涛", "p.14", "exact", "C-素材抽取"], ["law", "两高掩饰隐瞒犯罪所得司法解释(2025)第10条", "", "exact", "C-素材抽取"], ["note", "data/刑法.json 卡片 crim-104", "crim-104", "exact", "C-素材抽取"]]}, {"id": "qa-xf-105", "kind": "case", "topicIds": ["xf002", "xf028"], "title": "专题一 犯罪构成体系", "prompt": "（2002年卷二38题·头痛粉案）甲将头痛粉冒充海洛因骗乙去出卖，约定均分货款。乙卖得4000元，分赃前被查获。\n问：甲、乙如何处理？", "answer": "甲不构成对乙的诈骗罪（未骗乙的钱财）\n甲利用乙的不知情，让乙充当自己诈骗买家的工具 → 甲是诈骗罪的间接正犯\n制造违法事实层面甲乙构成诈骗罪共同犯罪：甲教唆犯、乙客观层面\"实行犯\"；但乙无诈骗故意，最终不构成诈骗罪\n甲既是间接正犯又是教唆犯 → 就高不就低，认定为诈骗罪间接正犯\n乙是否构成贩卖毒品罪？少数说：有故意有行为 → 未遂；多数说：对象是头痛粉，无侵犯毒品法益的危险性，客观上不属贩毒行为 → 不构成（定罪先看客观行为）\n【易错点】本题综合考查间接正犯、阶段化共犯认定与\"先客观后主观\"的定罪顺序，是观点展示型答题的范本。", "points": ["甲不构成对乙的诈骗罪（未骗乙的钱财）", "甲利用乙的不知情，让乙充当自己诈骗买家的工具 → 甲是诈骗罪的间接正犯", "制造违法事实层面甲乙构成诈骗罪共同犯罪：甲教唆犯、乙客观层面\"实行犯\"；但乙无诈骗故意，最终不构成诈骗罪", "甲既是间接正犯又是教唆犯 → 就高不就低，认定为诈骗罪间接正犯", "乙是否构成贩卖毒品罪？少数说：有故意有行为 → 未遂；多数说：对象是头痛粉，无侵犯毒品法益的危险性，客观上不属贩毒行为 → 不构成（定罪先看客观行为）"], "ladder": [1, 2, 3, 4, 5], "exam": {"year": 2002, "paper": "卷二", "qno": 38}, "sources": [["book", "2026主观题刑法攻略（精讲）·柏浪涛", "p.14-15", "exact", "C-素材抽取"], ["note", "data/刑法.json 卡片 crim-105", "crim-105", "exact", "C-素材抽取"]]}, {"id": "qa-xf-106", "topicIds": ["xf003", "xf004", "xf005"], "title": "专题二 不作为犯", "prompt": "不作为犯的成立条件（三项）及记忆公式？", "answer": "① 负有作为义务（应为）\n② 有能力履行该特定义务（能为）\n③ 不履行该义务（不为）\n记忆公式：应为 — 能为 — 不为\n【易错点】应试提示：不作为犯中作为义务是判断重点；主观题常将不作为犯与共同犯罪结合考查。", "points": ["① 负有作为义务（应为）", "② 有能力履行该特定义务（能为）", "③ 不履行该义务（不为）", "记忆公式：应为 — 能为 — 不为"], "ladder": [1, 2, 3, 4], "sources": [["book", "2026主观题刑法攻略（精讲）·柏浪涛", "p.16", "exact", "C-素材抽取"], ["note", "data/刑法.json 卡片 crim-106", "crim-106", "exact", "C-素材抽取"]]}, {"id": "qa-xf-107", "topicIds": ["xf003"], "title": "专题二 不作为犯", "prompt": "作为义务的来源：默写\"实质的二分说\"完整体系图（法考理论立场）。", "answer": "【一、对危险源的监管义务】\n　1. 对危险物的监管（自己养的狗咬人；危险动物/物品/设施；机动车；房东告知危房）\n　2. 对他人危险行为的监管（自己的熊孩子打人；监护/监管关系）\n　3. 对自己先行行为的监管：(1)先行行为对法益创设危险；(2)正当防卫有防止过当结果的义务\n【二、对法益对象的保护义务】\n　1. 特定关系：(1)法律规定（父救子）(2)职务业务（警察阻止犯罪）(3)合同约定（保管财物）(4)自愿救助形成依赖关系（弃婴捡回家）\n　2. 特定领域：①行为人是该领域管理者；②形成依赖关系（出租车上乘客强奸乘客）\n【易错点】传统\"形式四分说\"过于形式化，不足以应对法考真题；本书采实质二分说（教材注引张明楷《刑法学》第六版 p.198-204）。此图是全专题的总骨架，案例先定位义务类型再展开。", "points": ["【一、对危险源的监管义务】", "　1. 对危险物的监管（自己养的狗咬人；危险动物/物品/设施；机动车；房东告知危房）", "　2. 对他人危险行为的监管（自己的熊孩子打人；监护/监管关系）", "　3. 对自己先行行为的监管：(1)先行行为对法益创设危险；(2)正当防卫有防止过当结果的义务", "【二、对法益对象的保护义务】", "　1. 特定关系：(1)法律规定（父救子）(2)职务业务（警察阻止犯罪）(3)合同约定（保管财物）(4)自愿救助形成依赖关系（弃婴捡回家）", "　2. 特定领域：①行为人是该领域管理者；②形成依赖关系（出租车上乘客强奸乘客）"], "ladder": [1, 2, 3, 4], "sources": [["book", "2026主观题刑法攻略（精讲）·柏浪涛", "p.16, 21", "exact", "C-素材抽取"], ["note", "data/刑法.json 卡片 crim-107", "crim-107", "exact", "C-素材抽取"]]}, {"id": "qa-xf-108", "topicIds": ["xf003"], "title": "专题二 不作为犯", "prompt": "对危险源的监管义务有哪三类？各举教材实例。", "answer": "① 对危险物：主人对凶狗（动物咬人时有阻止义务）；道路/电力设施、矿井、广告牌负责人；机动车所有人（阻止无照者、醉酒者、小孩驾驶）；房东发现房屋危险须告知租客\n② 对他人危险行为（须有监护监管关系）：父母对年幼子女；家属对狂躁症成员；军官对士兵；幼儿园阿姨对小朋友\n③ 对自己先行行为：饭店食物致客人中毒须救助；制造商对有隐患产品有召回义务（2021年试题）；黑夜停车高速路不设警示致追尾须救助；明知乙有癫痫故意吵架诱发不救 → 不作为故意杀人罪（2019年试题）\n【易错点】反例（无义务）：儿子看到父亲盗窃无阻止义务（2011年52题等）；成年兄妹、夫妻间无监管关系——妻子对丈夫贪污受贿不阻止，不构成不作为帮助犯（2013年51题）。", "points": ["① 对危险物：主人对凶狗（动物咬人时有阻止义务）；道路/电力设施、矿井、广告牌负责人；机动车所有人（阻止无照者、醉酒者、小孩驾驶）；房东发现房屋危险须告知租客", "② 对他人危险行为（须有监护监管关系）：父母对年幼子女；家属对狂躁症成员；军官对士兵；幼儿园阿姨对小朋友", "③ 对自己先行行为：饭店食物致客人中毒须救助；制造商对有隐患产品有召回义务（2021年试题）；黑夜停车高速路不设警示致追尾须救助；明知乙有癫痫故意吵架诱发不救 → 不作为故意杀人罪（2019年试题）"], "ladder": [1, 2, 3, 4], "sources": [["book", "2026主观题刑法攻略（精讲）·柏浪涛", "p.16-17", "exact", "C-素材抽取"], ["note", "data/刑法.json 卡片 crim-108", "crim-108", "exact", "C-素材抽取"]]}, {"id": "qa-xf-109", "topicIds": ["xf003", "xf021"], "title": "专题二 不作为犯", "prompt": "正当防卫人对被其打伤的不法侵害人，有无救助义务？（分情形 + 两说）", "answer": "少数说：先行行为须是违法行为，正当防卫是合法行为，不产生救助义务\n多数说（注引张明楷）：防卫行为若会导致过当结果，防卫人有防止过当结果发生的义务；先行行为不要求违法\n情形一（2013年7题）：甲仅一般性伤害，乙防卫致甲重伤倒地——若甲死亡则属过当 → 乙有救助义务，故意不救 → 不作为故意杀人罪\n情形二（2014年5题·藏獒案）：小偷入户被藏獒咬（防卫措施），若死亡即过当 → 主人有阻止/救助义务，不救 → 不作为故意杀人罪\n情形三：甲持刀杀乙，乙反击致甲重伤——即使甲死亡也不过当 → 乙无救助义务，不构成不作为犯\n【易错点】判断口诀：看\"放任下去会不会过当\"。会过当 → 有防止义务；不会过当（如对行凶的反击）→ 无义务。", "points": ["少数说：先行行为须是违法行为，正当防卫是合法行为，不产生救助义务", "多数说（注引张明楷）：防卫行为若会导致过当结果，防卫人有防止过当结果发生的义务；先行行为不要求违法", "情形一（2013年7题）：甲仅一般性伤害，乙防卫致甲重伤倒地——若甲死亡则属过当 → 乙有救助义务，故意不救 → 不作为故意杀人罪", "情形二（2014年5题·藏獒案）：小偷入户被藏獒咬（防卫措施），若死亡即过当 → 主人有阻止/救助义务，不救 → 不作为故意杀人罪", "情形三：甲持刀杀乙，乙反击致甲重伤——即使甲死亡也不过当 → 乙无救助义务，不构成不作为犯"], "ladder": [1, 2, 3, 4], "sources": [["book", "2026主观题刑法攻略（精讲）·柏浪涛", "p.17-18", "exact", "C-素材抽取"], ["note", "data/刑法.json 卡片 crim-109", "crim-109", "exact", "C-素材抽取"]]}, {"id": "qa-xf-110", "kind": "case", "topicIds": ["xf003", "xf005"], "title": "专题二 不作为犯", "prompt": "（火把案，2020/2023年试题）甲故意伤害乙，乙防卫扔火把恰落入稻草堆后趁机逃离；甲见起火不灭离开，火势烧毁邻居家。谁有灭火义务？\n问：谁构成不作为犯罪？", "answer": "争点：防卫行为对第三方造成危险，谁有作为义务\n多数说：不法侵害人和防卫人都有作为义务（少数说：仅不法侵害人）\n甲（不法侵害人）有灭火义务，不灭火 → 构成不作为犯罪\n乙客观上制造了危险也有灭火义务，但甲正在伤害乙，乙缺乏作为可能性（能为）→ 最终不构成不作为犯罪\n【易错点】本题同时落点\"作为义务\"与\"作为可能性\"两个条件——乙是因\"能为\"要件不满足而出罪，不是没有义务。", "points": ["争点：防卫行为对第三方造成危险，谁有作为义务", "多数说：不法侵害人和防卫人都有作为义务（少数说：仅不法侵害人）", "甲（不法侵害人）有灭火义务，不灭火 → 构成不作为犯罪", "乙客观上制造了危险也有灭火义务，但甲正在伤害乙，乙缺乏作为可能性（能为）→ 最终不构成不作为犯罪"], "ladder": [1, 2, 3, 4, 5], "exam": {"year": 2020, "paper": "刑法"}, "sources": [["book", "2026主观题刑法攻略（精讲）·柏浪涛", "p.18", "exact", "C-素材抽取"], ["note", "data/刑法.json 卡片 crim-110", "crim-110", "exact", "C-素材抽取"]]}, {"id": "qa-xf-111", "topicIds": ["xf003"], "title": "专题二 不作为犯", "prompt": "紧急避险行为、犯罪行为能否成为产生作为义务的先行行为？各举教材实例。", "answer": "① 紧急避险可以：甲驾大巴刹车失灵，为避免坠崖撞伤路边老大爷——避险虽合法，但给老大爷创设危险 → 有救助义务\n② 犯罪行为可以：甲盗伐林木，树木倒下砸晕乙，甲不救离去致乙死亡 → 盗伐林木罪 + 不作为的故意杀人罪，数罪并罚（2010年52题）\n【易错点】与正当防卫卡（crim-109）呼应：先行行为不要求违法性——合法行为（避险）与犯罪行为都可产生作为义务，核心看是否对法益创设了危险。", "points": ["① 紧急避险可以：甲驾大巴刹车失灵，为避免坠崖撞伤路边老大爷——避险虽合法，但给老大爷创设危险 → 有救助义务", "② 犯罪行为可以：甲盗伐林木，树木倒下砸晕乙，甲不救离去致乙死亡 → 盗伐林木罪 + 不作为的故意杀人罪，数罪并罚（2010年52题）"], "ladder": [1, 2, 3, 4], "sources": [["book", "2026主观题刑法攻略（精讲）·柏浪涛", "p.18", "exact", "C-素材抽取"], ["note", "data/刑法.json 卡片 crim-111", "crim-111", "exact", "C-素材抽取"]]}, {"id": "qa-xf-112", "kind": "case", "topicIds": ["xf003", "xf004"], "title": "专题二 不作为犯", "prompt": "（考验男人案，2015年52题/2020年试题）女友和母亲同时落水，狗蛋只救女友，母亲溺亡，如何处理？\n问：若妻子与母亲同时落水，丈夫只救妻子呢？", "answer": "母亲落水：子女有法律产生的救助义务（特定关系）\n女友落水：仅道德义务，法律未规定 → 男友无刑法上的救助义务\n故狗蛋不救母亲 → 构成不作为犯罪\n妻子与母亲都落水：丈夫（儿子）对两人都有救助义务；救了妻子未救母亲 → 对母亲属不作为，但在排除违法事由阶段以\"义务冲突\"排除违法性\n义务冲突 = 负两项义务，履行其一必然无法履行另一项 → 未履行的那项不具有违法性\n【易错点】教材脚注例：家庭医生发现男主人感染艾滋病，保密义务与告知女主人义务冲突，选择告知则未保密不违法。", "points": ["母亲落水：子女有法律产生的救助义务（特定关系）", "女友落水：仅道德义务，法律未规定 → 男友无刑法上的救助义务", "故狗蛋不救母亲 → 构成不作为犯罪", "妻子与母亲都落水：丈夫（儿子）对两人都有救助义务；救了妻子未救母亲 → 对母亲属不作为，但在排除违法事由阶段以\"义务冲突\"排除违法性", "义务冲突 = 负两项义务，履行其一必然无法履行另一项 → 未履行的那项不具有违法性"], "ladder": [1, 2, 3, 4, 5], "exam": {"year": 2015, "paper": "刑法", "qno": 52}, "sources": [["book", "2026主观题刑法攻略（精讲）·柏浪涛", "p.16, 18", "exact", "C-素材抽取"], ["note", "data/刑法.json 卡片 crim-112", "crim-112", "exact", "C-素材抽取"]]}, {"id": "qa-xf-113", "topicIds": ["xf003"], "title": "专题二 不作为犯", "prompt": "路人甲看到附近大楼火灾没有报警，《消防法》规定任何人发现火灾都有报警义务——甲是否构成不作为犯罪？", "answer": "不构成。报警义务 ≠ 保护义务\n无论根据何种法律，甲对大楼均没有保护义务 → 没有刑法上的作为义务\n【易错点】一般法律义务（如报警）不能直接升格为刑法上的作为义务；刑法上的保护义务以特定依赖关系为实质根据。", "points": ["不构成。报警义务 ≠ 保护义务", "无论根据何种法律，甲对大楼均没有保护义务 → 没有刑法上的作为义务"], "ladder": [1, 2, 3, 4], "sources": [["book", "2026主观题刑法攻略（精讲）·柏浪涛", "p.18", "exact", "C-素材抽取"], ["note", "data/刑法.json 卡片 crim-113", "crim-113", "exact", "C-素材抽取"]]}, {"id": "qa-xf-114", "topicIds": ["xf003"], "title": "专题二 不作为犯", "prompt": "多个作为义务人之间的先后关系如何处理？（岳母受伤案 / 妻子殴打自己母亲案，2020年试题）", "answer": "结论：若第一位作为义务人不救助甚至侵害法益，不能期待第二位作为义务人实施救助\n例1：岳母受伤，妻子（第一义务人）不救，丈夫（第二义务人）也不救 → 丈夫不构成不作为犯\n例2：妻子殴打自己母亲，丈夫不阻止 → 不构成不作为犯（2020年试题）\n【易错点】义务有位序：近亲属/直接关系人是第一位。第一位不作为时，第二位欠缺期待可能性。", "points": ["结论：若第一位作为义务人不救助甚至侵害法益，不能期待第二位作为义务人实施救助", "例1：岳母受伤，妻子（第一义务人）不救，丈夫（第二义务人）也不救 → 丈夫不构成不作为犯", "例2：妻子殴打自己母亲，丈夫不阻止 → 不构成不作为犯（2020年试题）"], "ladder": [1, 2, 3, 4], "exam": {"year": 2020, "paper": "刑法"}, "sources": [["book", "2026主观题刑法攻略（精讲）·柏浪涛", "p.19", "exact", "C-素材抽取"], ["note", "data/刑法.json 卡片 crim-114", "crim-114", "exact", "C-素材抽取"]]}, {"id": "qa-xf-115", "kind": "case", "topicIds": ["xf003"], "title": "专题二 不作为犯", "prompt": "（2023年试题）下班民警在辖区酒吧喝酒，发现有人强奸乙女，认为自己已下班未制止——是否构成不作为犯罪？\n问：卫生局局长路过杀人现场呢（2006年4题）？", "answer": "民警构成不作为犯罪：《警察法》规定警察非工作时间遇职责范围内紧急情况应履行职责，不受是否穿警服影响（职务产生的保护义务）\n卫生局局长不构成：虽是公务员但不是警察，职务上没有保护义务\n【易错点】职务/业务产生的保护义务限于该职务的职责范围——警察、消防员、医生、救生员等对其职责对象负保护义务。", "points": ["民警构成不作为犯罪：《警察法》规定警察非工作时间遇职责范围内紧急情况应履行职责，不受是否穿警服影响（职务产生的保护义务）", "卫生局局长不构成：虽是公务员但不是警察，职务上没有保护义务"], "ladder": [1, 2, 3, 4, 5], "exam": {"year": 2023, "paper": "刑法"}, "sources": [["book", "2026主观题刑法攻略（精讲）·柏浪涛", "p.19", "exact", "C-素材抽取"], ["law", "《警察法》（非工作时间履职条款）", "", "exact", "C-素材抽取"], ["note", "data/刑法.json 卡片 crim-115", "crim-115", "exact", "C-素材抽取"]]}, {"id": "qa-xf-116", "topicIds": ["xf003"], "title": "专题二 不作为犯", "prompt": "自愿救助何时产生继续救助义务？（井底绳子案 2014年5题 / 救生圈案 2024年试题 / 弃婴案 2013年51题）", "answer": "条件：① 自愿救助 + ② 法益对象对行为人形成依赖关系\n弃婴：视而不见不构成犯罪；捡回家 → 形成依赖关系 → 有继续救助义务\n井底绳子：绳到井底尚未上拉 → 未形成依赖 → 可不拉；拉到半空 → 有继续拉的义务（\"救人救到底\"），此时放绳摔死人 = 作为与不作为竞合 → 认定为作为\n救生圈：乙尚未抓到救生圈即捞走 → 未形成依赖 → 无救助义务\n酒局：请人喝酒属生活行为不创设危险，直接离开无义务（2025年试题，但酒吧基于特定领域有保护义务）；一旦扶上车开车送回家 → 形成依赖 → 有继续送达义务\n【易错点】判断锚点是\"依赖关系是否已经形成\"——救助着手且对方因此放弃/丧失其他获救可能时，义务产生。", "points": ["条件：① 自愿救助 + ② 法益对象对行为人形成依赖关系", "弃婴：视而不见不构成犯罪；捡回家 → 形成依赖关系 → 有继续救助义务", "井底绳子：绳到井底尚未上拉 → 未形成依赖 → 可不拉；拉到半空 → 有继续拉的义务（\"救人救到底\"），此时放绳摔死人 = 作为与不作为竞合 → 认定为作为", "救生圈：乙尚未抓到救生圈即捞走 → 未形成依赖 → 无救助义务", "酒局：请人喝酒属生活行为不创设危险，直接离开无义务（2025年试题，但酒吧基于特定领域有保护义务）；一旦扶上车开车送回家 → 形成依赖 → 有继续送达义务"], "ladder": [1, 2, 3, 4], "exam": {"year": 2014, "paper": "刑法", "qno": 5}, "sources": [["book", "2026主观题刑法攻略（精讲）·柏浪涛", "p.19", "exact", "C-素材抽取"], ["note", "data/刑法.json 卡片 crim-116", "crim-116", "exact", "C-素材抽取"]]}, {"id": "qa-xf-117", "topicIds": ["xf003"], "title": "专题二 不作为犯", "prompt": "辨析：相约登山（2023年试题）vs 相约打羽毛球（2024年试题）——同伴遇险时有无救助义务？", "answer": "登山（危险的山）：意味着愿意相互照顾，形成危险共同体 → 特定关系产生保护义务 → 有救助义务\n打羽毛球：未形成危险共同体 → 甲突发心脏病，乙没有刑法上的救助义务\n【易错点】区分核心：活动本身是否有危险性、参与者是否以相互照顾为前提结成\"危险共同体\"。", "points": ["登山（危险的山）：意味着愿意相互照顾，形成危险共同体 → 特定关系产生保护义务 → 有救助义务", "打羽毛球：未形成危险共同体 → 甲突发心脏病，乙没有刑法上的救助义务"], "ladder": [1, 2, 3, 4], "exam": {"year": 2023, "paper": "刑法"}, "sources": [["book", "2026主观题刑法攻略（精讲）·柏浪涛", "p.20", "exact", "C-素材抽取"], ["note", "data/刑法.json 卡片 crim-117", "crim-117", "exact", "C-素材抽取"]]}, {"id": "qa-xf-118", "topicIds": ["xf003"], "title": "专题二 不作为犯", "prompt": "基于\"特定领域\"产生保护义务的两个条件？并用宿舍着火案、嫖娼案、吸毒案（均2023年试题）检验。", "answer": "条件①：行为人是特定领域的管理者，被害人不是该领域的管理者\n条件②：行为人对领域内危险有控制力，被害人对其形成依赖关系\n宿舍着火：甲乙共同居住，乙也是管理者 → 甲无救助义务\n嫖娼案：在谁家里谁有义务（卖淫女家中嫖客发病→卖淫女有义务；反之无）；酒店看谁开的房（视为谁家），酒店管理者另基于职务业务有义务；二人共同管理的房间 → 另一方无义务\n吸毒案：甲乙常在乙家吸毒，乙发病甲无义务；甲发病则乙（领域管理者）有义务\n【易错点】口诀：\"在谁的地盘，谁管\"。共同管理 = 互相都不是\"依赖方\" → 无义务。", "points": ["条件①：行为人是特定领域的管理者，被害人不是该领域的管理者", "条件②：行为人对领域内危险有控制力，被害人对其形成依赖关系", "宿舍着火：甲乙共同居住，乙也是管理者 → 甲无救助义务", "嫖娼案：在谁家里谁有义务（卖淫女家中嫖客发病→卖淫女有义务；反之无）；酒店看谁开的房（视为谁家），酒店管理者另基于职务业务有义务；二人共同管理的房间 → 另一方无义务", "吸毒案：甲乙常在乙家吸毒，乙发病甲无义务；甲发病则乙（领域管理者）有义务"], "ladder": [1, 2, 3, 4], "exam": {"year": 2023, "paper": "刑法"}, "sources": [["book", "2026主观题刑法攻略（精讲）·柏浪涛", "p.20", "exact", "C-素材抽取"], ["note", "data/刑法.json 卡片 crim-118", "crim-118", "exact", "C-素材抽取"]]}, {"id": "qa-xf-119", "kind": "case", "topicIds": ["xf003"], "title": "专题二 不作为犯", "prompt": "出租车司机见男乘客强奸女乘客（巩固题1）、大巴司机见乘客甲盗窃乘客乙（2023年试题）——司机有无阻止义务？\n问：\"依赖关系\"如何定义？", "answer": "都有阻止义务，且来源有二：① 职务、业务产生的保护义务；② 特定领域产生的保护义务\n出租车司机不阻止强奸 → 构成强奸罪的不作为形式的帮助犯\n大巴有其他乘客≠乙可依赖他们：其他乘客没有刑法上的作为义务 → 乙只能依赖司机\n依赖关系定义：现场没有其他人；或有其他人但他们无作为义务；或有义务但缺乏作为能力——被害人只能依赖行为人消除危险\n【易错点】这段\"依赖关系\"的定义是教材给出的标准表述，主观题论证特定领域义务时可直接引用。", "points": ["都有阻止义务，且来源有二：① 职务、业务产生的保护义务；② 特定领域产生的保护义务", "出租车司机不阻止强奸 → 构成强奸罪的不作为形式的帮助犯", "大巴有其他乘客≠乙可依赖他们：其他乘客没有刑法上的作为义务 → 乙只能依赖司机", "依赖关系定义：现场没有其他人；或有其他人但他们无作为义务；或有义务但缺乏作为能力——被害人只能依赖行为人消除危险"], "ladder": [1, 2, 3, 4, 5], "exam": {"year": 2023, "paper": "刑法"}, "sources": [["book", "2026主观题刑法攻略（精讲）·柏浪涛", "p.20", "exact", "C-素材抽取"], ["note", "data/刑法.json 卡片 crim-119", "crim-119", "exact", "C-素材抽取"]]}, {"id": "qa-xf-120", "topicIds": ["xf004", "xf005"], "title": "专题二 不作为犯", "prompt": "不作为犯的\"能为\"与\"不为\"要件分别如何判断？（脚抽筋案 / 车间压伤案 2010年52题 / 逃逸致死）", "answer": "【能为=作为可能性】从行为人自身能力 + 客观条件两方面判断。例：大叔带小孩游泳双双落水，大叔脚抽筋自身难保 → 不构成不作为犯\n【不为的前提=结果避免可能性】履行义务危害结果就不会发生，处罚不履行才有意义\n车间案：甲操作不当致机器压伤乙、乙濒临死亡，甲不救乙很快死亡 → 救了也救不活 → 不构成不作为犯罪，只构成过失致人死亡罪\n交通肇事\"因逃逸致人死亡\"：若伤者头盖骨破裂，立即送最近医院也无法挽救 → 肇事者逃逸不属于\"因逃逸致人死亡\"\n【易错点】结果避免可能性是隐蔽考点：先确认\"救得活\"，再谈不作为的因果关系与归责。", "points": ["【能为=作为可能性】从行为人自身能力 + 客观条件两方面判断。例：大叔带小孩游泳双双落水，大叔脚抽筋自身难保 → 不构成不作为犯", "【不为的前提=结果避免可能性】履行义务危害结果就不会发生，处罚不履行才有 犯罪事实 + 人民检察院补充起诉（两要件缺一不可）\n检察院未补充起诉的：依不告不理，法院不得主动审理新事实并加刑\n检察院补充起诉的：可数罪并罚，刑期可高于原判\n【易错点】答题关键词是「补充起诉」。只写“甲上诉故不得加重”会丢理由分——把原则写成了绝对规则。", "points": ["原则：仅被告方上诉→发回重审的案件，原审法院不得加重被告人的刑罚", "唯一例外 = 有新的犯罪事实 + 人民检察院补充起诉（两要件缺一不可）", "检察院未补充起诉的：依不告不理，法院不得主动审理新事实并加刑", "检察院补充起诉的：可数罪并罚，刑期可高于原判"], "ladder": [1, 2, 3, 4], "sources": [["book", "主观题刑事诉讼法攻略（基础版）·左宁", "p.223-224", "exact", "C-素材抽取"], ["law", "《刑事诉讼法》第237条第1款", "", "exact", "C-素材抽取"], ["law", "《刑诉解释》第403条第1款", "", "exact", "C-素材抽取"], ["note", "data/刑诉.json 卡片 xsu-101", "xsu-101", "exact", "C-素材抽取"]]}, {"id": "qa-xs-102", "topicIds": ["xs146"], "title": "上诉不加刑 · 刑诉解释401条 vs 403条第2款", "prompt": "改判受限的两条易混规则：《刑诉解释》401条与403条第2款各自适用于什么场合？限制标准分别是什么？（判断口诀：看最后启动这次二审的是谁）", "answer": "401条｜仅被告方上诉的案件：可改罪名、罪数、调整单罪刑罚，但不得加重「决定执行的刑罚」或对刑罚执行产生不利影响（不得撤缓刑/延考验期、新增禁止令、增设限制减刑等）；检察院抗诉或自诉人上诉的不受此限\n403条第2款｜被告方上诉→发回重审→重审判决后检察院抗诉：二审可加刑，但不得重于原一审「第一次判决」的刑罚\n口诀：被告方上诉看401（盯决定执行刑罚）；重审后检察院抗诉看403②（盯第一次判决封顶）\n【易错点】典型陷阱：单罪刑期升高但决定执行刑罚降低→不违背401条。401条第7项（刑罚畸轻走审判监督）只在被告方上诉案件中适用，检察院已抗诉时勿引。", "points": ["401条｜仅被告方上诉的案件：可改罪名、罪数、调整单罪刑罚，但不得加重「决定执行的刑罚」或对刑罚执行产生不利影响（不得撤缓刑/延考验期、新增禁止令、增设限制减刑等）；检察院抗诉或自诉人上诉的不受此限", "403条第2款｜被告方上诉→发回重审→重审判决后检察院抗诉：二审可加刑，但不得重于原一审「第一次判决」的刑罚", "口诀：被告方上诉看401（盯决定执行刑罚）；重审后检察院抗诉看403②（盯第一次判决封顶）"], "ladder": [1, 2, 3, 4], "sources": [["book", "主观题刑事诉讼法攻略（基础版）·左宁", "p.223-224", "exact", "C-素材抽取"], ["law", "《刑诉解释》第401条", "", "exact", "C-素材抽取"], ["law", "《刑诉解释》第403条第2款", "", "exact", "C-素材抽取"], ["note", "data/刑诉.json 卡片 xsu-102", "xsu-102", "exact", "C-素材抽取"]]}]}];
