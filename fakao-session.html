    3: { label:"挖空填", show:["cloze"], act:"type", reveal:["answer"], grade:true,
         hint:"把空处的关键词打出来或说出来，逗号分隔。" },
    4: { label:"默写全文", show:["title"], act:"type", reveal:["answer"], grade:true,
         hint:"完整写一遍，或者语音背一遍。" },
    5: { label:"应用", show:["prompt"], act:"type", reveal:["answer","points"], grade:true, timed:6,
         hint:"用这个考点答一道小题。" },
  },
  case: {   // 案例题 / 真题
    1: { label:"只读题干", show:["stem"], act:"read", reveal:[], grade:false,
         hint:"只读事实，不给设问。让疑问自己长出来。" },
    2: { label:"读题不做题", show:["prompt"], act:"recall", reveal:["points"], grade:true,
         hint:"在心里想清楚怎么答，再看要点核对。别动笔。" },
    3: { label:"按提纲口述", show:["prompt","points"], act:"type", reveal:["answer"], grade:true,
         hint:"照要点提纲口述一遍（点麦克风），再看完整答案。" },
    4: { label:"限时完整作答", show:["prompt"], act:"type", reveal:["answer","points"], grade:true, timed:12,
         hint:"限时写完整答案，写完逐条对要点给分。" },
    5: { label:"变式应用", show:["prompt"], act:"type", reveal:["answer","points"], grade:true, timed:10,
         hint:"换事实、换设问也要能答。" },
  },
};
const trackOf = it => (it.kind === "case" || it.kind === "exam") ? "case" : "memo";
const INTERVAL_D = [0, 1, 2, 4, 7, 14, 21];   // 各级答对后的间隔（天）

/* ─────────── 数据装载 ─────────── */
const ITEMS = [];
for (const d of DECKS) for (const it of d.items) ITEMS.push({ ...it, deck: d.deck, kind: it.kind || d.kind });
const BY_ID = new Map(ITEMS.map(i => [i.id, i]));

const blank = () => ({ v:1, device:"", items:{}, feedback:[], doneToday:0, day:today(),
                       secToday:0, bestLap:0, hits:[] });
function today(){ const d = new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
let S = load();
function load(){
  try {
    const s = JSON.parse(localStorage.getItem(KEY)) || blank();
    if (s.day !== today()) { s.day = today(); s.doneToday = 0; s.secToday = 0; s.bestLap = 0; s.hits = []; }
    if (!s.device) s.device = navigator.platform + "-" + Math.random().toString(36).slice(2, 6);
    /* 老进度没有计时字段，补上，别让 undefined 传染进导出 */
    s.secToday = s.secToday || 0; s.bestLap = s.bestLap || 0; s.hits = s.hits || [];
    return s;
  } catch { return blank(); }
}
const save = () => localStorage.setItem(KEY, JSON.stringify(S));

function st(id){
  if (!S.items[id]) S.items[id] = { lv:0, due:0, reps:0, lapses:0, last:0 };
  return S.items[id];
}
/* 当前该练哪一级：lv 0 表示还没开始，取该条 ladder 的第一级 */
function levelFor(it){
  const s = st(it.id), lad = it.ladder || [1,2,3,4,5];
  if (!s.lv) return lad[0];
  const i = lad.indexOf(s.lv);
  return i < 0 ? lad[0] : s.lv;
}

/* ─────────── 队列：到期 + 薄弱优先，混着出不按科目分块 ─────────── */
function buildQueue(){
  const now = Date.now();
  const due = [], fresh = [];
  for (const it of ITEMS){
    const s = st(it.id);
    if (!s.lv) fresh.push(it);
    else if (s.due <= now) due.push(it);
  }
  const rank = a => (st(a.id).lapses * 10) + (weightOf(a));    // 错得多的先来，其次重要度高的
  due.sort((a,b) => rank(b) - rank(a) || st(a.id).due - st(b.id).due);
  fresh.sort((a,b) => weightOf(b) - weightOf(a));
  const q = due.concat(fresh);
  return interleave(q);
}
function weightOf(it){ return (it.topicIds || []).length ? 5 : 3; }
/* 相邻两条尽量换科目也换题型（2026-07-30 Simon 实测连刷 3 个案例只读——只按科目交错，
   民法案例接民诉案例照样全是案例。双维交错：先找"科目≠上一个 且 轨≠上一个"，
   退而求其次换轨（读→背→写的节奏比换科目更防疲劳），再退换科目。 */
function interleave(q){
  const out = [], pool = q.slice();
  let lastSubj = null, lastTrack = null;
  while (pool.length){
    let k = pool.findIndex(x => subjOf(x) !== lastSubj && trackOf(x) !== lastTrack);
    if (k < 0) k = pool.findIndex(x => trackOf(x) !== lastTrack);
    if (k < 0) k = pool.findIndex(x => subjOf(x) !== lastSubj);
    if (k < 0) k = 0;
    const it = pool.splice(k, 1)[0];
    out.push(it); lastSubj = subjOf(it); lastTrack = trackOf(it);
  }
  return out;
}
const PREFIX = { ms:"民诉", xs:"刑诉", xf:"刑法", mf:"民法", xz:"行政法", sf:"商法", ll:"理论法" };
/* 注意：空数组是 truthy，所以不能写 `it.topicIds || [""]`——
   未挂考点的条目会得到 [] 再取 [0] 得 undefined，.slice 直接抛错，整页空白。 */
const subjOf = it => PREFIX[((it.topicIds || [])[0] || "").slice(0, 2)] || "未挂考点";

let QUEUE = buildQueue(), cur = null, phase = "prompt", tick = null, tLeft = 0, readN = 0;

/* ─────────── 渲染 ─────────── */
const view = document.getElementById("view");
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const SRC_T = { book:"教材", lecture:"网课实录", note:"笔记", law:"法条" };
const SRC_C = { exact:"", range:"待核", none:"未定位" };

function syncBar(){
  paintLap();
  document.getElementById("sDone").textContent = S.doneToday;
  document.getElementById("sQueue").textContent = QUEUE.length;
  document.getElementById("sWhere").textContent = cur
    ? `${subjOf(cur)} · L${levelFor(cur)} ${LADDER[trackOf(cur)][levelFor(cur)].label}` : "—";
}

function clozeText(it){
  let a = it.answer || "";
  for (const w of (it.cloze || [])) a = a.split(w).join("____");
  return a;
}
function stemOf(it){ return (it.prompt || "").split(/\n\s*问[：:]/)[0]; }
/* 大案例：一段背景挂着好几问。背景只值得完整读一遍，之后各问要看的是「这一问问什么」。
   分组键就用背景原文——同一大案例的各问，背景一字不差。本 session 内记住读过谁。 */
function questionOf(it){
  const m = (it.prompt || "").split(/\n\s*问[：:]/);
  return m.length > 1 ? m.slice(1).join("问：").trim() : "";
}
const stemSeen = new Set();
function stemBlock(it, forceOpen){
  const s = stemOf(it); if (!s) return "";
  const key = s.slice(0, 200);
  const first = forceOpen || !stemSeen.has(key);
  stemSeen.add(key);
  if (first) return `<div class="body">${esc(s)}</div>`;
  return `<details class="stemfold"><summary>案情背景（已读过，点开重看）</summary>
          <div class="body quiet">${esc(s)}</div></details>`;
}

function next(){
  if (!QUEUE.length) return renderDone();
  cur = QUEUE.shift(); phase = "prompt"; readN = 0;
  try { render(); }
  catch (e){
    /* 单条数据有问题时跳过它继续刷，并把它记进反馈，别让整轮卡死 */
    S.feedback.push({ ts: Date.now(), device: S.device, itemId: cur.id, topicIds: cur.topicIds || [],
                      lv: 0, text: "【引擎自动记录】这条渲染失败：" + (e && e.message || e) });
    save(); next();
  }
}

function render(){
  const it = cur, track = trackOf(it), lv = levelFor(it), cfg = LADDER[track][lv];
  if (!cfg) { advance("good"); return; }
  const showing = phase === "prompt" ? cfg.show : cfg.show.concat(cfg.reveal);
  const parts = [];

  parts.push(`<span class="lvtag">L${lv} · ${esc(cfg.label)}</span>`);
  parts.push(`<p class="meta">${esc(subjOf(it))} · ${esc(it.deck)}${it.exam ? ` · ${it.exam.year}年真题` : ""}</p>`);
  parts.push(`<h2 class="title">${esc(it.title)}</h2>`);
  if (phase === "prompt"){
    /* 同一大案例的第二问起，L1 的「只读事实」已经做过了，换成看设问 */
    const reread = lv === 1 && track === "case" && stemSeen.has(stemOf(it).slice(0,200));
    parts.push(`<p class="hint">${esc(reread ? "背景上一问读过了，这里只看清这一问问什么。" : cfg.hint)}</p>`);
  }

  if (it.audio && showing.includes("answer")) parts.push(`<audio controls preload="none" style="width:100%;margin:0 0 14px" src="${esc(it.audio)}"></audio>`);
  if (it.hint && phase === "prompt") parts.push(`<p class="hint">💭 ${esc(it.hint)}</p>`);
  if (it.analogy && phase === "reveal") parts.push(`<p class="hint">🔗 ${esc(it.analogy)}</p>`);
  /* 背景一律走 stemBlock（首次展开、之后折叠）；设问单独拎出来，不再埋在背景末尾 */
  if (showing.includes("stem")){
    const wasFirst = !stemSeen.has(stemOf(it).slice(0,200));
    parts.push(stemBlock(it));
    /* 背景已经读过的，L1 就不是「再读一遍」，而是「看清这一问问什么」 */
    if (!wasFirst && questionOf(it))
      parts.push(`<p class="meta">这一问</p><div class="body">${esc(questionOf(it))}</div>`);
  }
  if (showing.includes("prompt")){
    parts.push(stemBlock(it));
    const q = questionOf(it);
    if (q) parts.push(`<p class="meta">这一问</p><div class="body">${esc(q)}</div>`);
  }
  if (showing.includes("cloze"))  parts.push(`<div class="body quiet">${esc(clozeText(it))}</div>`);
  if (showing.includes("title") && phase === "prompt")
    parts.push(`<div class="body quiet">（凭这个标题想出内容）</div>`);
  if (showing.includes("answer")) parts.push(`<div class="body">${esc(it.answer)}</div>`);
  if (showing.includes("points") && (it.points || []).length)
    parts.push(`<ul class="pts">${it.points.map((p,i)=>`<li><span class="n mono">${i+1}</span><span>${esc(p)}</span></li>`).join("")}</ul>`);

  if (cfg.act === "type" && phase === "prompt")
    parts.push(`<div class="inputrow">
      <textarea id="ans" placeholder="打字，或点右下角麦克风说"></textarea>
      <button class="mic" id="mic" title="语音输入">🎤</button></div>`);
  if (cfg.act === "type" && phase === "reveal" && lastAnswer)
    parts.push(`<p class="meta">你写的：</p><div class="body quiet">${esc(lastAnswer)}</div>`);
  if (cfg.timed && phase === "prompt")
    parts.push(`<p class="hint mono" id="timer">⏱ ${cfg.timed}:00</p>`);

  parts.push(`<div id="acts"></div>`);
  parts.push(`<button class="iconbtn" id="srcBtn">溯源 · ${(it.sources||[]).length} 条来源</button>
    <div id="srcBox">${srcRows(it.sources)}</div>`);
  parts.push(`<div id="fb"><h3>这条哪里不对？随手写，不用停下来<span id="fbSaved"></span></h3>
    <div class="inputrow"><textarea id="fbText" placeholder="例：这张卡答案太长，拆成两条 / 要点3 和 要点4 重复了"></textarea>
    <button class="mic" id="fbMic" title="语音输入">🎤</button></div>
    <button class="iconbtn" id="fbSave">存下这条反馈</button></div>`);

  view.innerHTML = parts.join("");
  renderActs(cfg, lv);
  wire(cfg);
  syncBar();
  window.scrollTo(0, 0);
}

function renderActs(cfg, lv){
  const box = document.getElementById("acts");
  if (phase === "prompt"){
    if (cfg.act === "read3"){
      box.innerHTML = `<button class="btn primary" id="go">读了一遍（还需 ${3-readN} 遍）</button>`;
    } else if (cfg.act === "read"){
      box.innerHTML = `<button class="btn primary" id="go">读完了</button>`;
    } else if (cfg.act === "recall"){
      box.innerHTML = `<button class="btn primary" id="go">想好了，看答案</button>`;
    } else {
      box.innerHTML = `<button class="btn primary" id="go">写好了，对答案</button>`;
    }
  } else {
    if (!cfg.grade){ box.innerHTML = `<button class="btn primary" id="g-good">过，下一条</button>`; return; }
    box.innerHTML =
      `<button class="btn g-again" id="g-again">忘了<small>降一级，10 分钟后再来</small></button>
       <button class="btn g-hard" id="g-hard">有点吃力<small>原级重来</small></button>
       <button class="btn g-good" id="g-good">会了<small>升到 L${Math.min(lv+1,5)}</small></button>`;
  }
}

function srcRows(list){
  if (!list || !list.length) return `<p class="hint">还没登记来源。</p>`;
  return list.map(([t,ref,loc,conf,how]) => `<div class="srow">
    <span class="t">${esc(SRC_T[t]||t)}</span><span>${esc(ref)}</span>
    <span class="loc${conf==="exact"?"":" weak"}">${esc(loc || SRC_C[conf] || "")}</span></div>`).join("");
}

let lastAnswer = "";

function wire(cfg){
  const go = document.getElementById("go");
  if (go) go.onclick = () => {
    if (cfg.act === "read3"){
      readN++;
      if (readN < 3){ renderActs(cfg, levelFor(cur)); wire(cfg); return; }
    }
    if (cfg.act === "type"){ lastAnswer = (document.getElementById("ans")?.value || "").trim(); }
    stopTimer();
    if (!cfg.reveal.length && !cfg.grade){ advance("good"); return; }
    phase = "reveal"; render();
  };
  for (const g of ["again","hard","good"]){
    const b = document.getElementById("g-" + g);
    if (b) b.onclick = () => advance(g);
  }
  document.getElementById("srcBtn").onclick = e => {
    const box = document.getElementById("srcBox");
    box.classList.toggle("on");
    e.target.setAttribute("aria-expanded", box.classList.contains("on"));
  };
  document.getElementById("fbSave").onclick = saveFeedback;
  micWire("mic", "ans"); micWire("fbMic", "fbText");
  if (cfg.timed && phase === "prompt") startTimer(cfg.timed);
}

/* ─────────── 陪练累计计时（正向）───────────
   跟下面 startTimer 的**题内倒计时**是两回事，别混：
     ⏱ 倒计时  = L4/L5 掐表做案例，限时是为了不盯着发呆、不无限纠结，保留。
     ▶ 正向计时 = 这一程连续练了多久。不设目标时长，5 分钟也算数。
   只在"真的在练"时走表：页面可见 + 3 分钟内有动作。停超过 10 分钟算新的一程。 */
const LAP_HITS = [5, 15, 25];          // 成就节点（分钟）。达成才出现，不达成不显示"还差多少"
const IDLE_MS  = 3 * 60 * 1000;        // 多久没动作就暂停走表
const BREAK_MS = 10 * 60 * 1000;       // 断这么久就算新的一程
let lapSec = 0, lapTick = null, lastAct = Date.now(), lapDirty = 0;

function fmt(s){ return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; }

function lapRunning(){
  return document.visibilityState === "visible" && (Date.now() - lastAct) < IDLE_MS;
}
function bump(){                        // 任何用户动作都喊一声，用来判断"还在练吗"
  const gap = Date.now() - lastAct;
  if (gap > BREAK_MS){ lapSec = 0; }    // 隔太久：这一程重新算
  lastAct = Date.now();
  if (!lapTick) lapStart();
}
function lapStart(){
  if (lapTick) return;
  lapTick = setInterval(() => {
    if (!lapRunning()){ paintLap(); return; }   // 暂停时只是不累加，不清零
    lapSec++; S.secToday++;
    if (lapSec > S.bestLap) S.bestLap = lapSec;
    const min = lapSec / 60;
    for (const m of LAP_HITS){
      if (lapSec === m * 60 && !S.hits.includes(m)){
        S.hits.push(m); save();
        toast(`▶ 这一程连续 ${m} 分钟`);
        const el = document.getElementById("sLap");
        if (el){ el.classList.add("hit"); setTimeout(() => el.classList.remove("hit"), 6000); }
      }
    }
    if (++lapDirty >= 10){ lapDirty = 0; save(); }   // 每 10 秒落一次盘，别每秒都写
    paintLap();
  }, 1000);
}
function paintLap(){
  const el = document.getElementById("sLap");
  if (!el) return;
  el.textContent = `▶ ${fmt(lapSec)}`;
  el.classList.toggle("paused", !lapRunning());
  el.title = `这一程 ${fmt(lapSec)} · 今日累计 ${fmt(S.secToday)} · 今日最长 ${fmt(S.bestLap)}`;
}
let toastT = null;
function toast(msg){
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove("show"), 3200);
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") lastAct = Date.now();   // 回来就当刚动过
  else save();                                                        // 切走先落盘
  paintLap();
});
window.addEventListener("beforeunload", save);
["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, bump, { passive:true }));

/* ─────────── 题内倒计时 ─────────── */
function startTimer(min){
  tLeft = min * 60;
  const el = document.getElementById("timer");
  tick = setInterval(() => {
    tLeft--;
    if (!el) return stopTimer();
    const m = Math.floor(Math.abs(tLeft)/60), s = String(Math.abs(tLeft)%60).padStart(2,"0");
    el.textContent = `⏱ ${tLeft<0?"超时 ":""}${m}:${s}`;
    el.style.color = tLeft < 0 ? "var(--again)" : tLeft < 60 ? "var(--hard)" : "";
  }, 1000);
}
function stopTimer(){ if (tick){ clearInterval(tick); tick = null; } }

/* ─────────── 语音输入 ─────────── */
/* 主路径永远是系统听写（手机键盘麦克风 / macOS 双击 Fn）——这个按钮只是锦上添花，
   浏览器不支持时给提示而不是假装能用。 */
function micWire(btnId, taId){
  const btn = document.getElementById(btnId), ta = document.getElementById(taId);
  if (!btn || !ta) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){
    btn.onclick = () => { btn.title = "这个浏览器不支持网页语音识别，请用键盘上的麦克风按钮"; alert(btn.title); };
    return;
  }
  let rec = null;
  btn.onclick = () => {
    if (rec){ rec.stop(); return; }
    rec = new SR(); rec.lang = "zh-CN"; rec.continuous = true; rec.interimResults = true;
    let base = ta.value;
    rec.onresult = e => {
      let s = "";
      for (let i = e.resultIndex; i < e.results.length; i++) s += e.results[i][0].transcript;
      ta.value = (base ? base + " " : "") + s;
    };
    rec.onend = () => { btn.classList.remove("rec"); rec = null; };
    rec.onerror = ev => { btn.classList.remove("rec"); rec = null;
      if (ev.error !== "aborted") alert("语音识别出错（" + ev.error + "），改用键盘麦克风吧"); };
    rec.start(); btn.classList.add("rec");
  };
}

/* ─────────── 反馈：append-only，天然无冲突 ─────────── */
function saveFeedback(){
  const ta = document.getElementById("fbText"), txt = ta.value.trim();
  if (!txt) return;
  S.feedback.push({ ts: Date.now(), device: S.device, itemId: cur.id,
                    topicIds: cur.topicIds || [], lv: levelFor(cur), text: txt });
  save(); ta.value = ""; schedulePush();
  const tag = document.getElementById("fbSaved");
  tag.textContent = "已存，继续刷"; setTimeout(() => tag.textContent = "", 2200);
}

/* ─────────── 评分与排程 ─────────── */
function advance(grade){
  const it = cur, s = st(it.id), lad = it.ladder || [1,2,3,4,5], lv = levelFor(it);
  s.reps++; s.last = Date.now();
  let nlv = lv;
  if (grade === "again"){ s.lapses++; const i = lad.indexOf(lv); nlv = lad[Math.max(0, i-1)]; }
  else if (grade === "good"){ const i = lad.indexOf(lv); nlv = i < lad.length-1 ? lad[i+1] : lv; }
  s.lv = nlv;
  const days = grade === "again" ? 0 : INTERVAL_D[Math.min(nlv, INTERVAL_D.length-1)];
  s.due = Date.now() + (grade === "again" ? 10*60*1000 : days*86400*1000);
  S.doneToday++; save(); stopTimer(); lastAnswer = "";
  schedulePush();
  next();
}

/* ─────────── 收工 ─────────── */
function renderDone(){
  cur = null; syncBar();
  const total = Object.keys(S.items).length;
  const mastered = Object.values(S.items).filter(x => x.lv >= 5).length;
  view.innerHTML = `<div id="done">
    <h2>这一轮刷完了</h2>
    <p>队列空了。导出进度带到别的设备，或者把反馈交给 Claude 改卡。</p>
    <div class="stat">
      <div><b>${S.doneToday}</b>今日</div>
      <div><b class="mono">${fmt(S.secToday)}</b>今日时长</div>
      <div><b class="mono">${fmt(S.bestLap)}</b>最长一程</div>
      <div><b>${total}</b>已开卡</div>
      <div><b>${mastered}</b>到 L5</div>
      <div><b>${S.feedback.length}</b>条反馈</div>
    </div>
    <div id="acts">
      <button class="btn primary" id="expP">导出进度</button>
      <button class="btn" id="expF">导出反馈</button>
      <button class="btn" id="again">再刷一轮</button>
    </div>
    <div id="drop">把 progress.json 拖到这里合并另一台设备的进度<br>
      <span class="mono" style="font-size:11px">按 (条目, 级别) 逐键取较新的一条，不整份覆盖</span></div>
  </div>`;
  document.getElementById("expP").onclick = () => { save(); dl("progress.json", {
    v:1, device:S.device, exportedAt:Date.now(), items:S.items,
    byTopic: byTopic(),     // 给全景图上色用
    /* 陪练时长也要带走，否则跨设备一合并当天时长就被冲掉 */
    time: { day:S.day, secToday:S.secToday, bestLap:S.bestLap, hits:S.hits }
  }); };
  document.getElementById("expF").onclick = () => dl("feedback.json", { v:1, device:S.device, feedback:S.feedback });
  document.getElementById("again").onclick = () => { QUEUE = buildQueue(); next(); };
  wireDrop();
}

/* 掌握度按考点聚合——全景图 P3 直接吃这个 */
function byTopic(){
  const m = {};
  for (const it of ITEMS){
    const s = S.items[it.id]; if (!s || !s.lv) continue;
    for (const t of (it.topicIds || [])){
      if (!m[t]) m[t] = { lv:0, lapses:0, items:0 };
      m[t].lv = Math.max(m[t].lv, s.lv); m[t].lapses += s.lapses; m[t].items++;
    }
  }
  return m;
}

function dl(name, obj){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 1)], { type:"application/json" }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}

function wireDrop(){
  const z = document.getElementById("drop");
  z.ondragover = e => { e.preventDefault(); z.classList.add("over"); };
  z.ondragleave = () => z.classList.remove("over");
  z.ondrop = async e => {
    e.preventDefault(); z.classList.remove("over");
    const f = e.dataTransfer.files[0]; if (!f) return;
    try {
      const o = JSON.parse(await f.text());
      let n = 0;
      for (const [id, s] of Object.entries(o.items || {})){
        const mine = S.items[id];
        if (!mine || (s.last || 0) > (mine.last || 0)){ S.items[id] = s; n++; }
      }
      for (const fb of (o.feedback || [])){
        if (!S.feedback.some(x => x.ts === fb.ts && x.itemId === fb.itemId)) S.feedback.push(fb);
      }
      /* 陪练时长：同一天才合，两台设备的时长相加、最长一程取大的 */
      let addMin = 0;
      const t = o.time;
      if (t && t.day === S.day){
        addMin = Math.round((t.secToday || 0) / 60);
        S.secToday += (t.secToday || 0);
        S.bestLap = Math.max(S.bestLap, t.bestLap || 0);
        S.hits = [...new Set([...S.hits, ...(t.hits || [])])].sort((a,b) => a-b);
      }
      save(); QUEUE = buildQueue(); paintLap();
      z.textContent = `合并了 ${n} 条更新的进度` + (addMin ? `，另加 ${addMin} 分钟练习时长。` : "。");
    } catch { z.textContent = "这个文件读不了，确认是导出的 progress.json"; }
  };
}

document.getElementById("btnEnd").onclick = () => { stopTimer(); renderDone(); };
document.getElementById("btnQuest").onclick = () => { stopTimer(); renderQuests(); };

/* ─────────── 跨设备同步（E 交付的 HTTPS 端点，Worker 反代自建服务器）───────────
   token 不写进页面——本页在公开 GitHub 仓库里，写死等于任何人可读写同步数据。
   token 存本机 localStorage，每台设备首次点 ⇅ 粘贴一次。
   失败一律静默降级：离线照刷，联网自动补传。服务端只存 items+feedback（时长等体验数据不上云）。 */
const SYNC_URL = "https://ai-proxy.congshi-jiang.workers.dev/v1/sync";
const TOKEN_KEY = "fakao-sync-token";
let syncTimer = null, syncBusy = false;

function mergeInto(base, o){
  let n = 0;
  for (const [id, st2] of Object.entries(o.items || {})){
    const mine = base.items[id];
    if (!mine || (st2.last || 0) > (mine.last || 0)){ base.items[id] = st2; n++; }
  }
  for (const fb of (o.feedback || [])){
    if (!base.feedback.some(x => x.ts === fb.ts && x.itemId === fb.itemId)) base.feedback.push(fb);
  }
  return n;
}
function syncUI(state, title){
  const b = document.getElementById("btnSync");
  b.classList.remove("ok", "off");
  if (state) b.classList.add(state);
  if (title) b.title = title;
}
async function pushSync(){
  const token = localStorage.getItem(TOKEN_KEY);
  if (!token || syncBusy) return;
  syncBusy = true;
  try {
    const r = await fetch(`${SYNC_URL}/s/${token}/merge`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ items: S.items, feedback: S.feedback }),
    });
    if (!r.ok) throw new Error(r.status);
    mergeInto(S, await r.json()); save();
    syncUI("ok", "已同步 " + new Date().toLocaleTimeString().slice(0, 5));
  } catch { syncUI("off", "离线（本地照常记录，联网自动补传）"); }
  finally { syncBusy = false; }
}
function schedulePush(){
  if (!localStorage.getItem(TOKEN_KEY)) return;
  clearTimeout(syncTimer); syncTimer = setTimeout(pushSync, 4000);
}
async function pullSync(){
  const token = localStorage.getItem(TOKEN_KEY);
  if (!token) { syncUI("off", "未配置同步——点 ⇅ 粘贴 token"); return; }
  try {
    const r = await fetch(`${SYNC_URL}/s/${token}/state`);
    if (!r.ok) throw new Error(r.status);
    const n = mergeInto(S, await r.json()); save();
    syncUI("ok", "已同步 " + new Date().toLocaleTimeString().slice(0, 5));
    /* 拉下来的进度可能改变到期集合：不打断正在刷的题，只在空闲/收工页时重建队列 */
    if (n && !cur){ QUEUE = buildQueue(); next(); }
  } catch { syncUI("off", "离线（本地照常记录）"); }
}
document.getElementById("btnSync").onclick = async () => {
  let token = localStorage.getItem(TOKEN_KEY);
  if (!token){
    token = (prompt("粘贴同步 token（问 Claude 要，每台设备只需一次）") || "").trim();
    if (!token) return;
    localStorage.setItem(TOKEN_KEY, token);
  }
  await pullSync(); await pushSync();
};

/* ─────────── 副本（支线任务）───────────
   副本 = 把某个 deck 一次性集中过一遍：主线序列的"提前执行"。
   评分写的是同一份 S.items，所以刷完的条目由主线的间隔复习接着安排——副本本身不存进度。 */
function questStats(d){
  let started = 0, done5 = 0;
  for (const it of d.items){ const s = S.items[it.id]; if (s && s.lv){ started++; if (s.lv >= 5) done5++; } }
  return { started, total: d.items.length, done5 };
}
function renderQuests(){
  cur = null; syncBar();
  const rows = DECKS.slice()
    .sort((a, b) => (b.side ? 1 : 0) - (a.side ? 1 : 0))
    .map((d, di) => {
      const st = questStats(d);
      const tag = d.side ? "📌 任务副本 · " : "";
      return `<button class="btn" style="text-align:left" data-q="${di}">
        ${esc(tag + d.deck)}
        <small>${d.items.length} 条 · 已首刷 ${st.started}/${st.total}${st.done5 ? ` · ${st.done5} 条到 L5` : ""}</small>
      </button>`;
    }).join("");
  view.innerHTML = `<div id="done" style="text-align:left;padding:30px 0">
    <h2>副本 · 挑一个整包刷</h2>
    <p>副本是主线的提前执行：刷过的条目会自动进入主线的间隔复习，不单独存进度。<br>
    想加新副本（班主任任务／临时想专攻的一批题），把材料发给 Claude 做成 deck 即可。</p>
    <div id="acts" style="flex-direction:column">${rows}</div>
    <div id="acts" style="margin-top:18px"><button class="btn primary" id="backMain">回主线</button></div>
  </div>`;
  view.querySelectorAll("[data-q]").forEach(b => b.onclick = () => {
    const d = DECKS[+b.dataset.q];
    QUEUE = interleave(d.items.map(it => ({ ...it, deck: d.deck, kind: it.kind || d.kind })));
    next();
  });
  document.getElementById("backMain").onclick = () => { QUEUE = buildQueue(); next(); };
}

/* 空白页是最糟的失败形态——手机上连控制台都没有。任何异常都渲染成看得见的错误卡。 */
function boot(){
  try { QUEUE = buildQueue(); next(); lapStart(); paintLap(); }
  catch (e){
    view.innerHTML = `<div id="done">
      <h2>引擎出错了</h2>
      <p class="warn">${esc(e && e.message || e)}</p>
      <div class="body quiet" style="text-align:left">${esc((e && e.stack || "").slice(0, 700))}</div>
      <div id="acts"><button class="btn" id="reset">清空本机进度重来</button></div>
      <p class="hint">把上面这段发回 Claude 就能定位。清空只影响本机进度，不影响 deck。</p></div>`;
    document.getElementById("reset").onclick = () => { localStorage.removeItem(KEY); location.reload(); };
  }
}
window.addEventListener("error", e => {
  if (!view.innerHTML.trim()) view.innerHTML =
    `<div id="done"><h2>引擎出错了</h2><p class="warn">${esc(e.message)}</p></div>`;
});
boot();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
